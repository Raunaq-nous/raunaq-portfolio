addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("input,textarea"))return;if(e.key==="ArrowRight")pf&&pf.flipNext();if(e.key==="ArrowLeft")pf&&pf.flipPrev();if(e.key==="Escape")$("#pop").classList.remove("show")});
$("#tocBtn").onclick=()=>go("TOC");
$("#listBtn").onclick=()=>{document.body.classList.toggle("listmode");$("#listBtn").textContent=document.body.classList.contains("listmode")?"Book view":"List view"};
/* ---------- clicks: links, tabs, receipts ---------- */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){e.preventDefault();e.stopPropagation();go(g.dataset.go);return}
  const r=e.target.closest(".rc");if(r){e.preventDefault();e.stopPropagation();showReceipt(r.dataset.k,r.getBoundingClientRect());return}

},true);
$("#popx").onclick=()=>$("#pop").classList.remove("show");
/* ---------- the revolving cover: five sports around a read ---------- */
function fiveSports(){const a=[],L=[],rnd=Math.random,P=(x,y,z,c)=>a.push([x,y,z,c]);
  const C=[[-.38,-.18],[.12,.3],[.42,-.24],[-.05,-.42],[-.5,.28]];
  for(let i=0;i<900;i++){const t=rnd()*6.283,r=.72*Math.sqrt(rnd());P(Math.cos(t)*r,.16,Math.sin(t)*r,0)}
  C.forEach(([cx,cz])=>{for(let i=0;i<110;i++){const t=rnd()*6.283,r=.07*Math.sqrt(rnd());P(cx+Math.cos(t)*r,.16,cz+Math.sin(t)*r,1)}});
  [[0,.42],[1,.3],[2,.5]].forEach(([k,h])=>{const [cx,cz]=C[k];for(let i=0;i<80;i++)P(cx+(rnd()-.5)*.02,.16-i/80*h,cz+(rnd()-.5)*.02,1)});
  const arc=(p,q)=>{for(let i=0;i<70;i++){const t=i/70;P(p[0]+(q[0]-p[0])*t,.16-Math.sin(t*Math.PI)*.32,p[1]+(q[1]-p[1])*t,0)}};
  arc(C[3],C[0]);arc(C[3],C[2]);arc(C[4],C[1]);
  L.push([C[1][0],-.14,C[1][1],0],[C[3][0],.16,C[3][1],1],[C[2][0],-.34,C[2][1],2]);
  return{a,L,lab:["FORMING","SPURS","LEADS"]}}

function spin(cv){if(!cv)return;const {a,L,lab}=fiveSports();let rot=.4,vis=true;const DPR=()=>Math.min(2,devicePixelRatio||1);
  function size(){const d=DPR(),w=cv.clientWidth,h=cv.clientHeight;if(w&&h&&(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d))){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}}
  function draw(){const x=cv.getContext("2d"),W=cv.width,H=cv.height,d=DPR(),s=Math.min(W,H)*.62,cx=W/2,cy=H*.52;rot+=reduce?0:.004;const cr=Math.cos(rot),sr=Math.sin(rot),ct=Math.cos(.42),st=Math.sin(.42);
    const P3=p=>{let X=p[0]*cr-p[2]*sr,Z=p[0]*sr+p[2]*cr,Y=p[1]*ct-Z*st;Z=p[1]*st+Z*ct;const f=3/(3+Z);return[cx+X*s*f,cy+Y*s*f,f]};
    x.clearRect(0,0,W,H);for(const p of a){const [X,Y,f]=P3(p);x.fillStyle=p[3]?"rgba(212,168,83,.9)":"rgba(241,240,236,.6)";const r=1.15*f*d;x.fillRect(X,Y,r,r)}
    x.font=`${9.5*d}px JetBrains Mono`;x.textBaseline="middle";L.forEach(([a0,b0,c0,t])=>{const [X,Y]=P3([a0,b0,c0]);const lx=X+(t%2?-1:1)*26*d,ly=Y-18*d,txt=lab[t],tw=x.measureText(txt).width+10*d,bx=t%2?lx-tw:lx;x.strokeStyle="rgba(241,240,236,.5)";x.lineWidth=d;x.beginPath();x.moveTo(X,Y);x.lineTo(lx,ly);x.stroke();x.fillStyle="#141512";x.fillRect(bx,ly-8*d,tw,16*d);x.strokeStyle="rgba(212,168,83,.8)";x.strokeRect(bx,ly-8*d,tw,16*d);x.fillStyle="#efe8d6";x.fillText(txt,bx+5*d,ly+1)});
    if(vis)requestAnimationFrame(draw)}
  size();new ResizeObserver(size).observe(cv);draw()}
spin(document.getElementById("cv"));spin(document.getElementById("cv2"));
update();
const wantR=(location.hash.match(/r=(\d+)/)||[])[1];if(wantR){const k=Object.keys(NB.refs).find(x=>NB.refs[x].n===+wantR);if(k)setTimeout(()=>showReceipt(k,null),1100)}
})();
