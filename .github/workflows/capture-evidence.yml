name: Capture research evidence

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Recapture every source, not just new or changed ones'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'public/notebooks/*/evidence/manifest.json'

permissions:
  contents: write

concurrency:
  group: capture-evidence
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.56.1
      - name: Install the browser
        run: cd /tmp/pw && npx playwright install --with-deps chromium
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Capture every notebook
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          cp scripts/capture-evidence.mjs /tmp/pw/
          for d in public/notebooks/*/evidence; do
            if [ -f "$d/manifest.json" ]; then
              echo "== $d"
              EVIDENCE_DIR="$PWD/$d" node /tmp/pw/capture-evidence.mjs || echo "capture failed for $d"
            fi
          done
      - name: Commit captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/notebooks/*/evidence
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: capture research evidence"
          git pull --rebase
          git push
