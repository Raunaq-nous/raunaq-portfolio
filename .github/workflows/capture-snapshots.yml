name: Capture paper snapshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/capture-snapshots.mjs
      - .github/workflows/capture-snapshots.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture
        run: node scripts/capture-snapshots.mjs
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/media/snapshots
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: capture paper snapshots"
          git push
