tch_out":"The fixed default seed makes repeat runs identical, which helps testing but can hide variation."},{"start":31,"end":36,"kind":"class","name":"MonteCarloResponse","id":"s5","hash":"d221ad06ea09430b","title":"Risk percentile reply shape","what":"Describes the risk reply with 50, 80 and 90 percent finish durations in days.","why":"Likely reason: the standard confidence levels used in schedule reviews.","watch_out":"The reply gives durations, while the database stores finish dates, so the two must be converted."},{"start":37,"end":40,"kind":"class","name":"RCPSPResponse","id":"s6","hash":"0c0dd34e4310b424","title":"Alternative plans reply shape","what":"Describes the reply as a list of alternative plan entries.","why":"Likely reason: a flexible list while the plan fields are still being settled.","watch_out":"Entries are untyped, so each field must be checked by the caller."},{"start":41,"end":60,"kind":"function","name":"ingest_schedule","id":"s7","hash":"37968503419c88a6","title":"Schedule import endpoint","what":"Accepts an uploaded schedule file and a project ID, and returns a fixed schedule ID, 150 activities and a 365 day baseline without reading the file.","why":"Likely reason: a placeholder until file parsing is written.","watch_out":"The uploaded file is ignored, so a bad file also appears to succeed."},{"start":61,"end":80,"kind":"function","name":"run_cpm","id":"s8","hash":"56ee0b6a1daab283","title":"Critical path endpoint","what":"Returns fixed critical path results: 365 days, 45 critical tasks, 12 near-critical tasks and a fragility of 0.38.","why":"Likely reason: a placeholder until the critical path calculation exists.","watch_out":"The schedule ID is not used, so any ID, even a wrong one, gets the same results."},{"start":81,"end":99,"kind":"function","name":"run_monte_carlo","id":"s9","hash":"8b4fb1d42027f10c","title":"Risk simulation endpoint","what":"Returns fixed 50, 80 and 90 percent durations of 365, 395 and 420 days, ignoring the trial count and seed.","why":"Likely reason: a placeholder until the simulation exists.","watch_out":"The trial count and seed have no effect, so a larger run appears to give better results when nothing changed."},{"start":100,"end":129,"kind":"function","name":"run_rcpsp","id":"s10","hash":"ff30da98998ea3bf","title":"Alternative plans endpoint","what":"Returns two fixed alternative plans with duration changes and indirect cost savings, not generated from the schedule.","why":"Likely reason: a placeholder until the scheduling optimizer exists. The docstring describes the intended method.","watch_out":"The savings are fixed figures, so presenting them as results would mislead."}],"explained_at":"2026-11-11T22:49:27+00:00","explained_by":"haiku","summary":"Exposes endpoints to import a schedule file and to run critical path, risk simulation and resource-constrained scheduling, all returning fixed example numbers.","purpose":"A planned API for schedule analysis of solar construction projects.","why":"Likely reason: the routes are set up first for front end work. The placeholder comments say so.","how":"1) The import endpoint accepts an uploaded file and returns a fixed schedule ID and counts. 2) The critical path, risk simulation and scenario endpoints each return fixed results without reading the schedule.","inputs":"An uploaded schedule file for import. A schedule or project ID, and for risk runs a trial count and seed.","outputs":"Fixed counts, durations, percentiles and scenarios.","risks":"Every result looks real but is constant. The uploaded file is not read. The schedule ID is fixed, so every import looks the same.","debug":"If numbers never change, these are placeholders. If upload fails, check that the multipart upload library is installed.","summary_hash":"sha256:d7263f9c8a3737aa6acbfdaa721425998ff97340f21bb206851ea3ac1b7f54cd","fresh":true},"api/services/normalization.py":{"schema_version":1,"path":"api/services/normalization.py","language":"Python","lines":398,"hash":"sha256:4b667aaecf390f10acd0ce52ab052bdab80b91e293d9b46447358686e34efa09","area":"api","status":"explained","summary_stale":false,"readiness":{"status":"not-ready","reasons":["Reading the code, the multiplication of a float per-MWac value by the Decimal combined factor looks like it raises a TypeError, so normalization would stop before saving. This was not run here.","No test is visible for this file.","Hard-coded exchange rates and silent 1.0 fallbacks can produce plausible but wrong numbers.","detect_conflicts may divide by zero when the median is zero."]},"terms":[{"term":"Comparator","meaning":"One benchmark project record whose costs are being compared."},{"term":"Base quarter","meaning":"The reference time period that all costs are adjusted to."},{"term":"PPI","meaning":"Producer Price Index, a published series that tracks how prices of goods change over time."},{"term":"FX rate","meaning":"An exchange rate that converts one currency into another."},{"term":"MWac and MWdc","meaning":"Two ways to measure solar capacity: AC output and DC panel rating. The ratio between them is the DC/AC ratio."},{"term":"Decimal","meaning":"A number type for exact decimal math. It cannot be mixed with ordinary floats without an explicit conversion."},{"term":"Median","meaning":"The middle value when numbers are sorted, less affected by extreme values than an average."},{"term":"MAD","meaning":"Median absolute deviation, a measure of spread that resists outliers."},{"term":"Z-score here","meaning":"How many spread units a source's value sits from the median."}],"depends_on":["models.comparator","models.research","pandas","sqlalchemy","structlog"],"used_by":["Not visible in this packet"],"sections":[{"start":1,"end":25,"kind":"setup","name":"File setup","id":"s1","hash":"36a17e1f963dbd31","title":"Imports and list of adjustments","what":"Brings in math, data and database tools and the record types for comparators and sources. The header describes the five kinds of adjustment.","why":"The header works as a map of what this file is meant to do.","watch_out":"The header promises a scope maturity adjustment, which is not present in the code shown, so do not assume it is applied."},{"start":26,"end":79,"kind":"class","name":"NormalizationService (part 1)","id":"s2","hash":"70a2b83d30a36dd4","title":"Service setup and start of the main method","what":"Creates the service with the database session and the base quarter and currency from settings. Starts the main method that builds the time, currency and location factors for one comparator.","why":"Shared settings mean every comparator is adjusted to the same base.","watch_out":"The base quarter and currency fall back to defaults if the settings are missing, which can quietly change every result."},{"start":80,"end":132,"kind":"class","name":"NormalizationService (part 2)","id":"s3","hash":"46fd07598489db43","title":"Applying factors and saving results","what":"Multiplies the combined factor into each cost field after converting it to per-MWac, writes the results onto the comparator, saves them, and returns them.","why":"Stores adjusted costs so later pages can read them without recalculating.","watch_out":"The multiplication that combines a float value with a Decimal factor looks like it raises an error, so this step may fail before anything is saved."},{"start":133,"end":170,"kind":"method","name":"NormalizationService: _normalize_time","id":"s4","hash":"9fa1840b9d9b7fbe","title":"Time adjustment from price indices","what":"Works out how much costs changed between two quarters using a weighted mix of three price series. It returns a multiplier, such as 1.15 for a 15 percent rise.","why":"Costs from older quarters need to be moved forward to the base quarter before they can be compared.","watch_out":"If an index value is zero, the code logs a warning and silently uses 1.0, which hides the missing adjustment."},{"start":171,"end":206,"kind":"method","name":"NormalizationService: _get_composite_index","id":"s5","hash":"8c5c4e0a2158ef26","title":"Weighted price index for one quarter","what":"Computes a blended price index for a quarter from the available series. It uses the middle date of the quarter and the nearest stored date when that date is missing.","why":"Blending several series gives one number that reflects the mix of costs in a solar project.","watch_out":"If none of the series are present, the function returns a default base of 100, which can look like real data."},{"start":207,"end":257,"kind":"method","name":"NormalizationService: _normalize_currency","id":"s6","hash":"f23c6bc8484bfc88","title":"Currency conversion rate","what":"Returns the multiplier that converts a cost from one currency to the base currency. It uses a rate table and returns 1.0 when no matching rate is found.","why":"Lets costs in euros, pounds or yen be compared with dollar costs.","watch_out":"Rates are hard-coded for now, so they will go stale, and a missing currency pair silently becomes 1.0."},{"start":258,"end":299,"kind":"method","name":"NormalizationService: _normalize_capacity_to_ac","id":"s7","hash":"0af5dd2c2114af0b","title":"Converting capacity to AC basis","what":"Returns the AC megawatt value. It uses the AC figure if present, otherwise converts from DC using the DC/AC ratio, or assumes 1.25 when no ratio is given. This block also holds three loaders for indices, exchange rates and location factors.","why":"Costs are compared per AC megawatt, so the size must be on the same basis.","watch_out":"If both sizes are missing, no capacity is returned, and the caller then sets per-MWac values to zero, which looks like a real result."},{"start":300,"end":348,"kind":"method","name":"NormalizationService: detect_conflicts","id":"s8","hash":"78d8905312a714fd","title":"Checking sources for disagreement","what":"Compares values from different sources for the same field, computes the median and spread, flags sources far from the median, and begins choosing a confidence label.","why":"Helps reviewers decide which numbers to trust when sources disagree.","watch_out":"The agreement check divides by the median, so a median of zero can cause a division error when there are two or more sources."},{"start":349,"end":398,"kind":"class","name":"NormalizationService (part 8)","id":"s9","hash":"4882862386d99114","title":"Flagging outliers and final label","what":"Works out each source's distance from the median in spread units, flags those above the threshold, and sets the final confidence label and recommendation text.","why":"Turns raw numbers into a readable decision the reviewer can act on.","watch_out":"The threshold comes from a setting that defaults to 2.0, so changing it quietly changes which sources are flagged."}],"explained_at":"2026-11-11T22:51:57+00:00","explained_by":"haiku","summary":"Adjusts each comparator cost figure so projects from different years, currencies, locations and sizes can be compared fairly, and flags sources that disagree.","purpose":"Puts cost data onto one base quarter, one base currency and one size basis, then saves the adjusted figures. It also checks several sources for the same value and reports conflicts.","why":"Comparisons across projects are only fair when they share one basis. The file header lists the adjustments involved.","how":"1. The normalize_comparator method finds a time factor from price indices, a currency factor, and a location factor. 2. It converts each cost field to a per-MWac value. 3. It multiplies by the combined factor and writes the results to the comparator. 4. It saves the change to the database. 5. Separately, detect_conflicts groups values by source, computes the median and spread, and flags sources far from the median.","inputs":"A comparator record with vintage, currency, location, capacity and cost fields. Price index, exchange rate and location factor data from the database or passed in directly. Extract records for conflict checks. Environment settings BASE_QUARTER, BASE_CCY and CONFLICT_THRESHOLD_Z_SCORE.","outputs":"Normalized cost fields and a norm_factors record saved on the comparator. A dictionary of normalized values. A conflict report with a confidence label and recommendation.","risks":"Exchange rates are hard-coded, not live. Missing data often becomes a factor of 1.0 without an error. The main method appears to mix float and Decimal numbers, which Python rejects. The header promises a scope maturity adjustment that is not in the code shown.","debug":"If a normalized figure looks wrong, read the norm_factors record on the comparator to see each factor. Check that the price index table contains the needed quarter dates. If normalize_comparator raises a TypeError, look at the multiplication that combines per-MWac values with the combined factor. Check BASE_QUARTER, BASE_CCY and the conflict threshold setting.","summary_hash":"sha256:4b667aaecf390f10acd0ce52ab052bdab80b91e293d9b46447358686e34efa09","fresh":true},"api/services/research.py":{"schema_version":1,"path":"api/services/research.py","language":"Python","lines":638,"hash":"sha256:db32a0cacab01944c6327833b9fa97274d909c094c71620075aed9e543c0654d","area":"api","status":"explained","summary_stale":false,"readiness":{"status":"not-ready","reasons":["Reading the code, a PDF or other non-HTML source would stop the run in the run_research loop, because a value used in scoring is only set for HTML pages. This was not run here.","Consistency is a fixed placeholder, so the credibility score does not reflect cross-source agreement.","Text extraction is an empty placeholder.","No test is visible for this file."]},"terms":[{"term":"CredScore","meaning":"A 0 to 100 credibility score that combines the four individual scores with weights."},{"term":"robots.txt","meaning":"A file on a website that states which automated visitors may read which pages."},{"term":"Allowlist","meaning":"A list of approved sites. Only matching sites are fetched when it is not empty."},{"term":"User agent","meaning":"The name the crawler announces itself with when it requests a page."},{"term":"Rate limit","meaning":"A cap on how often the crawler sends requests, so it does not overload a site."},{"term":"Provenance","meaning":"Who published a source and how authoritative that publisher is."},{"term":"Traceability","meaning":"How easy it is to check where a number came from, such as a date, author, or table."},{"term":"Syndicated content","meaning":"Copies of the same article published on several sites, which do not count as independent evidence."},{"term":"Fingerprint (SHA-256)","meaning":"A unique code computed from the page content, used to detect changes or duplicates."}],"depends_on":["models.research","models.project","httpx","beautifulsoup4","pdfplumber","sqlalchemy","structlog","settings from the environment file"],"used_by":["api/routes research module (imported by api/main.py, not shown in this packet)"],"sections":[{"start":1,"end":31,"kind":"setup","name":"File setup","id":"s1","hash":"54176d5881fbafa2","title":"Imports and module purpose","what":"Brings in web fetching, HTML and PDF reading, fingerprinting, and database tools. The header lists the module's five jobs.","why":"The header is a summary of what the module is meant to cover.","watch_out":"The header names method and scope extraction, which is not present in the code shown, so do not assume it is done."},{"start":32,"end":84,"kind":"class","name":"ResearchService (part 1)","id":"s2","hash":"0dcb620336c5ee38","title":"Service setup and credibility weights","what":"Creates the service with settings for identity, request rate, timeouts, robots rules, the allowlist, and the four weights used for credibility scoring.","why":"Keeps crawling behavior and scoring adjustable without code changes.","watch_out":"The weights are not checked to add up to 1, and the final score is clamped to 0 to 100, which can hide a weight problem."},{"start":85,"end":144,"kind":"class","name":"ResearchService (part 2)","id":"s3","hash":"0cf1413ee0df41ec","title":"Building the search query plan","what":"Builds a long list of search phrases for a project, including capacity variants, plus lists of target sites and terms to include or exclude.","why":"Likely reason: to search widely for cost, schedule, and filing evidence. No further reason is stated in the code.","watch_out":"The queries are built but never sent to a search service, so no searching actually happens yet."},{"start":145,"end":192,"kind":"class","name":"ResearchService (part 3)","id":"s4","hash":"949b40e734ef6489","title":"Returning the plan and robots check","what":"Returns the query plan settings, then checks a website's robots.txt rules to see whether this crawler may read a page.","why":"Respecting site rules is a basic courtesy for automated visitors, and the module states this as a goal.","watch_out":"If the robots file cannot be read, the page is allowed by default, so the crawler goes ahead despite the uncertainty."},{"start":193,"end":251,"kind":"method","name":"ResearchService: fetch_url","id":"s5","hash":"44430ed88e32c277","title":"Downloading one web page as a source","what":"Checks the allowlist and robots rules, downloads the page, and builds a source record with a fingerprint and document type. It returns nothing if the download fails.","why":"Creates the raw evidence record that every later step depends on.","watch_out":"The allowlist matches any allowed text that appears inside the domain, so a short entry can allow unexpected sites, and an empty allowlist permits every site."},{"start":252,"end":307,"kind":"class","name":"ResearchService (part 5)","id":"s6","hash":"3347f3965428509c","title":"Saving sources and reading HTML tables","what":"Saves the new source, then reads cost fields such as total cost and module cost from table rows and returns them as extract records.","why":"Turns the numbers on a page into structured values that the normalization step can use.","watch_out":"Only the first two cells of each table row are read, so tables that put the value elsewhere are missed."},{"start":308,"end":367,"kind":"class","name":"ResearchService (part 6)","id":"s7","hash":"e8c03b6ffb198e0a","title":"Finishing HTML reading and PDF reading","what":"Checks paragraphs in HTML for values, and reads cost rows from PDF tables and page text. Errors in PDF reading are logged and an empty list is returned.","why":"Covers the two document types the platform expects to see.","watch_out":"PDF reading needs a file on disk, but the main run never saves downloaded PDFs, so this step is not reached during a normal run."},{"start":368,"end":426,"kind":"class","name":"ResearchService (part 7)","id":"s8","hash":"1394505a14dcf19c","title":"Matching cost labels and numbers","what":"Decides which cost field a table label belongs to, such as total cost or interconnection, and pulls out the number, currency and units from the value text.","why":"Turns free-form labels into named fields the rest of the platform can use.","watch_out":"Matching is done by partial text in an ordered list, so a label can match the wrong field, and only the first match is kept."},{"start":427,"end":481,"kind":"method","name":"ResearchService: _parse_currency_symbol","id":"s9","hash":"84583c971c90ff35","title":"Currency symbol and multiplier reading","what":"Maps dollar, pound, euro and yen symbols to currency codes, and turns words such as million or billion into numeric multipliers.","why":"Lets numbers in different currencies be compared later.","watch_out":"An unknown currency symbol silently defaults to US dollars, which can mislabel a value."},{"start":482,"end":534,"kind":"method","name":"ResearchService: score_provenance","id":"s10","hash":"5135903cd4dcb244","title":"Scoring provenance and traceability","what":"Gives a provenance score by type of organization, guessing the type from the web address when it is not set. This block also gives a traceability score that starts at 70 and rises when tables are present, and falls when a date or author is missing.","why":"Likely reason: official regulators and academic sources are treated as more reliable than blogs. No further reason is stated in the code.","watch_out":"The address guess is simple text matching, so a domain that contains a short word such as puc can be misclassified."},{"start":535,"end":590,"kind":"method","name":"ResearchService: score_consistency","id":"s11","hash":"db0b20b583f80bcd","title":"Placeholder consistency and independence scores","what":"Gives a fixed consistency score of 70. Gives an independence score that starts at 70 and drops for press releases. This block also begins the main run method, which checks that the project exists.","why":"Consistency needs other sources to compare against, so it stays a placeholder until normalization is connected.","watch_out":"Consistency is hard-coded to 70 in two places, so the score does not yet reflect real agreement between sources."},{"start":591,"end":638,"kind":"class","name":"ResearchService (part 11)","id":"s12","hash":"bcc8115cc2ae095f","title":"Main research run and summary","what":"Runs the full pass: fetches each URL, reads HTML tables, scores each source, saves progress, waits between requests, and returns counts and an average credibility score.","why":"Acts as the single entry point that ties the research steps together for one project.","watch_out":"A PDF or other non-HTML source causes an error here, because the traceability score uses a value that was only set for HTML pages."}],"explained_at":"2026-11-11T22:51:57+00:00","explained_by":"haiku","summary":"Finds and reads web sources for a project, pulls cost figures from HTML tables, and scores how trustworthy each source is.","purpose":"Gathers public evidence for benchmarking, follows site crawling rules, and records each source with a credibility score.","why":"Likely reason: the platform needs sourced numbers that can be checked later. Crawling rules are included to be respectful to websites. The header describes the module's five jobs.","how":"1. The run_research method loads the project and goes through each URL. 2. fetch_url checks the allowlist and robots.txt, then downloads the page. 3. It saves a source record with a fingerprint and document type. 4. HTML tables are read for cost fields. 5. Provenance, traceability, consistency and independence scores are calculated and combined into a credibility score. 6. Each source is saved and the service waits before the next request.","inputs":"A project ID and a list of URLs. Settings for user agent, rate limit, timeouts, robots checks, allowlist, score weights and provenance scores. The live web pages.","outputs":"Source records, extract records holding cost values, credibility scores saved to the database, and a summary with counts and an average score. The query plan is built during the run but its queries are not used.","risks":"The crawler contacts live websites, so the crawl rules matter. Consistency is a fixed placeholder. Text extraction does nothing. PDFs are downloaded but not read by the main run. The rate limit is applied to all requests rather than per domain. The allowlist uses partial text matching.","debug":"If no sources are saved, check the ALLOWLIST_DOMAINS setting and log lines url_blocked_by_allowlist and url_blocked_by_robots. If a fetch fails, look for http_error or fetch_failed. If a score looks odd, check the four individual scores on the source record. If a run fails on a PDF, look at how the extracts value is passed in the run_research loop.","summary_hash":"sha256:db32a0cacab01944c6327833b9fa97274d909c094c71620075aed9e543c0654d","fresh":true},"db/schema.sql":{"schema_version":1,"path":"db/schema.sql","language":"SQL","lines":782,"hash":"sha256:0bf1a4ae6a9349f3f1b0de0e5b8f8329f62600bb8d468510a784f22396a219dd","area":"db","status":"explained","summary_stale":false,"readiness":{"status":"unknown","reasons":["Only 5 of 40 parts of the file are visible, so the rest cannot be judged.","The file targets PostgreSQL, while the default app setup uses SQLite."]},"terms":[{"term":"PostgreSQL","meaning":"A full database server commonly used for shared or larger deployments."},{"term":"UUID","meaning":"A long unique identifier, used here as the primary key for records."},{"term":"Extension","meaning":"An add-on that gives PostgreSQL extra features."},{"term":"Index","meaning":"A lookup structure that makes searching a column faster."},{"term":"JSONB","meaning":"A PostgreSQL column type that stores flexible structured data."},{"term":"GIN index","meaning":"An index type built for searching inside structured data such as JSON."},{"term":"Foreign key","meaning":"A link that requires a value to match an existing record in another table."},{"term":"CHECK constraint","meaning":"A rule that limits which values a column may hold."}],"depends_on":["PostgreSQL 15 or newer","uuid-ossp extension","pgcrypto extension","btree_gin extension"],"used_by":["Not visible in this packet"],"sections":[{"start":1,"end":7,"kind":"setup","name":"File setup","id":"s1","hash":"06741d5c5a8bab12","title":"Required extensions and header note","what":"Turns on two PostgreSQL add-ons used for generating unique IDs and encryption helpers. The header says PostgreSQL 15 or newer is required and that the schema matches the Python models.","why":"Unique IDs created by the database need these add-ons.","watch_out":"The header says this must match the Python models, so any column change here needs a matching change in the models."},{"start":8,"end":13,"kind":"statement","name":"CREATE","id":"s2","hash":"ccfc2e8f758851bf","title":"Extra index extension","what":"Adds a PostgreSQL extension that lets ordinary columns be used inside GIN indexes.","why":"Likely reason: a later index may combine ordinary and structured columns. The code does not state the reason.","watch_out":"This extension exists only in PostgreSQL, so this file cannot run on SQLite."},{"start":14,"end":29,"kind":"statement","name":"CREATE","id":"s3","hash":"9269e6d3dddaea0e","title":"Users table","what":"Defines the table of people who can sign in, with email, a hashed password field, full name, role, an active flag, and timestamps.","why":"Sign-in and role checks need a stored user record, and the role rule limits roles to three names.","watch_out":"Roles are limited to Consultant, Reviewer and Admin here, so adding a role requires changing this table as well as the app."},{"start":30,"end":45,"kind":"statement","name":"CREATE","id":"s4","hash":"00ef963013fc61d8","title":"Projects table","what":"Defines the table of benchmarking projects. Each project has a name, asset type (solar, wind or storage), location, owner, status, and a flexible metadata field.","why":"Projects are the top-level record that the other data belongs to.","watch_out":"Each project must point to an existing user, so that user cannot be deleted while the project exists."},{"start":46,"end":51,"kind":"statement","name":"CREATE","id":"s5","hash":"dcfd4d4c0a925511","title":"Fast search index on project metadata","what":"Creates an index so that searches inside the flexible metadata field stay quick.","why":"Likely reason: metadata is searched often. The code does not state the reason.","watch_out":"The index slows writes slightly and only helps when queries search inside that metadata."},{"start":52,"end":82,"kind":"statement","name":"CREATE","id":"s6","hash":"57112321be457b4d","title":"Storing web sources and their scores","what":"Defines the table that keeps each web page, PDF, or filing the app collects for research, along with its address, publisher type, date, and credibility scores. It also stores a fingerprint of the content and the robots.txt decision, so a source can be traced back later.","why":"Likely reason: the app needs a record of where each number came from so that results can be checked and trusted. Each source is unique per project and URL.","watch_out":"The credibility score is limited to whole numbers from 0 to 100, so any code that writes to it must respect that limit or the save will fail."},{"start":83,"end":102,"kind":"statement","name":"CREATE","id":"s7","hash":"59bd417199c27ae2","title":"Storing individual extracted data points","what":"Defines the table that holds each single value pulled out of a source, such as a capital cost or a megawatt figure, with the quote it came from and the unit and currency. It links every value back to its source.","why":"Likely reason: each number in a benchmark needs its exact wording and location kept so a reviewer can verify it.","watch_out":"The quote length check counts characters, not words, even though the comment says about 25 words, so long quotes are rejected at around 250 characters."},{"start":103,"end":108,"kind":"statement","name":"CREATE","id":"s8","hash":"5ae9dc722866c75a","title":"Indexing extracted data for context lookup","what":"Adds a search index on the extra context stored with each extracted value, so the database can find values by their notes quickly.","why":"Likely reason: the context field holds flexible data, and the index speeds up searches on it.","watch_out":"Indexes speed up reads but slow down writes slightly, so adding many more indexes will make large imports slower."},{"start":109,"end":164,"kind":"statement","name":"CREATE (part 1)","id":"s9","hash":"a5427e793ba4cf40","title":"Storing comparable solar projects","what":"Defines the main table of comparable projects used as a reference group. It stores each project's location, size, technology, dates, interconnection details, and cost breakdown by part, plus notes on what was included or excluded.","why":"Likely reason: the reference group is the basis for benchmarking, so every comparison needs the same set of descriptive fields.","watch_out":"Costs are stored in the currency the source reported, so mixing currencies in one comparison requires the normalized columns instead."},{"start":165,"end":204,"kind":"statement","name":"CREATE (part 2)","id":"s10","hash":"7d59578bc7b14624","title":"Normalized costs and quality labels","what":"Completes the comparable projects table with normalized costs (adjusted for time, currency, and location), a confidence label and score, counts of sources, flags that decide if a project is included, and site details such as soil and terrain. It also adds the timestamps and a free-text notes field.","why":"Likely reason: raw costs from different years and places cannot be compared directly, so adjusted versions are stored beside them.","watch_out":"The confidence label only accepts four fixed values, so any new label must be added to the database rule first."},{"start":205,"end":210,"kind":"statement","name":"CREATE","id":"s11","hash":"e2fa9ac1612e85fa","title":"Indexing normalization factors","what":"Adds a search index on the stored adjustment factors of each comparable project.","why":"Likely reason: the adjustment factors are stored as flexible data, and the index speeds up searches on them.","watch_out":"Reason not stated in the code beyond the index itself."},{"start":211,"end":228,"kind":"statement","name":"CREATE","id":"s12","hash":"2efd3fa882513f96","title":"Storing price and cost index series","what":"Defines the table that holds time-series price indices such as copper or electrical equipment prices. Each series has a unique ID and stores its monthly values as one flexible block.","why":"Likely reason: the app adjusts old costs using these indices, so it needs a single place to keep them.","watch_out":"Values are stored as one block keyed by date text, so a typo in a date key will quietly create a separate, wrong entry rather than an error."},{"start":229,"end":245,"kind":"statement","name":"CREATE","id":"s13","hash":"965b9cddb74cf959","title":"Storing location cost multipliers","what":"Defines the table that holds location adjustment factors such as wage, productivity, and material cost multipliers, one set per place and effective date.","why":"Likely reason: labor and material costs differ by place, so each location needs its own multipliers.","watch_out":"The uniqueness rule on place and date does not stop duplicate rows when the effective date is left empty, because empty dates are treated as different from each other in PostgreSQL."},{"start":246,"end":251,"kind":"statement","name":"CREATE","id":"s14","hash":"5df1341daae8c5df","title":"Indexing location factors by country","what":"Adds a search index so location factors can be looked up by country.","why":"Likely reason: country is a common way to find location factors, so the index speeds up that lookup.","watch_out":"Reason not stated in the code beyond the index itself."},{"start":252,"end":303,"kind":"statement","name":"CREATE","id":"s15","hash":"93f7366771668230","title":"Storing the project being benchmarked","what":"Defines the table for the project under study. It has the same descriptive fields as the comparable projects, plus optional user-entered cost estimates, site details, and a flexible block filled in automatically from research.","why":"Likely reason: the subject project is kept apart from the comparable group so that it can be measured against that group.","watch_out":"Each project can have only one row here, enforced by a uniqueness rule on the project ID, so a second save for the same project will be rejected."},{"start":304,"end":309,"kind":"statement","name":"CREATE","id":"s16","hash":"12f97cc2cde030a4","title":"Indexing auto-filled project profile","what":"Adds a search index on the automatically filled profile of the subject project.","why":"Likely reason: the auto-filled profile is flexible data, and the index speeds up searches on it.","watch_out":"Reason not stated in the code beyond the index itself."},{"start":310,"end":344,"kind":"statement","name":"CREATE","id":"s17","hash":"c4361963baf1afab","title":"Storing cost model fits","what":"Defines the table that records each run of the cost model, including which features and comparable projects were used, the fitted coefficients, accuracy scores, residuals, and checks for influential points and collinearity.","why":"Likely reason: a saved record of each model run lets the app show how a prediction was produced and rerun or compare it later.","watch_out":"Fit results are stored as flexible blocks, so the database will not check that the coefficient names match the features list."},{"start":345,"end":372,"kind":"statement","name":"CREATE","id":"s18","hash":"159319d02c3ff154","title":"Storing cost variance breakdowns","what":"Defines the table that holds the step-by-step breakdown of why the subject project costs differ from the baseline, such as DC to AC ratio, tracking, soil, and region effects, plus any leftover unexplained amount.","why":"Likely reason: a waterfall of cost differences helps the user see which factors drive the gap.","watch_out":"The individual step columns are stored separately from the full waterfall block, and nothing in the database checks that they add up to the total."},{"start":373,"end":400,"kind":"statement","name":"CREATE","id":"s19","hash":"d7d6845d5edaa360","title":"Storing cost reduction ideas","what":"Defines the table that lists possible cost savings for a project, each with a name, category, dollar and percent impact, schedule effect, feasibility, risk level, and priority rank.","why":"Likely reason: the app recommends changes, and each recommendation needs its size, risk, and rank saved together.","watch_out":"Feasibility and risk accept only the fixed values high, medium, and low, so other wording will be rejected by the database."},{"start":401,"end":406,"kind":"statement","name":"CREATE","id":"s20","hash":"16f1999aedb22f97","title":"Indexing reduction ideas by priority","what":"Adds a search index on the priority rank of cost reduction ideas so the top ones can be listed quickly.","why":"Likely reason: the app usually shows the highest priority ideas first, so ordering by rank needs to be fast.","watch_out":"Reason not stated in the code beyond the index itself."},{"start":407,"end":429,"kind":"statement","name":"CREATE","id":"s21","hash":"cc629f2b1116dd16","title":"Storing schedule projects","what":"Defines the table for each construction schedule, recording its name, how it was made (imported, generated, or a mix), the file format, work calendars, and its baseline start, finish, and duration.","why":"Likely reason: each schedule must be stored as one unit so its tasks and analysis can be linked back to it.","watch_out":"The schedule type accepts only imported, generated, or hybrid, and the file format is free text, so formats are not checked against a fixed list."},{"start":430,"end":487,"kind":"statement","name":"CREATE","id":"s22","hash":"1953ce9983ff648c","title":"Storing individual schedule tasks","what":"Defines the table for each task in a schedule. It keeps the task ID, name, duration, early and late dates, float (slack), critical path flags, links to other tasks, resources, constraints, solar work category, and progress.","why":"Likely reason: the schedule analysis works task by task, so every task's timing and links must be stored.","watch_out":"The near-critical flag comment says float of 5 days or less, but the threshold is also stored per analysis, so the two can disagree if the threshold is changed."},{"start":488,"end":518,"kind":"statement","name":"CREATE","id":"s23","hash":"961c70aedb3f5705","title":"Storing critical path results","what":"Defines the table that holds the results of the critical path analysis for a schedule. It stores the overall duration, the critical paths, the fragility index, and solar productivity measures such as piles per day and trackers per day.","why":"Likely reason: the critical path analysis is run separately from the tasks, so its summary numbers are stored in their own record.","watch_out":"The fragility index is described as a percentage, and its meaning depends on the float threshold stored beside it, so both must be read together."},{"start":519,"end":551,"kind":"statement","name":"CREATE","id":"s24","hash":"4f465aecedf566f2","title":"Storing schedule risk simulation runs","what":"Defines the table that records each Monte Carlo simulation run for a schedule. It stores the settings, the weather assumptions, the probability dates for finishing at 50, 80, and 90 percent, and the histograms of results.","why":"Likely reason: a random simulation can give different answers, so the seed, trial count, and results are saved together to make each run reproducible.","watch_out":"The default number of trials here matches a setting in the system configuration table, but changing that setting will not change this default."},{"start":552,"end":585,"kind":"statement","name":"CREATE","id":"s25","hash":"facf8abde9d6aab9","title":"Storing optimized schedule scenarios","what":"Defines the table that records alternative schedules produced by the scheduling optimizer. It stores each scenario's rank, the method and rule used, the resulting duration, the change from the baseline, the cost effect, the task moves, the resource use, and an explanation.","why":"Likely reason: the optimizer produces several candidate schedules, and each needs its results and reasons kept to compare them.","watch_out":"The change from baseline is stored as a number, so if the baseline changes later the saved change will no longer match."},{"start":586,"end":591,"kind":"statement","name":"CREATE","id":"s26","hash":"a12125d611aaa6b6","title":"Indexing scenarios by rank","what":"Adds a search index on scenario rank so the best scenarios can be listed quickly.","why":"Likely reason: the app shows the top ranked scenarios first, so ranking must be fast.","watch_out":"Reason not stated in the code beyond the index itself."},{"start":592,"end":618,"kind":"statement","name":"CREATE","id":"s27","hash":"8ada50e56069cf36","title":"Recording exported files","what":"Defines the table that logs each exported report, such as a slide deck, spreadsheet, or PDF. It stores the type, the run IDs used to build it, the file name and location, its size, and how many citations it includes.","why":"Likely reason: each exported file should be traceable to the data and model runs that produced it.","watch_out":"The file path is stored as text, so if the file is moved or deleted on disk, the database record will still exist and point to nothing."},{"start":619,"end":636,"kind":"statement","name":"CREATE","id":"s28","hash":"5cf28434dbc99b34","title":"Storing reasoning chains","what":"Defines the table that stores the step-by-step explanation behind a result, such as a comparable project or a model prediction, along with the sources and extracts it relied on. This supports the View Reasoning feature.","why":"Likely reason: users need to see why the app reached a number, so the steps and their sources are saved.","watch_out":"The steps field is required, so a reasoning record cannot be saved without at least a step block."},{"start":637,"end":642,"kind":"statement","name":"CREATE","id":"s29","hash":"3812ab610a9046ba","title":"Indexing reasoning chains by target","what":"Adds a search index that finds reasoning chains by the type and ID of the item they explain.","why":"Likely reason: the View Reasoning feature starts from a specific result, so the lookup needs to be fast.","watch_out":"Reason not stated in the code beyond the index itself."},{"start":643,"end":660,"kind":"statement","name":"CREATE","id":"s30","hash":"ea8a417af71e7e89","title":"Audit log of app actions","what":"Defines the table that records who did what in the app, such as creating a project or running research, with the target, the details, the network address, the browser, and the time.","why":"The table comment says it should be immutable, which suggests it is meant as a trustworthy record of activity.","watch_out":"The table comment says immutable, but nothing in this file blocks updates or deletes, so the rule is only a promise unless added later."},{"start":661,"end":671,"kind":"statement","name":"CREATE","id":"s31","hash":"7cc072ce6d13c09f","title":"Field level access rules by role","what":"Defines the table that says, for each role, which table fields can be read and which can be changed. Each role and field pair appears only once.","why":"Likely reason: different users should see and edit different parts of the data, so the rules are kept in the database.","watch_out":"The rules are only stored here, so the app must actually check them for them to have any effect."},{"start":672,"end":677,"kind":"statement","name":"CREATE","id":"s32","hash":"1ebdd225494cf8db","title":"Indexing access rules by role","what":"Adds a search index so access rules can be found quickly for a given role.","why":"Likely reason: the app checks access rules for every role, so the lookup needs to be fast.","watch_out":"Reason not stated in the code beyond the index itself."},{"start":678,"end":687,"kind":"statement","name":"CREATE","id":"s33","hash":"c9c7183491d64128","title":"Storing system settings table","what":"Defines the table that stores app-wide settings as named key and value pairs, with a description and the user who last changed each one.","why":"Likely reason: settings such as the base currency or domain allowlist should be changeable without editing code.","watch_out":"Values are stored as flexible blocks, so a setting saved in the wrong format will be accepted and may only fail later when the app reads it."},{"start":688,"end":704,"kind":"statement","name":"INSERT","id":"s34","hash":"1c4d58b786f5e8f3","title":"Default settings loaded at setup","what":"Inserts the starting settings: base quarter and currency for cost adjustments, an empty domain allowlist that means all domains are allowed, the robots.txt rule, the price index series used, the credibility score weights, the default simulation trial count, and the float threshold in days.","why":"Likely reason: the app needs working values from its first run, so they are loaded when the database is created.","watch_out":"This insert has no protection against running twice, so rerunning the script on a database that already has these keys will fail with a duplicate key error."},{"start":705,"end":715,"kind":"statement","name":"SELECT","id":"s35","hash":"dce8938dc8f4f77b","title":"View of comparables with source counts","what":"Creates a view that shows each comparable project with its full row, plus a count of sources and their average credibility score.","why":"Likely reason: the reference table page needs source counts and quality for each project without extra work in the app.","watch_out":"The join connects extracts to sources but not to the specific comparable project, so the source counts and averages likely cover all matching data rather than only that project."},{"start":716,"end":732,"kind":"statement","name":"SELECT","id":"s36","hash":"d98c8b317989489c","title":"View of active project summaries","what":"Creates a view that lists active projects with counts of their included comparables and sources, plus the subject project's size and location.","why":"Likely reason: the dashboard needs one summary row per project without several separate queries.","watch_out":"Only projects with status active appear here, so inactive projects will be missing from any screen that uses this view."},{"start":733,"end":735,"kind":"statement","name":"CREATE","id":"s37","hash":"45258babf72448a4","title":"Starting the timestamp update function","what":"Begins the definition of a database function that sets the updated time on a row to the current time. This section shows only the first lines, and the body is in the next section.","why":"Likely reason: keeping the last changed time accurate without relying on each save in the app.","watch_out":"The function is incomplete in this section, so it only works when read together with the next section."},{"start":736,"end":748,"kind":"statement","name":"BEGIN","id":"s38","hash":"94abd183c94d8d3f","title":"Automatic last updated timestamps","what":"Finishes the timestamp function and attaches it to the users, projects, comparables, project inputs, and schedule projects tables, so their updated time changes on every edit.","why":"Likely reason: last changed times are needed for audit and for knowing when data was last touched.","watch_out":"Tables such as indices and system settings also have an updated time column but have no trigger here, so their times will not change automatically."},{"start":749,"end":757,"kind":"statement","name":"CREATE","id":"s39","hash":"4f3c7c17c7f8a298","title":"Starting the credibility score function","what":"Begins the definition of a database function that combines the four source quality scores into one credibility score. This section shows only the header, and the calculation is in the next section.","why":"Likely reason: keeping the credibility formula in the database makes every saved score follow the same rule.","watch_out":"The function is incomplete in this section, so it only works when read together with the next section."},{"start":758,"end":782,"kind":"statement","name":"BEGIN","id":"s40","hash":"7127ebaf00bb6bba","title":"Credibility score calculation and table notes","what":"Computes the credibility score as a weighted average of the four source quality scores, rounded and kept between 0 and 100. It is followed by short descriptions attached to each main table.","why":"Likely reason: a fixed formula in the database keeps every source's credibility score consistent.","watch_out":"The weights are written into the function, separately from the weights stored in the system settings, so changing the settings will not change the score."}],"explained_at":"2026-11-11T22:53:00+00:00","explained_by":"haiku","summary":"Describes the database tables for the platform in PostgreSQL form. Only the opening part of the file is visible here, covering the extensions, the users table and the projects table.","purpose":"Creates the tables that store users and projects, plus indexes that speed up common lookups.","why":"Likely reason: a readable reference for the database structure that is separate from the Python models. The header says the file must match the models, which also run on SQLite. Why both are supported is not fully stated.","how":"1. Enables two PostgreSQL extensions for unique IDs and encryption helpers. 2. Enables a third extension for index support. 3. Creates the users table and its indexes. 4. Creates the projects table, which links to users, and its indexes. 5. The rest of the file, which the packet says has 40 parts, is not visible here.","inputs":"Run against an empty PostgreSQL database, version 15 or newer according to the header. Relies on the table design in the Python models.","outputs":"Database tables and indexes.","risks":"The file is written for PostgreSQL, so the SQLite default in the app will not run it. The list of roles in the users table must match the roles used by the app. Most of the file was not reviewed.","debug":"If a CREATE statement fails, check that the extensions are installed on the server. Tables must be created in order because projects refers to users. If a column disagrees with the Python models, compare the two directly.","summary_hash":"sha256:0bf1a4ae6a9349f3f1b0de0e5b8f8329f62600bb8d468510a784f22396a219dd","fresh":true},"frontend/index.html":{"schema_version":1,"path":"frontend/index.html","language":"HTML","lines":468,"hash":"sha256:7b6f8463c8cc1db89854242434c647eea240d930baf93f2ac767d04c54dabd9c","area":"frontend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No test or other evidence that the page works in use was found in this file.","The project list request does not check the response status, so an error response can break the list.","The 30 second refresh timer starts on load and is never stopped.","The Vue library is loaded without a pinned version, so a new release could change behavior.","Errors are shown only as short messages, with no way to retry."]},"terms":[{"term":"Vue","meaning":"a library that updates the page automatically when the app's stored data changes"},{"term":"Tailwind","meaning":"a styling library that uses short class names to set colors and spacing"},{"term":"CDN","meaning":"a web server that hands out shared library files so the page does not need to host them"},{"term":"API","meaning":"a doorway other programs use to ask this app for data"},{"term":"Toast","meaning":"a short pop-up message that appears in a corner and disappears after a few seconds"},{"term":"v-model","meaning":"a Vue way of linking a form field to a stored value so the two stay in step"}],"depends_on":["vue@3 loaded from cdn.jsdelivr.net","cdn.tailwindcss.com","the backend API at the address in apiBaseUrl, using its health route and its projects routes"],"used_by":[],"sections":[{"start":1,"end":54,"kind":"setup","name":"File setup (part 1)","id":"s1","hash":"a2dc1f611bf4540b","title":"Page setup and header bar","what":"Sets up the page, loads the Vue and Tailwind libraries, and draws the blue header with the app name and a status badge that shows whether the API is connected. It also draws the row of tab buttons.","why":"Likely reason: the header and tabs stay visible on every screen, so the user always sees the connection status and can switch views.","watch_out":"The page depends on the internet to load Vue and Tailwind, so without access to those hosts the page appears broken or unstyled."},{"start":55,"end":103,"kind":"setup","name":"File setup (part 2)","id":"s2","hash":"ef479f1e888994be","title":"Dashboard summary cards","what":"Draws three cards on the dashboard: the total number of projects, the number of active projects, and the database type. The counts update from the stored project list.","why":"Likely reason: a quick summary lets the owner see the state of the data at a glance.","watch_out":"The counts depend on the project list being a real list, so a bad list response would make these cards wrong or fail."},{"start":104,"end":135,"kind":"setup","name":"File setup (part 3)","id":"s3","hash":"c19fb2a44a15a3da","title":"Quick action buttons on dashboard","what":"Draws four large buttons on the dashboard for creating a project, viewing projects, opening the API docs tab, and running a health check.","why":"Likely reason: these are shortcuts to the most common actions so the user does not need to use the tab bar.","watch_out":"The New Project button also switches to the projects tab, so it changes the screen as well as opening the form."},{"start":136,"end":179,"kind":"setup","name":"File setup (part 4)","id":"s4","hash":"a4b0d8c75657a126","title":"New project form","what":"Draws the form for creating a project with fields for name, asset type, location, and capacity in megawatts. Submitting it runs the create method, and cancel hides the form.","why":"Likely reason: the owner needs one place to enter the basic facts about a new project.","watch_out":"The name field is required in the browser, but the capacity field can be left blank and is then sent as empty rather than as a number."},{"start":180,"end":239,"kind":"setup","name":"File setup (part 5)","id":"s5","hash":"6eda9bfcdf8081ee","title":"Projects list header and states","what":"Draws the projects section heading, the New Project button, and the messages shown while the list is loading or when there are no projects. It also starts the table that lists projects.","why":"Likely reason: users need to know whether the list is still loading or simply empty, instead of seeing a blank table.","watch_out":"The New Project button hides while the form is open, so the form can only be closed with its own cancel or close buttons."},{"start":240,"end":299,"kind":"setup","name":"File setup (part 6)","id":"s6","hash":"d703fd87f575ceb3","title":"Project table rows and actions","what":"Fills the table with one row per project showing its name, asset type, location, status, created date, and View and Delete buttons. Active projects get a green status badge and other statuses get a grey one.","why":"Likely reason: each row gives a quick look at the project and the two actions available for it.","watch_out":"The Delete button is shown on every row with no role check, so any visitor to the page can remove a project."},{"start":300,"end":359,"kind":"setup","name":"File setup (part 7)","id":"s7","hash":"a94b8923a6f7ed39","title":"Pop-up messages and starting app data","what":"Draws the pop-up message area in the bottom right corner, then starts the app's setup. It sets the backend address, the status values, the tab list, the project list, the new project form values, and the pop-up list.","why":"Likely reason: the pop-up area sits outside the tabs so messages appear on any screen, and the starting values give the form and lists a known state.","watch_out":"The backend address can be changed by a page parameter, so the page will send requests to whatever address is given there."},{"start":360,"end":419,"kind":"setup","name":"File setup (part 8)","id":"s8","hash":"d6ec46b7538cf3f4","title":"Health check, loading and creating projects","what":"Calls the backend health route to set the status badge and database type, then loads the project list from the projects route. It also sends a new project to the backend and, if that works, clears the form and reloads the list.","why":"Likely reason: the page needs to know whether the backend is reachable before it shows data, and it reloads the list after a change so the new project appears.","watch_out":"The project list fetch does not check whether the response is successful, so an error page or message could be stored as the project list and break the table and counts."},{"start":420,"end":468,"kind":"setup","name":"File setup (part 9)","id":"s9","hash":"65f4443621f0e263","title":"Deleting, viewing, and auto refresh","what":"Asks for confirmation, then deletes a project and reloads the list. It also shows a project's details in a browser alert, formats dates for display, shows pop-up messages for three seconds, and starts a timer that reloads projects every 30 seconds.","why":"Likely reason: the confirmation prevents accidental deletes, and the timer keeps the list current without a manual refresh.","watch_out":"The 30 second timer starts when the page loads and is never stopped, so it keeps running for as long as the page stays open."}],"explained_at":"2026-11-11T22:53:00+00:00","explained_by":"haiku","summary":"A single web page that shows a dashboard, a list of solar projects with create and delete buttons, and a page of API links, all talking to the backend API.","purpose":"Gives the owner a simple browser screen to see the project list, add a new project, remove one, and check whether the backend is reachable.","why":"Likely reason: a plain page with no build step lets the app be opened in a browser directly, without a separate frontend project to compile.","how":"The page loads Vue and Tailwind from the internet. On load, it checks the backend health route and fetches the project list. Each button calls a method that sends a request to the backend and then shows a short pop-up message. The project list refreshes every 30 seconds while the projects or dashboard tab is open.","inputs":"Text typed into the new project form (name, asset type, location, capacity), button clicks, and the optional api address in the page URL or the window setting.","outputs":"Requests to the backend for health, listing, creating, and deleting projects, plus visible tables, counts, status badges, and pop-up messages.","risks":"If the backend returns an error body where a list is expected, the project list can be replaced with a non-list value and the page can break. The page also depends on two internet services, so it stops styling or working if they are unreachable. Deleting a project is permanent and relies only on a confirmation prompt.","debug":"If the status badge says disconnected, check the backend address in the page setup, the ?api parameter, and whether the backend is running. If the list is empty or broken, open the browser developer console and look at the network response from the projects route. If the page is unstyled, check the internet access to the style and script hosts.","summary_hash":"sha256:7b6f8463c8cc1db89854242434c647eea240d930baf93f2ac767d04c54dabd9c","fresh":true}}}</script>
<script>
(function () {
  "use strict";

  var main = document.getElementById("main");
  var DATA = null;
  try { DATA = JSON.parse(document.getElementById("clarity-data").textContent); } catch (error) { DATA = null; }

  // ---- Mode (shared with the portfolio through the same storage key) ----
  var modeButton = document.getElementById("mode");
  function currentMode() { return document.documentElement.getAttribute("data-mode") === "nerd" ? "nerd" : "calm"; }
  function syncModeLabel() { modeButton.setAttribute("aria-label", "Switch to " + (currentMode() === "calm" ? "nerd" : "calm") + " mode"); }
  modeButton.addEventListener("click", function () {
    var next = currentMode() === "calm" ? "nerd" : "calm";
    document.documentElement.setAttribute("data-mode", next);
    try { localStorage.setItem("site-mode", next); } catch (error) { /* private browsing: fine */ }
    syncModeLabel();
  });
  syncModeLabel();

  if (!DATA || !DATA.repo) {
    main.innerHTML = '<div class="empty"><p class="label">No notes yet</p><h2 class="display" style="margin-top:14px">This page is empty</h2>' +
      '<p class="punch">Open the repository in Claude Code and run <code>python3 .claude/clarity/clarity.py build</code> to fill it.</p></div>';
    return;
  }

  var REPO = DATA.repo;
  var SITE = DATA.site || {};
  var FILES = DATA.files || {};
  var PATHS = Object.keys(FILES).sort();
  var TITLE = SITE.project_name || REPO.name || "Repository";
  var FILE_STATES = {
    "ready": ["\u2713", "Ready", "ok"], "needs-work": ["!", "Needs work", "warn"],
    "not-ready": ["\u00D7", "Not ready", "bad"], "unknown": ["?", "Not checked", "unk"]
  };
  var CHECK_STATES = {
    "pass": ["\u2713", "Yes", "ok"], "partial": ["!", "Partly", "warn"], "fail": ["\u00D7", "No", "bad"],
    "unknown": ["?", "Not checked", "unk"], "ready": ["\u2713", "Ready", "ok"],
    "needs-work": ["!", "Needs work", "warn"], "not-ready": ["\u00D7", "Not ready", "bad"]
  };
  var KIND_LABELS = { "setup": "setup", "function": "function", "class": "class", "method": "method",
    "type": "data shape", "value": "settings or data", "route": "web address", "export": "export",
    "statement": "database statement", "block": "block", "rule": "style rule", "entry point": "starting point",
    "test group": "tests", "event handler": "reacts to an event" };

  function esc(value) {
    return String(value == null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function fmt(value) {
    if (!value) return "";
    return esc(value).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\n/g, "<br>");
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function trunc(value, n) { value = String(value || ""); return value.length > n ? value.slice(0, n - 1) + "\u2026" : value; }
  function base(path) { var i = path.lastIndexOf("/"); return i < 0 ? path : path.slice(i + 1); }
  function dir(path) { var i = path.lastIndexOf("/"); return i < 0 ? "" : path.slice(0, i + 1); }
  function fileHref(path, section) { return "#/file/" + encodeURIComponent(path) + (section ? "/" + section : ""); }
  function both(calm, nerd) { return '<span class="calm-only">' + calm + '</span><span class="nerd-only">' + nerd + "</span>"; }
  function badge(states, status) {
    var s = states[status] || states.unknown;
    return '<span class="badge b-' + s[2] + '"><span aria-hidden="true">' + s[0] + "</span>" + esc(s[1]) + "</span>";
  }
  function fileBadge(card) { return badge(FILE_STATES, (card.readiness && card.readiness.status) || "unknown"); }
  function checkBadge(status) { return badge(CHECK_STATES, status || "unknown"); }

  // ---- Areas -------------------------------------------------------------

  function stats() {

  var tree = document.getElementById("tree");

  function matches(path, q) {
    var f = FILES[path];
    if (path.toLowerCase().indexOf(q) >= 0) return true;
    if ((f.summary || "").toLowerCase().indexOf(q) >= 0) return true;

  }
  function renderTree() {

      var files = sortFiles(a.files).filter(function (p) { return !q || matches(p, q); });
      if (!files.length) return;
      var open = q || a.id === currentArea ? " open" : "";
      html += '<details class="t-area"' + open + ' data-area="' + esc(a.id) + '"><summary><span class="label">' + a.num +

      files.forEach(function (p) {

  search.addEventListener("keydown", function (event) {

  // ---- Mind map ----------------------------------------------------------
  function edge(x1, y1, x2, y2, opacity) {
    var mx = (x1 + x2) / 2;
    return '<path class="mm-edge" d="M' + x1 + " " + y1 + " C" + mx + " " + y1 + ", " + mx + " " + y2 + ", " + x2 + " " + y2 +
      '" stroke-opacity="' + opacity + '"/>';
  }
  function drawMap() {
    var wrap = document.getElementById("mm");
    var detail = document.getElementById("mm-detail");
    if (!wrap) return;
    if (!AREAS.length) { wrap.innerHTML = '<p class="pending">No source files yet.</p>'; return; }
    var ROW = 40, H = 30, TOP = 10, X0 = 4, W0 = 200, X1 = 250, W1 = 268, X2 = 566, W2 = 292;
    var ys = AREAS.map(function (_, i) { return TOP + i * ROW; });
    var open = AREA_BY_ID[openArea] || null;
    var fnodes = [];
    if (open) {
      var sorted = sortFiles(open.files);
      var shown = sorted.slice(0, 14);
      fnodes = shown.map(function (p) { return { kind: "file", path: p }; });
      if (sorted.length > shown.length) fnodes.push({ kind: "more", n: sorted.length - shown.length });
    }
    var oi = open ? AREAS.indexOf(open) : -1;
    var fTop = open ? Math.max(TOP, ys[oi] - ((fnodes.length - 1) * ROW) / 2) : TOP;
    var lastA = ys[ys.length - 1];
    var lastF = fnodes.length ? fTop + (fnodes.length - 1) * ROW : 0;
    var height = Math.max(lastA, lastF) + H + TOP;
    var width = (open ? X2 + W2 : X1 + W1) + 6;
    var rootY = (ys[0] + lastA) / 2;
    var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + width + " " + height + '" width="' + width + '" height="' +
      height + '" role="group" aria-label="Mind map of ' + esc(TITLE) + '">';
    AREAS.forEach(function (a, i) { s += edge(X0 + W0, rootY + H / 2, X1, ys[i] + H / 2, open && a !== open ? 0.12 : 0.4); });
    fnodes.forEach(function (_, j) { s += edge(X1 + W1, ys[oi] + H / 2, X2, fTop + j * ROW + H / 2, 0.4); });
    s += '<g class="mm-root"><rect x="' + X0 + '" y="' + rootY + '" width="' + W0 + '" height="' + H + '" rx="15"/><text x="' +
      (X0 + 16) + '" y="' + (rootY + 19) + '">' + esc(trunc(TITLE, 24)) + "</text></g>";
    AREAS.forEach(function (a, i) {
      var isOpen = a === open;
      s += '<g class="mm-node mm-area' + (isOpen ? " is-open" : "") + (open && !isOpen ? " is-dim" : "") + '" tabindex="0" role="button" aria-expanded="' +
        isOpen + '" aria-label="' + esc(a.name) + ", " + a.files.length + ' files" data-area="' + esc(a.id) + '"><rect class="box" x="' + X1 +
        '" y="' + ys[i] + '" width="' + W1 + '" height="' + H + '" rx="15"/><text class="mm-num" x="' + (X1 + 14) + '" y="' + (ys[i] + 19) + '">' +
        a.num + '</text><text x="' + (X1 + 44) + '" y="' + (ys[i] + 19) + '">' + esc(trunc(a.name, 25)) + '</text><text class="mm-count" x="' +
        (X1 + W1 - 14) + '" y="' + (ys[i] + 19) + '" text-anchor="end">' + a.files.length + "</text></g>";
    });
    fnodes.forEach(function (f, j) {
      var y = fTop + j * ROW;
      if (f.kind === "more") {
        s += '<g class="mm-node mm-more" tabindex="0" role="link" aria-label="' + f.n + ' more files in this area" data-more="' + esc(open.id) +
          '"><rect class="box" x="' + X2 + '" y="' + y + '" width="' + W2 + '" height="' + H + '" rx="4"/><text x="' + (X2 + 14) + '" y="' + (y + 19) +
          '">' + f.n + " more files in this area</text></g>";

      var card = FILES[f.path];

      s += '<g class="mm-node mm-file" tabindex="0" role="link" aria-label="' + esc(f.path) + ", " + esc(st[1]) + '" data-path="' + esc(f.path) +

        esc(trunc(base(f.path), 32)) + '</text><text class="mm-glyph" x="' + (X2 + W2 - 14) + '" y="' + (y + 19) + '" text-anchor="end">' + st[0] +

    });

  function viewOverview() {

        '<th scope="col">Answer</th><th scope="col">Evidence</th><th scope="col">Next step</th></tr></thead><tbody>' + checks.map(function (c) {
          return "<tr><td>" + esc(c.question) + "</td><td>" + checkBadge(c.status) + "</td><td>" + (fmt(c.evidence) || "") + "</td><td>" +
            (fmt(c.next_step) || "") + "</td></tr>"; }).join("") + "</tbody></table></div>");
    }
    var groups = { "not-ready": [], "needs-work": [] };
    PATHS.forEach(function (p) { var st = (FILES[p].readiness || {}).status; if (groups[st]) groups[st].push(p); });
    [["not-ready", "Files that are not ready", "grep not-ready"], ["needs-work", "Files that need work", "grep needs-work"]].forEach(function (g) {
      var list = groups[g[0]];
      if (!list.length) return;
      html += sec(++n, g[1] + " (" + list.length + ")", g[2], '<ul class="rows-list">' + list.map(function (p, i) {
        var reasons = (FILES[p].readiness.reasons || []).map(fmt).join(" ");
        return '<li><a class="rowlink" href="' + fileHref(p) + '"><span class="label num">' + pad(i + 1) + '</span><span class="name">' + esc(base(p)) +
          '<span class="dirp">' + esc(dir(p)) + "</span></span>" + fileBadge(FILES[p]) + '<span class="sub">' + reasons + "</span></a></li>"; }).join("") + "</ul>");
    });
    return html;
  }

  function viewDecisions() {
    var list = REPO.decisions || [];
    var html = '<p class="label head-meta"><span>' + both("Decision records", "git log --decisions") + "</span><span>" + list.length +
      ' recorded</span></p><h2 class="display">Why it is built this way</h2><p class="punch">Each decision records what was chosen, why, what else was considered, and when to revisit it.</p>';
    if (!list.length) return html + '<p class="pending" style="margin-top:30px">No decisions recorded yet. The plan-first skill adds one whenever there is a real choice to make.</p>';
    return html + sec(1, "Decisions", "decisions", list.map(function (d) {
      return '<article class="card"><h3>' + esc((d.id ? d.id + ". " : "") + (d.title || "Decision")) + '</h3><dl class="facts">' +
        fact("What was decided", fmt(d.decision)) + fact("Why", fmt(d.why)) + fact("Alternatives considered", fmt(d.alternatives)) +
        fact("Trade-offs", fmt(d.tradeoffs)) + fact("Revisit when", fmt(d.revisit_when)) + fact("Files", linkList(d.files)) + "</dl></article>"; }).join(""));
  }

  function viewDebug() {
    var html = '<p class="label head-meta"><span>' + both("Debugging guide", "man debug") + '</span></p><h2 class="display">When something breaks</h2>' +
      '<p class="punch">A calm method that works for any bug, then the problems this app is most likely to have and where to look.</p>';
    html += sec(1, "The method", "procedure", '<ol class="method">' +
      "<li><strong>Make it happen again on purpose.</strong> Write down the exact steps, what you expected and what happened instead.</li>" +
      "<li><strong>Read the error in plain words.</strong> Copy the full message. Ask Claude what it means before asking it to fix anything.</li>" +
      "<li><strong>Find the area.</strong> Use the map on the overview to pick the area, then the file, then the section.</li>" +
      "<li><strong>Prove it with a small test.</strong> Ask Claude for a test that fails because of the bug. A fix without a failing test first is a guess.</li>" +
      "<li><strong>Fix the cause, not the symptom.</strong> Hiding an error message is not a fix. If two attempts fail, stop and rethink.</li>" +
      "<li><strong>Keep it fixed.</strong> Keep the test, refresh these notes, and record the problem below if it could happen again.</li></ol>");
    var list = REPO.debug_playbook || [];
    html += sec(2, "Known problems", "known issues", list.length ? list.map(function (item) {
      var area = AREA_BY_ID[item.likely_area];
      return '<article class="card"><h3>' + esc(item.symptom || "Problem") + '</h3><dl class="facts">' +
        fact("Likely area", area ? '<a href="#/area/' + encodeURIComponent(area.id) + '">' + area.num + " / " + esc(area.name) + "</a>" : esc(item.likely_area || "")) +
        fact("Where to look", linkList(item.where_to_look)) +
        fact("What to try", (item.steps || []).length ? '<ol class="method">' + item.steps.map(function (s) { return "<li>" + fmt(s) + "</li>"; }).join("") + "</ol>" : "") +
        "</dl></article>"; }).join("") : '<p class="pending">No known problems recorded yet.</p>');
    return html;
  }

  function viewGlossary() {
    var terms = {};
    (REPO.glossary || []).forEach(function (t) { if (t && t.term) terms[t.term.toLowerCase()] = { term: t.term, meaning: t.meaning, files: [] }; });
    PATHS.forEach(function (p) {
      (FILES[p].terms || []).forEach(function (t) {
        if (!t || !t.term) return;
        var key = t.term.toLowerCase();
        if (!terms[key]) terms[key] = { term: t.term, meaning: t.meaning, files: [] };
        if (terms[key].files.length < 5) terms[key].files.push(p);
      });
    });
    var keys = Object.keys(terms).sort();
    var html = '<p class="label head-meta"><span>' + both("Glossary", "grep glossary") + "</span><span>" + keys.length +
      ' terms</span></p><h2 class="display">Glossary</h2><p class="punch">Technical words used in this codebase, in plain English.</p>';
    if (!keys.length) return html + '<p class="pending" style="margin-top:30px">No terms recorded yet.</p>';
    return html + sec(1, "Terms", "terms", '<label><span class="sr-only">Filter the glossary</span><input class="filter" id="gfilter" type="search" placeholder="Filter terms"></label>' +
      '<dl class="glossary" id="glist">' + keys.map(function (k) {
        var t = terms[k];
        return '<dt data-k="' + esc(k) + '">' + esc(t.term) + '</dt><dd data-k="' + esc(k) + '">' + fmt(t.meaning) +
          (t.files.length ? '<div class="used">Used in ' + t.files.map(function (p) { return '<a href="' + fileHref(p) + '">' + esc(base(p)) + "</a>"; }).join(", ") + "</div>" : "") +
          "</dd>"; }).join("") + "</dl>");
  }

  function notFound(message) {
    return '<p class="label head-meta"><span>404</span></p><h2 class="display">Not found</h2><p class="punch">' + esc(message) +
      '</p><p style="margin-top:24px"><a class="u" href="#/overview">Back to the overview</a></p>';
  }

  // ---- Router ------------------------------------------------------------
  function render() {
    var raw = (location.hash || "#/overview").slice(2);
    var parts = raw.split("/");
    var view = parts[0] || "overview";
    var arg = parts[1] ? decodeURIComponent(parts[1]) : "";
    var extra = parts[2] ? decodeURIComponent(parts[2]) : "";
    currentPath = null;
    var html;
    if (view === "file") html = viewFile(arg, extra);
    else if (view === "area") html = viewArea(arg);
    else if (view === "readiness") html = viewReadiness();
    else if (view === "decisions") html = viewDecisions();
    else if (view === "debug") html = viewDebug();
    else if (view === "glossary") html = viewGlossary();
    else { view = "overview"; html = viewOverview(); }
    main.innerHTML = html;
    document.querySelectorAll(".views a").forEach(function (link) {
      if (link.getAttribute("data-view") === view) link.setAttribute("aria-current", "page"); else link.removeAttribute("aria-current");
    });
    renderTree();
    if (view === "overview") drawMap();
    if (view === "glossary") {
      var gf = document.getElementById("gfilter");
      if (gf) gf.addEventListener("input", function () {
        var q = gf.value.trim().toLowerCase();
        var text = {};
        document.querySelectorAll("#glist [data-k]").forEach(function (el) { var k = el.getAttribute("data-k"); text[k] = (text[k] || "") + " " + el.textContent.toLowerCase(); });
        document.querySelectorAll("#glist [data-k]").forEach(function (el) { var k = el.getAttribute("data-k"); el.style.display = !q || text[k].indexOf(q) >= 0 ? "" : "none"; });
      });
    }
    var target = extra ? document.getElementById("sec-" + extra) : null;
    if (target && target.scrollIntoView) target.scrollIntoView({ block: "start" });
    else if (window.scrollTo) { try { window.scrollTo(0, 0); } catch (error) { /* not available */ } }
    main.focus({ preventScroll: true });
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
