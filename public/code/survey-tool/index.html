estion a white box with a purple left edge.","why":"Likely reason: makes each question stand out.","watch_out":"None."},{"start":209,"end":213,"kind":"rule","name":".question-card h4 ","id":"s29","hash":"6b6d82469ed5008b","title":"Question card heading","what":"Colours the question heading dark grey with space below.","why":"Reason not stated in the code.","watch_out":"None."},{"start":214,"end":219,"kind":"rule","name":".question-meta ","id":"s30","hash":"cf536c1d6f3d0e4e","title":"Question tag row","what":"Places question badges side by side with gaps and space above.","why":"Likely reason: keeps type and category tags neat.","watch_out":"None."},{"start":220,"end":227,"kind":"rule","name":".badge ","id":"s31","hash":"d1f9d6d9210fb493","title":"Badge shape","what":"Makes badges small rounded pills with bold text.","why":"Reason not stated in the code.","watch_out":"None."},{"start":228,"end":232,"kind":"rule","name":".badge-type ","id":"s32","hash":"32d8852f7100efbc","title":"Type badge colours","what":"Colours type badges pale blue with dark blue text.","why":"Likely reason: distinguishes question types.","watch_out":"None."},{"start":233,"end":237,"kind":"rule","name":".badge-category ","id":"s33","hash":"e76d4ef2fb9abec9","title":"Category badge colours","what":"Colours category badges pale purple with dark purple text.","why":"Likely reason: distinguishes categories from types.","watch_out":"None."},{"start":238,"end":245,"kind":"rule","name":".filters ","id":"s34","hash":"d32c6a0a43c08525","title":"Filter row layout","what":"Places the model filter dropdowns and refresh button in a wrapping row with spacing.","why":"Likely reason: keeps filters usable on small screens.","watch_out":"None."},{"start":246,"end":252,"kind":"rule","name":".filters select ","id":"s35","hash":"1ef26296ec0cb6f0","title":"Filter dropdown look","what":"Styles filter dropdowns with padding, a grey border, rounded corners and larger text.","why":"Reason not stated in the code.","watch_o kind":"rule","name":".model-meta-item .value ","id":"s43","hash":"68539358e359680d","title":"Detail value colour","what":"Makes detail values bold and dark grey.","why":"Reason not stated in the code.","watch_out":"None."},{"start":301,"end":307,"kind":"rule","name":".quality-score ","id":"s44","hash":"f90016ae1fe17177","title":"Quality score pill","what":"Shows the quality score as a small rounded pill with bold text.","why":"Reason not stated in the code.","watch_out":"None."},{"start":308,"end":312,"kind":"rule","name":".quality-high ","id":"s45","hash":"dca761292d30a7d2","title":"High quality colour","what":"Colours high quality scores green.","why":"Likely reason: signals a strong model at a glance.","watch_out":"The threshold for this colour is set in app.js, so both must agree."},{"start":313,"end":317,"kind":"rule","name":".quality-medium ","id":"s46","hash":"f8f4e8bacaee7f29","title":"Medium quality colour","what":"Colours medium quality scores yellow.","why":"Likely reason: signals a middling model.","watch_out":"None."},{"start":318,"end":325,"kind":"rule","name":"footer ","id":"s47","hash":"8c8dfb9f4552cb5b","title":"Footer look","what":"Gives the footer a light grey background, padding, centred text and a top border.","why":"Reason not stated in the code.","watch_out":"None."},{"start":326,"end":333,"kind":"rule","name":".status-badge ","id":"s48","hash":"73194f504cacb859","title":"Status badge shape","what":"Makes the backend status badge a small rounded pill with bold text.","why":"Reason not stated in the code.","watch_out":"None."},{"start":334,"end":338,"kind":"rule","name":".status-online ","id":"s49","hash":"93d6e310c1d74d5a","title":"Online status colour","what":"Colours the online status green.","why":"Likely reason: shows a healthy backend.","watch_out":"None."},{"start":339,"end":343,"kind":"rule","name":".status-offline ","id":"s50","hash":"eb8d93081e8de709","title":"Offline status colour","what":"Colours the offline status red.","why":"Likely reason: shows a problem.","watch_out":"None."},{"start":344,"end":349,"kind":"rule","name":"footer a ","id":"s51","hash":"906783187d537937","title":"Footer link look","what":"Colours footer links purple with no underline.","why":"Reason not stated in the code.","watch_out":"None."},{"start":350,"end":353,"kind":"rule","name":"footer a:hover ","id":"s52","hash":"1bc63b731cddbfad","title":"Footer link hover","what":"Underlines a footer link on hover.","why":"Likely reason: confirms the link is clickable.","watch_out":"None."},{"start":354,"end":368,"kind":"rule","name":".loading-overlay ","id":"s53","hash":"90baf6aabcc34cc4","title":"Full-screen loading overlay","what":"Covers the whole screen with a dark see-through layer and centres its content on top of everything.","why":"Likely reason: blocks clicks while a request runs.","watch_out":"The overlay is hidden by a style set in index.html, so both must stay in agreement."},{"start":369,"end":374,"kind":"rule","name":".loading-overlay p ","id":"s54","hash":"62ac6e9c2a213a8a","title":"Loading message text","what":"Makes the loading message white, larger and spaced below the spinner.","why":"Reason not stated in the code.","watch_out":"None."},{"start":375,"end":387,"kind":"rule","name":".spinner ","id":"s55","hash":"7529d35787e7636e","title":"Spinning loader","what":"Draws a round ring that spins continuously while work is in progress.","why":"Likely reason: shows that the app is busy.","watch_out":"None."},{"start":388,"end":397,"kind":"rule","name":".error-message ","id":"s56","hash":"33efa8d515dfdb27","title":"Error message box","what":"Shows errors in a pink box with dark red text and a red left edge.","why":"Likely reason: makes problems obvious.","watch_out":"None."},{"start":398,"end":406,"kind":"rule","name":".success-message ","id":"s57","hash":"48ba8d828fdeffb9","title":"Success message box","what":"Shows success messages in a green box with dark green text.","why":"Likely reason: matches the error style but with positive colours.","watch_out":"None."},{"start":407,"end":411,"kind":"rule","name":".validation-section ","id":"s58","hash":"b474ee19f65e9108","title":"Validation section spacing","what":"Adds space below each group of validation results.","why":"Reason not stated in the code.","watch_out":"None."},{"start":412,"end":416,"kind":"rule","name":".validation-section h4 ","id":"s59","hash":"54b53032e63acb85","title":"Validation section heading","what":"Colours validation group headings dark grey with spacing below.","why":"Reason not stated in the code.","watch_out":"None."},{"start":417,"end":424,"kind":"rule","name":".validation-item ","id":"s60","hash":"f8536504ea57dd5b","title":"Validation item box","what":"Gives each validation line a white box with a green left edge.","why":"Likely reason: a green edge marks a passing item by default.","watch_out":"Items are green unless another class changes the colour."},{"start":425,"end":428,"kind":"rule","name":".validation-item.error ","id":"s61","hash":"b0f9c95e3c665985","title":"Failed validation item","what":"Changes the left edge of a validation item to red.","why":"Likely reason: flags a problem.","watch_out":"None."},{"start":429,"end":432,"kind":"rule","name":".validation-item.warning ","id":"s62","hash":"4ca8b28fb81bb319","title":"Warning validation item","what":"Changes the left edge of a validation item to yellow.","why":"Likely reason: flags a item worth a look.","watch_out":"None."},{"start":433,"end":459,"kind":"rule","name":"@media (max-width: 768px) ","id":"s63","hash":"81f1ace85096d505","title":"Narrow screen layout","what":"On screens 768 pixels wide or less, reduces padding, shrinks the heading, lets tabs wrap into two per row, and shows model cards in one column.","why":"Likely reason: keeps the layout usable on phones.","watch_out":"Tab sizing here overrides the desktop tab rule, so changes must be made in both places."},{"start":460,"end":470,"kind":"rule","name":"pre ","id":"s64","hash":"a82fb6f252525e5c","title":"Code and raw data display","what":"Shows raw answers in a dark box with light text, padding and sideways scrolling.","why":"Likely reason: raw answers are displayed as code when the expected format is missing.","watch_out":"None."},{"start":471,"end":473,"kind":"rule","name":"code ","id":"s65","hash":"e83b66576f092db5","title":"Code font","what":"Sets code text to a standard monospaced font.","why":"Reason not stated in the code.","watch_out":"None."}],"explained_at":"2026-11-12T00:00:13+00:00","explained_by":"haiku","summary":"The stylesheet that sets the colours, spacing, layout, tabs, cards, buttons, model grid, status badges and mobile layout for the frontend.","purpose":"Makes the classic page look consistent and usable on phones and desktops.","why":"Likely reason: keeps visual rules in one file separate from the page structure. Reason for specific values is not stated in the code.","how":"Rules are read top to bottom. Global resets come first, then layout pieces, then components such as tabs, forms, buttons and cards, then status colours, the loading overlay, messages, and finally a narrow-screen block and code display styles.","inputs":"Class names and ids added by index.html and app.js.","outputs":"Visual appearance on screen.","risks":"Some selectors are grouped with others that are not shown in this packet, so changes may affect more elements than expected. Colours carry meaning such as green for good and red for poor.","debug":"If an element looks wrong, search the file for its class name. If the mobile layout breaks, check the rules inside the narrow-screen block.","summary_hash":"sha256:2381ae6c8352debcaada0e88eb6b8589429e20fe9c3be9cae526eda5d7d2cb9b","fresh":true},"frontend/wizard-app.js":{"schema_version":1,"path":"frontend/wizard-app.js","language":"JavaScript","lines":685,"hash":"sha256:be31993ab752f74dd4af9c3a281f8765d23ff1b62382dc907b5f8dc007c1f2e3","area":"frontend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Work is not saved between page loads.","Server data is written as raw HTML.","The page-start document load can never run.","Only 22 of 35 sections were included in this review, so the later editing, validation and export parts are not covered here."]},"terms":[{"term":"state","meaning":"values the program remembers while it runs, here workflowData and currentStep."},{"term":"step","meaning":"one stage of the guided workflow, numbered from zero."},{"term":"progress bar or stepper","meaning":"the visual row of steps that shows which stage the user is on."},{"term":"export","meaning":"saving the finished survey to a file in a chosen format."},{"term":"CSV","meaning":"a plain text table format where values are separated by commas."},{"term":"Markdown","meaning":"a simple plain text format that uses symbols for headings and lists."}],"depends_on":["frontend/index.html (the classic page it links to)","backend API at localhost port 8000"],"used_by":["Not visible in the packet."],"sections":[{"start":1,"end":10,"kind":"setup","name":"File setup","id":"s1","hash":"ee932b4efa119951","title":"Setup and shared memory","what":"Holds the backend address, the current step number, and the in-memory record of documents, plan, questions and validation results.","why":"Likely reason: keeps the workflow's progress in one place so each step can read what earlier steps produced.","watch_out":"Everything here disappears on page reload."},{"start":11,"end":17,"kind":"value","name":"workflowData","id":"s2","hash":"ff4ddc149e9de169","title":"Empty workflow record","what":"Defines the starting shape of the workflow record with empty document list, no plan, no questions and no validation results.","why":"Likely reason: gives a clean starting point, and startOver reuses the same shape.","watch_out":"Any new field must be added here and in startOver, or resets will be incomplete."},{"start":18,"end":28,"kind":"event handler","name":"document DOMContentLoaded handler","id":"s3","hash":"44e3b974b541fc85","title":"Page start setup","what":"On load, checks backend status, starts the 30 second status timer, and would load documents if the user is past step one.","why":"Likely reason: same startup pattern as the classic page.","watch_out":"The step counter starts at zero, so the document load inside this block never runs on first load."},{"start":29,"end":48,"kind":"function","name":"checkAPIStatus","id":"s4","hash":"d5340dd25f85edff","title":"Backend status check","what":"Asks the health address whether the backend is up and updates the footer badge to Online, Error or Offline.","why":"Likely reason: the wizard uses a dedicated health address, unlike the classic page.","watch_out":"Any successful response counts as online."},{"start":49,"end":55,"kind":"function","name":"startWorkflow","id":"s5","hash":"4567a44e559ae347","title":"Starting the workflow","what":"Moves the user from the welcome screen to step one.","why":"Likely reason: the start button needs a single named action.","watch_out":"None."},{"start":56,"end":61,"kind":"function","name":"nextStep","id":"s6","hash":"ba1f78caee344b06","title":"Moving forward","what":"Advances to the next step, but never past step five.","why":"Likely reason: the last step is the final stage, so the limit prevents going beyond it.","watch_out":"The limit is a fixed number, so adding a step needs this changed too."},{"start":62,"end":67,"kind":"function","name":"previousStep","id":"s7","hash":"e05f4a1650d5ce51","title":"Moving back","what":"Returns to the previous step, but never before the welcome screen.","why":"Likely reason: lets the user correct earlier choices.","watch_out":"None."},{"start":68,"end":95,"kind":"function","name":"goToStep","id":"s8","hash":"4f5cb50284f718c1","title":"Switching the visible step","what":"Hides the current step panel, shows the chosen one, updates the progress bar, scrolls to the top, and loads documents when step one opens.","why":"Likely reason: this is the single place where navigation happens, so all steps behave the same.","watch_out":"Only step one loads documents, so other steps must load their own data."},{"start":96,"end":107,"kind":"function","name":"updateStepper","id":"s9","hash":"9b4256a8d5e0a85d","title":"Progress bar highlighting","what":"Marks the current step as active and earlier steps as completed.","why":"Likely reason: gives the user a sense of how far they have come.","watch_out":"It assumes the progress items appear in the same order as the step numbers."},{"start":108,"end":119,"kind":"function","name":"startOver","id":"s10","hash":"4ddf5bff84008494","title":"Starting over","what":"After a confirmation prompt, clears all stored work and returns to the welcome screen.","why":"Likely reason: lets the user begin a new survey without reloading the page.","watch_out":"Typed text in form fields and displayed results are not cleared, only the stored data."},{"start":120,"end":123,"kind":"function","name":"openClassicUI","id":"s11","hash":"cb9d236101093b79","title":"Switching to the classic page","what":"Opens the classic index page in the same window.","why":"Likely reason: lets users who prefer the single-page tool switch.","watch_out":"Stored work is lost when leaving this page."},{"start":124,"end":135,"kind":"function","name":"showLoading","id":"s12","hash":"5d836eacb776474f","title":"Loading indicator","what":"Shows the full-screen spinner with a chosen message, updating the message text if that element exists.","why":"Likely reason: tells the user what is happening during long calls such as planning.","watch_out":"The overlay itself is looked up without a check, so a missing overlay causes an error."},{"start":136,"end":139,"kind":"function","name":"hideLoading","id":"s13","hash":"2c7498929021a580","title":"Hiding the loading indicator","what":"Removes the spinner after a request finishes.","why":"Likely reason: pairs with the show function.","watch_out":"None."},{"start":140,"end":159,"kind":"function","name":"showError","id":"s14","hash":"3cc4c86806a2289e","title":"Error display","what":"Turns errors into readable text and shows them in the chosen area in red.","why":"Likely reason: different error shapes need one display.","watch_out":"The message is inserted as raw HTML."},{"start":160,"end":208,"kind":"function","name":"handleFileUpload (part 1)","id":"s15","hash":"619b080d8228bc53","title":"Choosing and sending documents","what":"Reads the selected files and document type, then uploads each file one at a time and collects successes and failures.","why":"Likely reason: one failing file should not stop the rest.","watch_out":"Long lists of files keep the spinner up for a long time."},{"start":209,"end":254,"kind":"function","name":"handleFileUpload (part 2)","id":"s16","hash":"e8f060219c33eec8","title":"Showing upload results","what":"Lists uploaded files with their IDs and failed files with reasons, resets the form, and reloads the document list.","why":"Likely reason: gives clear per-file feedback before the user moves on.","watch_out":"Failure reasons from the server are inserted as raw HTML."},{"start":255,"end":277,"kind":"function","name":"loadDocuments","id":"s17","hash":"8eaea64551f17176","title":"Loading the document list","what":"Asks the backend for uploaded documents and stores them, then displays them.","why":"Likely reason: keeps the list current after each upload.","watch_out":"Errors appear inside the list as raw HTML."},{"start":278,"end":311,"kind":"function","name":"displayDocuments","id":"s18","hash":"95685587ab89c5a9","title":"Drawing document cards","what":"Creates a card per document with title, type, audience labels, version and upload date.","why":"Likely reason: a readable summary of what the user has uploaded.","watch_out":"Titles are inserted as raw HTML."},{"start":312,"end":366,"kind":"function","name":"handlePlanSurvey (part 1)","id":"s19","hash":"1fa1c9c94872db22","title":"Requesting the survey plan","what":"Reads the goal, audience, required topics and model type, sends them to the planning endpoint, and shows the planned questions.","why":"Likely reason: the planning step turns the goal into questions, which later steps use.","watch_out":"Planned text from the backend is inserted as raw HTML."},{"start":367,"end":396,"kind":"function","name":"handlePlanSurvey (part 2)","id":"s20","hash":"3161511204ddeb96","title":"Showing plan and saving questions","what":"Builds the plan cards, stores the planned questions for later steps, and shows the result or the raw data if the format is unexpected.","why":"Likely reason: saving the questions here is what makes the review step possible.","watch_out":"If the backend does not send a questions list, the review step has nothing to show."},{"start":397,"end":405,"kind":"function","name":"acceptPlanAndContinue","id":"s21","hash":"8270bbbcefde511c","title":"Accepting the plan","what":"If questions exist, builds the review list and moves to step three, otherwise asks the user to plan first.","why":"Likely reason: stops the user from reviewing an empty list.","watch_out":"It checks only that questions exist, not that the plan is valid."},{"start":406,"end":443,"kind":"function","name":"displayQuestionsForReview","id":"s22","hash":"1ce5a697fbd11cd2","title":"Building the review list","what":"Draws one card per question with its number, type, category, options and reasoning, plus Edit and Delete buttons.","why":"Likely reason: lets the user check and change each question before validation. The Edit and Delete functions are defined in a part of the file not included in this review.","watch_out":"Buttons refer to questions by position, so removing one can shift the positions the other buttons use, and the delete logic is not visible here. Question text is inserted as raw HTML."},{"start":444,"end":447,"kind":"function","name":"editQuestion","id":"s23","hash":"ee2721bd650ab69b","title":"Edit question placeholder","what":"Shows a message that question editing is not built yet. Clicking edit does not change any question.","why":"Likely reason: a placeholder for a feature that has not been written yet.","watch_out":"Users may expect edits that never happen, because nothing is saved."},{"start":448,"end":454,"kind":"function","name":"deleteQuestion","id":"s24","hash":"430f290fa573e165","title":"Delete question after confirmation","what":"Asks the user to confirm, then removes the chosen question from the working question list and redraws the review list.","why":"Reason not stated in the code. The confirmation likely prevents accidental deletes.","watch_out":"Removes the question only from workflowData.questions, so the saved survey plan may still contain it and the JSON export can still include it."},{"start":455,"end":462,"kind":"function","name":"proceedToValidation","id":"s25","hash":"38dc1cd99c652124","title":"Move to validation after check","what":"Blocks the move to the Validate step with a message when there are no questions. Otherwise it jumps to step 4.","why":"Stops users from validating an empty survey.","watch_out":"The step number 4 is fixed in this function, so reordering the steps means changing it too."},{"start":463,"end":521,"kind":"function","name":"runValidation (part 1)","id":"s26","hash":"21031ca212d40613","title":"Start validation and build results","what":"Sends the survey plan to the backend validation endpoint and starts building the results panel from the hard checks. Stops with a message if no plan exists.","why":"Likely reason: the plan must exist first, and the backend does the actual checking.","watch_out":"Issue text from the server is placed into the page as HTML without escaping, so any markup in it will be shown or run."},{"start":522,"end":569,"kind":"function","name":"runValidation (part 2)","id":"s27","hash":"0052818581afd3d4","title":"Show quality scores and suggestions","what":"Adds color-coded quality scores out of 10 and suggestions to the results, then enables the Continue to Export button and hides the spinner. If the request fails, it shows an error in the results panel.","why":"Lets users see which quality areas need work at a glance. Scores are advice, and hard checks are the required ones.","watch_out":"The Continue to Export button is enabled even when the hard checks failed, and the scores are colored by fixed cutoffs of 7 and 5."},{"start":570,"end":608,"kind":"function","name":"exportSurvey","id":"s28","hash":"99838ddcf8954463","title":"Choose export format and download","what":"Builds the file content for JSON, CSV, or Markdown and starts a download with a timestamped file name. Any other format shows a not-implemented message.","why":"One entry point so every export button uses the same steps.","watch_out":"JSON comes from the survey plan, while CSV and Markdown use the working question list, so the files can disagree after edits."},{"start":609,"end":619,"kind":"function","name":"convertToCSV","id":"s29","hash":"2da06a5df6b560f9","title":"Turn questions into spreadsheet rows","what":"Builds a CSV file with a header row and one row per question containing its text, type, and category. Double quotes in the question text are doubled so the file stays valid.","why":"Quoting keeps commas and quote marks inside question text from breaking the columns.","watch_out":"Only the question text is escaped, so a type or category value containing a double quote would break the file."},{"start":620,"end":638,"kind":"function","name":"convertToMarkdown","id":"s30","hash":"04a3c52852b9ebf2","title":"Turn plan into readable document","what":"Builds a Markdown document with the survey title, description, and each question with its type, category, options, and reasoning.","why":"Gives a human-readable copy for documentation.","watch_out":"The questions come from the working list rather than the plan, so this document may not match the JSON export."},{"start":639,"end":651,"kind":"function","name":"downloadFile","id":"s31","hash":"56f25ee1ef6b613e","title":"Save text as file in browser","what":"Wraps the content in a file, creates a temporary link to it, clicks the link to start the download, then removes the link and the temporary address.","why":"A browser cannot save a file directly from script, so a hidden link is used.","watch_out":"This only works inside a browser. The file name is used exactly as the caller gives it."},{"start":652,"end":671,"kind":"function","name":"downloadJSON","id":"s32","hash":"59efa9118fb08d4d","title":"Download plan as JSON file","what":"Saves the current survey plan as a JSON file. The file name starts with the label passed in, such as planner, plus a timestamp. Shows a message if there is no plan.","why":"Likely reason: a shortcut for the plan download button on the planning step.","watch_out":"It repeats the download steps from the file download function instead of reusing them, so a fix in one place may be missed in the other."},{"start":672,"end":678,"kind":"function","name":"viewDashboard","id":"s33","hash":"265c596bfd215dcb","title":"Dashboard placeholder message","what":"Shows a coming soon message. No dashboard exists yet.","why":"Likely reason: a placeholder for a future feature.","watch_out":"Anything that links here will look like a working feature to users."},{"start":679,"end":682,"kind":"function","name":"closeModal","id":"s34","hash":"cc3cac2e9d84d41f","title":"Hide a popup by its id","what":"Hides the popup with the given id by setting its display to none.","why":"Reusable, so every popup closes the same way.","watch_out":"Fails with an error if no element has that id."},{"start":683,"end":685,"kind":"function","name":"showQuickTour","id":"s35","hash":"9a1468d4c0d6d1fe","title":"Open the quick tour popup","what":"Shows the element with id tourModal as a flex box.","why":"Likely reason: a help popup that was planned, or removed from the page.","watch_out":"The tourModal element does not appear in wizard.html as provided, so clicking the tour link would cause an error."}],"explained_at":"2026-11-12T00:07:16+00:00","explained_by":"haiku","summary":"Browser logic for the step-by-step version of the research tool, which walks the user through upload, planning, reviewing questions, validating and exporting a survey.","purpose":"Moves the user through numbered steps and keeps the work done so far in memory.","why":"Likely reason: a guided flow suits users new to survey design. Reason not stated in the code.","how":"On load it checks backend status. The step functions show the right panel and update the progress bar. Upload, planning and review functions call the backend and store results in workflowData. Later steps for review editing, validation, exporting and the dashboard are defined below the reviewed part.","inputs":"Form input, selected files, button clicks, and answers from the backend.","outputs":"Updated step panels, a progress indicator, stored data for later steps, and downloads.","risks":"All work is held only in memory, so a reload loses it. Server text is written as raw HTML. The initial document load on page start is never reached because the step counter starts at zero.","debug":"If a step does not appear, check that goToStep finds an element named with the step number. If progress is lost after reload, this is expected because nothing is saved. If the review step is empty, confirm the plan step stored questions.","summary_hash":"sha256:be31993ab752f74dd4af9c3a281f8765d23ff1b62382dc907b5f8dc007c1f2e3","fresh":true},"frontend/wizard-styles.css":{"schema_version":1,"path":"frontend/wizard-styles.css","language":"CSS","lines":781,"hash":"sha256:dedfd00ee2d5c95a95208d5ce33b0b35deac2debf8c5d18dd0857177d3819509","area":"frontend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No automated check or screenshot test is visible for the styles.","A few button rules are duplicated, which can confuse later changes.","The page has not been checked in a browser as part of this review."]},"terms":[{"term":"CSS","meaning":"the style language that controls how a web page looks"},{"term":"selector","meaning":"the part of a style rule that names which elements it applies to"},{"term":"flexbox","meaning":"a layout method that arranges items in a row or column and spaces them"},{"term":"grid","meaning":"a layout method that arranges items into rows and columns"},{"term":"media query","meaning":"a rule that applies only when the screen is a certain width"}],"depends_on":["frontend/wizard.html"],"used_by":["frontend/wizard.html"],"sections":[{"start":1,"end":12,"kind":"setup","name":"File setup","id":"s1","hash":"6ce2319af9817360","title":"Reset of spacing and sizing","what":"Removes default margins and padding and makes every box include its border in its size.","why":"Gives every browser the same starting point so layouts line up.","watch_out":"Every element is affected, so added spacing elsewhere may look different than expected."},{"start":13,"end":19,"kind":"rule","name":"body ","id":"s2","hash":"390e4c23479a2e9b","title":"Page background and text","what":"Sets a purple gradient background that fills the screen, the default font, and dark gray text.","why":"Likely reason: sets the brand look for the whole page.","watch_out":""},{"start":20,"end":26,"kind":"rule","name":".main-container ","id":"s3","hash":"305390e5216d5bc8","title":"Centered main container","what":"Limits the page content to a maximum width of 1400 pixels and centers it.","why":"Keeps content readable on wide monitors.","watch_out":""},{"start":27,"end":35,"kind":"rule","name":".app-header ","id":"s4","hash":"324da87dfb7f963f","title":"Header card style","what":"Makes the top header a white rounded card with padding and a soft shadow.","why":"Likely reason: separates the title area from the content.","watch_out":""},{"start":36,"end":43,"kind":"rule","name":".header-content h1 ","id":"s5","hash":"b26ffcf7e7df9d05","title":"Gradient header title","what":"Fills the main heading with a purple gradient instead of a solid color.","why":"Visual emphasis for the app name.","watch_out":"Relies on browser-specific text rules, so some browsers may show the heading in a plain color."},{"start":44,"end":49,"kind":"rule","name":".subtitle ","id":"s6","hash":"1ee16cb73093a74f","title":"Subtitle style","what":"Styles the line under the title in gray with a larger font.","why":"Likely reason: a secondary description under the heading.","watch_out":""},{"start":50,"end":56,"kind":"rule","name":".header-status ","id":"s7","hash":"8658320fa91923a1","title":"Header status row layout","what":"Places the API label and status badge side by side with a small gap.","why":"Keeps the status label on one line.","watch_out":""},{"start":57,"end":63,"kind":"rule","name":".status-badge ","id":"s8","hash":"23e8fff671a457bc","title":"Status badge shape","what":"Gives the API status badge rounded ends, bold text, and padding.","why":"Makes the status easy to notice.","watch_out":""},{"start":64,"end":68,"kind":"rule","name":".status-online ","id":"s9","hash":"93d6e310c1d74d5a","title":"Online status colors","what":"Shows the online badge with a light green background and dark green text.","why":"Green signals the backend is reachable.","watch_out":"The script must add this class; the color does not change by itself."},{"start":69,"end":73,"kind":"rule","name":".status-offline ","id":"s10","hash":"eb8d93081e8de709","title":"Offline status colors","what":"Shows the offline badge with a light red background and dark red text.","why":"Red signals the backend cannot be reached.","watch_out":"Like the online style, it only appears if the script adds this class."},{"start":74,"end":85,"kind":"rule","name":".progress-stepper ","id":"s11","hash":"97a44f57cc6da38e","title":"Progress bar card layout","what":"Makes the six-step progress bar a white card with items spread across the full width.","why":"Shows the whole journey at once.","watch_out":""},{"start":86,"end":92,"kind":"rule","name":".step ","id":"s12","hash":"445327a84606c80f","title":"Single step layout","what":"Stacks each step's circle above its label and centers them.","why":"Keeps each step's number and name together.","watch_out":""},{"start":93,"end":107,"kind":"rule","name":".step-number ","id":"s13","hash":"1b1772a5bac52fe0","title":"Step number circle","what":"Draws a gray circle of fixed size with a bold number and a short color transition.","why":"Makes each step look like a numbered button.","watch_out":""},{"start":108,"end":114,"kind":"rule","name":".step.active .step-number ","id":"s14","hash":"e409b5ec52983029","title":"Active step highlight","what":"Gives the current step a purple gradient, white number, slightly larger size, and a glow.","why":"Shows the user where they are.","watch_out":"Only one step should have the active class at a time."},{"start":115,"end":119,"kind":"rule","name":".step.completed .step-number ","id":"s15","hash":"8a904cff376353ba","title":"Completed step color","what":"Turns finished steps green with white numbers.","why":"Shows progress already made.","watch_out":"The script must add the completed class to earlier steps."},{"start":120,"end":123,"kind":"rule","name":".step.completed .step-number::after ","id":"s16","hash":"fcc6f89aae1e3f04","title":"Checkmark on completed step","what":"Adds a check mark symbol to finished step circles.","why":"Makes completion clear without relying only on color.","watch_out":"The check mark replaces the number visually, not in the page content."},{"start":124,"end":130,"kind":"rule","name":".step-label ","id":"s17","hash":"7ff3e0ec3dd378c6","title":"Step label text","what":"Styles the step names under the circles as small, centered, gray text.","why":"Keeps labels readable without crowding the bar.","watch_out":""},{"start":131,"end":135,"kind":"rule","name":".step.active .step-label ","id":"s18","hash":"880c243cc7f7a57a","title":"Active step label","what":"Makes the current step's name purple and bold.","why":"Matches the highlighted circle.","watch_out":""},{"start":136,"end":144,"kind":"rule","name":".step-connector ","id":"s19","hash":"5447471c23ff62d8","title":"Line between steps","what":"Draws a thin gray line between step circles.","why":"Connects the steps visually as one path.","watch_out":"The top offset is fixed at 20 pixels, so changing the circle size may misalign the line."},{"start":145,"end":148,"kind":"rule","name":".step.completed + .step-connector ","id":"s20","hash":"01dee43ec7ac7ca6","title":"Line after completed step","what":"Colors the line that follows a finished step green.","why":"Shows the path already completed.","watch_out":"Depends on the completed step being directly before its connector in the page structure."},{"start":149,"end":157,"kind":"rule","name":".content-wrapper ","id":"s21","hash":"6ba719a392871744","title":"Main content card","what":"Makes the content area a white rounded card with padding and a minimum height.","why":"Gives each step a consistent panel.","watch_out":""},{"start":158,"end":162,"kind":"rule","name":".step-content ","id":"s22","hash":"9acb717997c9cbbd","title":"Hidden step panels","what":"Hides every step panel by default.","why":"Only the current step should be visible.","watch_out":"A panel stays hidden unless the active class is added to it."},{"start":163,"end":178,"kind":"rule","name":".step-content.active ","id":"s23","hash":"58c303e808f15ed3","title":"Visible step with fade in","what":"Shows the active step panel and plays a short fade and slide-up animation.","why":"Softens the change between steps.","watch_out":""},{"start":179,"end":183,"kind":"rule","name":".welcome-screen ","id":"s24","hash":"73cadda96e80c23a","title":"Welcome screen centering","what":"Centers the text on the welcome screen.","why":"Likely reason: matches the centered welcome design.","watch_out":""},{"start":184,"end":187,"kind":"rule","name":".hero-section ","id":"s25","hash":"2aaf70102f969d2f","title":"Hero section spacing","what":"Adds space below the welcome heading block.","why":"Separates the intro from the cards.","watch_out":""},{"start":188,"end":193,"kind":"rule","name":".hero-section h2 ","id":"s26","hash":"ecf7898a5cbdaf70","title":"Hero heading","what":"Sets a large dark heading for the welcome message.","why":"Main message on the first screen.","watch_out":""},{"start":194,"end":201,"kind":"rule","name":".hero-text ","id":"s27","hash":"420357b4300b6af8","title":"Hero paragraph","what":"Styles the welcome text as larger gray text with a limited width and comfortable line spacing.","why":"Keeps the intro text easy to read.","watch_out":""},{"start":202,"end":209,"kind":"rule","name":".journey-cards ","id":"s28","hash":"44763ea2bc12f617","title":"Journey card grid","what":"Arranges the six step cards in a grid that adds columns as space allows.","why":"Shows all steps in an easy-to-scan layout.","watch_out":""},{"start":210,"end":217,"kind":"rule","name":".journey-card ","id":"s29","hash":"88befb8e581e493b","title":"Journey card look","what":"Gives each step card a light gray background, rounded corners, padding, and a smooth transition.","why":"Makes each card look like a separate tile.","watch_out":""},{"start":218,"end":222,"kind":"rule","name":".journey-card:hover ","id":"s30","hash":"57c6aa9d67c8787c","title":"Journey card hover lift","what":"Moves a card up slightly and adds a shadow when the mouse is over it.","why":"Signals that the card responds to the mouse.","watch_out":""},{"start":223,"end":227,"kind":"rule","name":".card-icon ","id":"s31","hash":"291ba9c8dfa86027","title":"Journey card icon size","what":"Makes the card emoji large.","why":"Gives each card a visual anchor.","watch_out":""},{"start":228,"end":233,"kind":"rule","name":".journey-card h3 ","id":"s32","hash":"89f31139de4fec54","title":"Journey card heading","what":"Styles each card title in dark text with spacing below.","why":"Clear title for each card.","watch_out":""},{"start":234,"end":239,"kind":"rule","name":".journey-card p ","id":"s33","hash":"6c4c90f2f34525f5","title":"Journey card text","what":"Styles each card description in smaller gray text with comfortable line height.","why":"Keeps descriptions secondary to titles.","watch_out":""},{"start":240,"end":244,"kind":"rule","name":".features-section ","id":"s34","hash":"0005a95eba14f3b0","title":"Features section spacing","what":"Adds space below the features block.","why":"Separates it from the start button.","watch_out":""},{"start":245,"end":250,"kind":"rule","name":".features-section h3 ","id":"s35","hash":"5ea831e1e08eeb5e","title":"Features heading","what":"Styles the Platform Features heading.","why":"Labels the feature list.","watch_out":""},{"start":251,"end":256,"kind":"rule","name":".features-grid ","id":"s36","hash":"1eda9f12637b3af1","title":"Features grid","what":"Arranges feature tiles in a responsive grid.","why":"Fits as many tiles as the width allows.","watch_out":""},{"start":257,"end":267,"kind":"rule","name":".feature ","id":"s37","hash":"5dcd934f466b76cf","title":"Feature tile","what":"Gives each feature a purple gradient box with white bold text, aligned in a row.","why":"Highlights the platform's claims.","watch_out":"The feature text is fixed in the HTML and is not checked against real capabilities."},{"start":268,"end":271,"kind":"rule","name":".feature-icon ","id":"s38","hash":"036babf556db9ef0","title":"Feature icon size","what":"Makes the feature emoji larger.","why":"Matches the tile style.","watch_out":""},{"start":272,"end":276,"kind":"rule","name":".action-section ","id":"s39","hash":"0101f26b4aa55d7e","title":"Action section spacing","what":"Adds space above the start button area.","why":"Separates the call to action.","watch_out":""},{"start":277,"end":281,"kind":"rule","name":".help-text ","id":"s40","hash":"1be23be0909c698a","title":"Help text style","what":"Styles the help line under the start button in gray with space above.","why":"Keeps help text quiet.","watch_out":""},{"start":282,"end":287,"kind":"rule","name":".help-text a ","id":"s41","hash":"20cd6d5a4a2161b1","title":"Help link style","what":"Colors help links purple and bold without an underline.","why":"Makes links visible but understated.","watch_out":""},{"start":288,"end":291,"kind":"rule","name":".help-text a:hover ","id":"s42","hash":"15b78cddcdb4149b","title":"Help link hover underline","what":"Underlines help links when the mouse is over them.","why":"Confirms the link is clickable.","watch_out":""},{"start":292,"end":298,"kind":"rule","name":".step-header ","id":"s43","hash":"8abf78962a625c27","title":"Step header block","what":"Adds space below and a light gray line under each step's heading block.","why":"Separates the step title from the step content.","watch_out":""},{"start":299,"end":304,"kind":"rule","name":".step-header h2 ","id":"s44","hash":"fabf1699bd4395e5","title":"Step header heading","what":"Sets large dark text for each step title.","why":"Names the current step.","watch_out":""},{"start":305,"end":309,"kind":"rule","name":".step-header p ","id":"s45","hash":"b2d52c9dc6e2712a","title":"Step header paragraph","what":"Styles the step description in larger gray text.","why":"Explains the step briefly.","watch_out":""},{"start":310,"end":314,"kind":"rule","name":".form-group ","id":"s46","hash":"b3ef96db389668ba","title":"Form field spacing","what":"Adds space below each form group.","why":"Keeps fields from crowding each other.","watch_out":""},{"start":315,"end":321,"kind":"rule","name":".form-row ","id":"s47","hash":"94f1579a81cd6372","title":"Two column form row","what":"Places form fields side by side and wraps them when the width is small.","why":"Saves space on wide screens.","watch_out":"Mobile rules later switch this to one column."},{"start":322,"end":332,"kind":"rule","name":"label ","id":"s48","hash":"a54756b3572ede32","title":"Label style and input base","what":"Makes labels bold and dark, and sets the shared look for text fields.","why":"Makes forms readable and consistent.","watch_out":"The selector list continues into the next section, so this rule is shared by several field types."},{"start":333,"end":344,"kind":"rule","name":"select ","id":"s49","hash":"b97cbf6bfa9637c4","title":"Dropdown style","what":"Makes dropdowns full width with a light border, rounded corners, and padding.","why":"Matches the text field look.","watch_out":""},{"start":345,"end":350,"kind":"rule","name":"select:focus ","id":"s50","hash":"21efd7a5f6d796d6","title":"Dropdown focus glow","what":"Shows a purple border and soft glow when a dropdown is selected.","why":"Shows which field has focus.","watch_out":"Removing the outline here is intentional, so the glow is the only focus signal."},{"start":351,"end":355,"kind":"rule","name":"textarea ","id":"s51","hash":"61c0b4a66db99532","title":"Text area size","what":"Lets text areas resize vertically with a minimum height.","why":"Gives room for longer answers.","watch_out":""},{"start":356,"end":362,"kind":"rule","name":".field-help ","id":"s52","hash":"fc35dbfff5f79ac1","title":"Small help text under fields","what":"Styles the small hint text under a field in gray.","why":"Explains what to enter without cluttering the field.","watch_out":""},{"start":363,"end":374,"kind":"rule","name":".file-upload-area ","id":"s53","hash":"b5bc72403404975c","title":"File drop zone","what":"Draws a large dashed box with padding and a light background for file selection.","why":"Makes the upload area obvious.","watch_out":""},{"start":375,"end":379,"kind":"rule","name":".file-upload-area:hover ","id":"s54","hash":"0c52a3d11b3385fc","title":"Drop zone hover","what":"Changes the drop zone border and background to purple tints on hover.","why":"Signals the area is clickable.","watch_out":""},{"start":380,"end":389,"kind":"rule","name":".file-upload-area input[type=\"file\"] ","id":"s55","hash":"f95c5e5e6c103a26","title":"Hidden file input over zone","what":"Makes the real file input invisible and stretches it over the whole zone so any click opens the file picker.","why":"Lets the whole box work as a button without showing the default control.","watch_out":"Depends on the zone having position set to relative in an earlier rule."},{"start":390,"end":393,"kind":"rule","name":".upload-placeholder ","id":"s56","hash":"0c00f010efb242bc","title":"Upload prompt passes clicks","what":"Stops the placeholder text from catching clicks so the hidden input receives them.","why":"Without this, clicks would land on the text instead of the file input.","watch_out":"If this rule is removed, clicking on the text will not open the file picker."},{"start":394,"end":399,"kind":"rule","name":".upload-icon ","id":"s57","hash":"fbd7b8d998380bb1","title":"Upload icon size","what":"Makes the upload icon large and on its own line.","why":"Draws attention to the drop zone.","watch_out":""},{"start":400,"end":405,"kind":"rule","name":".upload-placeholder p ","id":"s58","hash":"3288c76fb499eb0b","title":"Upload prompt text","what":"Styles the main upload instruction in dark, slightly larger text.","why":"Clear instruction.","watch_out":""},{"start":406,"end":412,"kind":"rule","name":".upload-placeholder small ","id":"s59","hash":"dffef75a6c3f901b","title":"Upload small text","what":"Styles the accepted file types note in gray.","why":"Shows allowed types without shouting.","watch_out":"Listed types here must match the accept setting in the HTML."},{"start":413,"end":423,"kind":"rule","name":".btn-link ","id":"s60","hash":"f7fe1859e7238ce8","title":"Shared button base","what":"Sets the common button look (padding, rounded corners, bold text, pointer cursor) for primary, secondary, and link buttons.","why":"The selector list in the file applies this to all three button styles.","watch_out":"Padding here is later overridden for link buttons, so changing this block may not change them."},{"start":424,"end":428,"kind":"rule","name":".btn-primary ","id":"s61","hash":"caeaa184db173d94","title":"Primary button colors","what":"Gives primary buttons the purple gradient with white text.","why":"Marks the main action on each step.","watch_out":""},{"start":429,"end":433,"kind":"rule","name":".btn-primary:hover ","id":"s62","hash":"eece9a26578ad7d0","title":"Primary button hover lift","what":"Moves primary buttons up slightly with a glow on hover.","why":"Shows the button responds to the mouse.","watch_out":""},{"start":434,"end":438,"kind":"rule","name":".btn-large ","id":"s63","hash":"7544b84dbc63062b","title":"Large button size","what":"Makes large buttons wider and taller.","why":"Emphasizes the start and validate actions.","watch_out":""},{"start":439,"end":443,"kind":"rule","name":".btn-small ","id":"s64","hash":"2871a9d2dd24090c","title":"Small button size","what":"Makes small buttons compact.","why":"Used for refresh and other secondary actions.","watch_out":""},{"start":444,"end":448,"kind":"rule","name":".btn-secondary ","id":"s65","hash":"67e8be886b845cb8","title":"Secondary button colors","what":"Gives secondary buttons a gray background with white text.","why":"Marks back and other less important actions.","watch_out":""},{"start":449,"end":452,"kind":"rule","name":".btn-secondary:hover ","id":"s66","hash":"0ad1df7fc0d73b81","title":"Secondary button hover","what":"Darkens the gray background on hover.","why":"Confirms the button responds to the mouse.","watch_out":""},{"start":453,"end":458,"kind":"rule","name":".btn-link ","id":"s67","hash":"3a5f029c4a757d30","title":"Link-style button","what":"Makes these buttons transparent with purple text and smaller padding.","why":"Used for quiet actions such as skipping a step.","watch_out":"This rule overrides the padding and background from the shared button base, so the two rules must be read together."},{"start":459,"end":462,"kind":"rule","name":".btn-link:hover ","id":"s68","hash":"d8514a66745e6bf4","title":"Link-style button hover","what":"Adds a light purple tint on hover.","why":"Shows the button responds to the mouse.","watch_out":""},{"start":463,"end":471,"kind":"rule","name":".info-box ","id":"s69","hash":"443f86b90d9c5e24","title":"Info box look","what":"Gives info boxes a pale blue background, a purple left border, padding, and rounded corners.","why":"Highlights tips and explanations.","watch_out":""},{"start":472,"end":477,"kind":"rule","name":".info-box strong ","id":"s70","hash":"eb3c31e171af6e43","title":"Info box heading","what":"Makes the bold line inside an info box a block with spacing below.","why":"Separates the heading from the body.","watch_out":""},{"start":478,"end":482,"kind":"rule","name":".info-box ul ","id":"s71","hash":"7a2c6832dcc4cb83","title":"Info box list indent","what":"Indents lists inside info boxes and sets a gray text color.","why":"Makes lists readable inside the box.","watch_out":""},{"start":483,"end":486,"kind":"rule","name":".info-box li ","id":"s72","hash":"36eb0b77494276e8","title":"Info box list spacing","what":"Adds a little space between list items in info boxes.","why":"Keeps list items from crowding.","watch_out":""},{"start":487,"end":494,"kind":"rule","name":".result-box ","id":"s73","hash":"f989f15903eb8cfc","title":"Result panel box","what":"Gives result panels a light gray background, rounded corners, and space above.","why":"Separates results from the form.","watch_out":""},{"start":495,"end":500,"kind":"rule","name":".result-box h3 ","id":"s74","hash":"875b6f07d0c7904e","title":"Result panel heading","what":"Sets the result heading in dark text with space below.","why":"Labels the results.","watch_out":""},{"start":501,"end":507,"kind":"rule","name":".result-actions ","id":"s75","hash":"a85b5f1f15355924","title":"Result action buttons row","what":"Places result buttons in a wrapping row with gaps.","why":"Keeps buttons visible on narrow screens.","watch_out":""},{"start":508,"end":517,"kind":"rule","name":".question-card ","id":"s76","hash":"23a4884200e70298","title":"Question card look","what":"Gives each question a white card with a light border, rounded corners, and padding.","why":"Makes each question stand out during review.","watch_out":""},{"start":518,"end":522,"kind":"rule","name":".question-card:hover ","id":"s77","hash":"2a52dae63feb75b8","title":"Question card hover","what":"Turns the card border purple and adds a shadow on hover.","why":"Shows the card is interactive.","watch_out":""},{"start":523,"end":529,"kind":"rule","name":".question-meta ","id":"s78","hash":"5754fbf532f5d321","title":"Question tag row","what":"Places the type and category tags in a wrapping row with space above.","why":"Keeps tags tidy under the question text.","watch_out":""},{"start":530,"end":536,"kind":"rule","name":".badge ","id":"s79","hash":"7dd8c87e5f6dc4bc","title":"Tag shape","what":"Gives tags padding, rounded corners, and bold small text.","why":"Makes tags easy to scan.","watch_out":""},{"start":537,"end":541,"kind":"rule","name":".badge-type ","id":"s80","hash":"3c1d6d7ddb7e5c7d","title":"Type tag colors","what":"Gives type tags a solid purple background with white text.","why":"Distinguishes question types.","watch_out":""},{"start":542,"end":546,"kind":"rule","name":".badge-category ","id":"s81","hash":"d4fae50b0707c7c5","title":"Category tag colors","what":"Gives category tags a pale purple background with purple text.","why":"Distinguishes categories from types.","watch_out":""},{"start":547,"end":553,"kind":"rule","name":".documents-section ","id":"s82","hash":"200261e98626b977","title":"Documents section divider","what":"Adds space and a light line above the uploaded documents list.","why":"Separates the list from the upload form.","watch_out":""},{"start":554,"end":560,"kind":"rule","name":".section-header ","id":"s83","hash":"b4d89c3dd9bf84d7","title":"Section title row","what":"Places a section title and a refresh button on one line with space between them.","why":"Keeps the refresh action near the list heading.","watch_out":""},{"start":561,"end":565,"kind":"rule","name":".section-header h3 ","id":"s84","hash":"eb57e3c93c5547a7","title":"Section title text","what":"Sets the section title in dark text.","why":"Labels the list.","watch_out":""},{"start":566,"end":572,"kind":"rule","name":".placeholder-text ","id":"s85","hash":"88a0799a1a1d8819","title":"Placeholder text","what":"Centers gray italic text with padding.","why":"Shows empty-state messages such as no documents yet.","watch_out":""},{"start":573,"end":580,"kind":"rule","name":".export-options ","id":"s86","hash":"e5a5629be92fe704","title":"Export card grid","what":"Arranges export cards in a responsive grid.","why":"Shows JSON, CSV, and Markdown options together.","watch_out":""},{"start":581,"end":588,"kind":"rule","name":".export-card ","id":"s87","hash":"c537040d375d6b0b","title":"Export card look","what":"Gives export cards a light gray background, rounded corners, padding, and centered text.","why":"Makes each option a clear tile.","watch_out":""},{"start":589,"end":593,"kind":"rule","name":".export-card:hover ","id":"s88","hash":"cff474fd72578986","title":"Export card hover lift","what":"Moves export cards up with a shadow on hover.","why":"Shows the card responds to the mouse.","watch_out":""},{"start":594,"end":598,"kind":"rule","name":".export-card h3 ","id":"s89","hash":"93c8714af5cd2cfe","title":"Export card heading","what":"Sets the export card title in dark text.","why":"Names the format.","watch_out":""},{"start":599,"end":604,"kind":"rule","name":".export-card p ","id":"s90","hash":"9a587fff80f702c7","title":"Export card text","what":"Styles the export description in gray with space below.","why":"Explains the format.","watch_out":""},{"start":605,"end":609,"kind":"rule","name":".success-section ","id":"s91","hash":"86c64c4cde2c1b68","title":"Success section spacing","what":"Adds space above the completion message.","why":"Separates it from the export cards.","watch_out":""},{"start":610,"end":617,"kind":"rule","name":".success-message ","id":"s92","hash":"2d902ad1f654b0b5","title":"Success banner","what":"Gives the completion message a green gradient, white text, rounded corners, and centered padding.","why":"Celebrates the finished survey.","watch_out":""},{"start":618,"end":623,"kind":"rule","name":".success-icon ","id":"s93","hash":"2460099e310f18a6","title":"Success icon size","what":"Makes the success emoji very large and on its own line.","why":"Visual celebration.","watch_out":""},{"start":624,"end":628,"kind":"rule","name":".success-message h3 ","id":"s94","hash":"a5096f248fbb9cbd","title":"Success heading","what":"Makes the success heading large and adds space below.","why":"Main completion message.","watch_out":""},{"start":629,"end":633,"kind":"rule","name":".success-message p ","id":"s95","hash":"0bc9cc30823d52b3","title":"Success paragraph","what":"Styles the success text larger with space below.","why":"Readable completion text.","watch_out":""},{"start":634,"end":638,"kind":"rule","name":".success-message ul ","id":"s96","hash":"009cd205db3dd234","title":"Success list without bullets","what":"Removes bullet points from the next-steps list.","why":"Lets the custom check marks take their place.","watch_out":""},{"start":639,"end":642,"kind":"rule","name":".success-message li ","id":"s97","hash":"3862188c71a494de","title":"Success list item spacing","what":"Adds vertical space between next-steps items.","why":"Keeps the list easy to read.","watch_out":""},{"start":643,"end":647,"kind":"rule","name":".success-message li::before ","id":"s98","hash":"175061a8ffdc5bc6","title":"Success check symbol","what":"Adds a bold check mark before each next-steps item.","why":"Makes each item look completed.","watch_out":"The check mark is text content, so it is read aloud by screen readers."},{"start":648,"end":659,"kind":"rule","name":".step-actions ","id":"s99","hash":"cbce3382f63b1d8f","title":"Step button row","what":"Places back and continue buttons on one line with space between them and a top border.","why":"Keeps navigation consistent on every step.","watch_out":""},{"start":660,"end":674,"kind":"rule","name":".loading-overlay ","id":"s100","hash":"d8ed9b1ab39571f5","title":"Loading overlay","what":"Covers the whole screen with a near-white layer and centers its contents, above everything else.","why":"Blocks clicks while the app waits for the backend.","watch_out":"If the script never hides it, the user is stuck behind the overlay."},{"start":675,"end":688,"kind":"rule","name":".spinner ","id":"s101","hash":"e7c2c558d97039fc","title":"Spinner and animation","what":"Draws a rotating purple ring and defines the spin motion.","why":"Shows that work is happening.","watch_out":""},{"start":689,"end":695,"kind":"rule","name":".loading-overlay p ","id":"s102","hash":"afa4b2e1393b600a","title":"Loading text","what":"Styles the loading message in bold dark text.","why":"Tells the user what is happening.","watch_out":""},{"start":696,"end":705,"kind":"rule","name":".error-message ","id":"s103","hash":"3b5b66cfa4679130","title":"Error box","what":"Gives error messages a pink background, red left border, and dark red text.","why":"Makes failures easy to notice.","watch_out":""},{"start":706,"end":715,"kind":"rule","name":".success-item ","id":"s104","hash":"c4a6f534c11ee8d4","title":"Success item box","what":"Gives success messages a green background, green left border, and dark green text.","why":"Confirms a good result.","watch_out":""},{"start":716,"end":726,"kind":"rule","name":".placeholder-box ","id":"s105","hash":"50f01ef3c9914687","title":"Placeholder box","what":"Gives empty areas a dashed gray border and centered large text.","why":"Shows where content will appear.","watch_out":""},{"start":727,"end":781,"kind":"rule","name":"@media (max-width: 768px) ","id":"s106","hash":"7b12d37643fafee4","title":"Mobile layout rules","what":"Below 768 pixels wide, reduces padding and switches grids to one column. Stacks step buttons and makes them full width.","why":"Makes the wizard usable on phones.","watch_out":"Changes to the desktop grids must be checked here too, or narrow screens may break."}],"explained_at":"2026-11-12T00:07:16+00:00","explained_by":"haiku","summary":"The stylesheet that gives the wizard page its colors, layout, buttons, cards, and mobile behavior.","purpose":"Makes the setup wizard look consistent and guides the user through six steps with a visible progress bar.","why":"Keeps all visual rules in one file, separate from the page structure and behavior.","how":"The page loads this file. Rules first reset spacing, then style the header, progress bar, step panels, forms, buttons, result panels, and overlays, and finally adjust the layout for narrow screens.","inputs":"Class names and element types set in wizard.html, plus classes added by wizard-app.js such as active, completed, and error-message.","outputs":"Colors, sizes, spacing, animations, and layout on the page. Produces no data.","risks":"Some button rules are repeated, so a later rule can quietly override an earlier one. Visual changes are not checked by any automated test visible here.","debug":"Use the browser developer tools to find the element, then check which rule wins for the property that looks wrong. Look at the .btn-link rules and the step classes first.","summary_hash":"sha256:dedfd00ee2d5c95a95208d5ce33b0b35deac2debf8c5d18dd0857177d3819509","fresh":true},"frontend/wizard.html":{"schema_version":1,"path":"frontend/wizard.html","language":"HTML","lines":415,"hash":"sha256:7464add3277ec2b2f0f49024e3a55b9188357ce17f5f0cbd537ccb51e7f811ee","area":"frontend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Hard-coded local API address for the docs link.","Continue to Export is enabled before validation is run.","The quick tour popup referenced by the script is missing from this file.","No automated tests are visible for the page."]},"terms":[{"term":"HTML","meaning":"the markup language that defines the structure and content of a web page"},{"term":"form","meaning":"a block of fields that the user fills in and sends"},{"term":"element id","meaning":"a unique name given to one part of the page so scripts can find it"},{"term":"API","meaning":"a doorway other programs use to ask this app for data"}],"depends_on":["frontend/wizard-styles.css","frontend/wizard-app.js"],"used_by":[],"sections":[{"start":1,"end":56,"kind":"setup","name":"File setup (part 1)","id":"s1","hash":"7c8d63cb49ce713b","title":"Page setup and header","what":"Sets the page title and style link, then shows the app name and an API status badge that starts at Checking.","why":"The badge tells the user whether the backend is reachable.","watch_out":"If the script fails to load, the badge stays at Checking forever."},{"start":57,"end":102,"kind":"setup","name":"File setup (part 2)","id":"s2","hash":"98af1cbfc1604e93","title":"Welcome screen with six journey cards","what":"Opens the content area and shows the step 0 welcome screen with a hero heading and six cards describing upload, goals, planning, review, validation and export.","why":"Gives users an overview of the whole process before they start.","watch_out":"Card numbers and titles are typed by hand, so adding or reordering a step means editing each card."},{"start":103,"end":156,"kind":"setup","name":"File setup (part 3)","id":"s3","hash":"63eb39328227e6a0","title":"Feature list and start button","what":"Lists platform features and a Start button that calls startWorkflow, plus a link to the API docs and a link to the classic interface.","why":"Likely reason: an introduction for first-time users.","watch_out":"The docs link points to localhost on port 8000, so it fails on any other server. Feature claims like 25 plus models are fixed text."},{"start":157,"end":215,"kind":"setup","name":"File setup (part 4)","id":"s4","hash":"91b43b438fd0a0d1","title":"Document upload form","what":"Form to choose a document type, audience, and one or more TXT, MD, CSV, or JSON files, which is sent to handleFileUpload. Also has a result area and a list of uploaded documents.","why":"Lets users add reference material before planning.","watch_out":"The file type filter only works in the browser. The server must also check file types."},{"start":216,"end":274,"kind":"setup","name":"File setup (part 5)","id":"s5","hash":"613b3eaa516786a9","title":"Step 1 navigation buttons","what":"Back, Continue, and Skip buttons for the knowledge base step.","why":"Uploading documents is optional, so users can skip.","watch_out":"Skip and Continue both call nextStep, so skipping records nothing about whether documents were uploaded."},{"start":275,"end":323,"kind":"setup","name":"File setup (part 6)","id":"s6","hash":"17240c5cc8e0ddc0","title":"Survey planning form","what":"Form for research goal, audience, model type, and must-include topics, sent to handlePlanSurvey. Below it is a result panel with download and accept buttons.","why":"Collects what the AI needs to draft a survey plan.","watch_out":"The result panel stays hidden until a plan is generated, so its buttons cannot be used before then. The audience list here differs from the upload form."},{"start":324,"end":377,"kind":"setup","name":"File setup (part 7)","id":"s7","hash":"f5a4e446b1a7e0df","title":"Review, validate, and export screens","what":"Review step with a container the script fills, a validation step with an info list and a Run Validation button, and an export step.","why":"Groups the remaining workflow steps into the page.","watch_out":"Continue to Export is not disabled in the HTML, so it can be clicked before validation runs."},{"start":378,"end":415,"kind":"setup","name":"File setup (part 8)","id":"s8","hash":"2bfe67a652423f33","title":"Export cards, loading screen, and script","what":"Three export cards, a completion message, a Start New Survey button, a full-screen loading overlay hidden at first, and the script tag that loads wizard-app.js at the end.","why":"Likely reason: loading the script last lets the page draw before the script runs.","watch_out":"The overlay is hidden with an inline style, so if the script stops early it may never hide and block the page."}],"explained_at":"2026-11-12T00:07:16+00:00","explained_by":"haiku","summary":"The main page of the survey wizard, with six steps from welcome to export.","purpose":"Lets a user build a survey by moving through knowledge base upload, planning, review, validation, and export.","why":"A single page with hidden step panels keeps the whole flow in the browser without page reloads.","how":"The page shows a progress bar and one step panel at a time. Buttons call functions in wizard-app.js. Results from the backend are placed into empty containers.","inputs":"User entries in the upload form and planning form, and uploaded files.","outputs":"Visible screens, and the actions passed to wizard-app.js such as uploading documents, planning, validating, and exporting.","risks":"Some links point to a fixed local address. The Continue to Export button is clickable before validation. The quick tour popup it calls is not present in this file.","debug":"If a button does nothing, check that its function name matches one in wizard-app.js and that the browser console shows no error. If a step does not show, check its id and the active class.","summary_hash":"sha256:7464add3277ec2b2f0f49024e3a55b9188357ce17f5f0cbd537ccb51e7f811ee","fresh":true},"scripts/load_sample_data.py":{"schema_version":1,"path":"scripts/load_sample_data.py","language":"Python","lines":74,"hash":"sha256:45ce304f59a4d33503fe91a473942fdfa60e125dd84d15e189060ca36bc35079","area":"other","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No duplicate check.","Paths depend on the working folder.","No error handling closes the session if loading fails."]},"terms":[{"term":"session","meaning":"A working connection to the database used for one set of changes."},{"term":"ingest","meaning":"To take a document in and store it for later use."},{"term":"import path","meaning":"The list of folders Python searches when loading code."}],"depends_on":["backend/database.py","backend/services/document_ingestion.py","backend/models/corpus.py","data/sample_b2b_question_bank.txt","data/sample_b2c_question_bank.txt"],"used_by":["the startup script, as a suggested step"],"sections":[{"start":1,"end":11,"kind":"setup","name":"File setup","id":"s1","hash":"4d9743939e13b0a5","title":"Imports and project path","what":"Adds the project's parent folder to the import path, then brings in the database session, the ingestion service and the document type.","why":"Likely reason: lets the script import backend modules when run from the scripts folder.","watch_out":"The package-style imports may fail when the script runs from inside the backend container, depending on its working folder."},{"start":12,"end":40,"kind":"function","name":"load_b2b_questions","id":"s2","hash":"6397cb43a4beb711","title":"Load B2B question bank","what":"Reads the B2B sample text, stores it with a title, description, priority, use cases, audiences, categories and topics, then prints the new ID.","why":"Likely reason: sample content for business surveys.","watch_out":"The file path is relative to the current folder, and the session is not closed if an error happens first."},{"start":41,"end":69,"kind":"function","name":"load_b2c_questions","id":"s3","hash":"a69b53bbff17a0a7","title":"Load B2C question bank","what":"Reads the consumer sample text, stores it with its metadata, then prints the new ID.","why":"Likely reason: sample content for consumer surveys.","watch_out":"Same relative path and session risks as the B2B loader."},{"start":70,"end":74,"kind":"entry point","name":"entry point","id":"s4","hash":"8761226bac8f4cf7","title":"Run both loaders","what":"When run directly, loads the B2B bank, then the B2C bank, then prints a success line.","why":"Likely reason: one command sets up both samples.","watch_out":"Running it again creates duplicates."}],"explained_at":"2026-11-12T00:15:30+00:00","explained_by":"haiku","summary":"A script that loads the two sample question banks, one for business and one for consumer surveys, into the document library.","purpose":"Gives a new install example content to work with.","why":"Likely reason: an empty library gives poor results, so sample data helps a new user start.","how":"Adds the project folder to the import path, then for each bank reads its text file, sends it to the ingestion service with metadata and prints the new ID.","inputs":"Two text files in the data folder, read relative to the current folder.","outputs":"Stored documents and printed confirmation lines.","risks":"Running it twice adds duplicate documents. The file paths depend on the folder the script runs from. Sessions are closed only on success.","debug":"If a file is not found, run the script from the project root. If import errors appear, check the folder layout. If documents are duplicated, clear the table before rerunning.","summary_hash":"sha256:45ce304f59a4d33503fe91a473942fdfa60e125dd84d15e189060ca36bc35079","fresh":true},"setup_and_test.sh":{"schema_version":1,"path":"setup_and_test.sh","language":"Shell script","lines":276,"hash":"sha256:9df6379bc6ccb082642cc23abfb90b0e815832163dc62959d7893e220ee2579b","area":"root-files","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The reset command deletes all local data without asking.","The key check only looks at two providers and can miss a missing key.","The script reports success based on the presence of text, so some failures may be shown as passing.","Several steps use fixed 30 second and 3 second waits, which can be too short on slow computers."]},"terms":[{"term":"Shell script","meaning":"A text file of commands that a Linux or Mac terminal runs in order."},{"term":"Health check","meaning":"A quick request to see whether a service is ready to answer."},{"term":"Docker volume","meaning":"Storage kept by Docker that survives when containers restart, unless it is deleted."},{"term":"jq","meaning":"A small tool that reads and pulls values out of JSON text."}],"depends_on":[".env.example","docker-compose.yml","backend/scripts/load_sample_data.py","examples/b2b_csat_example.py"],"used_by":["Run by the owner from the project folder."],"sections":[{"start":1,"end":16,"kind":"setup","name":"File setup","id":"s1","hash":"3f9e9700e869801f","title":"Script header and colors","what":"Gives the script its name, stops it on the first error, prints a title banner, and defines the colors used for messages.","why":"Makes the output easy to read and stops the script early if a command fails.","watch_out":"Because of the stop-on-error setting, a failing command ends the whole run without a friendly message in some steps."},{"start":17,"end":21,"kind":"function","name":"print_success","id":"s2","hash":"5ca8542ede912904","title":"Success message helper","what":"Prints a green line starting with a check mark.","why":"Keeps the success output consistent across steps.","watch_out":"Relies on the terminal supporting color codes."},{"start":22,"end":25,"kind":"function","name":"print_error","id":"s3","hash":"ef53fa89432b7860","title":"Error message helper","what":"Prints a red line starting with a cross mark.","why":"Makes failures easy to spot in the output.","watch_out":"The script continues after some errors, so a red line does not always mean the run stopped."},{"start":26,"end":78,"kind":"function","name":"print_info (part 1)","id":"s4","hash":"87431c38211c79f0","title":"Docker check and settings file creation","what":"Checks that Docker, Docker Compose and the Docker service are present and running. If there is no settings file, it copies the template and asks the owner to add an API key.","why":"Docker must be running before any later step can work, and the settings file is needed by all services.","watch_out":"The prompt waits for the owner to press Enter, so the script stops until someone is at the keyboard."},{"start":79,"end":138,"kind":"function","name":"print_info (part 2)","id":"s5","hash":"948123763ef81e96","title":"API key check and service start","what":"Checks whether the key placeholders are still present in the settings file, then resets the containers, starts them and waits 30 seconds.","why":"Likely reason: an empty key would make AI steps fail later, so the script tries to catch it early.","watch_out":"The reset command deletes all Docker data, including saved records. The key check only looks at OpenAI and Anthropic and treats a missing key as passing if either is set."},{"start":139,"end":197,"kind":"function","name":"print_info (part 3)","id":"s6","hash":"6029655e689db492","title":"API health wait","what":"Checks the health address up to ten times, waiting 3 seconds between tries, and stops with an error if the API never reports healthy.","why":"Services take a moment to start, so the script waits instead of failing on the first attempt.","watch_out":"The health check looks for the word healthy in the reply. A reply that contains that word in an error message would count as a pass."},{"start":198,"end":238,"kind":"function","name":"print_info (part 4)","id":"s7","hash":"03b4158018846189","title":"Model list and sample data loading","what":"Asks the API to set up the model list, reports how many models were found, then runs the sample data loader inside the backend container and reports whether it worked.","why":"The planner needs the model list and the question banks before it can produce a survey.","watch_out":"The model count is read from the reply text with a simple pattern, so a change in the reply format will show zero."},{"start":239,"end":276,"kind":"function","name":"print_info (part 5)","id":"s8","hash":"800fec04dfc13950","title":"Data checks, test plan and summary","what":"Counts the question banks and models, sends a sample survey plan request for a B2B customer satisfaction study, reports how many sections it created, then prints a summary with useful links and commands.","why":"Gives a quick end-to-end check that the planner works, and lists the next steps for the owner.","watch_out":"The final message says all core tests passed even when earlier checks printed red errors, because the script does not track failures."}],"explained_at":"2026-11-12T00:12:57+00:00","explained_by":"haiku","summary":"A Linux or Mac script that checks Docker, creates the settings file, starts all services, checks the API, loads sample data and runs one survey planning test.","purpose":"Lets the owner set up and test the whole Docker version in one command.","why":"Likely reason: the setup has many steps, and a script avoids repeating them by hand.","how":"The script first checks that Docker and Docker Compose are installed and running. Then it creates the settings file from the template and asks for an API key. Next it resets and starts the containers. It then waits for the health check, loads the model list, loads sample question banks, and sends one test planning request. It prints a summary at the end.","inputs":"Your API key typed at the prompt, and the settings in the template file.","outputs":"Running Docker services, a settings file, and printed results with green checks or red errors.","risks":"The script removes all existing Docker data each time through the reset command, so saved studies and databases are deleted. It only checks two API key names for placeholders.","debug":"If a step fails, the script prints the command to run for logs. Check that Docker is running. If the API is not healthy after 10 tries, run the logs command for the backend. If sample data fails, check the backend container logs.","summary_hash":"sha256:9df6379bc6ccb082642cc23abfb90b0e815832163dc62959d7893e220ee2579b","fresh":true},"setup_native.sh":{"schema_version":1,"path":"setup_native.sh","language":"Shell script","lines":182,"hash":"sha256:ec4ab682d85962558366350b432560ec4c7cd8ae151c5542303d4a94c06d1e07","area":"root-files","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Several steps only print a warning when they fail and then continue, so problems can be hidden.","The database setup uses a name, survey_tool, that differs from the name in the Docker setup.","Not tested in this review."]},"terms":[{"term":"Virtual environment","meaning":"A private folder of Python packages for this project, so they do not clash with other projects."},{"term":"PostgreSQL","meaning":"A full database server that must be installed separately."},{"term":"pgvector","meaning":"An add-on for PostgreSQL that stores numeric vectors for search."},{"term":"sudo","meaning":"A Linux command that runs another command with administrator rights."}],"depends_on":["backend/requirements.txt",".env.example","backend/database.py","backend/services/model_manager.py","backend/scripts/load_sample_data.py"],"used_by":["Run by the owner from the project folder."],"sections":[{"start":1,"end":60,"kind":"setup","name":"File setup (part 1)","id":"s1","hash":"22add18060b1129c","title":"Environment checks and virtual environment","what":"Checks for Python 3 and PostgreSQL, tries to start PostgreSQL if it is stopped, then creates and activates a private Python environment for the project.","why":"Ensures the required tools are present before installing anything.","watch_out":"The version check only confirms that Python exists. It does not check that the version is 3.11 or newer, as the message claims."},{"start":61,"end":120,"kind":"setup","name":"File setup (part 2)","id":"s2","hash":"38431e3dbc75291c","title":"Package install and settings file","what":"Updates pip, installs all packages from the requirements file, then creates the settings file if one does not exist. It asks the owner to edit the file in the nano text editor.","why":"The app needs its packages and settings before it can start.","watch_out":"The package install can take several minutes and prints nothing while it runs because output is hidden."},{"start":121,"end":153,"kind":"setup","name":"File setup (part 3)","id":"s3","hash":"09015d7e4b9b67bc","title":"Database creation","what":"Asks for the PostgreSQL username and password, creates the survey_tool database, and turns on the vector and UUID add-ons.","why":"The app stores all its data in this database.","watch_out":"If the database already exists, the error is hidden and the script continues as if all went well."},{"start":154,"end":182,"kind":"setup","name":"File setup (part 4)","id":"s4","hash":"a35065d7839d0d45","title":"Setup summary and reminders","what":"Prints a setup complete banner, the steps to start the server (activate venv, cd backend, run uvicorn), the docs URL, a documentation list, and reminders to configure .env and check the PostgreSQL password.","why":"Tells the user what to do after setup finishes.","watch_out":"This block only prints text; it does not create tables, load models or load sample data."}],"explained_at":"2026-11-12T00:12:57+00:00","explained_by":"haiku","summary":"A Mac or Linux script that installs the platform without Docker, using a local PostgreSQL database, a Python virtual environment and the settings file.","purpose":"Lets the owner run the platform directly on their computer without Docker.","why":"Likely reason: some owners prefer a native install, and the script automates the many steps.","how":"The script checks Python and PostgreSQL, starts PostgreSQL if needed, creates a virtual environment, installs the Python packages, and creates the settings file. It then asks for database details, creates the database and extensions, creates the tables, loads the model list, and optionally loads sample data. Finally it prints the commands to start the server.","inputs":"Database username and password typed at the prompts, and the settings file the owner edits.","outputs":"A virtual environment, a local database named survey_tool, created tables, and
