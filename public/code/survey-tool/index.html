id":"s1","hash":"b3c2f2c0f73470e9","title":"Script setup and Windows encoding fix","what":"Imports the standard tools the script needs and, on Windows only, makes the output able to print emoji and other symbols.","why":"Without this fix, the emoji messages can crash the script on some Windows consoles.","watch_out":"The fix replaces the output streams, so anything else that writes to the console in this script must use the same settings."},{"start":17,"end":22,"kind":"function","name":"print_header","id":"s2","hash":"bfd6b373ac072856","title":"Header printer","what":"Prints a line of equal signs, the text, and another line, to separate sections of output.","why":"Makes the progress readable in the terminal.","watch_out":"Only affects display, so changing it does not change any setup behaviour."},{"start":23,"end":42,"kind":"function","name":"run_command","id":"s3","hash":"d8fa1de6852c20b6","title":"Command runner","what":"Runs a shell command, prints its normal output, and prints its errors if it fails.","why":"Lets the setup run pip and other commands without writing each one out by hand.","watch_out":"Because the failure check is off in most calls, this helper returns success even when the command failed. Only real exceptions are caught, and those are not raised here."},{"start":43,"end":91,"kind":"function","name":"main (part 1)","id":"s4","hash":"d393041bbd29d8af","title":"Start checks and virtual environment","what":"Checks the Python version is 3.11 or newer, creates the virtual environment if it is missing, and picks the correct activation and install commands for the operating system.","why":"The rest of the script needs the right Python and command paths for Windows or Mac and Linux.","watch_out":"Commands run from this script use the Python that started it, so running it with an old Python can cause a wrong install."},{"start":92,"end":150,"kind":"function","name":"main (part 2)","id":"s5","hash":"48fc9ad5e2016b53","title":"Package list and settings file","what":"Writes a short package list, installs it, and then either checks an existing settings file or creates a new one. For a new file it asks for an OpenAI key and writes it, along with other default settings.","why":"The app needs its packages and an OpenAI key before it can run.","watch_out":"The generated settings file sets debug mode on and uses a weak development secret, which should be changed before any real use."},{"start":151,"end":206,"kind":"function","name":"main (part 3)","id":"s6","hash":"4580d69431ad020e","title":"Database table creation","what":"Writes a temporary script that creates all the database tables, runs it, and then deletes it.","why":"The app needs its tables before it can save anything.","watch_out":"The message on failure says it may be normal, so a real failure can be missed."},{"start":207,"end":266,"kind":"function","name":"main (part 4)","id":"s7","hash":"b95723870c01584c","title":"Model list, frontend folder and start scripts","what":"Loads the model list through a temporary script, creates the frontend folder, and writes a start script for the operating system that launches the backend on port 8000 and a simple web server on port 3000.","why":"Gives the owner a single file to double-click or run to start everything.","watch_out":"The frontend folder is created empty, so the page on port 3000 may show nothing until real frontend files are added."},{"start":267,"end":325,"kind":"function","name":"main (part 5)","id":"s8","hash":"245f049913ecb9fd","title":"Summary of created files","what":"Prints a list of the files and folders created, plus the start command for the operating system.","why":"Tells the owner what changed on their computer.","watch_out":"The list is printed whether or not each step truly worked."},{"start":326,"end":347,"kind":"function","name":"main (part 6)","id":"s9","hash":"0a5b80470bb949f5","title":"Usage and reminder messages","what":"Prints the start command, the web addresses for the UI and API docs, the documentation names, and reminders to back up the database file and keep the key secret.","why":"Gives the owner the next steps after setup.","watch_out":"The documentation file names listed here are not checked by the script and may not exist."},{"start":348,"end":358,"kind":"entry point","name":"entry point","id":"s10","hash":"b983db755b75f96f","title":"Program entry point and error handling","what":"Runs the main setup when the file is started directly, handles Ctrl+C by stopping cleanly, and prints the full error details for any other failure.","why":"Lets the owner see what went wrong instead of a silent crash.","watch_out":"Any error raised in the setup stops the whole run, so later steps are skipped."}],"explained_at":"2026-11-12T00:12:57+00:00","explained_by":"haiku","summary":"A cross-platform Python script that installs a simpler version of the platform using a single SQLite file, writes a settings file, and creates scripts to start the app.","purpose":"Lets the owner run the platform on Windows, Mac or Linux with no database server to install.","why":"Likely reason: PostgreSQL and Docker are hard to install on some computers, so a file-based database is an easier start.","how":"The script checks Python is 3.11 or newer, creates a virtual environment, writes a small package list and installs it. It asks for an OpenAI key and writes the settings file. It then creates the database tables and the model list through short temporary scripts, creates a frontend folder, and writes a start script for the operating system.","inputs":"An OpenAI API key typed at the prompt, and the current folder layout.","outputs":"A virtual environment, a survey_data.db file, a settings file, a start script, and a frontend folder.","risks":"The generated settings file turns on debug mode and uses a weak secret key. Install steps print an error but still report success. The frontend folder is created empty, so the UI may not appear.","debug":"If the start script fails, run the backend command directly from the backend folder to see the error. If the database is empty, rerun the table step. If packages are missing, reinstall them from the package list. Look at survey_data.db to confirm the tables exist.","summary_hash":"sha256:30cc5841a132aa8925925a036374b5118ff4d24d99b2a9131f68f0c3ff810d79","fresh":true},"tests/test_workflow.py":{"schema_version":1,"path":"tests/test_workflow.py","language":"Python","lines":83,"hash":"sha256:274e4bb8d30d6b77cab15d98c5cb9c2ac6edeb64655161917340604c4a0420dd","area":"other","status":"explained","summary_stale":false,"readiness":{"status":"unknown","reasons":["Only the import section was provided.","The test steps cannot be checked from this packet."]},"terms":[{"term":"end-to-end test","meaning":"A test that runs a whole process from start to finish, not one part at a time."},{"term":"async","meaning":"Code that can wait for slow work, such as network calls, without stopping the rest of the program."},{"term":"agent","meaning":"A component that performs one step of the workflow, such as planning or validating."}],"depends_on":["backend/database.py","backend/agents/planner.py","backend/agents/author.py","backend/agents/validator.py","pytest"],"used_by":[],"sections":[{"start":1,"end":9,"kind":"setup","name":"File setup","id":"s1","hash":"cb3821423016ccf7","title":"Test file imports","what":"Brings in the test tool, async support, the database session, and the planner, author and validator agents that the test uses.","why":"Likely reason: the test needs these parts to run the workflow end to end.","watch_out":"Imports assume the tests run from the project root, and the database must be reachable for the session to be used."},{"start":10,"end":66,"kind":"function","name":"test_full_workflow (part 1)","id":"s2","hash":"2d83c0c952f0004d","title":"Running the three-step survey workflow","what":"Runs a full survey build as a test. It asks the planner for a survey plan for a B2B customer satisfaction study, passes that plan to the author to write the questions, then passes the survey to the validator to score it. It checks that each step returns a success result or the expected fields, and prints the number of sections and questions along the way.","why":"Likely reason: the test checks that the three agents work together end to end, since each one's output is the next one's input. Reason for the specific study details is not stated in the code.","watch_out":"The test uses a real database session and asserts only on the shape of results, not on quality, so a survey can pass while being weak; if an assert fails, the database session is never closed."},{"start":67,"end":81,"kind":"function","name":"test_full_workflow (part 2)","id":"s3","hash":"8cb8ea82a087e5d4","title":"Printing results and closing the database","what":"Prints the validator's readiness score, issue count and pass or fail result, then shows the title and first two questions of the first two survey sections so a person can read them. Finally it closes the database session. Nothing here changes the survey itself.","why":"Likely reason: the printed output lets a person check the survey by eye when the test runs, because the assertions alone do not show what was produced. Closing the session releases the database connection at the end of a normal run.","watch_out":"The database is only closed when the test reaches this point, so any earlier failure leaves the session open, and the printed sample assumes every section has at least one question."},{"start":82,"end":83,"kind":"entry point","name":"entry point","id":"s4","hash":"281a7eff4b725a52","title":"Running the test directly from the command line","what":"Lets a person run this workflow test by starting the file itself rather than through the test runner. Starting the file runs the same full workflow once and prints the output.","why":"Likely reason: it allows a quick manual run of the workflow without the full test tool, for debugging.","watch_out":"Running the file directly skips the test runner's setup, so a result can differ from a normal test run if that setup matters."}],"explained_at":"2026-11-12T00:15:44+00:00","explained_by":"haiku","summary":"A test file for the end-to-end workflow. Only its import section was provided, so the test steps are not explained here.","purpose":"Intended to check that planning, authoring and validation work together.","why":"Likely reason: end-to-end tests catch problems that single-step tests miss. Not confirmed from the visible code.","how":"Only the imports are visible. They bring in the test tool, async support, the database session and the planner, author and validator agents.","inputs":"Not visible in the portion provided.","outputs":"Not visible in the portion provided.","risks":"Tests need a reachable database and must run from the project root for the backend imports to resolve.","debug":"If imports fail, run the tests from the project root. If the database cannot be reached, check the database service. The test bodies were not provided, so their checks cannot be confirmed.","summary_hash":"sha256:274e4bb8d30d6b77cab15d98c5cb9c2ac6edeb64655161917340604c4a0420dd","fresh":true}}}</script>
<script>
(function () {
  "use strict";

  var main = document.getElementById("main");
  var DATA = null;
  try { DATA = JSON.parse(document.getElementById("clarity-data").textContent); } catch (error) { DATA = null; }

  // ---- Mode (shared with the portfolio through the same storage key) ----
  var modeButton = document.getElementById("mode");
  function currentMode() { return document.documentElement.getAttribute("data-mode") === "nerd" ? "nerd" : "calm"; }
  function syncModeLabel() { modeButton.setAttribute("aria-label", "Switch to " + (currentMode() === "calm" ? "nerd" : "calm") + " mode"); }
  modeButton.addEventListener("click", function () {
    var next = currentMode() === "calm" ? "nerd" : "calm";
    document.documentElement.setAttribute("data-mode", next);
    try { localStorage.setItem("site-mode", next); } catch (error) { /* private browsing: fine */ }
    syncModeLabel();
  });
  syncModeLabel();

  if (!DATA || !DATA.repo) {
    main.innerHTML = '<div class="empty"><p class="label">No notes yet</p><h2 class="display" style="margin-top:14px">This page is empty</h2>' +
      '<p class="punch">Open the repository in Claude Code and run <code>python3 .claude/clarity/clarity.py build</code> to fill it.</p></div>';
    return;
  }

  var REPO = DATA.repo;
  var SITE = DATA.site || {};
  var FILES = DATA.files || {};
  var PATHS = Object.keys(FILES).sort();
  var TITLE = SITE.project_name || REPO.name || "Repository";
  var FILE_STATES = {
    "ready": ["\u2713", "Ready", "ok"], "needs-work": ["!", "Needs work", "warn"],
    "not-ready": ["\u00D7", "Not ready", "bad"], "unknown": ["?", "Not checked", "unk"]
  };
  var CHECK_STATES = {
    "pass": ["\u2713", "Yes", "ok"], "partial": ["!", "Partly", "warn"], "fail": ["\u00D7", "No", "bad"],
    "unknown": ["?", "Not checked", "unk"], "ready": ["\u2713", "Ready", "ok"],
    "needs-work": ["!", "Needs work", "warn"], "not-ready": ["\u00D7", "Not ready", "bad"]
  };
  var KIND_LABELS = { "setup": "setup", "function": "function", "class": "class", "method": "method",
    "type": "data shape", "value": "settings or data", "route": "web address", "export": "export",
    "statement": "database statement", "block": "block", "rule": "style rule", "entry point": "starting point",
    "test group": "tests", "event handler": "reacts to an event" };

  function esc(value) {
    return String(value == null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function fmt(value) {
    if (!value) return "";
    return esc(value).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\n/g, "<br>");
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function trunc(value, n) { value = String(value || ""); return value.length > n ? value.slice(0, n - 1) + "\u2026" : value; }
  function base(path) { var i = path.lastIndexOf("/"); return i < 0 ? path : path.slice(i + 1); }
  function dir(path) { var i = path.lastIndexOf("/"); return i < 0 ? "" : path.slice(0, i + 1); }
  function fileHref(path, section) { return "#/file/" + encodeURIComponent(path) + (section ? "/" + section : ""); }
  function both(calm, nerd) { return '<span class="calm-only">' + calm + '</span><span class="nerd-only">' + nerd + "</span>"; }
  function badge(states, status) {
    var s = states[status] || states.unknown;
    return '<span class="badge b-' + s[2] + '"><span aria-hidden="true">' + s[0] + "</span>" + esc(s[1]) + "</span>";
  }
  function fileBadge(card) { return badge(FILE_STATES, (card.readiness && card.readiness.status) || "unknown"); }
  function checkBadge(status) { return badge(CHECK_STATES, status || "unknown"); }
  function explainState(card) {
    if (!card.fresh) return ["\u25D0", "Code changed after these notes were written"];
    if (card.status === "explained") return ["\u25CF", "Explained"];
    if (card.status === "partial") return ["\u25D0", "Partly explained"];
    return ["\u25CB", "Not explained yet"];
  }
  function sec(n, title, nerdTitle, body) {
    return '<section class="sec"><p class="label">' + pad(n) + " / " + both(esc(title), esc(nerdTitle || title)) +
      '</p><div class="sec-body">' + body + "</div></section>";
  }

  // ---- Breadcrumb back into the portfolio -------------------------------
  var SITE_ROOT = SITE.url ? SITE.url.replace(/\/?$/, "/") : "";
  var PROJECT_URL = SITE_ROOT && SITE.project ? SITE_ROOT + "work/" + SITE.project + "/" : "";
  (function () {
    var crumbs = document.getElementById("crumbs");
    var parts = [];
    if (SITE_ROOT) {
      parts.push('<a class="link-quiet" href="' + esc(SITE_ROOT) + '">' + esc(SITE.owner || "Home") + "</a>");
      parts.push('<span aria-hidden="true">/</span><a class="link-quiet" href="' + esc(SITE_ROOT + "code/") + '">Code</a>');
      parts.push('<span aria-hidden="true">/</span><span class="here">' + esc(TITLE) + "</span>");
    } else {
      parts.push('<span class="here">' + esc(TITLE) + '</span><span aria-hidden="true">/</span><span>' + both("Code explorer", "./explore") + "</span>");
    }
    crumbs.innerHTML = parts.join("");
    if (PROJECT_URL) {
      var who = document.querySelector(".rail .who");
      if (who) who.insertAdjacentHTML("afterend", '<p class="label" style="margin:10px 0 0"><a class="link-quiet" href="' + esc(PROJECT_URL) +
        '">' + both("See the project page", "cd ../work/" + esc(SITE.project)) + "</a></p>");
    }
  })();
  function lineLink(path, s) {
    if (!SITE.repo_url || !REPO.commit) return "";
    var url = SITE.repo_url.replace(/\/$/, "") + "/blob/" + encodeURIComponent(REPO.commit) + "/" +
      path.split("/").map(encodeURIComponent).join("/") + "#L" + s.start + "-L" + s.end;
    return '<a class="link-quiet" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer"' +
      (SITE.private ? ' title="Private repository: opens for the owner after signing in to GitHub"' : "") + ">" +
      both(SITE.private ? "GitHub (owner only)" : "Open on GitHub", "git show") + "</a>";
  }

  // ---- Areas -------------------------------------------------------------
  var AREAS = [];
  var AREA_BY_ID = {};
  (function buildAreas() {
    (REPO.areas || []).forEach(function (a) {
      if (!AREA_BY_ID[a.id]) { var copy = Object.assign({}, a, { files: [] }); AREAS.push(copy); AREA_BY_ID[a.id] = copy; }
    });
    PATHS.forEach(function (p) {
      var id = FILES[p].area || "other";
      if (!AREA_BY_ID[id]) {
        var made = { id: id, name: id === "other" ? "Everything else" : id, summary: "", why: "", debug_tips: "", files: [] };
        AREAS.push(made); AREA_BY_ID[id] = made;
      }

  var START = (REPO.start_here || []).filter(function (p) { return FILES[p]; });
  function sortFiles(list) {

  }

  // ---- Sidebar -----------------------------------------------------------

  function matches(path, q) {

  function renderTree() {

  // ---- Mind map ----------------------------------------------------------
  function edge(x1, y1, x2, y2, opacity) {
    var mx = (x1 + x2) / 2;
    return '<path class="mm-edge" d="M' + x1 + " " + y1 + " C" + mx + " " + y1 + ", " + mx + " " + y2 + ", " + x2 + " " + y2 +
      '" stroke-opacity="' + opacity + '"/>';
  }
  function drawMap() {
    var wrap = document.getElementById("mm");
    var detail = document.getElementById("mm-detail");
    if (!wrap) return;
    if (!AREAS.length) { wrap.innerHTML = '<p class="pending">No source files yet.</p>'; return; }
    var ROW = 40, H = 30, TOP = 10, X0 = 4, W0 = 200, X1 = 250, W1 = 268, X2 = 566, W2 = 292;
    var ys = AREAS.map(function (_, i) { return TOP + i * ROW; });
    var open = AREA_BY_ID[openArea] || null;
    var fnodes = [];
    if (open) {
      var sorted = sortFiles(open.files);
      var shown = sorted.slice(0, 14);
      fnodes = shown.map(function (p) { return { kind: "file", path: p }; });
      if (sorted.length > shown.length) fnodes.push({ kind: "more", n: sorted.length - shown.length });
    }
    var oi = open ? AREAS.indexOf(open) : -1;
    var fTop = open ? Math.max(TOP, ys[oi] - ((fnodes.length - 1) * ROW) / 2) : TOP;
    var lastA = ys[ys.length - 1];
    var lastF = fnodes.length ? fTop + (fnodes.length - 1) * ROW : 0;
    var height = Math.max(lastA, lastF) + H + TOP;
    var width = (open ? X2 + W2 : X1 + W1) + 6;
    var rootY = (ys[0] + lastA) / 2;
    var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + width + " " + height + '" width="' + width + '" height="' +
      height + '" role="group" aria-label="Mind map of ' + esc(TITLE) + '">';
    AREAS.forEach(function (a, i) { s += edge(X0 + W0, rootY + H / 2, X1, ys[i] + H / 2, open && a !== open ? 0.12 : 0.4); });
    fnodes.forEach(function (_, j) { s += edge(X1 + W1, ys[oi] + H / 2, X2, fTop + j * ROW + H / 2, 0.4); });
    s += '<g class="mm-root"><rect x="' + X0 + '" y="' + rootY + '" width="' + W0 + '" height="' + H + '" rx="15"/><text x="' +
      (X0 + 16) + '" y="' + (rootY + 19) + '">' + esc(trunc(TITLE, 24)) + "</text></g>";
    AREAS.forEach(function (a, i) {
      var isOpen = a === open;
      s += '<g class="mm-node mm-area' + (isOpen ? " is-open" : "") + (open && !isOpen ? " is-dim" : "") + '" tabindex="0" role="button" aria-expanded="' +
        isOpen + '" aria-label="' + esc(a.name) + ", " + a.files.length + ' files" data-area="' + esc(a.id) + '"><rect class="box" x="' + X1 +
        '" y="' + ys[i] + '" width="' + W1 + '" height="' + H + '" rx="15"/><text class="mm-num" x="' + (X1 + 14) + '" y="' + (ys[i] + 19) + '">' +
        a.num + '</text><text x="' + (X1 + 44) + '" y="' + (ys[i] + 19) + '">' + esc(trunc(a.name, 25)) + '</text><text class="mm-count" x="' +
        (X1 + W1 - 14) + '" y="' + (ys[i] + 19) + '" text-anchor="end">' + a.files.length + "</text></g>";
    });
    fnodes.forEach(function (f, j) {
      var y = fTop + j * ROW;
      if (f.kind === "more") {
        s += '<g class="mm-node mm-more" tabindex="0" role="link" aria-label="' + f.n + ' more files in this area" data-more="' + esc(open.id) +
          '"><rect class="box" x="' + X2 + '" y="' + y + '" width="' + W2 + '" height="' + H + '" rx="4"/><text x="' + (X2 + 14) + '" y="' + (y + 19) +
          '">' + f.n + " more files in this area</text></g>";
        return;
      }
      var card = FILES[f.path];
      var st = explainState(card);
      s += '<g class="mm-node mm-file" tabindex="0" role="link" aria-label="' + esc(f.path) + ", " + esc(st[1]) + '" data-path="' + esc(f.path) +
        '"><rect class="box" x="' + X2 + '" y="' + y + '" width="' + W2 + '" height="' + H + '" rx="4"/><text x="' + (X2 + 14) + '" y="' + (y + 19) + '">' +
        esc(trunc(base(f.path), 32)) + '</text><text class="mm-glyph" x="' + (X2 + W2 - 14) + '" y="' + (y + 19) + '" text-anchor="end">' + st[0] +
        "</text><title>" + esc(f.path) + (card.summary ? ": " + esc(card.summary) : "") + "</title></g>";
    });
    wrap.innerHTML = s + "</svg>";
    if (open) {
      detail.innerHTML = '<p class="label legend">' + open.num + " / " + both("Area", "dir") + "</p><h3>" + esc(open.name) + "</h3>" +
        (open.summary ? "<p>" + fmt(open.summary) + "</p>" : '<p class="pending">This area has no plain-English summary yet.</p>') +
        '<p><a class="u" href="#/area/' + encodeURIComponent(open.id) + '">Read about this area and all ' + open.files.length + " of its files</a></p>";
    } else {
      detail.innerHTML = '<p class="label legend">\u25CF explained \u00A0 \u25D0 partly explained or out of date \u00A0 \u25CB not explained yet</p>';
    }
  }
  main.addEventListener("click", function (event) { mapAction(event.target); });
  main.addEventListener("keydown", function (event) {

  function mapAction(target) {

    html += sec(++n, "How the parts fit together", "tree --areas",

  function viewDebug() {
    var html = '<p class="label head-meta"><span>' + both("Debugging guide", "man debug") + '</span></p><h2 class="display">When something breaks</h2>' +

    var list = REPO.debug_playbook || [];
    html += sec(2, "Known problems", "known issues", list.length ? list.map(function (item) {
      var area = AREA_BY_ID[item.likely_area];
      return '<article class="card"><h3>' + esc(item.symptom || "Problem") + '</h3><dl class="facts">' +
        fact("Likely area", area ? '<a href="#/area/' + encodeURIComponent(area.id) + '">' + area.num + " / " + esc(area.name) + "</a>" : esc(item.likely_area || "")) +
        fact("Where to look", linkList(item.where_to_look)) +
        fact("What to try", (item.steps || []).length ? '<ol class="method">' + item.steps.map(function (s) { return "<li>" + fmt(s) + "</li>"; }).join("") + "</ol>" : "") +
        "</dl></article>"; }).join("") : '<p class="pending">No known problems recorded yet.</p>');
    return html;
  }

  function viewGlossary() {
    var terms = {};
    (REPO.glossary || []).forEach(function (t) { if (t && t.term) terms[t.term.toLowerCase()] = { term: t.term, meaning: t.meaning, files: [] }; });
    PATHS.forEach(function (p) {
      (FILES[p].terms || []).forEach(function (t) {
        if (!t || !t.term) return;
        var key = t.term.toLowerCase();
        if (!terms[key]) terms[key] = { term: t.term, meaning: t.meaning, files: [] };
        if (terms[key].files.length < 5) terms[key].files.push(p);
      });
    });
    var keys = Object.keys(terms).sort();
    var html = '<p class="label head-meta"><span>' + both("Glossary", "grep glossary") + "</span><span>" + keys.length +
      ' terms</span></p><h2 class="display">Glossary</h2><p class="punch">Technical words used in this codebase, in plain English.</p>';
    if (!keys.length) return html + '<p class="pending" style="margin-top:30px">No terms recorded yet.</p>';
    return html + sec(1, "Terms", "terms", '<label><span class="sr-only">Filter the glossary</span><input class="filter" id="gfilter" type="search" placeholder="Filter terms"></label>' +
      '<dl class="glossary" id="glist">' + keys.map(function (k) {
        var t = terms[k];
        return '<dt data-k="' + esc(k) + '">' + esc(t.term) + '</dt><dd data-k="' + esc(k) + '">' + fmt(t.meaning) +
          (t.files.length ? '<div class="used">Used in ' + t.files.map(function (p) { return '<a href="' + fileHref(p) + '">' + esc(base(p)) + "</a>"; }).join(", ") + "</div>" : "") +
          "</dd>"; }).join("") + "</dl>");
  }

  function notFound(message) {
    return '<p class="label head-meta"><span>404</span></p><h2 class="display">Not found</h2><p class="punch">' + esc(message) +
      '</p><p style="margin-top:24px"><a class="u" href="#/overview">Back to the overview</a></p>';
  }

  // ---- Router ------------------------------------------------------------
  function render() {
    var raw = (location.hash || "#/overview").slice(2);
    var parts = raw.split("/");
    var view = parts[0] || "overview";
    var arg = parts[1] ? decodeURIComponent(parts[1]) : "";
    var extra = parts[2] ? decodeURIComponent(parts[2]) : "";
    currentPath = null;
    var html;
    if (view === "file") html = viewFile(arg, extra);
    else if (view === "area") html = viewArea(arg);
    else if (view === "readiness") html = viewReadiness();
    else if (view === "decisions") html = viewDecisions();
    else if (view === "debug") html = viewDebug();
    else if (view === "glossary") html = viewGlossary();
    else { view = "overview"; html = viewOverview(); }
    main.innerHTML = html;
    document.querySelectorAll(".views a").forEach(function (link) {
      if (link.getAttribute("data-view") === view) link.setAttribute("aria-current", "page"); else link.removeAttribute("aria-current");
    });
    renderTree();
    if (view === "overview") drawMap();
    if (view === "glossary") {
      var gf = document.getElementById("gfilter");
      if (gf) gf.addEventListener("input", function () {
        var q = gf.value.trim().toLowerCase();
        var text = {};
        document.querySelectorAll("#glist [data-k]").forEach(function (el) { var k = el.getAttribute("data-k"); text[k] = (text[k] || "") + " " + el.textContent.toLowerCase(); });
        document.querySelectorAll("#glist [data-k]").forEach(function (el) { var k = el.getAttribute("data-k"); el.style.display = !q || text[k].indexOf(q) >= 0 ? "" : "none"; });
      });
    }
    var target = extra ? document.getElementById("sec-" + extra) : null;
    if (target && target.scrollIntoView) target.scrollIntoView({ block: "start" });
    else if (window.scrollTo) { try { window.scrollTo(0, 0); } catch (error) { /* not available */ } }
    main.focus({ preventScroll: true });
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
