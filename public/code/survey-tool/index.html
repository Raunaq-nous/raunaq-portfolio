n.py","language":"Python","lines":87,"hash":"sha256:eece0fac0a632ff08e5da611e1043219dd811da0277bb506175348a93967ce93","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The health check uses a plain text SQL command that newer SQLAlchemy versions reject, so it is likely to report unhealthy even with a working database.","Table creation at startup is disabled.","The version number is written in two places and may drift."]},"terms":[{"term":"FastAPI","meaning":"The Python web framework that turns Python functions into web addresses the frontend can call."},{"term":"Route","meaning":"A web address and action the API answers, such as a health check."},{"term":"CORS","meaning":"A browser rule that decides which websites may call the API."},{"term":"Router","meaning":"A group of related routes, such as all survey routes, attached to the main app."},{"term":"Health check","meaning":"A simple route that reports whether the app and its database are working."},{"term":"Uvicorn","meaning":"The server program that runs the API."}],"depends_on":["backend/config.py","backend/database.py","backend/routers/corpus.py","backend/routers/surveys.py","backend/routers/studies.py","backend/routers/agents.py","backend/routers/models.py"],"used_by":["backend/Dockerfile","docker-compose.yml","setup_and_test.sh","setup_native.sh","setup_sqlite.py"],"sections":[{"start":1,"end":40,"kind":"setup","name":"File setup","id":"s1","hash":"ea2e7e60db9fc532","title":"App setup, allowed websites and route groups","what":"Sets up logging, creates the web app with its documentation pages, allows browser requests from the configured websites, and connects the corpus, survey, study, agent and model route groups under their web addresses.","why":"Lets the frontend and other programs reach the right features under clear address prefixes.","watch_out":"Any website missing from the allowed origins list will be blocked by the browser."},{"start":41,"end":49,"kind":"function","name":"startup_event","id":"s2","hash":"2f377d6562560af2","title":"Startup message","what":"Writes a log message when the app starts. The table creation line is commented out.","why":"Gives a clear sign in the logs that the app began.","watch_out":"Because table creation is off, a fresh database will have no tables until a setup script creates them."},{"start":50,"end":55,"kind":"function","name":"shutdown_event","id":"s3","hash":"93ca572b796e7416","title":"Shutdown message","what":"Writes a log message when the app stops.","why":"Shows in the logs that the app stopped cleanly.","watch_out":"Only logs; it does not close database connections itself."},{"start":56,"end":66,"kind":"function","name":"root","id":"s4","hash":"b8f0da2b6fdbc9b2","title":"Root information route","what":"Answers requests to the top address with the app name, version, running status and documentation address.","why":"Gives a quick way to check that the server responds.","watch_out":"The version here is typed in by hand and must be updated alongside the one in the app setup."},{"start":67,"end":84,"kind":"function","name":"health_check","id":"s5","hash":"b5b177e33bf3a8f9","title":"Health check route","what":"Runs a quick database test and returns healthy if it works, or a service unavailable error if it fails.","why":"Used by the setup scripts and monitoring tools to decide whether the API is ready.","watch_out":"The test passes a plain text SQL command, which newer SQLAlchemy versions reject, so this check may report failure even when the database is fine."},{"start":85,"end":87,"kind":"entry point","name":"entry point","id":"s6","hash":"44db6dc595e5fb01","title":"Direct start entry point","what":"Starts the API server on port 8000 when the file is run directly.","why":"Lets the owner start the backend with one Python command without the Docker command.","watch_out":"Starting this way does not turn on automatic reloading, so code edits need a restart."}],"explained_at":"2026-11-12T00:12:57+00:00","explained_by":"haiku","summary":"The starting point of the backend API. It creates the web app, allows the frontend to call it, connects the route groups, and provides a root page and a health check.","purpose":"Brings all parts of the API together so one server can answer requests.","why":"Likely reason: a web app needs one entry point that sets up shared rules such as CORS and the route list.","how":"It configures logging and creates the FastAPI app with documentation at /api/docs. It allows requests from the origins in the settings, then attaches the corpus, surveys, studies, agents and models routes. On startup and shutdown it logs messages. The root route returns the app name, and the health route tests the database.","inputs":"The settings object, requests from the browser or other programs, and the database session.","outputs":"JSON replies from the root route and the health route, plus logs.","risks":"The health check passes a plain text SQL command, which SQLAlchemy 2 may reject, so the health check may always fail. Table creation at startup is commented out, so a new database will be empty. Allowed origins are set from the settings and must include the frontend address.","debug":"If the frontend cannot call the API, check the allowed origins in the settings. If the health check reports unhealthy, check the database connection and the logs for the error text. If the API will not start, check the logs for the first import error.","summary_hash":"sha256:eece0fac0a632ff08e5da611e1043219dd811da0277bb506175348a93967ce93","fresh":true},"backend/models/audit.py":{"schema_version":1,"path":"backend/models/audit.py","language":"Python","lines":221,"hash":"sha256:015c98c4af80d3058fa864d3501587ba2d617cb731f9c2d3bdfbaa0f8750b58c","area":"backend-models","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The temperature and top-p columns lose decimal values.","No tests are visible.","The column layout is clear and the compliance fields are present."]},"terms":[{"term":"SQLAlchemy","meaning":"a Python library that maps Python classes to database tables"},{"term":"Column","meaning":"one field in a database table, such as an email or a timestamp"},{"term":"Schema","meaning":"a named group of tables inside a database, used here to keep the audit tables separate"},{"term":"SQLite","meaning":"a small database stored in one file, often used for local work"},{"term":"PostgreSQL","meaning":"a full database server used for the main app"},{"term":"GDPR","meaning":"the European data protection law that includes a right to have personal data deleted"},{"term":"Primary key","meaning":"the field that uniquely identifies each row in a table"}],"depends_on":["database module (Base and is_sqlite)","sqlalchemy library"],"used_by":["Not visible in this packet"],"sections":[{"start":1,"end":19,"kind":"setup","name":"File setup","id":"s1","hash":"58e2fceba14247b6","title":"Choosing column types for the database","what":"Chooses the column types for IDs and lists based on the database type. On SQLite it uses text and JSON stand-ins. On PostgreSQL it uses the real UUID and array types.","why":"The comment says SQLite has no UUID or array types, so stand-ins let the same tables run on both.","watch_out":"Lists stored as JSON on SQLite cannot be searched the same way, so queries that work on PostgreSQL may behave differently in local tests."},{"start":20,"end":63,"kind":"class","name":"AuditLog","id":"s2","hash":"089da339db7983d5","title":"Audit log of actions","what":"Defines the table for significant actions: who did it, what it touched, what changed, whether it succeeded, and flags for personal data and sensitivity.","why":"The comments show it is meant as a compliance trail covering create, read, update, delete and export actions.","watch_out":"The details and changes fields are free-form, and nothing here stops personal data from being written into them."},{"start":64,"end":117,"kind":"class","name":"ModelCall","id":"s3","hash":"2601f6b8573d8acb","title":"Record of each AI model call","what":"Stores every model call: provider, model, the full prompt and response, token use, speed, which agent made it, and any error.","why":"The docstring says it supports reproducibility, so a result can be reviewed or rerun from the saved prompt and response.","watch_out":"Temperature and top-p are stored as whole numbers, so decimal settings such as 0.3 are lost."},{"start":118,"end":155,"kind":"class","name":"ConsentRecord","id":"s4","hash":"eb143ce730ac48d4","title":"Consent records","what":"Stores each consent a person gave: the study, the consent wording and version, when it was given, whether the person is a minor and whether a parent consented, and any later withdrawal.","why":"Likely reason: to prove that consent was given and to show what the person agreed to.","watch_out":"The parent email is stored in plain text, so this table holds a guardian's contact details."},{"start":156,"end":189,"kind":"class","name":"DataAccess","id":"s5","hash":"9220f988fee7bef7","title":"Data access log","what":"Records each time someone views, exports, downloads or deletes a respondent record. Stores the person's ID, the resource, and the stated purpose.","why":"Likely reason: compliance, so the team can show who looked at sensitive data and why.","watch_out":"The purpose field is optional, so an access can be saved with no reason given."},{"start":190,"end":221,"kind":"class","name":"Erasure","id":"s6","hash":"a98ccccecd67e715","title":"Erasure requests","what":"Tracks a request to delete a person's data under the right to be forgotten. Stores who asked, which person, which studies, the status, a 30-day deadline, and whether the deadline was met.","why":"The comments name GDPR and a 30-day deadline as the reason.","watch_out":"The deadline and the met-deadline flag are stored, but nothing in this file sets or checks them. Other code must do that."}],"explained_at":"2026-11-12T00:11:10+00:00","explained_by":"haiku","summary":"Defines the database tables that record who did what, every AI model call, consent given, data viewed, and data erasure requests.","purpose":"Keeps the audit trail for compliance, for example to show who viewed respondent data, when, and why.","why":"The file docstring says it is for audit and compliance. The table comments mention GDPR erasure and minors' consent, which are the likely reasons for the design.","how":"Each class describes one table and its columns. The file picks column types based on whether the database is SQLite (used for local work) or PostgreSQL. On PostgreSQL, the tables sit in an audit schema.","inputs":"Nothing directly. Other code creates rows in these tables.","outputs":"Five database tables: audit logs, model calls, consent records, data access records, and erasure requests.","risks":"Temperature and top-p are stored as whole numbers, so a value such as 0.3 is saved as 0. Personal data such as emails and parent emails is stored in these logs. The erasure deadline is a required field, but nothing in this file checks it.","debug":"If a saved value looks wrong, check the column type for that field. If a table is missing on PostgreSQL, check that the audit schema exists. If data looks different in local runs, check the database type setting.","summary_hash":"sha256:015c98c4af80d3058fa864d3501587ba2d617cb731f9c2d3bdfbaa0f8750b58c","fresh":true},"backend/models/corpus.py":{"schema_version":1,"path":"backend/models/corpus.py","language":"Python","lines":229,"hash":"sha256:0ca1fa0be1de1b18d17283190dceb3a3f2392d8eb2cb53725276bda7959c0987","area":"backend-models","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The pgvector fallback is silent.","Tags are copied rather than linked, so they can go stale.","No tests are visible.","The time-to-live is stored but not enforced in this file."]},"terms":[{"term":"Enum","meaning":"a fixed list of allowed labels, such as document types, so a typo cannot be saved"},{"term":"Embedding","meaning":"a list of numbers that represents the meaning of a piece of text, so similar texts can be found"},{"term":"Vector","meaning":"a database column type that stores embeddings and can search them quickly"},{"term":"pgvector","meaning":"an optional PostgreSQL add-on that supports vector columns"},{"term":"Chunk","meaning":"a small piece of a longer document, stored separately so it can be searched on its own"},{"term":"Time-to-live","meaning":"how many days a deprecated item is kept before it can be removed"},{"term":"Schema","meaning":"a named group of tables inside a database"}],"depends_on":["database module (Base and is_sqlite)","sqlalchemy library","pgvector library (optional)"],"used_by":["Not visible in this packet"],"sections":[{"start":1,"end":28,"kind":"setup","name":"File setup","id":"s1","hash":"f54a7c86cf77f324","title":"Database type switch and vector support","what":"Chooses column types based on the database. Sets up the vector column for embeddings, and falls back to plain JSON if the pgvector library is missing.","why":"Same reason as the audit file, and the fallback keeps the app running without the library.","watch_out":"The fallback is silent, so a missing library gives no warning and embedding search quietly stops working."},{"start":29,"end":38,"kind":"class","name":"DocType","id":"s2","hash":"de60e97548f42731","title":"Document type labels","what":"Lists the kinds of documents the library holds: question banks, templates, policies, method guides, past surveys, and industry packs.","why":"Likely reason: each document gets a fixed category so search can filter by it.","watch_out":"Changing these labels can break saved records that still use an old label."},{"start":39,"end":59,"kind":"class","name":"QuestionType","id":"s3","hash":"891b05a8cd3e84dc","title":"Question type labels","what":"Lists the question formats the tool understands, such as Likert scales, NPS, MaxDiff and CBC.","why":"Likely reason: keeps question types consistent across the planner, validator and publisher.","watch_out":"These names must match the names used in the validator and publisher, and those lists are kept separately, so they can drift apart."},{"start":60,"end":100,"kind":"class","name":"Document","id":"s4","hash":"6e7ab6a8fa7b53b9","title":"Library document record","what":"Stores one document: title, type, version, source and priority, the topics and audiences it covers, policy tags, full text, and whether it is active or deprecated.","why":"Documents carry the tags that search and policy checks rely on.","watch_out":"Source priority is a 0 to 1 number that nothing in this file uses. How it is applied is not stated in the code."},{"start":101,"end":146,"kind":"class","name":"DocumentChunk","id":"s5","hash":"af812fd0fa03bfb3","title":"Searchable document chunk","what":"Stores a small piece of a document with its own embedding and quality numbers such as usage count and success rate. Copies the document's tags onto the chunk.","why":"Likely reason: search returns short pieces rather than whole documents, and copied tags let search filter without joining tables.","watch_out":"Tags are copied, so editing a document does not update its chunks automatically."},{"start":147,"end":195,"kind":"class","name":"QuestionTemplate","id":"s6","hash":"4d573707ce6b3236","title":"Approved question templates","what":"Stores a reusable question with placeholders such as brand or category, its answer options and scale, display logic, method settings, and who approved it.","why":"Likely reason: lets the team reuse pre-approved wording instead of generating new questions every time.","watch_out":"Approval fields are optional, so a template can be used without an approval record unless other code checks for one."},{"start":196,"end":229,"kind":"class","name":"PolicyRule","id":"s7","hash":"7407a490363bf6a6","title":"Policy rules","what":"Stores governance rules such as banned words or required consent, with the regions and audiences they apply to, their severity, and the action to take (reject, warn, redact or require approval).","why":"Likely reason: lets compliance rules live in data so they can change without code edits.","watch_out":"This file only records the action. Nothing here applies the rule."}],"explained_at":"2026-11-12T00:11:10+00:00","explained_by":"haiku","summary":"Defines the database tables for the library of reference content: documents, searchable pieces of them, approved question templates, and policy rules.","purpose":"Stores what the survey tool draws on: question banks, past surveys, method guides, policies, and industry packs.","why":"Likely reason: lets the planner and author use approved, classified content, and lets the validator apply policies. The file does not state this.","how":"Defines two lists of labels (document types and question types), then four tables: documents, document chunks with embedding vectors, question templates, and policy rules. On PostgreSQL, the chunk embedding uses a vector column if the pgvector library is installed.","inputs":"Nothing directly. Other code writes to these tables.","outputs":"Four database tables in the corpus schema on PostgreSQL.","risks":"If pgvector is missing, embeddings are stored as plain JSON and similarity search stops working, with no warning. Chunks copy the tags from their document, so they can drift out of date. Chunks link to documents by text ID with no enforced link. The time-to-live for deprecated documents is stored here but not enforced.","debug":"If similarity search returns nothing, check that pgvector is installed and that the embedding column is a vector type. If a chunk shows old tags, re-copy them from the parent document. If a deprecated document is still used, check the code that enforces time-to-live, which is not in this file.","summary_hash":"sha256:0ca1fa0be1de1b18d17283190dceb3a3f2392d8eb2cb53725276bda7959c0987","fresh":true},"backend/models/model_config.py":{"schema_version":1,"path":"backend/models/model_config.py","language":"Python","lines":191,"hash":"sha256:d1003e1cb4cfa2904afac791775d39f7a1a72735a75f7f3a624c6b31535c2a50","area":"backend-models","status":"explained","summary_stale":false,"readiness":{"status":"not-ready","reasons":["API keys are stored as plain text in the database. The comment says they should be encrypted in production, but no encryption appears in this file.","Performance counters need other code to keep them up to date.","No tests are visible."]},"terms":[{"term":"API key","meaning":"a secret string that proves to an AI provider that a request is allowed and billed to the right account"},{"term":"Enum","meaning":"a fixed list of allowed labels, so a typo cannot be saved"},{"term":"Task","meaning":"a kind of job an AI model can be chosen for, such as planning or translation"},{"term":"Registry","meaning":"a catalog of models with their known features and costs"},{"term":"Top-p","meaning":"a setting that limits how many word choices the model considers, along with temperature"},{"term":"Encrypted","meaning":"scrambled so it cannot be read without a secret key"}],"depends_on":["database module (Base and is_sqlite)","sqlalchemy library"],"used_by":["agents/planner_v2.py (imports the task and type labels)","services/model_manager.py (likely; not visible in this packet)"],"sections":[{"start":1,"end":21,"kind":"setup","name":"File setup","id":"s1","hash":"f8b82974bc161116","title":"Choosing column types for the database","what":"Chooses ID and list column types based on the database type. On SQLite, it uses text and JSON stand-ins.","why":"SQLite has no UUID or array types, so stand-ins let the same tables run on both databases.","watch_out":"Lists are stored as JSON on SQLite, so searches on those lists behave differently in local tests."},{"start":22,"end":33,"kind":"class","name":"ModelProvider","id":"s2","hash":"e0b12faedb2c0990","title":"Model provider labels","what":"Lists the companies and runtimes a model can come from, such as OpenAI, Anthropic, Google, Ollama, and local models.","why":"Keeps provider names consistent across the settings and performance tables.","watch_out":"Adding a provider here does not make it usable. The code that calls the provider must also support it."},{"start":34,"end":46,"kind":"class","name":"ModelTask","id":"s3","hash":"77839a853b4f40ff","title":"Task labels","what":"Lists the jobs a model can be chosen for: planning, generation, validation, embedding, translation, sentiment, emotion, theme extraction, and summarization.","why":"Lets each task have its own model setting.","watch_out":"Only planning is used by the agent files in this packet. Whether the other tasks are used elsewhere is not visible here."},{"start":47,"end":52,"kind":"class","name":"ModelType","id":"s4","hash":"d38148a87603e439","title":"Open source or paid label","what":"Marks whether a model is run by the team (open source) or bought as a service (paid).","why":"The planner v2 docstring says callers can prefer one kind, so this label supports that choice.","watch_out":"This is only a tag. Nothing in this file stops a paid model from being chosen when open source was preferred."},{"start":53,"end":101,"kind":"class","name":"ModelConfig","id":"s5","hash":"ab31c777e4edbd5b","title":"Model settings for an organization","what":"Stores which model an organization uses for one task: provider, model name and version, API key, custom server address, randomness and length limits, plus usage counts and whether it is active or the default.","why":"Likely reason: lets each organization use its own model and its own keys.","watch_out":"The API key is stored unencrypted in this table."},{"start":102,"end":155,"kind":"class","name":"ModelRegistry","id":"s6","hash":"2533200442da2e7b","title":"Catalog of available models","what":"Lists known models with what they can do (JSON output, function calling, streaming), which tasks they suit, speed, cost per thousand tokens, quality, and hardware needs.","why":"Helps the team pick a suitable model without trying each one.","watch_out":"Speed and cost values are entered by hand, so they can go out of date. Nothing in this file refreshes them."},{"start":156,"end":191,"kind":"class","name":"ModelPerformanceLog","id":"s7","hash":"8aa0e7910e3f1214","title":"Performance log for each call","what":"Records each model call for a task: input and output sizes, token counts, speed, success, error text, estimated cost, and an optional user rating from 1 to 5.","why":"Likely reason: lets the team compare models using real results.","watch_out":"The rating and the estimated cost are plain stored values. Nothing here checks the rating range or calculates the cost."}],"explained_at":"2026-11-12T00:11:10+00:00","explained_by":"haiku","summary":"Defines the database tables that choose which AI model each task uses, the catalog of available models, and a log of how each call performed.","purpose":"Lets admins set and change the AI model for each task and organization, and tracks how well each model works.","why":"The file docstring says it holds the user's model configuration. The planner v2 file reads these types, which is the likely reason for the design.","how":"Defines three lists of labels (providers, tasks, and model types), then three tables: the model settings for each organization, the catalog of models, and a performance log with one row per call.","inputs":"Nothing directly. Other code writes rows to these tables.","outputs":"Three database tables in the public schema on PostgreSQL.","risks":"Each model setting stores its API key as plain text. The comment says keys should be encrypted in production, and no encryption appears in this file. Performance counters must be updated by other code. Links between tables use text model names, not enforced relationships.","debug":"If the wrong model runs, check the model settings row for the organization and task, and whether it is marked active and default. If costs look wrong, check the catalog values. If a provider rejects a key, check the stored key for that setting.","summary_hash":"sha256:d1003e1cb4cfa2904afac791775d39f7a1a72735a75f7f3a624c6b31535c2a50","fresh":true},"backend/models/panel.py":{"schema_version":1,"path":"backend/models/panel.py","language":"Python","lines":210,"hash":"sha256:a3f6bfab53c963b841a353f94efa10bfd37ca511d75df0064add5582d85a8e0c","area":"backend-models","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Only 5 of the 7 sections in this file were included in the packet. The Invitation and Incentive sections were not reviewed, so they have no notes.","Personal data is stored in plain text.","Panel counters need other code to stay correct.","No tests are visible."]},"terms":[{"term":"Panel","meaning":"a named list of people the team can invite to surveys"},{"term":"Contact","meaning":"one person in a panel, with their details and invitation history"},{"term":"Opt-out","meaning":"a person asking not to be contacted again"},{"term":"Bounce","meaning":"an invitation that could not be delivered, for example because the email address is invalid"},{"term":"Fingerprint","meaning":"a value computed from someone's details, such as a hashed email, used to spot the same person appearing twice"},{"term":"Hash","meaning":"a scrambled, one-way version of a value, so the original cannot easily be read back"},{"term":"CRM","meaning":"customer relationship management, a business system that stores customer records"}],"depends_on":["database module (Base and is_sqlite)","sqlalchemy library"],"used_by":["Not visible in this packet"],"sections":[{"start":1,"end":20,"kind":"setup","name":"File setup","id":"s1","hash":"4c6cc8ae4b738c4a","title":"Choosing column types for the database","what":"Chooses ID and list column types based on the database type. On SQLite, it uses text and JSON stand-ins.","why":"SQLite has no UUID or array types, so stand-ins let the same tables run on both databases.","watch_out":""},{"start":21,"end":29,"kind":"class","name":"ContactStatus","id":"s2","hash":"e4274889cc2ae6be","title":"Contact status labels","what":"Lists the possible states of a contact: active, bounced, opted out, duplicate, and blocked.","why":"Likely reason: stops the team from inviting people who have bounced, opted out, or are duplicates.","watch_out":"Status holds one value, but opt-out and bounce have their own timestamp fields, so a contact can show mixed signals unless other code keeps them in step."},{"start":30,"end":64,"kind":"class","name":"Panel","id":"s3","hash":"8dddd7febab7a2dc","title":"Contact list record","what":"Stores one panel: its name, type (B2B, B2C or vendor), source, creator, and running counts of total, active, opted-out and bounced contacts.","why":"Likely reason: lets a list be found and summarised without counting every contact each time.","watch_out":"The counts are stored, not calculated, so they go out of date unless the code that changes contacts updates them."},{"start":65,"end":123,"kind":"class","name":"Contact (part 1)","id":"s4","hash":"5e47401b2846d1c9","title":"Contact identity, fingerprints, and profile","what":"Stores one person's identity (email, phone, CRM ID, and panel respondent ID), fingerprints used to spot duplicates, and profile details for business or consumer surveys. Also holds status, invitation and response counts, and opt-out and bounce dates.","why":"The fields are labelled as dedupe fingerprints, so duplicates can be spotted without comparing raw personal data.","watch_out":"Raw email, phone, age, gender and income are stored in plain text, so this table needs protection."},{"start":124,"end":131,"kind":"class","name":"Contact (part 2)","id":"s5","hash":"6bd2354e659ab764","title":"Extra fields and record dates","what":"Stores extra custom details in a flexible field, plus metadata and created and updated times for each contact.","why":"Likely reason: the flexible field lets each panel store details the fixed columns do not cover, and timestamps support audit and sorting.","watch_out":"The flexible field accepts any data, and this file does not check what gets stored in it."},{"start":132,"end":172,"kind":"class","name":"Invitation","id":"s6","hash":"385886cfbfe06fec","title":"Study invitation record","what":"Defines the table that stores each invitation sent to a survey contact. It records the channel used (email, SMS or WhatsApp), when it was sent, delivered, opened, clicked, started and completed, and whether it bounced or was reminded.","why":"Likely reason: the app needs one place to track how far each invitation got, so response rates and reminders can be measured. Reason not stated in the code for the exact field list.","watch_out":"The status column is plain text, so a misspelled or new status value is accepted silently and will not show up in status-based filters."},{"start":173,"end":210,"kind":"class","name":"Incentive","id":"s7","hash":"9ee0832b9342c557","title":"Incentive payment record","what":"Defines the table that tracks rewards promised to panel members, such as gift cards or points. It stores the amount, currency, status (pending, verified, paid or failed), payment method, payment reference and who verified it.","why":"Likely reason: payments need an audit trail of what was promised, checked and paid. Reason not stated in the code for the exact design.","watch_out":"The amount is a floating-point number, which can round small money values. Nothing in this file prevents an amount from being changed after it is marked paid."}],"explained_at":"2026-11-12T00:12:57+00:00","explained_by":"haiku","summary":"Defines the database tables for contact lists (panels) and the people in them, including profile details, duplicate-spotting fingerprints, and opt-out and bounce status.","purpose":"Stores the people the team can invite to surveys, and records who has opted out, bounced, or been counted as a duplicate.","why":"Likely reason: lets the team manage invitations while respecting opt-outs and avoiding duplicate invitations. The file does not state this directly.","how":"Defines a status list, then two tables: panels (contact lists with summary counts) and contacts (one row per person). The file picks column types based on the database type, and tables sit in the panels schema on PostgreSQL.","inputs":"Nothing directly. Other code writes rows to these tables.","outputs":"Two database tables, panels and contacts, in the panels schema on PostgreSQL. The status list is used to label each contact.","risks":"Raw email, phone, age, gender and income are stored in plain text, so this table holds sensitive personal data. Panel counts are stored, not calculated, so they go stale unless other code updates them. A contact's panel link is plain text with no enforced relationship.","debug":"If a panel's counts look wrong, recount its contacts and check the code that updates them. If a person was invited after opting out, check the contact's status and opt-out timestamp. If duplicates slip through, check the fingerprint fields the duplicate check uses.","summary_hash":"sha256:a3f6bfab53c963b841a353f94efa10bfd37ca511d75df0064add5582d85a8e0c","fresh":true},"backend/models/study.py":{"schema_version":1,"path":"backend/models/study.py","language":"Python","lines":250,"hash":"sha256:f914d954aa4f45541092feacce28835206e8e8aca816f98f8e9011fd458abc1d","area":"backend-models","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No tests or migration files were shown for these tables.","Status and type fields for Stimulus and Response are plain text while Study uses enums, so the approach is inconsistent.","Several fields are unused or unclear from this file alone, such as the hashed respondent ID approach, which is only described in a comment."]},"terms":[{"term":"ORM","meaning":"Object-relational mapper, a library that lets the app work with database rows as Python objects. Here it is SQLAlchemy."},{"term":"Column","meaning":"One named field in a database table, such as name or status."},{"term":"Enum","meaning":"A fixed list of allowed values, such as the study statuses."},{"term":"JSON column","meaning":"A column that stores a structured blob of data, such as a dictionary or list, instead of a single value."},{"term":"Schema","meaning":"A named group of tables inside one PostgreSQL database, used here to separate studies data from other data."},{"term":"Foreign key","meaning":"A database rule that a value must match a row in another table."},{"term":"SQLite","meaning":"A simple database stored in one local file, used for easy local setup."},{"term":"PostgreSQL","meaning":"A full database server used for the main installation."}],"depends_on":["backend/database.py","sqlalchemy"],"used_by":["backend/routers/studies.py","backend/services"],"sections":[{"start":1,"end":21,"kind":"setup","name":"File setup","id":"s1","hash":"6b5a68be07fe5457","title":"Database compatibility setup","what":"Prepares the file so the same models work on both SQLite and PostgreSQL. When SQLite is used, it swaps in simpler stand-ins for the UUID and array types.","why":"The comment says SQLite does not support the PostgreSQL-specific types, so stand-ins are defined.","watch_out":"The stand-ins ignore the as_uuid option and store arrays as plain JSON, so results can differ between the two databases."},{"start":22,"end":32,"kind":"class","name":"StudyStatus","id":"s2","hash":"18d7b04c50fc8913","title":"Study lifecycle stages","what":"Lists the stages a study moves through, from planning to ready, recruiting, running, analyzing, completed and archived.","why":"Gives each study a fixed, named stage so the app can enforce what happens next.","watch_out":"Stage values are stored as text, so renaming one later will break saved studies that use the old name."},{"start":33,"end":45,"kind":"class","name":"StudyType","id":"s3","hash":"333cf6cdac0758cd","title":"Study type list","what":"Lists the kinds of research a study can be, such as customer satisfaction, brand tracking, concept test, ad test, pricing, UX test, persona, category discovery, and custom.","why":"Gives each study a fixed type so the app can choose the right method and questions.","watch_out":"Values like Brand_Tracker are stored in the database, so changing their text will orphan existing studies."},{"start":46,"end":104,"kind":"class","name":"Study (part 1)","id":"s4","hash":"112574be7f7831ee","title":"Core study details","what":"Defines the main Study table. It holds the name, type, owner, team, targets such as sample size and markets, quotas, planned and actual dates, status, and consent and privacy settings. It also keeps progress counters for responses, completions and screen-outs.","why":"Holds everything about a study in one row so the app can show a single study page. Reason for the default retention of 2555 days is not stated in the code, though the settings file says it is about seven years.","watch_out":"The counters such as responses_count are stored separately from the response rows, so they can drift out of step if the app does not update both."},{"start":105,"end":116,"kind":"class","name":"Study (part 2)","id":"s5","hash":"e9be641947a9b70f","title":"Study quality and metadata","what":"Holds quality checks such as attention checks and fraud detection results, a count of flagged responses, a free-form metadata field, and the created and updated times.","why":"Keeps quality information on the study itself so it can be reviewed without reading every response.","watch_out":"The metadata field is named record_metadata because metadata is a reserved name in SQLAlchemy. Renaming it back will break the code."},{"start":117,"end":154,"kind":"class","name":"Stimulus","id":"s6","hash":"88ebeace5c9b3d0e","title":"Stimulus table","what":"Defines the table for items shown to participants, such as images, videos, prototypes or audio. It stores where the file lives, its type and size, display order, whether to randomize, and how many times it was shown.","why":"Likely reason: the app must track which stimulus each participant saw and in what order.","watch_out":"The uri field is described as S3 or similar but is free text, so a bad link is not caught at save time."},{"start":155,"end":212,"kind":"class","name":"Response","id":"s7","hash":"d1563a67f9ccb307","title":"Individual response table","what":"Defines the table where each respondent's answers are stored. It includes status, answers as a single structured field, quality flags, fraud score, timing, device, location, language, source, and incentive status.","why":"Keeps all data about one person's attempt in one row, which makes it easy to filter and export.","watch_out":"Answers are stored as one structured blob keyed by question ID, so a typo in a question ID will not be caught by the database."},{"start":213,"end":250,"kind":"class","name":"Interview","id":"s8","hash":"bcf8c34f730631c1","title":"AI interview table","what":"Defines the table for AI-led qualitative interviews. It stores start and end times, mode (chat, voice or SMS), the full transcript, extracted themes, sentiment, emotion, key quotes and a quality score.","why":"Likely reason: qualitative interviews need their own record separate from the survey answers, linked by the response ID.","watch_out":"The link to the response is only a text match, with no database rule enforcing it, so an interview can point to a response that does not exist."}],"explained_at":"2026-11-12T00:12:57+00:00","explained_by":"haiku","summary":"Defines the database tables for a research study and its parts: the study itself, the stimuli shown to people, individual responses, and AI interview sessions.","purpose":"Gives the rest of the app a fixed shape for storing study data, so the app can save, look up and update studies, stimuli, responses and interviews.","why":"Likely reason: each research study has several linked pieces of data, and a single shared model keeps them consistent. Reason not stated in the code for some choices, such as the 2555-day retention default.","how":"First it picks column types that work on both SQLite and PostgreSQL. Then it defines the allowed study statuses and study types. Then it defines the Study table with targeting, quotas, timeline, compliance, privacy and progress fields. Then it defines the Stimulus, Response and Interview tables. Each table has a public text ID and an internal ID.","inputs":"Data written by the app's study-related routers and services. Table names are study-scoped, such as studies.studies in PostgreSQL.","outputs":"Database tables and Python objects that the rest of the app reads and writes.","risks":"Changing a column name or type will break existing databases unless a migration is written. Several fields that look like links, such as response_id on Interview, are plain text with no foreign key, so a typo will not be caught.","debug":"If saving a study fails, check the study_type and status values against the enums in this file. If PostgreSQL reports a schema error, confirm the schema named in __table_args__ exists. If a list column behaves oddly on SQLite, remember it is stored as JSON.","summary_hash":"sha256:f914d954aa4f45541092feacce28835206e8e8aca816f98f8e9011fd458abc1d","fresh":true},"backend/models/survey.py":{"schema_version":1,"path":"backend/models/survey.py","language":"Python","lines":196,"hash":"sha256:9c2ad25466c71fa0efc0cb761ded85c035c70c6a50521cad71dd6449e2ebc2b7","area":"backend-models","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No tests or migrations were shown.","The survey_id link from Question uses the internal ID, which is easy to confuse with the public ID.","Some imported names are not used in this file."]},"terms":[{"term":"Foreign key","meaning":"A database rule that a value must match a row in another table."},{"term":"Relationship","meaning":"A link set up in code so that a survey can list its questions as Python objects."},{"term":"Cascade delete","meaning":"A rule that removes linked rows, such as questions, when their parent survey is deleted."},{"term":"Version snapshot","meaning":"A full saved copy of a survey at one point in time."},{"term":"Enum","meaning":"A fixed list of allowed values."}],"depends_on":["backend/database.py","backend/models/corpus.py","sqlalchemy"],"used_by":["backend/routers/surveys.py","backend/routers/agents.py","backend/agents"],"sections":[{"start":1,"end":23,"kind":"setup","name":"File setup","id":"s1","hash":"f4fb9a13d23a16af","title":"Shared setup for survey models","what":"Sets up the same database compatibility as the study models and imports the question type list from the corpus models.","why":"Keeps survey tables working on both SQLite and PostgreSQL, and reuses the shared question types.","watch_out":"The question type list comes from another file, so renaming it there will break this file on startup."},{"start":24,"end":37,"kind":"class","name":"SurveyStatus","id":"s2","hash":"cfb607ab467e821d","title":"Survey lifecycle stages","what":"Lists the stages a survey moves through, from draft, planned, authored and validating through approved, published, active, paused, completed and archived.","why":"Lets the app enforce a clear order of work so a survey is not published before it is approved.","watch_out":"Values are stored as text, so renaming one will leave existing surveys with an unknown status."},{"start":38,"end":44,"kind":"class","name":"Audience","id":"s3","hash":"bf1c14da1243bec6","title":"Audience types","what":"Lists the three audience choices for a survey: B2B (business), B2C (consumer) and Mixed.","why":"Lets the planner and author choose the right wording and sample rules for the audience.","watch_out":"Stored as text, so an unexpected audience value is rejected only if the app checks it first."},{"start":45,"end":95,"kind":"class","name":"Survey","id":"s4","hash":"2ebd7698ddeb1e40","title":"Main survey record","what":"Defines the Survey table. It holds the name, audience, owner, status, the planning spec, the written sections, validation results, readiness score, publishing details, approval details and locked sections. It also links to its list of questions.","why":"Holds the whole survey in one place so each step of the workflow can read and update the same record.","watch_out":"The sections and spec are stored as large structured blobs, so a shape change in one agent can break another without a database error."},{"start":96,"end":146,"kind":"class","name":"Question","id":"s5","hash":"b364b5e4cf36ecd0","title":"Individual survey question","what":"Defines the Question table. It stores each question's position, type, wording, answer options, scale, display logic, piped references, method details, source trace, quality scores, validation issues and lock flag.","why":"Keeps each question as its own row so it can be edited, scored and locked one at a time.","watch_out":"The survey link uses the internal ID of the survey, not its public survey ID, so code must use the right one."},{"start":147,"end":169,"kind":"class","name":"SurveyVersion","id":"s6","hash":"6eb836e0871fd8c7","title":"Survey version history","what":"Defines the SurveyVersion table. Each row stores a full snapshot of a survey, the version number, who changed it, a description, and which agent or manual step made the change.","why":"Likely reason: lets the team look back at or undo earlier versions of a survey.","watch_out":"Snapshots can grow large over time, and nothing in this file limits how many are kept."},{"start":170,"end":196,"kind":"class","name":"SurveyLogic","id":"s7","hash":"3c6fccff4bdbf3f4","title":"Survey logic rules","what":"Defines the SurveyLogic table. Each row stores a rule with a type (skip, branch, display, randomize or quota), the conditions that trigger it, the actions to take, the questions it affects, a priority and an active flag.","why":"Lets complex skip and display rules be stored as data rather than hard-coded.","watch_out":"The conditions and actions are free-form structures, so a malformed rule is saved without complaint and fails only when the survey runs."}],"explained_at":"2026-11-12T00:12:57+00:00","explained_by":"haiku","summary":"Defines the database tables for surveys, their questions, saved version history, and logic rules that control which questions appear.","purpose":"Gives the app a stored form of each survey so it can be planned, written, checked, published and tracked over time.","why":"Likely reason: a survey has many questions and rules, so they are kept as linked tables. Reason not stated in the code for the exact split.","how":"First it sets up the same SQLite and PostgreSQL compatibility as the study models. Then it defines the survey statuses and audiences. Then it defines the Survey table, which links to a list of Question rows. Then it defines the version history and the logic rule table.","inputs":"Survey data written by the planner, author, validator and publisher parts of the app.","outputs":"Database tables and Python objects for surveys, questions, versions and logic rules.","risks":"Question rows link to the survey by its internal ID, not by the public survey ID text. Mixing these up will attach questions to the wrong survey or none. Deleting a survey also deletes its questions.","debug":"If a question cannot be saved, check that its survey ID exists and that the question type is a known type. If a survey will not move to its next status, check the status values in SurveyStatus.","summary_hash":"sha256:9c2ad25466c71fa0efc0cb761ded85c035c70c6a50521cad71dd6449e2ebc2b7","fresh":true},"backend/requirements.txt":{"schema_version":1,"path":"backend/requirements.txt","language":"Configuration","lines":79,"hash":"sha256:c3be003142bfbc21bf4991e5a1ae9e5c536a2f6fa589d1d51e6a016f57c36987","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Repeated package lines can cause confusion.","Some AI library versions are old and may conflict.","Not tested here, so compatibility is unknown."]},"terms":[{"term":"Pinned version","meaning":"A package locked to one exact version number so it does not change unexpectedly."},{"term":"pip","meaning":"The Python tool that installs packages from a list."},{"term":"Torch","meaning":"A large machine learning library, used here for language models."},{"term":"Presidio","meaning":"A library that finds personal information in text so it can be removed."},{"term":"Celery","meaning":"A background job system for slow tasks."}],"depends_on":["PyPI package index"],"used_by":["backend/Dockerfile","setup_native.sh","setup_sqlite.py (writes its own smaller list)"],"sections":[{"start":1,"end":59,"kind":"setup","name":"File setup (part 1)","id":"s1","hash":"4c6c5ec7d191839c","title":"Core, database and AI package list","what":"Lists the packages for the web framework, the database, the background job system, the AI and language tools, the vector search, and the data and text tools.","why":"Each group provides a part of the platform's features.","watch_out":"Large packages here make the install slow and can fail on some computers."},{"start":60,"end":79,"kind":"setup","name":"File setup (part 2)","id":"s2","hash":"e86872523f5e5add","title":"Monitoring, utilities and testing package list","what":"Lists packages for logging and error reporting, small helpers such as environment reading, Word and Excel and PDF creation, and the testing tools.","why":"Supports the rest of the app, including exports and automated tests.","watch_out":"The testing tools are installed in production too, which adds size and risk."}],"explained_at":"2026-11-12T00:12:57+00:00","explained_by":"haiku","summary":"The list of Python packages the backend needs, each pinned to one exact version.","purpose":"Makes sure everyone installs the same package versions so the app behaves the same.","why":"Likely reason: the AI and data libraries change fast, so pinned versions prevent surprise breaks.","how":"The installer reads each line and installs that exact version. The list is grouped by purpose: the web core, the database, the background jobs, the AI libraries, the language and data tools, text handling, web requests, security, logging, utilities and testing.","inputs":"The pinned names and versions in this file.","outputs":"An installed set of Python packages in the environment.","risks":"Some packages are very large, such as torch, and some older pins may not install on new Python versions. The list repeats a few packages, such as python-multipart and httpx.","debug":"If install fails, read the first error and find which package and version it names. Check that the Python version matches the one in the Dockerfile. Try installing the failing package alone to see its message.","summary_hash":"sha256:c3be003142bfbc21bf4991e5a1ae9e5c536a2f6fa589d1d51e6a016f57c36987","fresh":true},"backend/routers/agents.py":{"schema_version":1,"path":"backend/routers/agents.py","language":"Python","lines":258,"hash":"sha256:a2c712a0ccb8289f26fa48703913d675db1f0019372a41ceabd5c7ef88988090","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"unknown","reasons":["Only six of eleven sections are visible here.","No tests were shown for these routes.","The workflow route, which is not shown here, may behave differently."]},"terms":[{"term":"Agent","meaning":"A part of the app that uses an AI model to do one job, such as planning a survey."},{"term":"Route","meaning":"A web address that the API answers when someone sends a request to it."},{"term":"Request model","meaning":"A description of the fields a route expects, which the app checks before running."},{"term":"Spec","meaning":"The written plan for a survey, such as its goal, audience and sections."},{"term":"Dependency injection","meaning":"A FastAPI way of handing each route its database session automatically."}],"depends_on":["backend/database.py","backend/agents/planner.py","backend/agents/author.py","backend/agents/validator.py","backend/agents/publisher.py","backend/models/survey.py"],"used_by":["backend/main.py","setup_and_test.sh (calls the plan route)"],"sections":[{"start":1,"end":16,"kind":"setup","name":"File setup","id":"s1","hash":"7e70fcead2a95176","title":"Imports and router setup","what":"Brings in the web tools, the database session helper, the four survey agents, the survey model, and creates the group of agent routes.","why":"Connects this file to the agents and database it needs.","watch_out":"If an agent file is renamed, this file will fail on import."},{"start":17,"end":30,"kind":"class","name":"PlanRequest","id":"s2","hash":"2d082496816d447d","title":"Planning request shape","what":"Describes the fields a planning request must or may include: the goal, audience, markets, sample size, length budget, required topics, sensitivity, languages, platform and extra context. Most have defaults.","why":"Lets the app check planning requests and fill in sensible defaults.","watch_out":"The list fields accept any content, so wrong entries are not rejected here."},{"start":31,"end":36,"kind":"class","name":"AuthorRequest","id":"s3","hash":"e6d7f98f914dd83c","title":"Authoring request shape","what":"Describes an authoring request, which carries a spec and a flag for whether to use retrieved question bank material.","why":"Gives the author agent the spec it needs and an option to use the question banks.","watch_out":"The spec is an open dictionary with no field checks."},{"start":37,"end":43,"kind":"class","name":"ValidateRequest","id":"s4","hash":"70748d695d062cb9","title":"Validation request shape","what":"Describes a validation request, which carries the survey, its spec and a strict-mode switch.","why":"Lets the validator compare the survey with its plan and check it strictly if asked.","watch_out":"The strict flag defaults to off, so validation is lenient unless the caller asks."},{"start":44,"end":50,"kind":"class","name":"PublishRequest","id":"s5","hash":"e4bd2e31cfcf77c1","title":"Publishing request shape","what":"Describes a publishing request, which carries the survey, a name and an optional description.","why":"Gives the publisher what it needs to create the live survey.","watch_out":"The survey is an open dictionary, so a missing section is not caught until publishing runs."},{"start":51,"end":82,"kind":"function","name":"plan_survey","id":"s6","hash":"0353329fa917ff59","title":"Planning route","what":"Accepts a planning request, runs the planner agent with those details, and returns its result. If the planner reports failure, it returns a server error with the reason.","why":"Gives the frontend and setup scripts a single way to get a survey plan.","watch_out":"The planner is run from this route in the same request, so a slow AI call can make the request wait for a long time."},{"start":83,"end":106,"kind":"function","name":"author_survey","id":"s7","hash":"c8492aaccdb2ec1e","title":"Author questions from a plan","what":"Takes a survey spec and asks the Author agent to write questions, optionally grounded in the document library. Returns the agent's result, or an error with status 500 if the agent fails.","why":"The docstring says questions are grounded in the corpus and adapted from templates. Likely reason: lets someone generate questions without running the full workflow.","watch_out":"When the agent fails, the caller receives the agent's error text as the error detail."},{"start":107,"end":128,"kind":"function","name":"validate_survey","id":"s8","hash":"b9c9abc02f98bd33","title":"Quality check a survey","what":"Sends a survey, its spec and a strictness flag to the Validator agent and returns its verdict, including issues and a readiness score.","why":"The docstring says it runs fixed rule checks (scales, types, policy) and language-model checks (clarity, neutrality, redundancy).","watch_out":"Unlike the other endpoints, this one never checks whether the agent succeeded, so a failure is returned as a normal result."},{"start":129,"end":153,"kind":"function","name":"publish_survey","id":"s9","hash":"5615c0342fa73244","title":"Send survey to Qualtrics","what":"Asks the Publisher agent to create the survey in Qualtrics, including its blocks, questions and flow. Returns the agent's result, or an error with status 500 if it fails.","why":"The docstring says publishing is idempotent with retry logic. Likely reason: a retry should not create a second copy of the survey.","watch_out":"This creates a real survey in an external account, so confirm the target before calling it."},{"start":154,"end":208,"kind":"function","name":"run_full_workflow (part 1)","id":"s10","hash":"0938e7d1747046e5","title":"Start full workflow and plan","what":"Creates a survey record with a generated ID, runs the planner, saves the spec, then runs the author and saves the sections. The status is saved after each step so progress is visible.","why":"The docstring says it runs all agents from research goal to published survey. Likely reason: saving after each step leaves a readable record if a later step fails.","watch_out":"Any error inside this block resets the status to draft and re-raises it as a 500 error, including planning errors that were already HTTP errors."},{"start":209,"end":258,"kind":"function","name":"run_full_workflow (part 2)","id":"s11","hash":"1fe754a50c6163d8","title":"Validate, publish and report result","what":"Runs the validator, saves its issues and score, sets the status to approved or validating, publishes only when validation passed, then returns everything.","why":"Likely reason: publishing is gated on validation so failing surveys do not reach Qualtrics.","watch_out":"If publishing fails, the survey stays approved with no Qualtrics link, yet the response still reports success as true."}],"explained_at":"2026-11-12T00:15:30+00:00","explained_by":"haiku","summary":"The API routes that start the AI agents for planning, writing, checking and publishing surveys, and a combined workflow. Only the first six sections are visible here.","purpose":"Lets the frontend or another program ask the AI agents to do their work on a survey.","why":"Likely reason: each survey stage is a separate agent, so each gets its own route.","how":"Each route receives a request with the needed details, passes them to the right agent, and returns the agent's result. If planning fails, the route returns a server error with the reason. The request shapes define which fields each route accepts.","inputs":"Request bodies such as goal, audience, markets, sample size and length budget for planning, and survey specs for the other stages.","outputs":"The agent's result as JSON, including the specification and which model was used.","risks":"Request fields such as markets and languages are loosely typed lists, so bad input is not rejected until the agent runs. Errors from the agent are passed to the user as text.","debug":"If planning returns a server error, read the detail text in the reply and check the agent logs. Check the request body fields and their types. Confirm the model list is loaded.","summary_hash":"sha256:a2c712a0ccb8289f26fa48703913d675db1f0019372a41ceabd5c7ef88988090","fresh":true},"backend/routers/corpus.py":{"schema_version":1,"path":"backend/routers/corpus.py","language":"Python","lines":155,"hash":"sha256:b31edec6ba139631586b48be2fb03dbfe803810a22d3d7218197c99351af2d53","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No tests are visible.","The upload route has no handling for files that are not UTF-8.","There is no access control.","The upload route returns 200 while the create route returns 201."]},"terms":[{"term":"endpoint","meaning":"A web address a program can call to ask the app for data or to send it data."},{"term":"router","meaning":"A group of endpoints attached to the app as one unit."},{"term":"request model","meaning":"A template that checks incoming data has the right fields and types before the code runs."},{"term":"corpus","meaning":"The stored library of documents the app can draw on."},{"term":"ingestion","meaning":"The process of taking a document in and preparing it for search and use."},{"term":"UTF-8","meaning":"A common way of storing text as bytes so letters from many languages display correctly."}],"depends_on":["backend/database.py","backend/models/corpus.py","backend/services/document_ingestion.py"],"used_by":[],"sections":[{"start":1,"end":13,"kind":"setup","name":"File setup","id":"s1","hash":"e93cf1da795128bd","title":"Imports and router setup","what":"Brings in the web framework tools, the database session, the document types and the ingestion service, then creates the router that holds the corpus routes.","why":"Likely reason: the main app needs one router object to attach these routes.","watch_out":"The imported names must match the modules they come from, or the app will fail at startup."},{"start":14,"end":28,"kind":"class","name":"DocumentCreate","id":"s2","hash":"04bc88610de68549","title":"Document upload request shape","what":"Defines the fields a caller sends to add a document: title, type, text, priority, and tag lists. Some fields are optional and have default values.","why":"Likely reason: the request model rejects badly formed input before the route runs.","watch_out":"The priority number has no range limit, and the policy tags field accepts any content."},{"start":29,"end":42,"kind":"class","name":"DocumentResponse","id":"s3","hash":"90a6090209808ee3","title":"Document summary sent back","what":"Defines the fields returned for a document: ID, title, type, version, use cases, audiences and creation time. The full text is not included.","why":"Likely reason: keeps responses small and avoids sending whole documents back.","watch_out":""},{"start":43,"end":80,"kind":"function","name":"create_document","id":"s4","hash":"3c1a9597264e5842","title":"Add document to corpus","what":"Passes the submitted document to the ingestion service and returns a summary with a 201 created status.","why":"The docstring says ingestion prepares documents for retrieval. Likely reason: the route stays thin and the service holds the work.","watch_out":"Ingestion runs inside the request, so a large document could make the response slow."},{"start":81,"end":103,"kind":"function","name":"get_document","id":"s5","hash":"fd58e9ac0367b116","title":"Fetch one document","what":"Looks up a document by ID and returns its summary, or a 404 error if none is found.","why":"Reason not stated in the code.","watch_out":""},{"start":104,"end":132,"kind":"function","name":"list_documents","id":"s6","hash":"c8cf4469a1b900af","title":"List documents with filters","what":"Returns documents, optionally narrowed by type, use case or audience.","why":"Likely reason: lets someone browse what is in the library.","watch_out":"Filters are exact text matches, so a typo returns an empty list rather than an error."},{"start":133,"end":155,"kind":"function","name":"upload_document","id":"s7","hash":"842dd30d42e54e63","title":"Upload a text file","what":"Accepts an uploaded file, reads it as text, adds it to the library using the file name as the title, and returns the new ID with a success message.","why":"Likely reason: gives a way to add documents without building a JSON request.","watch_out":"Files that are not UTF-8 fail while decoding, and the code does not handle that case. This route also sets no use cases or audiences."}],"explained_at":"2026-11-12T00:15:30+00:00","explained_by":"haiku","summary":"Defines the web addresses that let other programs add, look up, list and upload documents in the question and policy library.","purpose":"Gives the app a way to store document content so it can be used later when writing surveys.","why":"Reason not stated in the code beyond the file docstring. Likely reason: keeps document handling separate from surveys and models.","how":"Defines the request and response shapes. Each route checks its input, calls the ingestion service in the DocumentIngestionService class, and returns a summary.","inputs":"A title, document type, text content, version, priority number, and tag lists for use cases, audiences, categories, topics and policy. Also an uploaded file, and optional filters by type, use case or audience.","outputs":"Document summaries with ID, title, type, version, use cases, audiences and creation time. An upload returns an ID and a success message. Missing documents return a 404 error.","risks":"Upload assumes the file is UTF-8 text and has no handling for other encodings. Filters match plain text exactly. The priority number has no range check. No login or ownership check is visible.","debug":"Confirm the database and ingestion service are running. For failed creates, check DocumentIngestionService. For upload errors, test with a plain UTF-8 text file. For empty lists, check filter spelling.","summary_hash":"sha256:b31edec6ba139631586b48be2fb03dbfe803810a22d3d7218197c99351af2d53","fresh":true},"backend/routers/models.py":{"schema_version":1,"path":"backend/routers/models.py","language":"Python","lines":306,"hash":"sha256:dd889063fedcb61340a9e8f34fb04d5435a46754c259b5b0a68518c5aeb241e8","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Authentication is marked TODO.","The update route accepts any field without checks.","No tests are visible.","A plain GET request writes to the database on first use."]},"terms":[{"term":"provider","meaning":"The company or service that hosts the model."},{"term":"temperature","meaning":"A setting that controls how varied a model's answers are. Lower values give steadier answers."},{"term":"open-source model","meaning":"A model whose code and weights are free to download and run on your own machine."},{"term":"catalogue","meaning":"The stored list of known models with their details. Also called the registry."},{"term":"API key","meaning":"A secret code that proves to a paid service that a request is allowed to use it."},{"term":"VRAM","meaning":"Graphics memory on a computer, which limits how large a model can run locally."}],"depends_on":["backend/database.py","backend/models/model_config.py","backend/services/model_manager.py"],"used_by":[],"sections":[{"start":1,"end":13,"kind":"setup","name":"File setup","id":"s1","hash":"5fe6c9c1dad1a3f5","title":"Imports and router setup","what":"Brings in the web framework tools, database session, model data types and the model manager, then creates the router for model routes.","why":"Likely reason: the main app needs one router object for these routes.","watch_out":"Renaming any imported model type breaks the routes that use it."},{"start":14,"end":26,"kind":"class","name":"ModelConfigCreate","id":"s2","hash":"37d00a8814bf4f18","title":"Model setup request shape","what":"Defines what a caller sends to set up a model for a task: task, kind, provider, model name, optional key and address, temperature, length limit and default flag.","why":"Likely reason: names the choices a user must make for each task.","watch_out":"The API key is sent in the request body, so requests should only travel over a secure connection. Temperature has no range check here."},{"start":27,"end":44,"kind":"class","name":"ModelConfigResponse","id":"s3","hash":"1ddc8b460788adc2","title":"Model setup summary returned","what":"Defines the fields returned for a saved setup, including usage figures such as call count, average speed and success rate. The API key is not returned.","why":"Likely reason: keeps the key secret while still showing status.","watch_out":"The usage figures are only as accurate as the code that updates them, which is not shown here."},{"start":45,"end":69,"kind":"class","name":"ModelRegistryResponse","id":"s4","hash":"85046ae77f21d2d4","title":"Model catalogue entry shape","what":"Defines the fields for one catalogue entry: name, provider, description, suitable tasks, limits, approximate costs, hardware needs and documentation link.","why":"Likely reason: lets users compare models before choosing one.","watch_out":"Cost and quality figures are stored values. Where they come from is not visible here."},{"start":70,"end":113,"kind":"function","name":"create_model_config","id":"s5","hash":"915c605bcaebaf1d","title":"Create a model setup","what":"Passes a new setup to the model manager and returns its summary with a 201 created status.","why":"Likely reason: the route stays thin and the manager holds the logic.","watch_out":"The creator is fixed to system with a TODO, so every setup appears to be made by the system."},{"start":114,"end":147,"kind":"function","name":"list_model_configs","id":"s6","hash":"0fb556cf6673846c","title":"List model setups","what":"Returns saved setups, optionally filtered by organization, task or kind.","why":"Reason not stated in the code.","watch_out":"The filters are passed to the manager unchecked, so their behavior is not visible here."},{"start":148,"end":202,"kind":"function","name":"list_available_models","id":"s7","hash":"68107a5146902e12","title":"Browse model catalogue","what":"Returns catalogue entries, optionally filtered by task, kind or provider. If the catalogue is empty, it is filled with defaults first.","why":"Likely reason: a fresh install still has something to show.","watch_out":"A GET request writes to the database the first time, which can surprise people who expect reads to be harmless."},{"start":203,"end":256,"kind":"function","name":"get_task_recommendations","id":"s8","hash":"88033618c08d9787","title":"Best models for one task","what":"For one task, returns up to three open-source and up to three paid models, with quality and cost details.","why":"The docstring says results are sorted by quality. The sorting happens in the manager, which is not shown. The three-item cap is probably there to keep the list short.","watch_out":"The cap applies after the manager's order, so the ranking is only as good as the manager."},{"start":257,"end":273,"kind":"function","name":"update_model_config","id":"s9","hash":"6a67252d88c428bb","title":"Change a model setup","what":"Applies every field sent in the request to a saved setup and reports success. Returns not found if the setup does not exist.","why":"Reason not stated in the code.","watch_out":"Any field name is passed through without an allowed list, so a caller could change the API key or usage figures."},{"start":274,"end":289,"kind":"function","name":"delete_model_config","id":"s10","hash":"70a4fe55521daca5","title":"Turn off a model setup","what":"Marks a setup as inactive instead of deleting it.","why":"Likely reason: keeps the record of past calls and results.","watch_out":"Whether lists hide inactive setups is decided in the manager, which is not shown here."},{"start":290,"end":306,"kind":"function","name":"initialize_registry","id":"s11","hash":"3ea54ecdd49cd791","title":"Fill the model catalogue","what":"Asks the manager to fill the catalogue with default models, then reports how many entries exist.","why":"The docstring says to run it once during setup.","watch_out":"The route itself does not check for existing entries, so repeat calls may add duplicates depending on the manager."}],"explained_at":"2026-11-12T00:15:30+00:00","explained_by":"haiku","summary":"Defines the web addresses for creating, listing, changing, turning off and browsing model setups and model recommendations.","purpose":"Lets a user choose which language model each task uses and see the options available.","why":"Likely reason: model choices should change without editing code.","how":"Defines request and response shapes. Each route hands the work to the ModelManager class. Browse routes fill the catalogue first if it is empty.","inputs":"Task name, model kind, provider, model name, optional API key and address, temperature, length limit, default flag, organization filter, config ID, and arbitrary update fields.","outputs":"Setup summaries, catalogue entries, recommendation lists, success messages, and not found errors.","risks":"The API key travels in the request body and is stored. The update route accepts any field name. The creator is always set to system. There is no authentication. Browse routes write to the database.","debug":"If lists are empty, run the catalogue initialization route. Check that task names match the ModelTask values exactly. Check that a key is set for providers that need one. Look in ModelManager for the underlying logic.","summary_hash":"sha256:dd889063fedcb61340a9e8f34fb04d5435a46754c259b5b0a68518c5aeb241e8","fresh":true},"backend/routers/studies.py":{"schema_version":1,"path":"backend/routers/studies.py","language":"Python","lines":149,"hash":"sha256:285fe715befcbdea783f8786291d0c77b5daa49301acc0845203891110c461b1","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The analytics report is a placeholder with TODO notes.","Authentication is marked TODO.","No tests are visible.","Nothing in this file sets the ready status that launch requires."]},"terms":[{"term":"status","meaning":"The stage a study or survey is in, such as planning, ready or running."},{"term":"sample size","meaning":"How many people the study aims to collect responses from."},{"term":"schema (request)","meaning":"The agreed shape of data a caller must send."},{"term":"run ID","meaning":"An identifier for one active run of a study."}],"depends_on":["backend/database.py","backend/models/study.py"],"used_by":[],"sections":[{"start":1,"end":13,"kind":"setup","name":"File setup","id":"s1","hash":"76c74048fb3ddfec","title":"Imports and router setup","what":"Brings in the web framework tools, database session, study data types and date tools, then creates the router for study routes.","why":"Likely reason: the main app needs one router object for these routes.","watch_out":""},{"start":14,"end":25,"kind":"class","name":"StudyCreate","id":"s2","hash":"13d4ea526f89665e","title":"New study request fields","what":"Describes what a new study needs: name, description, study type, optional survey link, target audience data, sample size, markets and languages. Markets default to US and languages to EN.","why":"Likely reason: the defaults cover the most common case.","watch_out":"Target audience is free-form data. Other code may depend on its keys, which this file does not check."},{"start":26,"end":40,"kind":"class","name":"StudyResponse","id":"s3","hash":"9a3bc175e39c3fe6","title":"Study summary returned","what":"Defines the summary fields returned for a study: ID, name, type, status, target size, response counts and creation time.","why":"Likely reason: keeps responses to a fixed set of fields.","watch_out":""},{"start":41,"end":78,"kind":"function","name":"create_study","id":"s4","hash":"49d7e3825badd0b1","title":"Create a new study","what":"Saves a new study in planning status with a generated ID and returns its summary with a 201 created status.","why":"Likely reason: new studies start in planning so nothing goes live before it is set up.","watch_out":"The creator is fixed to system with a TODO."},{"start":79,"end":101,"kind":"function","name":"get_study","id":"s5","hash":"f706ac6127465f1e","title":"Fetch one study","what":"Returns the summary for a study ID, or a not found error.","why":"Reason not stated in the code.","watch_out":""},{"start":102,"end":126,"kind":"function","name":"launch_study","id":"s6","hash":"1f6eafd1ca168090","title":"Start a study running","what":"Starts a study only when it is ready. Marks it running, records the launch time and returns a run ID.","why":"Likely reason: a study should not go live before it is ready.","watch_out":"The run ID is the study ID itself, so there is no separate run record. The code does not say why."},{"start":127,"end":149,"kind":"function","name":"get_study_report","id":"s7","hash":"ab4b4aea1b2846c9","title":"Study progress report (partial)","what":"Returns the study name, status and a progress percentage of responses collected against the target. The analytics sections are empty.","why":"The TODO notes show the full report is not built yet.","watch_out":"The percentage is only computed when the target is above zero, and the rest of the report is empty."}],"explained_at":"2026-11-12T00:15:30+00:00","explained_by":"haiku","summary":"Defines the web addresses for creating, reading, launching and reporting on research studies.","purpose":"Lets a user set up a study, start it once it is ready, and check its progress.","why":"Likely reason: a study moves through set stages, and these routes control those stages.","how":"Defines request and response shapes. Creating saves a new planning-stage study. Launching checks for ready status, then marks it running and records the time. The report route reads the stored counts.","inputs":"Study name, description, study type, optional survey link, target audience data, sample size, markets, languages, and a study ID.","outputs":"Study summaries, a launch message with a run ID, a progress report, and not found or bad-status errors.","risks":"Launching is refused unless the study is ready, but nothing in this file sets a study to ready. The report is partial. The creator is fixed to system. Target audience data is not checked.","debug":"If launch fails, check the study status first. If a report shows zero progress, check that the completed count is being updated elsewhere. Check that the study ID is correct.","summary_hash":"sha256:285fe715befcbdea783f8786291d0c77b5daa49301acc0845203891110c461b1","fresh":true},"backend/routers/surveys.py":{"schema_version":1,"path":"backend/routers/surveys.py","language":"Python","lines":135,"hash":"sha256:49b04d2c51226ef0aae33a38454cfc050fb15721dd76f976904f8e7a52922865","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Status can be set directly, bypassing workflow checks.","Authentication is marked TODO.","No tests are visible."]},"terms":[{"term":"spec","meaning":"The plan describing what a survey should cover."},{"term":"draft","meaning":"A survey that is still being prepared and has not gone out."},{"term":"readiness score","meaning":"A number showing how ready a survey is, from the validation checks."},{"term":"allowlist","meaning":"A fixed list of fields that are permitted to change."}],"depends_on":["backend/database.py","backend/models/survey.py"],"used_by":[],"sections":[{"start":1,"end":13,"kind":"setup","name":"File setup","id":"s1","hash":"0515bd25fdb3e37f","title":"Imports and router setup","what":"Brings in the web framework tools, database session, survey data types and date tools, then creates the router for survey routes.","why":"Likely reason: the main app needs one router object for these routes.","watch_out":""},{"start":14,"end":21,"kind":"class","name":"SurveyCreate","id":"s2","hash":"65df3d31cf78dc9f","title":"New survey request fields","what":"Describes a new survey: name, optional description, audience type and optional spec.","why":"Likely reason: the spec is optional so a survey can be created before planning.","watch_out":"The spec is free-form and is not checked here."},{"start":22,"end":35,"kind":"class","name":"SurveyResponse","id":"s3","hash":"e58ad8eae462e4f3","title":"Survey summary returned","what":"Defines the fields returned for a survey, including ID, name, audience, status, creation time and Qualtrics links.","why":"Likely reason: lets a user see the publish state at a glance.","watch_out":"The Qualtrics fields stay empty until publishing has happened."},{"start":36,"end":68,"kind":"function","name":"create_survey","id":"s4","hash":"d392de2c7e47d2e2","title":"Create a new survey","what":"Creates a draft survey with a generated ID and returns its summary with a 201 created status.","why":"Likely reason: drafts keep unreviewed surveys from going out.","watch_out":"The creator is fixed to system with a TODO."},{"start":69,"end":90,"kind":"function","name":"get_survey","id":"s5","hash":"27453ceca427fec2","title":"Fetch one survey","what":"Returns the summary for a survey ID, or a not found error.","why":"Reason not stated in the code.","watch_out":""},{"start":91,"end":111,"kind":"function","name":"get_survey_guide","id":"s6","hash":"e7012fcf382ea9f6","title":"Full survey details","what":"Returns the spec, sections, validation results and readiness score for a survey in one response.","why":"Likely reason: gives one place to review everything about a survey.","watch_out":"Sections are returned as last saved. Nothing here checks that they still match the spec."},{"start":112,"end":135,"kind":"function","name":"update_survey","id":"s7","hash":"6fe6a5a6a8a46f8e","title":"Edit survey fields","what":"Changes only the name, description, spec, sections and status fields, then records the update time.","why":"Likely reason: an allowed list stops callers from changing other fields such as the ID.","watch_out":"Status is editable, so a caller can mark a survey published or approved without the workflow checks."}],"explained_at":"2026-11-12T00:15:30+00:00","explained_by":"haiku","summary":"Defines the web addresses for creating, reading, reviewing and editing survey records.","purpose":"Lets a user create a survey, look it up, see its full details, and change selected fields.","why":"Likely reason: new surveys start as drafts so that nothing goes out before review.","how":"Defines request and response shapes. Creating saves a draft. Reading looks up the stored record. The guide route returns the spec, sections and checks together. Updating changes only the allowed fields.","inputs":"Survey name, description, audience type, optional spec, a survey ID, and a dictionary of fields to update.","outputs":"Survey summaries, a full guide with spec, sections, validation results and readiness score, and a success
