 message after an update.","risks":"Status is an editable field, so a caller can set a survey to approved or published without the workflow checks. Spec is not validated. The creator is fixed to system.","debug":"If a survey is missing, check the ID. If the guide shows no sections, the workflow may not have finished. If a status change looks wrong, check the update route first.","summary_hash":"sha256:49b04d2c51226ef0aae33a38454cfc050fb15721dd76f976904f8e7a52922865","fresh":true},"backend/services/chunking.py":{"schema_version":1,"path":"backend/services/chunking.py","language":"Python","lines":189,"hash":"sha256:560fb098f51c77c582e520c5048a003f3ff4839ed8a65c75d2c5778969804aa3","area":"backend-services","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No tests are visible for any splitter.","Size limits are not applied to templates, questions, or past surveys.","Question parsing always returns a result, so the empty check in the caller never removes anything."]},"terms":[{"term":"chunk","meaning":"a small piece of a larger document, sized for search"},{"term":"regular expression","meaning":"a pattern used to find text that matches a shape, such as a question number"},{"term":"document type","meaning":"the category a file belongs to, such as question bank or policy"}],"depends_on":["models.corpus","re"],"used_by":["backend/services/document_ingestion.py"],"sections":[{"start":1,"end":6,"kind":"setup","name":"File setup","id":"s1","hash":"68238d0a450ca637","title":"Imports and module purpose","what":"Describes the file as document chunking methods and brings in the pattern tools, type hints, and document type list.","why":"Needed to find question markers and to know each document type.","watch_out":"Depends on models.corpus, so renaming a document type there breaks this file."},{"start":7,"end":39,"kind":"function","name":"chunk_document","id":"s2","hash":"d5e34f4ca62e2a21","title":"Pick splitter by document type","what":"Looks at the document type and sends the text to the matching splitter, falling back to paragraph grouping for other types.","why":"Different documents need different splitting rules.","watch_out":"The size limit is passed on only to some splitters, so it does not apply to every type."},{"start":40,"end":68,"kind":"function","name":"chunk_question_bank","id":"s3","hash":"9278b4865486a15c","title":"Split question banks into questions","what":"Finds markers such as Q1 or double hash marks and cuts the text into one piece per question. Without markers, it splits on blank lines.","why":"Each question should be its own searchable piece.","watch_out":"The blank-line fallback can turn ordinary paragraphs into questions."},{"start":69,"end":109,"kind":"function","name":"parse_question_chunk","id":"s4","hash":"f9f16e04b53126d8","title":"Read labels from one question","what":"Reads the optional type, scale, and topic labels from one question, removes the type tag from the text, and records the first real line as the example.","why":"Labels are stored separately so they can be searched.","watch_out":"This function always returns a result, so the caller's check for empty results never removes any piece."},{"start":110,"end":118,"kind":"function","name":"chunk_template","id":"s5","hash":"4e82a8e6e9d33389","title":"Keep template as one piece","what":"Returns the entire template as one chunk with its metadata.","why":"Likely reason: templates are complete forms, and splitting would break them.","watch_out":"A very long template becomes one large piece with no size limit."},{"start":119,"end":155,"kind":"function","name":"chunk_method_guide","id":"s6","hash":"0a977c672728f6b6","title":"Split guides by section headings","what":"Splits the guide at second and third level headings, then splits any long section by paragraphs up to the size limit.","why":"Keeps each topic together while keeping pieces small enough to search.","watch_out":"The split removes the heading marker, so each piece starts with the heading words alone."},{"start":156,"end":165,"kind":"function","name":"chunk_policy","id":"s7","hash":"16456d584b5f6a1a","title":"Policies use the guide splitter","what":"Passes policy text to the same heading-based splitter used for method guides.","why":"Likely reason: policies are organized much like guides.","watch_out":"Any change to guide splitting also changes how policies are split."},{"start":166,"end":171,"kind":"function","name":"chunk_past_survey","id":"s8","hash":"0a593ea4ff6e5ca5","title":"Past surveys use the question splitter","what":"Passes past surveys to the question bank splitter.","why":"Past surveys are lists of questions as well.","watch_out":"The size limit is not used here, the same as for question banks."},{"start":172,"end":189,"kind":"function","name":"chunk_semantic","id":"s9","hash":"38cbdc174a1901e8","title":"Generic paragraph splitter","what":"Groups paragraphs into chunks up to the size limit. Used for any document type not listed.","why":"Gives a sensible default for unknown types.","watch_out":"A single paragraph longer than the limit becomes an oversized chunk on its own."}],"explained_at":"2026-11-12T00:07:16+00:00","explained_by":"haiku","summary":"Splits uploaded documents into smaller pieces, using a method that fits each document type.","purpose":"Makes documents searchable in small units so the AI can find the right passage.","why":"Search and embedding work better on focused pieces than on whole files.","how":"chunk_document reads the document type and sends the text to a matching splitter. Question banks and past surveys are split by question. Method guides and policies are split by headings and paragraphs. Templates stay whole. Other types use paragraph grouping.","inputs":"The document text, its type, optional metadata, and a maximum chunk size.","outputs":"A list of pieces, each with content, type labels, scale, topics, and an example line where found.","risks":"Size limits are ignored for some types, so long templates or questions can become very large pieces. Question detection depends on the format of the text, so differently formatted files may be split wrongly.","debug":"Check the document's layout first, especially question markers and heading markers. Then test chunk_document on a sample text and inspect the piece count and lengths.","summary_hash":"sha256:560fb098f51c77c582e520c5048a003f3ff4839ed8a65c75d2c5778969804aa3","fresh":true},"backend/services/document_ingestion.py":{"schema_version":1,"path":"backend/services/document_ingestion.py","language":"Python","lines":211,"hash":"sha256:2e93f8a9f564b28f961443092295bdf45e505142e59c3ab5903139c30de3d4b2","area":"backend-services","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Only part of the file was reviewed, so the later update and list functions are not covered here.","No error handling around embedding calls.","Document-level topics are usually overridden by the empty topic list from each chunk.","No duplicate check or tests are visible."]},"terms":[{"term":"embedding","meaning":"a list of numbers that represents the meaning of a piece of text, so similar text can be found"},{"term":"session","meaning":"the open connection to the database used to read and save records"},{"term":"commit","meaning":"the step that makes saved changes permanent in the database"},{"term":"chunk record","meaning":"a database row that stores one piece of a document along with its embedding"}],"depends_on":["models.corpus","services.embeddings","services.chunking","sqlalchemy"],"used_by":[],"sections":[{"start":1,"end":11,"kind":"setup","name":"File setup","id":"s1","hash":"ac43f3e28482d7a7","title":"Imports for ingestion","what":"Brings in the ID tool, date and type helpers, the database session type, document and chunk models, the embedding service, and the chunking function.","why":"Lets this service save documents and create their chunks.","watch_out":"Relies on one shared embedding service, so any setup problem there appears here."},{"start":12,"end":57,"kind":"class","name":"DocumentIngestionService (part 1)","id":"s2","hash":"2a2b8550b5dff6e5","title":"Start a new document","what":"Creates the service with a database session and builds a unique ID for each document from its type and random characters.","why":"Unique IDs let each document be found later even if titles match.","watch_out":"No check for an existing document with the same content is visible, so repeat uploads create copies."},{"start":58,"end":102,"kind":"class","name":"DocumentIngestionService (part 2)","id":"s3","hash":"9a73283151a65449","title":"Save document record","what":"Fills the document record with the title, type, version, priority, tags, and content, then saves and reloads it before splitting.","why":"Likely reason: the document must exist before its chunks can point to it.","watch_out":"If splitting fails afterward, the document stays saved without chunks."},{"start":103,"end":137,"kind":"class","name":"DocumentIngestionService (part 3)","id":"s4","hash":"fbb0d07ec2105526","title":"Split and embed each piece","what":"Splits the content, creates an embedding for each piece, and saves each as a chunk record with its type and labels when they are valid.","why":"Embeddings let search match pieces by meaning.","watch_out":"Each piece takes the topic list from its own labels first, so document-level topics are usually ignored. Errors in the embedding call are not caught here."},{"start":138,"end":188,"kind":"method","name":"DocumentIngestionService: update_document","id":"s5","hash":"0abcf0cb1df86295","title":"Updating and deprecating documents","what":"Changes the saved fields of one document, identified by its document ID. If the text content changed, it deletes the old pieces of that document and rebuilds them with fresh embeddings. The same section also holds a function that marks a document as deprecated and inactive, and a function that fetches one document by ID.","why":"Likely reason: re-embedding only when the text changes avoids paying for embedding calls when only metadata such as audience or use case is edited. Reason for the deprecation function not stated in the code.","watch_out":"Any key passed in that is not a real field on the document is silently ignored, so a typo in a field name will not raise an error."},{"start":189,"end":211,"kind":"method","name":"DocumentIngestionService: list_documents","id":"s6","hash":"267f506fbeb5c0e8","title":"Listing active documents with filters","what":"Returns documents, newest first, optionally narrowed by document type, use case, and audience. By default it only returns documents that are still active, so deprecated documents are hidden from lists.","why":"Lets the app show the document library and pick documents for a given use case or audience without loading everything.","watch_out":"Passing active_only as false is the only way to see deprecated documents, and callers must remember that."}],"explained_at":"2026-11-12T00:08:40+00:00","explained_by":"haiku","summary":"Saves an uploaded document to the database, splits it into chunks, and stores an embedding for each chunk.","purpose":"Puts documents into the corpus so the survey agents can search them later.","why":"Saving the document first gives each chunk a parent record to point to.","how":"ingest_document creates a unique ID and a document record, saves it, then calls the chunk and embed step. That step splits the text, creates an embedding for each piece, saves each piece, and commits them together.","inputs":"Document text, document type, title, version, priority, tags, audiences, categories, and an optional uploader name.","outputs":"A saved document record, plus chunk records in the database, each with an embedding.","risks":"The document is saved before chunks are created, so a failure part way leaves a document with missing chunks. Each embedding call is not wrapped in error handling. Re-uploading the same file creates a duplicate because no check exists.","debug":"If search finds nothing for a document, check whether chunk records exist for its ID. Then check the embedding step for errors and the chunk split for empty output.","summary_hash":"sha256:2e93f8a9f564b28f961443092295bdf45e505142e59c3ab5903139c30de3d4b2","fresh":true},"backend/services/embeddings.py":{"schema_version":1,"path":"backend/services/embeddings.py","language":"Python","lines":44,"hash":"sha256:32c62c857b7fbbe4fbc884baa9529e2dc67907ac1e9dec358f4410b4d617c57a","area":"backend-services","status":"explained","summary_stale":false,"readiness":{"status":"unknown","reasons":["Only the imports were included for review, so the service class cannot be judged.","No tests are visible."]},"terms":[{"term":"embedding","meaning":"a list of numbers that represents the meaning of a piece of text"},{"term":"OpenAI library","meaning":"the code package used to call OpenAI's services"},{"term":"hashing","meaning":"turning data into a short fixed fingerprint, often used for caching"}],"depends_on":["openai","config"],"used_by":["backend/services/document_ingestion.py"],"sections":[{"start":1,"end":8,"kind":"setup","name":"File setup","id":"s1","hash":"97353f4aa360d03b","title":"Imports for embedding service","what":"Brings in the OpenAI library, app settings, and tools for hashing and JSON.","why":"Likely reason: hashing and JSON suggest the service caches results, but the class is not shown.","watch_out":"Settings must load correctly when this file is imported, so missing configuration fails early."},{"start":9,"end":44,"kind":"class","name":"EmbeddingService","id":"s2","hash":"4108bb29f554f11d","title":"Turning text into number lists","what":"Converts text into a list of numbers (an embedding) that captures its meaning, so similar texts get similar numbers. It only works with the OpenAI provider and raises an error for any other provider. A single shared instance is created when the file loads, so the rest of the app uses the same settings.","why":"Retrieval needs embeddings to measure how close a question is to stored document pieces. The shared instance avoids rebuilding the settings on every call.","watch_out":"The OpenAI calls here use a module-level style that the current OpenAI library may not provide, so this path has likely not been run and may fail on first use."}],"explained_at":"2026-11-12T00:08:40+00:00","explained_by":"haiku","summary":"Module that turns text into embeddings, which are number lists used for meaning-based search.","purpose":"Gives the rest of the backend one place to create embeddings.","why":"Keeps the embedding provider choice in one file.","how":"The file imports the OpenAI library, the app settings, and tools for hashing and JSON. The service class itself is not visible in this review.","inputs":"Text to embed and the settings in the config module.","outputs":"Embedding number lists, as far as this part shows.","risks":"Only the imports were reviewed, so the actual embedding and any caching behavior are unknown. Missing settings would stop the file from loading.","debug":"If embeddings fail, check the API key and provider settings in config, then look at the service class, which was not reviewed.","summary_hash":"sha256:32c62c857b7fbbe4fbc884baa9529e2dc67907ac1e9dec358f4410b4d617c57a","fresh":true},"backend/services/llm_provider.py":{"schema_version":1,"path":"backend/services/llm_provider.py","language":"Python","lines":361,"hash":"sha256:5caacaa0ad1a2ea64b1c7a3c919e5d114fbbe759ce5e6e2fb6034ae56799a2fa","area":"backend-services","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Several providers are placeholders that raise errors for embeddings or completions.","The Google key is placed in the web address, which can leak into logs.","No tests or error-handling checks are visible in this file."]},"terms":[{"term":"API","meaning":"a doorway other programs use to ask this app or an outside service for data"},{"term":"Provider","meaning":"an AI company or local server that supplies the model"},{"term":"Embedding","meaning":"a list of numbers that represents the meaning of a piece of text"},{"term":"JSON mode","meaning":"a setting that asks the model to reply with machine-readable JSON"},{"term":"Factory","meaning":"a helper that builds the right provider object from a name"},{"term":"Retry","meaning":"trying a failed request again after a short wait"},{"term":"Token","meaning":"a small chunk of text that AI services count and charge for"}],"depends_on":["openai","anthropic","httpx","tenacity"],"used_by":["backend/services/model_manager.py"],"sections":[{"start":1,"end":10,"kind":"setup","name":"File setup","id":"s1","hash":"8b89702c10702193","title":"Imports and setup","what":"Brings in the libraries used to talk to AI services, retry failed calls, and measure time. It has no visible effect on the user beyond making the rest of the file work.","why":"Each provider needs its own client library and the shared retry and timing tools.","watch_out":""},{"start":11,"end":41,"kind":"class","name":"LLMProvider","id":"s2","hash":"eab11bde687a0827","title":"Shared provider blueprint","what":"Defines the required shape every provider must follow: a completion method and an embedding method. Any provider that does not implement both cannot be created.","why":"Lets the rest of the app treat all providers the same way.","watch_out":""},{"start":42,"end":95,"kind":"class","name":"OpenAIProvider","id":"s3","hash":"57fa9fb1529bd69e","title":"OpenAI provider","what":"Sends prompts to OpenAI chat models and returns the text with token counts and timing. It can ask for JSON output, and it also provides embeddings using a default embedding model.","why":"OpenAI is the main provider the app is set up for, so it is the most complete.","watch_out":"The embedding model name is chosen separately here and in other files, so changing one may not change the others."},{"start":96,"end":149,"kind":"class","name":"AnthropicProvider","id":"s4","hash":"20a0d32fb3302ca5","title":"Anthropic (Claude) provider","what":"Sends prompts to Claude models. Because Claude has no built-in JSON mode, it adds an instruction to the system prompt asking for JSON only. It does not provide embeddings.","why":"Gives the app a second strong text model option.","watch_out":"The JSON request is only a wording instruction, so the reply can still include extra text that breaks JSON parsing."},{"start":150,"end":209,"kind":"class","name":"GoogleProvider","id":"s5","hash":"7f89d65824927025","title":"Google Gemini provider","what":"Sends prompts to Gemini through a web request and reads back the text, token counts and finish reason. It supports a JSON response setting. Embeddings are not available yet.","why":"Offers Google models as another option. Reason for sending the key in the web address is not stated in the code.","watch_out":"The key is placed in the web address, so any log of web requests can expose it."},{"start":210,"end":266,"kind":"class","name":"OllamaProvider (part 1)","id":"s6","hash":"b9463247e50c4707","title":"Local Ollama provider","what":"Sends chat messages to a model running on the user's own machine through Ollama and returns the reply with token counts. It waits up to five minutes for a reply, which suits slow local models.","why":"Lets the app run open-source models without sending data to an outside company.","watch_out":"Default model and address assume a local Ollama server on the standard port, so a missing server gives a connection error."},{"start":267,"end":286,"kind":"method","name":"OllamaProvider: embed","id":"s7","hash":"55c585170f1c4225","title":"Ollama embeddings","what":"Turns each text into an embedding by asking the local Ollama server one text at a time. It returns the list of number lists in the same order as the input.","why":"Lets embeddings run locally. Reason for one request per text is not stated in the code.","watch_out":"The default embedding model here differs from the default chat model, so both must be installed in Ollama."},{"start":287,"end":328,"kind":"class","name":"HuggingFaceProvider","id":"s8","hash":"f6e2c8c6de580624","title":"HuggingFace provider","what":"Gets embeddings from the HuggingFace inference web service, one text at a time, and requires an API key. Text completion is not implemented and raises an error telling the user to use Ollama or vLLM.","why":"Offers an open-source embedding option without running a model locally.","watch_out":"The web address used here may be outdated, and the model name must be set or requests will fail."},{"start":329,"end":361,"kind":"class","name":"LLMProviderFactory","id":"s9","hash":"57644bbea359c7d7","title":"Provider factory","what":"Picks the right provider class from a name such as openai or ollama, filling in a default model and address when none is given. An unknown name raises an error. The result is what the rest of the app uses to talk to an AI service.","why":"Keeps the choice of provider in one place so other files do not need to know the details.","watch_out":"Some names the factory accepts, such as cohere or local, are not handled here, so they raise an error."}],"explained_at":"2026-11-12T00:08:40+00:00","explained_by":"haiku","summary":"Gives the rest of the app one common way to ask different AI services (OpenAI, Anthropic, Google, Ollama, HuggingFace) for text completions and embeddings.","purpose":"Hides the differences between AI companies so the agents only call one interface and can switch providers through settings or a database entry.","why":"Each provider has its own request format, key handling and response shape. A shared interface with a factory keeps that difference in one file.","how":"A factory picks a provider by name and fills in a default model if none is given. Each provider builds its own request, sends it, measures how long it took, and returns the same result shape with the text and token counts. Completion calls retry up to three times with growing waits when they fail. Providers that cannot do something raise a clear error instead.","inputs":"A provider name, an API key where needed, a model name, and for Ollama a base address. Completion calls take a prompt, an optional system instruction, a temperature, a maximum output length, and a flag asking for JSON.","outputs":"A dictionary holding the generated text, prompt token count, completion token count, latency in milliseconds, and the finish reason. Embedding calls return lists of numbers.","risks":"The Google API key is sent as a web address parameter, which can leak into logs. Anthropic, Google and HuggingFace do not provide embeddings here. The HuggingFace base address looks outdated. No tests are visible in this file.","debug":"If a call fails, check the provider name and that the matching key is set. Check the model name against the provider's list. For Ollama, confirm the local server is running on the expected address. For Google, check the response shape if the text field is missing.","summary_hash":"sha256:5caacaa0ad1a2ea64b1c7a3c919e5d114fbbe759ce5e6e2fb6034ae56799a2fa","fresh":true},"backend/services/model_manager.py":{"schema_version":1,"path":"backend/services/model_manager.py","language":"Python","lines":348,"hash":"sha256:37deb32216649c725a17d24436f01609dfc9e32db4239b5f6e7ca8554042ac44","area":"backend-services","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["API keys are stored unencrypted in the database.","Some built-in defaults use provider names the provider factory does not handle, such as local.","No tests are visible in this file."]},"terms":[{"term":"Configuration","meaning":"a saved choice of which model and key to use for one task"},{"term":"Registry","meaning":"a catalog of known models with their details and strengths"},{"term":"Session","meaning":"the open connection to the database used to read and save records in one batch"},{"term":"Moving average","meaning":"a running average that gives recent values more weight than old ones"},{"term":"Enum","meaning":"a fixed list of allowed choices, such as task names or provider names"}],"depends_on":["sqlalchemy","models/model_config.py","services/llm_provider.py","services/model_registry_data.py","config.py"],"used_by":[],"sections":[{"start":1,"end":10,"kind":"setup","name":"File setup","id":"s1","hash":"3c58ec05056a2720","title":"Imports for model management","what":"Brings in the database session type, the model configuration records, the provider factory, and the built-in registry data. It has no direct effect on the user.","why":"The manager needs these pieces to store configurations, build providers, and seed the catalog.","watch_out":""},{"start":11,"end":45,"kind":"class","name":"ModelManager (part 1)","id":"s2","hash":"d9b67fa06044d2fe","title":"Starting point for choosing a provider","what":"Holds the database session and offers the main entry point that returns a ready provider for a task. It tries a saved configuration first and only falls back to the built-in defaults when none exists.","why":"Lets the owner override the default model per task without touching code.","watch_out":"The fallback path only runs when no saved configuration matches, so a stale saved configuration silently wins."},{"start":46,"end":99,"kind":"method","name":"ModelManager: _get_active_config","id":"s3","hash":"3a9566e11c7d5345","title":"Finding the active saved configuration","what":"Looks for the active saved configuration for one task, narrowed by organization and model type when given. It prefers the one marked as default and otherwise takes any active match.","why":"Gives priority to the owner's explicit default choice.","watch_out":"If no organization is given, configurations for every organization can match, which may pick the wrong one."},{"start":100,"end":129,"kind":"method","name":"ModelManager: _get_default_paid_provider","id":"s4","hash":"9d701bae538f7dc0","title":"Building a provider from a saved configuration","what":"Turns a saved configuration into a working provider object using its provider name, model name, key and address. It is a thin bridge to the provider factory.","why":"Keeps the stored settings and the provider construction in separate places.","watch_out":""},{"start":130,"end":165,"kind":"method","name":"ModelManager: create_config","id":"s5","hash":"70a67570756ca883","title":"Built-in defaults for open-source and paid models","what":"When nothing is saved, picks the best built-in open-source model for a task, falling back to a default local Llama model. A matching paid default is picked the same way, using the key from the app settings for the provider.","why":"Gives the app a sensible model for each task out of the box.","watch_out":"Fallbacks silently use a specific model, so a missing registry entry changes behavior without warning."},{"start":166,"end":209,"kind":"method","name":"ModelManager: list_configs","id":"s6","hash":"1c11186d48c8eae0","title":"Creating a saved configuration","what":"Writes a new model configuration for a task to the database with a generated identifier, the chosen provider and model, and the key. The key is saved exactly as given.","why":"Lets the owner store a preferred model choice for later use.","watch_out":"The key is stored unencrypted, as the in-code note acknowledges."},{"start":210,"end":268,"kind":"method","name":"ModelManager: log_performance","id":"s7","hash":"b39c9381d5819136","title":"Listing saved configurations","what":"Returns saved configurations, newest first, with optional filters for organization, task, model type, and whether only active ones are shown.","why":"Lets the app show the owner their current model choices.","watch_out":"Active-only is on by default, so inactive configurations stay hidden unless the caller turns it off."},{"start":269,"end":318,"kind":"class","name":"ModelManager (part 7)","id":"s8","hash":"678c22e7d1a7cde3","title":"Updating a saved configuration","what":"Changes the fields of one saved configuration, identified by its identifier, and stamps the update time. It returns nothing if the identifier does not exist.","why":"Lets the owner change a model choice without creating a new record.","watch_out":"Any key that is not a real field is silently ignored."},{"start":319,"end":348,"kind":"method","name":"ModelManager: get_available_models","id":"s9","hash":"487e9f3535e08981","title":"Recording model performance","what":"Adds a log entry for one model call with tokens, latency, success and any error, then updates the configuration's totals, average response time, success rate and last-used time. The success rate is a running average across all calls.","why":"Gives the owner evidence to judge which models perform well.","watch_out":"The success rate and response time are running averages, so a few early outliers can skew them for a long time."}],"explained_at":"2026-11-12T00:08:40+00:00","explained_by":"haiku","summary":"Chooses which AI model to use for each task, from saved configurations or built-in defaults, and records how each model performs.","purpose":"Lets the owner set a preferred model per task and keeps usage statistics so model choice can be judged.","why":"Separates model selection and tracking from the agents that do the work, so the choice can change without code changes.","how":"When a task needs a model, the manager first looks for an active saved configuration for that task, optionally narrowed by organization and open-source or paid type. If none exists, it uses the best built-in default from the registry data. Saved configurations can be created, updated and listed. Each call can be logged with tokens, latency and success, and the configuration's running totals and averages are updated. Registry entries can be seeded once from the built-in data.","inputs":"A task such as planning, an optional organization identifier, a preferred model type, and the details for a new or changed configuration including the provider, model name, and API key.","outputs":"A ready-to-use provider object for the task, configuration records, and performance log entries.","risks":"API keys are saved in the database as plain text, as the code's own comment notes. Built-in defaults can name providers the factory does not handle, which causes an error when they are picked.","debug":"If a task gets an unexpected model, check the saved configurations for that task and whether any is marked as default. If a provider fails to build, check the provider name in the registry data and whether the key is stored for that configuration. If statistics look wrong, check the log entries for that configuration.","summary_hash":"sha256:37deb32216649c725a17d24436f01609dfc9e32db4239b5f6e7ca8554042ac44","fresh":true},"backend/services/model_registry_data.py":{"schema_version":1,"path":"backend/services/model_registry_data.py","language":"Python","lines":397,"hash":"sha256:2888ffbffa3dc0f0550a49fe1ebae9849f7e5dc4df350aae457e3de24a5f83a3","area":"backend-services","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The best paid embedding choice is voyage-2, whose provider is local, which the factory does not handle.","Some providers such as cohere are not supported by the factory.","Scores, prices and license notes are hand-entered with no visible check or update date."]},"terms":[{"term":"Quality score","meaning":"a 0 to 1 number a builder assigns to suggest how good a model is for a task"},{"term":"Open-source model","meaning":"a model whose weights are published so anyone can run it"},{"term":"Context length","meaning":"how much text a model can read in one request"},{"term":"VRAM","meaning":"the memory on a graphics card, which limits which models can run locally"},{"term":"License","meaning":"the legal terms for who may use a model and for what purpose"}],"depends_on":["typing"],"used_by":["backend/services/model_manager.py"],"sections":[{"start":1,"end":45,"kind":"setup","name":"File setup (part 1)","id":"s1","hash":"f78d283bbb618e90","title":"Open-source planning and reasoning models","what":"Describes several open-source models suited to planning and structured output, each with its strengths, memory needs, and license. These entries feed the default choices for planning work when no saved configuration exists.","why":"Gives the app a free option for planning tasks that can run on local hardware.","watch_out":"Hardware minimums are listed, so a machine below them will be slow or fail to load the model."},{"start":46,"end":85,"kind":"setup","name":"File setup (part 2)","id":"s2","hash":"b1f8dda70c03d8c2","title":"Paid planning models from OpenAI","what":"Describes two paid OpenAI chat models with their prices, latency, quality scores and feature flags such as JSON mode. They are marked as recommended for planning and generation.","why":"Provides high-quality hosted options that need an OpenAI key.","watch_out":"Prices are fixed numbers that will drift from the provider's current pricing."},{"start":86,"end":126,"kind":"setup","name":"File setup (part 3)","id":"s3","hash":"04dab9c5e781bdd0","title":"Paid planning models from OpenAI (GPT-4o)","what":"Describes a faster, cheaper OpenAI model suited to generation and planning, with its prices and feature flags.","why":"Offers a cheaper alternative to the larger OpenAI model.","watch_out":"Scores and prices are estimates and may not match real performance."},{"start":127,"end":186,"kind":"setup","name":"File setup (part 4)","id":"s4","hash":"0f0fc4142bb0e594","title":"Paid models from Anthropic and Google","what":"Describes a Claude model and a Gemini model with their context sizes, prices and quality scores. Claude is marked as not supporting JSON mode, and the Gemini entry supports it.","why":"Gives the app paid options from two more providers with very large context limits.","watch_out":"The Claude entry says it does not support JSON mode, so requests that depend on JSON need the instruction approach instead."},{"start":187,"end":243,"kind":"setup","name":"File setup (part 5)","id":"s5","hash":"32f2218a5fd10dd3","title":"Generation and validation models","what":"Describes an open-source generation model, and a small open-source and a low-cost paid model for quick checks such as validation and sentiment. Each entry has suggested temperature and length settings.","why":"Matches cheaper, faster models to simpler jobs.","watch_out":"Suggested settings are only recommendations here and nothing in this file enforces them."},{"start":244,"end":295,"kind":"setup","name":"File setup (part 6)","id":"s6","hash":"88bafdb2c9d69663","title":"Embedding models","what":"Describes open-source and paid embedding models, including a paid Cohere model and a Voyage model. These are the entries used when the app needs to turn text into numbers for search.","why":"Gives the app a choice of embedding models with different costs and quality.","watch_out":"The Voyage entry is marked with provider local while its description says it is an API service, and this mismatch can make it unusable."},{"start":296,"end":350,"kind":"setup","name":"File setup (part 7)","id":"s7","hash":"a4d5fe61973eaa1d","title":"Emotion and sentiment models and more embeddings","what":"Describes two open-source emotion models and a further embedding entry from a different provider with a higher quality score. These cover detecting emotions in answers.","why":"Provides specialised models for emotion work.","watch_out":"The Voyage embedding entry has the highest quality score, so the best-paid lookup will pick it even though its provider cannot be built."},{"start":351,"end":369,"kind":"setup","name":"File setup (part 8)","id":"s8","hash":"9315bed0b10fa7a6","title":"Translation model","what":"Describes an open-source model that translates among about two hundred languages. Its license forbids commercial use.","why":"Gives the app a multilingual option for translation tasks.","watch_out":"The license is non-commercial, so using it in a paid product would break its terms."},{"start":370,"end":387,"kind":"function","name":"get_recommended_models_for_task","id":"s9","hash":"fbe22630f487f4e3","title":"Choosing models for a task","what":"Collects every catalog entry recommended for a given task, optionally limited to open-source or paid, and sorts them by quality score from highest to lowest.","why":"Gives the ordering logic that the model manager uses to pick defaults.","watch_out":"Only models marked as recommended for the task are considered, so a strong model not marked for it is never picked."},{"start":388,"end":393,"kind":"function","name":"get_best_open_source_model","id":"s10","hash":"b550213f1eeb3cb2","title":"Best open-source model for a task","what":"Returns the top open-source model recommended for a task, or nothing if there is none.","why":"Gives a single default open-source choice when no saved configuration exists.","watch_out":"Returns nothing when no model fits, so callers must handle an empty result."},{"start":394,"end":397,"kind":"function","name":"get_best_paid_model","id":"s11","hash":"efa222248e475d02","title":"Best paid model for a task","what":"Returns the top paid model recommended for a task, or nothing if there is none.","why":"Gives a single default paid choice when no saved configuration exists.","watch_out":"The top paid choice for embeddings is the Voyage entry, which the factory cannot build, so this default can break embedding setup."}],"explained_at":"2026-11-12T00:08:40+00:00","explained_by":"haiku","summary":"Holds a built-in catalog of AI models with their strengths, costs, quality scores and hardware needs, plus helper functions that pick the best model for a task.","purpose":"Gives the app a ready list of models to recommend, so the owner does not have to research and enter each one.","why":"Keeping the catalog as plain data makes it easy to add or change a model without changing logic.","how":"The catalog is one large dictionary keyed by model name, grouped by task type. A helper gathers the models recommended for a task, sorts them by quality score, and keeps the top result. Two shortcuts pick the best open-source model or the best paid model for a task.","inputs":"A task name such as planning, generation, validation, embedding, translation or emotion, and optionally a model type.","outputs":"Lists or single entries of model details including provider, model identifier, quality score, and suggested settings.","risks":"Scores and prices are hand-entered and will go out of date. Some entries use provider names the factory does not handle, and the voyage-2 entry is marked as local while its description says it is an API service.","debug":"If a task picks an odd model, look at the quality scores for that task. If a provider fails to build, check the provider name in the entry. If a price looks wrong, check the date of the source page.","summary_hash":"sha256:2888ffbffa3dc0f0550a49fe1ebae9849f7e5dc4df350aae457e3de24a5f83a3","fresh":true},"backend/services/retrieval.py":{"schema_version":1,"path":"backend/services/retrieval.py","language":"Python","lines":225,"hash":"sha256:baecd23983e38185115fbc7b75d98ee28e2b12baea6016321f51321d1d193c47","area":"backend-services","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Pieces without a source priority will cause an error during ranking.","Only two policy constraints are actually checked, and unknown constraints are ignored.","The recency boost is noted but not implemented, and no tests are visible."]},"terms":[{"term":"Embedding","meaning":"a list of numbers that represents the meaning of a piece of text"},{"term":"Cosine similarity","meaning":"a score from about 0 to 1 that shows how alike two lists of numbers point, used here to compare meaning"},{"term":"Reranking","meaning":"sorting an already chosen set of results again using a better score"},{"term":"Policy veto","meaning":"removing a result because it breaks a rule, no matter how relevant it is"},{"term":"Source priority","meaning":"a number on each piece saying how much its source should be trusted"},{"term":"Corpus","meaning":"the full collection of stored document pieces"}],"depends_on":["sqlalchemy","numpy","models/corpus.py","services/embeddings.py","config.py"],"used_by":["backend/agents/author.py"],"sections":[{"start":1,"end":11,"kind":"setup","name":"File setup","id":"s1","hash":"224d4f42c12f5657","title":"Imports and setup for retrieval","what":"Brings in the database query tools, the number library, the piece and type definitions, the shared embedding service, and the app settings. It has no direct effect on the user.","why":"The retrieval stages need these tools to filter, compare and read settings.","watch_out":""},{"start":12,"end":69,"kind":"class","name":"RetrievalEngine (part 1)","id":"s2","hash":"6314f0abfba71585","title":"Retrieval engine and its main entry point","what":"Creates the retrieval engine and its main method, which runs the four stages in order and returns the chosen pieces. Limits and thresholds come from the settings unless the caller overrides them.","why":"Gives the agents one call that does all the filtering and ranking.","watch_out":"Defaults that are zero are treated as missing, so passing zero as a threshold quietly falls back to the setting."},{"start":70,"end":106,"kind":"class","name":"RetrievalEngine (part 2)","id":"s3","hash":"abbee46944ad6047","title":"Chaining the stages and trimming the result","what":"Runs the diversity and policy stages on the ranked pieces and then keeps the requested number. It is the part that connects the stages into one result.","why":"Keeps the stages separate so each can change without affecting the others.","watch_out":"The number kept is cut at the end, so a larger requested number than the ranking limit cannot return more pieces."},{"start":107,"end":144,"kind":"method","name":"RetrievalEngine: _stage2_semantic_rerank","id":"s4","hash":"1cee7519b18d2ccf","title":"Ranking pieces by meaning","what":"Compares the query with each candidate piece by meaning, boosts pieces from higher-priority sources, and slightly adjusts for quality. It keeps the highest-scoring pieces. Recency boost is mentioned in a comment but not implemented.","why":"Puts the most relevant and trusted pieces first.","watch_out":"A piece with no source priority or a zero-length embedding will make the calculation fail."},{"start":145,"end":175,"kind":"method","name":"RetrievalEngine: _stage3_diversity","id":"s5","hash":"f510eada1b2adea7","title":"Removing near-duplicate pieces","what":"Walks through the ranked pieces and keeps one only if it is not too similar to any piece already kept. The top piece is always kept.","why":"Stops the agents from receiving the same idea many times.","watch_out":"The similarity threshold decides how many pieces survive, so a loose setting can let duplicates through."},{"start":176,"end":210,"kind":"method","name":"RetrievalEngine: _stage4_policy_veto","id":"s6","hash":"120b5c1e322fa310","title":"Applying policy rules","what":"Drops pieces that break two named rules: one about minors and one about personal data. If no rules are given, all pieces pass through.","why":"Keeps restricted or sensitive material out of generated surveys.","watch_out":"Any other constraint name is silently ignored, and a piece with no policy tags can raise an error."},{"start":211,"end":225,"kind":"function","name":"build_retrieval_context","id":"s7","hash":"a93ba4cd00e88255","title":"Building the text block for the prompt","what":"Turns the chosen pieces into one numbered text block that shows each source, its question type, any example, and its content. The agents paste this block into the prompt.","why":"Gives the language model the sources in a clear, labelled format.","watch_out":"There is no length limit, so many large pieces can overflow the model's context window."}],"explained_at":"2026-11-12T00:08:40+00:00","explained_by":"haiku","summary":"Finds the document pieces most relevant to a question by filtering on metadata, ranking by meaning, removing near-duplicates, and then removing pieces that break policy rules.","purpose":"Supplies the agents with the right source material so the questions they write are grounded in approved documents.","why":"Four stages let cheap filters run first and the costly comparisons run only on what remains. Reason for the exact order is only partly stated in the code.","how":"First the candidate pieces are filtered by audience, use case and question type. Each remaining piece is compared with the query by meaning and boosted by its source priority and quality. Pieces that are too similar to a higher-ranked one are dropped. Then policy rules remove pieces that break them. The top results are returned, and a helper turns them into one text block for the prompt.","inputs":"A search query, optional audience, use case and question type, optional policy constraints, and optional limits for how many results and how strict the duplicate check is.","outputs":"A list of document pieces, or a single text block that holds them numbered with their source and type.","risks":"Every active piece is loaded and compared in memory, which will slow down as the corpus grows. Missing source priority or quality values can crash the ranking. Policy rules are only checked for two named keys, so other constraints are silently ignored.","debug":"If results look irrelevant, check the query and the stored embeddings. If results are empty, check the metadata filters and whether the pieces are active. If a policy seems ignored, check the constraint names against the two handled keys. If the ranking crashes, check the source priority and policy tag values on the stored pieces.","summary_hash":"sha256:baecd23983e38185115fbc7b75d98ee28e2b12baea6016321f51321d1d193c47","fresh":true},"database/init/01_init.sql":{"schema_version":1,"path":"database/init/01_init.sql","language":"SQL","lines":36,"hash":"sha256:56c809ff237d2fd6f74dd7ab06e0aa1b53d6121e1947515528b0246f6413602b","area":"database","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Grants may not cover tables created later.","No checks confirm the extensions loaded."]},"terms":[{"term":"schema","meaning":"A named group inside a database that holds related tables."},{"term":"pgvector","meaning":"A database extension that stores and searches lists of numbers, used for similarity search."},{"term":"extension","meaning":"An add-on that gives the database extra features."},{"term":"search path","meaning":"The order of schemas the database checks when a name is used without a schema."},{"term":"sequence","meaning":"A counter the database uses to generate numbered IDs."}],"depends_on":["a PostgreSQL database with pgvector available","database name research_platform","user platform_user"],"used_by":[],"sections":[{"start":1,"end":12,"kind":"statement","name":"CREATE","id":"s1","hash":"5d87b8f80999708d","title":"Enable extensions and create schemas","what":"Turns on the vector and uuid-ossp extensions and creates six schemas for corpus, surveys, studies, panels, analytics and audit data.","why":"Likely reason: separate schemas keep each data area organized, and the vector extension supports document search.","watch_out":"The database must include the vector extension, or the script fails at the start."},{"start":13,"end":36,"kind":"statement","name":"ALTER","id":"s2","hash":"037c054ed5ebc2a2","title":"Set search path and grant access","what":"Sets the default schema search order for the database and gives the app user full rights on each schema, its existing tables and its sequences.","why":"Likely reason: lets the app use short table names and have full access without manual setup.","watch_out":"Grants cover only existing tables, so new tables may need grants added."}],"explained_at":"2026-11-12T00:15:30+00:00","explained_by":"haiku","summary":"A setup script that enables two database extensions, creates six schemas for the app's data areas, and gives the app's database user full access.","purpose":"Prepares the database so the app can store corpus, survey, study, panel, analytics and audit data.","why":"Likely reason: separate schemas keep data areas organized. The vector extension likely supports similarity search over documents.","how":"Enables the vector and uuid-ossp extensions, creates the schemas, sets the default search path for the database, then grants the user all rights on each schema, its tables and its sequences.","inputs":"A database named research_platform and a user named platform_user.","outputs":"Extensions, schemas and granted permissions.","risks":"The grants cover only tables that already exist. Tables created later may need new grants, unless default privileges are set elsewhere. Search path applies to the database as a whole.","debug":"If the script fails at the start, check that the database image includes the vector extension. If the app cannot write to a new table, check its grants. If names do not resolve, check the search path.","summary_hash":"sha256:56c809ff237d2fd6f74dd7ab06e0aa1b53d6121e1947515528b0246f6413602b","fresh":true},"docker-compose.yml":{"schema_version":1,"path":"docker-compose.yml","language":"Configuration","lines":88,"hash":"sha256:44a5d2f572a4c3085a0c7550d4d39bf5f3584c522cbdd40d82895a5856d51d20","area":"root-files","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Default development password is set in the file.","The worker command refers to a module that is not visible here, so it is unclear whether it works.","The frontend Dockerfile is referenced but not shown."]},"terms":[{"term":"Docker","meaning":"A tool that runs an app and its needed parts inside a sealed package called a container."},{"term":"Docker Compose","meaning":"A tool that starts several containers together from one description file."},{"term":"Contai ess. If a key error appears, compare the response with the fields the script reads. If the step-by-step version fails, check the planning address.","summary_hash":"sha256:4df118ad1078f94742f0066716687bbcf0fb0baa63a4ff8241adadc3f5cb8a36","fresh":true},"examples/load_corpus_example.py":{"schema_version":1,"path":"examples/load_corpus_example.py","language":"Python","lines":228,"hash":"sha256:0e75e89557d7c114ae7f31eaea83ec60be5bb155bdb76c51ee5319f007a71f26","area":"examples","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No check stops duplicate loads.","Errors show only the status code in some places.","No tests are visible."]},"terms":[{"term":"question bank","meaning":"A stored set of example survey questions with tags."},{"term":"priority","meaning":"A number that tells the system which documents to prefer. Higher is preferred."},{"term":"compliance","meaning":"Following legal and ethical rules about data, such as privacy laws."},{"term":"chunk","meaning":"A small part of a document that the system stores and searches separately."}],"depends_on":["the running backend server","requests library"],"used_by":[],"sections":[{"start":1,"end":6,"kind":"setup","name":"File setup","id":"s1","hash":"a5465e4266004448","title":"Server address and imports","what":"Brings in the tool for sending web requests and sets the server address to the local machine on port 8000.","why":"Likely reason: the example talks to a server running on this computer.","watch_out":"The server must be running before the script starts."},{"start":7,"end":64,"kind":"function","name":"load_custom_question_bank (part 1)","id":"s2","hash":"497934f2ba9a642a","title":"Question bank text","what":"Holds a custom question bank written as plain text with sections, numbered questions and tags for type, scale, topic, category, audience and use case.","why":"Likely reason: this text is the content the system will split up and search.","watch_out":"The format must match wh pens port 3000, then runs the dev command.","inputs":"The project files in the frontend folder and the package list in frontend/package.json.","outputs":"A container image that serves the frontend on port 3000 when started.","risks":"The dev server is meant for development, not for real users. Copying everything with one broad copy step may also bring in local files that are not needed, since no ignore file is visible.","debug":"If the container does not start, check the build output for failed installs and confirm the package list is valid. If the page does not load, confirm port 3000 is mapped and that the dev server printed a ready message.","summary_hash":"sha256:d13744ee3e0df92459dd5433484e5018fe3a57092962a4cb0613d4554f764b06","fresh":true},"frontend/app.js":{"schema_version":1,"path":"frontend/app.js","language":"JavaScript","lines":607,"hash":"sha256:e07b7936f18d636c7f7b8274cf60f26bcc654aab3c855a25cf3641de7e26a3b3","area":"frontend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Server data is written into the page without escaping, a security risk.","No tests are visible.","Author tab hardcodes the audience.","Relies on the browser's implicit event object in the tab switcher."]},"terms":[{"term":"API","meaning":"a doorway other programs use to ask this app for data or actions, here the backend on port 8000."},{"term":"fetch","meaning":"the browser's built-in way to send a request to a server and wait for its answer."},{"term":"DOM","meaning":"the browser's live model of the page, which code reads and changes to update what the user sees."},{"term":"innerHTML","meaning":"a property that replaces the contents of a page area with HTML text, which can also run embedded script."},{"term":"JSON","meaning":"a plain text format for structured data made of named fields, used to talk to the backend."},{"term":"polling","meaning":"checking something again on a fixed timer, here the backend status every 30 seconds."},{"term":"state","meaning":"values the program remembers while it runs, here currentData."}],"depends_on":["frontend/index.html","backend API at localhost port 8000"],"used_by":["frontend/index.html"],"sections":[{"start":1,"end":3,"kind":"setup","name":"File setup","id":"s1","hash":"70987c80502841d6","title":"Backend address setting","what":"Stores the backend address that every request in this file uses, currently the local machine on port 8000.","why":"Likely reason: keeps the address in one place so it is easy to change. Reason not stated in the code.","watch_out":"Changing the backend port here also requires changing the page links and the wizard file."},{"start":4,"end":6,"kind":"value","name":"currentData","id":"s2","hash":"d10b1ffee79faab7","title":"Shared memory of answers","what":"Holds the most recent answer from each tab so the download buttons can save them.","why":"Likely reason: lets the user download results later without asking the server again.","watch_out":"Data is lost on page reload because it is only kept in memory."},{"start":7,"end":13,"kind":"event handler","name":"document DOMContentLoaded handler","id":"s3","hash":"64def218543e5c0a","title":"Startup checks and timer","what":"When the page loads, it checks whether the backend is online and then repeats that check every 30 seconds.","why":"Likely reason: keeps the status badge up to date without a page refresh.","watch_out":"Each page keeps its own timer, so many open tabs send many status requests."},{"start":14,"end":33,"kind":"function","name":"showTab","id":"s4","hash":"cfbea3d85eb54e8f","title":"Switching between tabs","what":"Shows the chosen tab and hides the others, and loads the model list the first time the Browse Models tab opens.","why":"Likely reason: the page is a set of tabs in one page, so this switches between them.","watch_out":"It reads the global event object instead of receiving it as a parameter, which can break if the function is called in another way."},{"start":34,"end":51,"kind":"function","name":"checkAPIStatus","id":"s5","hash":"6cf71e2cdd1e5990","title":"Backend online status badge","what":"Asks the backend's documentation address whether it responds, then shows Online, Error, or Offline in the footer.","why":"Likely reason: gives the user a quick sign that the backend is reachable. Reason for using the documentation address is not stated in the code.","watch_out":"Any successful response counts as online, so a backend that is up but broken can still show Online."},{"start":52,"end":56,"kind":"function","name":"showLoading","id":"s6","hash":"cc17486fc8ba604d","title":"Showing the loading overlay","what":"Displays the full-screen spinner that blocks clicks while a request runs.","why":"Likely reason: stops the user from sending repeated requests while waiting.","watch_out":"Every handler that calls it must also call the hide function, or the screen stays blocked."},{"start":57,"end":60,"kind":"function","name":"hideLoading","id":"s7","hash":"2c7498929021a580","title":"Hiding the loading overlay","what":"Removes the full-screen spinner once a request finishes.","why":"Likely reason: pairs with the show function so the page is usable again.","watch_out":"It is called in the finally part of handlers, so it runs even after errors."},{"start":61,"end":82,"kind":"function","name":"showError","id":"s8","hash":"85239a9bb3bc5e1d","title":"Showing error messages","what":"Turns an error of any shape into readable text and places it in the chosen output area in red.","why":"Likely reason: the backend and the browser report errors in different shapes, so this converts them all into one message.","watch_out":"The message is inserted as raw HTML, so text containing markup from the server can change the page."},{"start":83,"end":136,"kind":"function","name":"handlePlanSurvey (part 1)","id":"s9","hash":"09ace10777de28c4","title":"Building the survey plan request","what":"Reads the planner form, sends the goal, audience, required topics and model type to the backend, then shows the planned questions as cards or raw data.","why":"Likely reason: the planner tab needs the backend to generate the plan, and this file turns the answer into readable cards.","watch_out":"Titles and question text from the backend are inserted without escaping."},{"start":137,"end":164,"kind":"function","name":"handlePlanSurvey (part 2)","id":"s10","hash":"0db16fc2bb8a4eb6","title":"Showing planned questions","what":"Creates one card per planned question with its number, type, category and reasoning, then shows the result box.","why":"Likely reason: makes each planned question easy to scan. Reason for falling back to raw data is not stated in the code.","watch_out":"If the backend sends no survey_spec field, the page shows raw JSON instead of cards, which can hide a changed response format."},{"start":165,"end":223,"kind":"function","name":"handleAuthorQuestions (part 1)","id":"s11","hash":"fd76a12ad535c900","title":"Sending the question author request","what":"Reads the topic, question type and count from the form, sends a request that describes them as one goal, then shows the generated questions.","why":"Likely reason: the author tab reuses the same backend endpoint style as the planner.","watch_out":"The audience is always sent as B2C and the count is only embedded in the goal text, so the backend cannot see them as separate settings."},{"start":224,"end":231,"kind":"function","name":"handleAuthorQuestions (part 2)","id":"s12","hash":"6fe4dffcbe9e8e8b","title":"Question author cleanup","what":"Shows an error in the author output area if the request fails and always hides the spinner afterwards.","why":"Likely reason: keeps the error display and spinner consistent with the other tabs.","watch_out":"The error path reuses the result box, so an old result may be replaced by an error message."},{"start":232,"end":288,"kind":"function","name":"handleValidate (part 1)","id":"s13","hash":"5efbac2e5ac7d4cc","title":"Reading and checking the survey JSON","what":"Reads the pasted survey text, turns it into data, sends it to the validator endpoint, and starts showing the hard check results.","why":"Likely reason: the validator needs real data, so invalid text is rejected before any request is sent.","watch_out":"The audience is taken from the survey itself or defaults to B2C, which may not match the user's intent."},{"start":289,"end":338,"kind":"function","name":"handleValidate (part 2)","id":"s14","hash":"1c26bc075bc9c2ad","title":"Showing validation results","what":"Lists hard check problems, shows each quality score with colour, and lists suggestions.","why":"Likely reason: separates must-fix problems from optional quality advice.","watch_out":"A missing passed field is treated as a pass, so an incomplete answer may look healthy."},{"start":339,"end":360,"kind":"function","name":"loadModels","id":"s15","hash":"e79def7191abc665","title":"Loading the model list","what":"Asks the backend for the model registry and stores the list so the page can display and filter it.","why":"Likely reason: the list comes from the backend so it can change without editing the page.","watch_out":"Failure text is placed into the page as raw HTML."},{"start":361,"end":405,"kind":"function","name":"displayModels","id":"s16","hash":"289daf04b180ff68","title":"Drawing model cards","what":"Creates a card for each model showing its name, task, open source or paid label, provider, quality out of 10, and cost.","why":"Likely reason: gives a readable overview of the models for choosing one.","watch_out":"Quality is multiplied by 10, so if the backend already sends a 0 to 10 score the number will be wrong."},{"start":406,"end":428,"kind":"function","name":"filterModels","id":"s17","hash":"24f58a30f5244139","title":"Filtering models by task and type","what":"Keeps only models matching the chosen task and access type, then redraws the cards.","why":"Likely reason: lets the user narrow a long list without another request.","watch_out":"If no list is loaded yet, it loads the list instead of filtering, which can surprise a user who only changed a dropdown."},{"start":429,"end":449,"kind":"function","name":"downloadJSON","id":"s18","hash":"70743961b96cf491","title":"Saving stored answers as a file","what":"Turns the stored answer for a tab into a JSON file and starts a browser download with a timestamped name.","why":"Likely reason: lets the user keep results for their own records or debugging.","watch_out":"If nothing is stored yet, it shows an alert instead of a file."},{"start":450,"end":497,"kind":"function","name":"handleFileUpload (part 1)","id":"s19","hash":"1227be11ad645741","title":"Uploading documents one at a time","what":"Reads the chosen files and document type, then sends each file separately to the upload endpoint, collecting successes and failures.","why":"Likely reason: one failing file should not stop the others. This is stated by the loop and error collection.","watch_out":"Files are sent in a loop, so a large batch takes a long time and the spinner stays up until all are done."},{"start":498,"end":545,"kind":"function","name":"handleFileUpload (part 2)","id":"s20","hash":"484252a8952abf97","title":"Showing upload results and refreshing","what":"Lists which files uploaded with their IDs and which failed with reasons, resets the form, and reloads the document list.","why":"Likely reason: gives clear per-file feedback and clears the form for the next upload.","watch_out":"Failure reasons from the server are inserted as raw HTML."},{"start":546,"end":567,"kind":"function","name":"loadDocuments","id":"s21","hash":"b76334aaa6000e53","title":"Loading the document list","what":"Asks the backend for uploaded documents and stores them, then passes them to the display function.","why":"Likely reason: keeps the document list in sync after uploads.","watch_out":"Errors are written into the list area as raw HTML."},{"start":568,"end":607,"kind":"function","name":"displayDocuments","id":"s22","hash":"71aa48324b0f6be9","title":"Drawing document cards","what":"Creates a card for each uploaded document with its title, type, audience labels, ID, version and upload date.","why":"Likely reason: gives the user a quick view of what is in the knowledge base.","watch_out":"Only the first underscore in the document type is replaced, so types with several underscores display oddly. Titles are inserted as raw HTML."}],"explained_at":"2026-11-12T00:00:13+00:00","explained_by":"haiku","summary":"Browser logic for the classic single-page version of the research tool: it switches tabs and sends planner, author, validator, model list, and document upload requests to the backend.","purpose":"Makes the buttons and forms on index.html work and shows the backend's answers on the page.","why":"Likely reason: the page is plain HTML with no framework, so this file handles all the interaction. Reason for some specific choices is not stated in the code.","how":"On page load it checks whether the backend is online and repeats that check every 30 seconds. Each tab has a handler that reads the form, sends a request to the backend, stores the answer in memory, and writes it into the page. Shared helpers show a spinner, show errors, and let the user download stored answers as files.","inputs":"Form values typed by the user, files picked for upload, and JSON answers from the backend at the address stored in API_BASE_URL.","outputs":"Updated text and cards on the page, a status badge showing whether the backend is online, downloaded JSON files, and in-memory data stored in currentData.","risks":"Server text is inserted into the page as raw HTML, so a crafted response could run script in the browser. The author tab always sends the audience as B2C. The backend address is fixed to localhost.","debug":"If a button does nothing, open the browser console and look for errors from the named function. If the status badge says Offline, confirm the backend is running on port 8000 and that the browser can reach it. If a result looks wrong, use the download button to see the raw answer.","summary_hash":"sha256:e07b7936f18d636c7f7b8274cf60f26bcc654aab3c855a25cf3641de7e26a3b3","fresh":true},"frontend/index.html":{"schema_version":1,"path":"frontend/index.html","language":"HTML","lines":291,"hash":"sha256:9c30bf9e9ed7750129eef1edd26d2b35255dd33179feb3b45e36ebbba226bed2","area":"frontend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The upload audience label points at the planner audience field instead of its own field.","Hardcoded local backend address.","No tests or accessibility checks visible."]},"terms":[{"term":"HTML","meaning":"the markup language that describes the structure of a web page."},{"term":"form","meaning":"a group of input fields that a user fills in and submits."},{"term":"stylesheet","meaning":"a file that controls how the page looks, here styles.css."},{"term":"overlay","meaning":"a layer placed on top of the page to block interaction while work runs."}],"depends_on":["frontend/app.js","frontend/styles.css"],"used_by":["frontend/wizard-app.js (links back to this page)"],"sections":[{"start":1,"end":52,"kind":"setup","name":"File setup (part 1)","id":"s1","hash":"671398136f1943ff","title":"Page header and tab bar","what":"Sets up the page title, the header banner, and five tab buttons that switch between sections.","why":"Likely reason: gives the user a clear way to move between tools on one page.","watch_out":"Each button calls a named function in app.js, so renaming those functions breaks navigation."},{"start":53,"end":111,"kind":"setup","name":"File setup (part 2)","id":"s2","hash":"2c3d555c9200f0ff","title":"Survey planner form","what":"Provides fields for the research goal, audience, required topics and model type, plus the button that sends the request and the results area.","why":"Likely reason: collects everything the planner handler reads.","watch_out":"Field names such as goal and audience are read by name in app.js, so renaming them breaks the planner."},{"start":112,"end":171,"kind":"setup","name":"File setup (part 3)","id":"s3","hash":"4132137ae80cd649","title":"Question author form","what":"Provides a topic field, a question type list, a count field, and the results area for the author tab.","why":"Likely reason: collects the inputs the author handler reads.","watch_out":"The question type list values such as NPS and MaxDiff are sent to the backend, so they must match what it accepts."},{"start":172,"end":223,"kind":"setup","name":"File setup (part 4)","id":"s4","hash":"47f41960b179a756","title":"Survey validator form and results","what":"Provides a large text box for pasting survey JSON and a button that runs the check, plus the results area.","why":"Likely reason: the validator needs the full survey pasted as text.","watch_out":"The text box is required, but invalid JSON is only caught after the button is pressed."},{"start":224,"end":282,"kind":"setup","name":"File setup (part 5)","id":"s5","hash":"966b376cb1c5c76c","title":"Model browser and document upload","what":"Provides task and type dropdowns with a refresh button for models, and a document type, audience, file picker, upload button and document list for the upload tab.","why":"Likely reason: these controls feed the model filter and the upload handler.","watch_out":"The upload audience label points at the planner audience field, which is a labelling bug."},{"start":283,"end":291,"kind":"setup","name":"File setup (part 6)","id":"s6","hash":"6e7e6ab069b41e34","title":"Footer and loading overlay","what":"Shows the backend status badge, a link to the API documentation, a full-screen spinner, and loads the script file.","why":"Likely reason: the status badge and spinner are updated by app.js. The script is placed last so the page is ready first.","watch_out":"The status badge id must stay the same because app.js looks it up by that name."}],"explained_at":"2026-11-12T00:00:13+00:00","explained_by":"haiku","summary":"The main web page for the classic version of the research tool, with five tabs for planning, authoring, validating, browsing models and uploading documents.","purpose":"Gives the user the forms, buttons and output areas that app.js and styles.css work with.","why":"Likely reason: a single static page keeps the tool simple to run. Reason not stated in the code.","how":"The page loads the stylesheet in the head, builds a header, a tab bar, five tab sections with their forms, and a footer showing backend status. A loading overlay sits at the end. The script file is loaded last so the page exists before the script runs.","inputs":"User typing, selections, and file choices in the forms.","outputs":"Calls the handler functions in app.js when forms are submitted or buttons are clicked.","risks":"Two different controls share the audience name, and the upload form label points to the wrong control, which can confuse screen readers and form submission. The backend link is fixed to localhost.","debug":"If a button does nothing, check that its handler name matches a function in app.js. If styling is missing, confirm styles.css loads.","summary_hash":"sha256:9c30bf9e9ed7750129eef1edd26d2b35255dd33179feb3b45e36ebbba226bed2","fresh":true},"frontend/package.json":{"schema_version":1,"path":"frontend/package.json","language":"Configuration","lines":27,"hash":"sha256:a36c69c10f70e9df6b55c794670a5bf7e7fd0433c762ec335b4144ea712a448f","area":"frontend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Several listed libraries are not used by the visible code.","Version ranges are loose, and no lock file is visible.","No test script exists."]},"terms":[{"term":"dependency","meaning":"an outside library the project needs in order to run."},{"term":"semver range","meaning":"a version pattern such as caret that lets npm pick newer compatible releases."},{"term":"Next.js","meaning":"a framework for building web apps with React, used here for its dev and build commands."},{"term":"React","meaning":"a library for building user interfaces from reusable pieces."},{"term":"lint","meaning":"a tool that checks code for style and likely mistakes."}],"depends_on":["npm registry"],"used_by":["frontend/Dockerfile"],"sections":[{"start":1,"end":27,"kind":"setup","name":"File setup","id":"s1","hash":"a7d4210ae2bace56","title":"Project descriptor and dependencies","what":"Names the frontend package, lists the commands to develop, build, start and lint it, and lists the libraries it needs at runtime and while developing.","why":"Likely reason: standard way for npm to know how to install and run the project.","watch_out":"Pinning Next.js exactly while other libraries use loose ranges means upgrades will behave unevenly."}],"explained_at":"2026-11-12T00:00:13+00:00","explained_by":"haiku","summary":"The project's descriptor listing the frontend's name, its run and build commands, and the libraries it depends on.","purpose":"Tells npm which libraries to install and which commands start, build and lint the frontend.","why":"Likely reason: standard for a Node.js project. Reason for listing these specific libraries is not stated in the code.","how":"npm reads the name and version, then the scripts, the runtime dependencies, and the development-only tools. Running install downloads them.","inputs":"Commands typed by a developer, such as install, dev, build or start.","outputs":"A set of installed libraries and runnable commands.","risks":"Several listed libraries such as axios, react-query and tailwindcss do not appear in the visible frontend code, so they add weight without visible use. Version ranges can pull in newer releases that behave differently.","debug":"If install fails, check the version numbers and whether the Node.js version matches the Docker image. If a command is missing, check the scripts section.","summary_hash":"sha256:a36c69c10f70e9df6b55c794670a5bf7e7fd0433c762ec335b4144ea712a448f","fresh":tru : frames the tool as a card on the coloured background.","watch_out":"Content wider than the maximum width is hidden where overflow is cut off."},{"start":25,"end":32,"kind":"rule","name":"header ","id":"s4","hash":"8aade7b5bdb0a6b0","title":"Header area","what":"Gives the top banner the same purple gradient with white centred text and generous padding.","why":"Reason not stated in the code. Likely branding.","watch_out":"None."},{"start":33,"end":37,"kind":"rule","name":"header h1 ","id":"s5","hash":"ee10d9a472893002","title":"Main heading size","what":"Sets the page title to a large size with some space below.","why":"Reason not stated in the code.","watch_out":"Smaller screens are handled separately in the narrow-screen block."},{"start":38,"end":42,"kind":"rule","name":"header p ","id":"s6","hash":"046a028ed3b88fc8","title":"Subtitle text","what":"Makes the header subtitle slightly large and a bit faded.","why":"Reason not stated in the code.","watch_out":"None."},{"start":43,"end":50,"kind":"rule","name":".tabs ","id":"s7","hash":"c220fa63bb07f94b","title":"Tab bar layout","what":"Places the tab buttons in a row on a light grey strip that can scroll sideways if needed.","why":"Likely reason: lets all five tabs fit or scroll on narrow screens.","watch_out":"Scrolling hides tabs off screen, which some users may miss."},{"start":51,"end":64,"kind":"rule","name":".tab-button ","id":"s8","hash":"83af6ea51f112d63","title":"Tab button look","what":"Styles each tab button with padding, no border, a transparent background, grey text and a hidden underline.","why":"Reason not stated in the code. Likely a clean tab look.","watch_out":"The hidden underline is what the active state later colours."},{"start":65,"end":69,"kind":"rule","name":".tab-button:hover ","id":"s9","hash":"b7e515a7f167c8f3","title":"Tab hover effect","what":"Gives a tab a light grey background and darker text when the mouse is over it.","why":"Likely reason: shows the user which tab they are pointing at.","watch_out":"None."},{"start":70,"end":75,"kind":"rule","name":".tab-button.active ","id":"s10","hash":"01cfd20ef834997c","title":"Active tab look","what":"Makes the selected tab purple, white in the background, with a purple underline.","why":"Likely reason: shows which tab is open. This matches the active class added by app.js.","watch_out":"Renaming the active class breaks this highlight."},{"start":76,"end":82,"kind":"rule","name":".tab-content ","id":"s11","hash":"9047aba427599b26","title":"Tab content area","what":"Hides each tab's content by default and adds padding and a short fade-in animation.","why":"Likely reason: only one tab is shown at a time.","watch_out":"The fade animation runs every time the tab is shown."},{"start":83,"end":91,"kind":"rule","name":".tab-content.active ","id":"s12","hash":"701cb4173a0078da","title":"Showing the active tab and fade animation","what":"Shows the selected tab's content and defines the fade-in animation that slides it up slightly.","why":"Likely reason: pairs with the hide rule above so exactly one tab is visible.","watch_out":"None."},{"start":92,"end":97,"kind":"rule","name":".tab-content h2 ","id":"s13","hash":"b510cd8cb2ab6444","title":"Tab heading style","what":"Colours the tab's heading purple and sets its size.","why":"Reason not stated in the code.","watch_out":"None."},{"start":98,"end":102,"kind":"rule","name":".tab-content \u003e p ","id":"s14","hash":"2d5bd2f711118b58","title":"Tab description style","what":"Makes the paragraph under each tab heading grey with spacing below.","why":"Reason not stated in the code.","watch_out":"None."},{"start":103,"end":107,"kind":"rule","name":".form-group ","id":"s15","hash":"b3ef96db389668ba","title":"Form field spacing","what":"Adds space below each form field group.","why":"Reason not stated in the code.","watch_out":"None."},{"start":108,"end":117,"kind":"rule","name":".form-group label ","id":"s16","hash":"3598321c83aa6c67","title":"Form labels and inputs","what":"Makes labels bold, grey and placed above their inputs, and styles text and number boxes.","why":"Likely reason: makes forms readable.","watch_out":"Some input types are styled through a shared list continued below."},{"start":118,"end":129,"kind":"rule","name":".form-group textarea ","id":"s17","hash":"5ecde5309e81c7f1","title":"Text area styling","what":"Makes text areas full width with padding, a thick grey border and rounded corners.","why":"Reason not stated in the code.","watch_out":"None."},{"start":130,"end":136,"kind":"rule","name":".form-group textarea:focus ","id":"s18","hash":"7c9d9a4b7635432b","title":"Focused field highlight","what":"Changes the border to purple when a text area is selected and removes the default outline.","why":"Likely reason: shows which field is active.","watch_out":"The default outline is removed, so keyboard users rely on this colour change to see focus."},{"start":137,"end":147,"kind":"rule","name":".btn-secondary ","id":"s19","hash":"5d297b23b84db9f9","title":"Secondary button look","what":"Gives secondary buttons padding, rounded corners, bold text and a pointer cursor.","why":"Reason not stated in the code.","watch_out":"A second rule for the same class later overrides some of these values."},{"start":148,"end":152,"kind":"rule","name":".btn-primary ","id":"s20","hash":"3eadf5b05827e477","title":"Primary button look","what":"Gives main action buttons a purple gradient with white text.","why":"Likely reason: makes the main action stand out.","watch_out":"None."},{"start":153,"end":157,"kind":"rule","name":".btn-primary:hover ","id":"s21","hash":"ca054ae3c7d7b128","title":"Primary button hover","what":"Lifts the primary button slightly and adds a glow when hovered.","why":"Likely reason: gives feedback that the button is clickable.","watch_out":"None."},{"start":158,"end":163,"kind":"rule","name":".btn-primary:disabled ","id":"s22","hash":"2b69f6aa722df85a","title":"Disabled primary button","what":"Fades and disables the click
