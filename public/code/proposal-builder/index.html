 code shows that this is the template returned when the proposals folder has no .pptx files.","why":"Likely reason: so the generator still has a usable pattern when there are no proposals.","watch_out":""},{"start":671,"end":684,"kind":"function","name":"analyze_approach_templates","id":"s17","hash":"56f9b99ebcdd09a0","title":"Standalone analysis entry point","what":"The code for this section is not in the packet, so its behavior cannot be confirmed here. From its name alone, it appears to be a top-level function that runs the analysis.","why":"Reason not stated in the code.","watch_out":""}],"explained_at":"2026-11-11T23:48:18+00:00","explained_by":"haiku","summary":"Reads the Approach slides of existing proposal PowerPoint files and works out a reusable layout and formatting pattern for each kind of approach slide. Only part of this file was visible in the packet, so later behavior is unconfirmed.","purpose":"Give the proposal generator a pattern for timeline, governance, module and workstream slides so new proposals match the style of past ones.","why":"Likely reason: so generated approach slides copy the look of real past slides rather than being drawn from scratch. The module docstring states this goal.","how":"Open each proposal file, find its approach slides (by semantic search when a RAG engine is given, otherwise by a fixed keyword list), describe each slide's shapes, text and table formatting, then combine the results into one master template. Reason for the final combining steps not stated in the visible code.","inputs":"A folder of .pptx proposal files (default data/proposals, a relative path), an optional RAG engine, and a verbose flag that controls printed progress.","outputs":"A dictionary of slide templates grouped by type (timeline, governance, modules, workstreams), plus slide sizes, fonts, colors and layout patterns. The fallback case returns a default template.","risks":"When verbose is off, a proposal that fails to analyze is skipped with no message. The default folder path depends on where the program is started. Most methods were not visible in the packet.","debug":"Turn on verbose and look for lines starting with a warning about a file name. Check that the proposals folder resolves from the launch directory. If templates come back empty, check the keyword list and whether the slides contain those words.","summary_hash":"sha256:e0b4c6512ff248185d2c5f315bc23f0e5351a4f10aec926bb5ff4505b96a0fab","fresh":true},"src/approach_replicator.py":{"schema_version":1,"path":"src/approach_replicator.py","language":"Python","lines":523,"hash":"sha256:b00fd1d1c7ce78b2abd54cd31c59c3e8c7b5631e9a1a7a3f653e7c44bd89afd1","area":"src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Module table can crash when the template has fewer than four columns and deliverables exist.","No tests or error handling are visible in this file.","Governance steering committee frequency is a rough calculation with no stated basis.","Workstream overview is a placeholder layout, as the code comments admit."]},"terms":[{"term":"python-pptx","meaning":"a library the code uses to create and edit PowerPoint files"},{"term":"slide layout","meaning":"a built-in page style in a PowerPoint file, such as Title or Blank, that new slides start from"},{"term":"template","meaning":"a record of the look of past proposals, such as sizes, colors, fonts and table columns, reused for new decks"},{"term":"Gantt-style chart","meaning":"a timeline drawn as bars, where each bar's position shows when a task starts and how long it runs"},{"term":"EMU","meaning":"a tiny unit of length used inside PowerPoint files, so that sizes are exact"}],"depends_on":["python-pptx","src/data_models.py","src/approach_analyzer.py (produces the template)"],"used_by":["Not visible in the files provided"],"sections":[{"start":1,"end":23,"kind":"setup","name":"File setup","id":"s1","hash":"d7a15d5cd890a23d","title":"Imports and module purpose","what":"Brings in the tools for building PowerPoint files and the project data types the replicator uses. The file header says it copies the layout of approved approach slides: timeline, governance, module and workstream slides.","why":"Needed so the rest of the file can build slides, tables, colors and shapes.","watch_out":"The math library is imported inside the functions that need it, not at the top, so any new function that uses math must import it too."},{"start":24,"end":82,"kind":"class","name":"ApproachSlideReplicator (part 1)","id":"s2","hash":"8ad0f760e95d48b5","title":"Starting the deck from the template","what":"Starts a new blank presentation sized to the template. Then it adds the slides in a fixed order: title, workstream overview, timeline, governance, and one module slide per workstream that has modules. Each slide is added only when its matching template exists.","why":"Each slide type is optional, so the app can still produce a deck when a past proposal lacked that slide style.","watch_out":"The template's size entry must include width, height, ratio and a 16:9 flag, or the build fails before any slide is made."},{"start":83,"end":140,"kind":"class","name":"ApproachSlideReplicator (part 2)","id":"s3","hash":"c7c8cca5c015650e","title":"Module slides and the summary count","what":"Adds one module detail slide for each workstream that has modules. Then it prints a summary of the slides and returns the deck. The printed list is fixed text, so it shows the same items even when some slide types were skipped.","why":"Gives the user progress messages while the build runs.","watch_out":"Because the printed list is fixed, it can say a slide was created when it was actually skipped."},{"start":141,"end":188,"kind":"class","name":"ApproachSlideReplicator (part 3)","id":"s4","hash":"a3e9096bbae7a4f2","title":"Title, project name and workstream overview","what":"Adds the project name under the title. Then it builds the workstream overview slide: one text box per workstream showing its name, duration in weeks and module count, stacked down the slide. The title color comes from the template, with black as the fallback.","why":"The overview gives a high-level view of the approach before the detail slides. The code comments say this layout is a simple placeholder that will later copy the template exactly.","watch_out":"Boxes are placed one inch apart with no limit, so many workstreams will run off the bottom of the slide."},{"start":189,"end":243,"kind":"method","name":"ApproachSlideReplicator: _create_timeline_slide","id":"s5","hash":"4627dfe77ceb5abd","title":"Choosing how to draw the timeline","what":"Creates a slide titled Project Timeline. It reads the timeline style from the template, using a table by default, and passes the work to the matching drawing routine.","why":"Past proposals used different timeline styles, so the code copies whichever style the template names.","watch_out":"Any style other than table or chart is drawn as bars, so an unexpected style value is handled without any warning."},{"start":244,"end":302,"kind":"class","name":"ApproachSlideReplicator (part 5)","id":"s6","hash":"23fec2e6420454a8","title":"Week table and bar chart drawing","what":"Draws the table version: one row per workstream, one column per week, with active weeks shaded green. Also draws the bar version, where each workstream is a labeled blue bar placed by its start week and length.","why":"The two styles need different drawing approaches, so each has its own routine.","watch_out":"The table is capped at 15 columns, so timelines longer than about 13 weeks are cut off with no warning."},{"start":303,"end":355,"kind":"class","name":"ApproachSlideReplicator (part 6)","id":"s7","hash":"be312e03fb2dafb2","title":"Bar labels, chart fallback and governance slide","what":"Writes each bar's duration label, such as 4w. The chart style simply draws bars, because a real editable chart is not built yet. Then builds the Governance and Meeting Cadence slide, with lines for the steering committee, working team and key workshops, each shown only when there is data for it.","why":"The chart fallback reason is stated in the code: a real chart needs extra data that is not written yet. Hiding empty lines keeps the slide clean when a proposal has little governance data.","watch_out":"Users who expect an editable chart will get drawn bars instead, and the steering committee wording is a rough guess."},{"start":356,"end":411,"kind":"method","name":"ApproachSlideReplicator: _extract_governance_info","id":"s8","hash":"a68628a8a184bf73","title":"Collecting governance details and starting module slides","what":"Scans every module for governance notes and collects three things: the steering committee frequency, whether weekly syncs exist, and the list of workshops. Then starts the module slide for one workstream, titled with its name and Modules and Activities, and creates an empty table sized from the template.","why":"Likely reason: governance notes are stored on each module, so they are gathered from the modules.","watch_out":"Each later module overwrites the steering committee value, and workshop names can repeat. The column count comes from the template and defaults to four."},{"start":412,"end":470,"kind":"class","name":"ApproachSlideReplicator (part 8)","id":"s9","hash":"1cfabd6f39d911b6","title":"Filling the module table and slide titles","what":"Fills the module table with a header row of Module, Duration, Key Activities and Deliverables, then one row per module. Each row shows the module name, its duration, up to three activities with a count of the rest, and up to three deliverables. It also defines the helper that adds a title to any slide.","why":"Keeps each row short enough to fit on the slide.","watch_out":"Writes to the third and fourth columns without checking how many columns exist, so a template with fewer than four columns that has deliverables will crash."},{"start":471,"end":502,"kind":"method","name":"ApproachSlideReplicator: export","id":"s10","hash":"69caea9f5345c080","title":"Saving the deck to a file","what":"Saves the finished deck to a file in the output exports folder, using the given name or Approach_Section.pptx by default. Returns the full path of the saved file.","why":"Gives the user a file they can open, and returns the path so other code can use it.","watch_out":"It raises an error if called before the deck is built, and it overwrites any existing file with the same name without asking."},{"start":503,"end":523,"kind":"function","name":"create_approach_presentation","id":"s11","hash":"aa4d657114d8486a","title":"One-step convenience function","what":"Builds the replicator, creates the deck, saves it and returns the file path, all in one call.","why":"Lets other code produce the approach deck with a single call.","watch_out":"The output folder is fixed to the default, so there is no way to choose a different folder through this function."}],"explained_at":"2026-11-11T23:44:23+00:00","explained_by":"haiku","summary":"Builds a new PowerPoint deck for the approach section of a proposal, copying the layout and styling of the analyzed template slides and filling them with the project's workstreams, timeline, governance and modules.","purpose":"Turns the generated project plan into PowerPoint slides that look like the firm's existing proposals, so the output can be used without manual reformatting.","why":"Likely reason: the analyzer extracts real layout details from past proposals, and this module applies them, so new decks match the house style.","how":"First the caller passes in the template and project. A blank deck is sized to the template. Then a title slide, workstream overview, timeline, governance slide and one module table per workstream are added in that order, each only if its template exists. The finished deck is saved to the output exports folder.","inputs":"A template dictionary from the approach analyzer, containing slide sizes and style details for each slide type. A ProjectStructure holding the project name, workstreams and their modules, activities and governance notes. An optional file name and output folder.","outputs":"A PowerPoint file named Approach_Section.pptx by default, saved in output/exports, and the path to that file is returned. Console messages report progress when verbose is on.","risks":"Module tables assume four columns and write to the third and fourth columns without checking. The workstream overview boxes can run off the bottom of the slide. Existing files with the same name are overwritten without warning.","debug":"Start with the template: if a slide is missing, its template key is probably None or empty. For a crash in the module table, check the template's table column count. For a wrong timeline, check the template's visualization type. Confirm the output folder exists and that the file is not open in PowerPoint.","summary_hash":"sha256:b00fd1d1c7ce78b2abd54cd31c59c3e8c7b5631e9a1a7a3f653e7c44bd89afd1","fresh":true},"src/content_generator.py":{"schema_version":1,"path":"src/content_generator.py","language":"Python","lines":186,"hash":"sha256:393f1adba86ce45d3d6f1ab47d748a2f5a96c77f741286f3dc67f634763884d5","area":"src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Explicit RFP workstreams are read but never used.","Reasoning and optimization results are not saved to the project.","No tests or error handling are visible.","Evidence counts depend on each agent setting a value that may never be set."]},"terms":[{"term":"RAG","meaning":"a search method that finds past proposal text similar to the current request, so the AI can learn from it"},{"term":"agent","meaning":"a part of the program that calls the AI model to do one job, such as finding dependencies"},{"term":"LLM","meaning":"large language model, the AI model that writes and reasons about text"},{"term":"API key","meaning":"a secret code that proves to the AI service that the program is allowed to use it"},{"term":"dependency","meaning":"a relationship where one piece of work must finish before another can start"}],"depends_on":["src/agents.py","src/data_models.py"],"used_by":["Not visible in the files provided"],"sections":[{"start":1,"end":17,"kind":"setup","name":"File setup","id":"s1","hash":"27db33235675b52c","title":"Imports and file purpose","what":"Brings in the four agents and the project data types. The header describes the file as orchestrating agents 3 to 6, which cover workstreams, dependencies, modules and timeline.","why":"Needed to build the pipeline from the agents and the shared data types.","watch_out":"The agent numbers in the header are the only record of their order, so keep them in step with the code if the pipeline changes."},{"start":18,"end":55,"kind":"class","name":"ContentGenerator (part 1)","id":"s2","hash":"102d4bb476e7eb16","title":"Setting up the agents","what":"Stores the search engine and LLM object, then creates the four agents with the same API key and model. Each agent is given the same search engine so it can look up past proposals.","why":"Shares one set of settings and one search tool across all agents, so they behave consistently.","watch_out":"The code reads specific attributes from the LLM object, so a different LLM class without those attributes will fail at startup."},{"start":56,"end":115,"kind":"method","name":"ContentGenerator: generate_content","id":"s3","hash":"1a6d24fb6572e839","title":"Generating workstreams, dependencies and the first steps","what":"Reads explicit workstreams and the duration from the RFP. Then looks up similar past proposals to build workstreams, and uses them to find dependencies. Prints progress messages for each step.","why":"The RFP names are read but the learned list replaces them, so the explicit list has no effect. Reason not stated in the code.","watch_out":"The RFP's explicit workstream names are read and then dropped, so the final plan may miss them. Reasoning returned by these steps is ignored."},{"start":116,"end":172,"kind":"class","name":"ContentGenerator (part 3)","id":"s4","hash":"19fa190be84ffe68","title":"Building modules, optimizing the timeline and returning the project","what":"For each workstream, builds its modules using the other workstreams and the RFP for context. Then the timeline optimizer rearranges work, using the target duration if one was given or the RFP duration otherwise. Finally it packages everything into a project and prints a summary.","why":"Modules are built one workstream at a time so each one gets its own focused request. The timeline step runs last because it needs the dependencies and modules.","watch_out":"Reasoning and optimization results are discarded here, so they cannot be reviewed later. Assigning modules to a workstream skips the duration check in the data model."},{"start":173,"end":186,"kind":"method","name":"ContentGenerator: get_evidence_summary","id":"s5","hash":"134894935e1c074d","title":"Reporting how much past evidence was used","what":"Returns the number of past proposal matches each agent used, defaulting to zero if an agent did not record a number.","why":"Gives a quick check of how much history shaped the result.","watch_out":"The code comment says this could be improved, so the counts may always show zero. Confirm the agents record their counts before trusting the numbers."}],"explained_at":"2026-11-11T23:44:23+00:00","explained_by":"haiku","summary":"Runs the main content pipeline for a proposal: it turns the RFP text into workstreams, dependencies, modules and an optimized timeline, using past proposals as examples.","purpose":"Coordinates four AI agents so that one call produces the full project structure from an RFP.","why":"Likely reason: each agent handles one step, and this file ensures they run in the correct order and share the same search tool.","how":"Creates four agents with the same API key and model. Pulls workstreams from the RFP and from past proposals. Then finds dependencies, builds modules for each workstream, optimizes the timeline, and returns the project.","inputs":"The full RFP text, a project name, and an optional target duration in weeks. The LLM object must provide an API key and model name.","outputs":"A ProjectStructure with workstreams, modules and dependencies. It also gives a summary of evidence counts from each agent.","risks":"Explicit workstreams taken from the RFP are discarded, so the RFP's own list may be ignored. Agent reasoning and optimization results are computed and then thrown away.","debug":"If the output lacks the RFP's workstreams, check whether explicit names were dropped. If the start fails, check that the LLM object has the expected key and model attributes. Watch the console messages for each agent's step.","summary_hash":"sha256:393f1adba86ce45d3d6f1ab47d748a2f5a96c77f741286f3dc67f634763884d5","fresh":true},"src/data_models.py":{"schema_version":1,"path":"src/data_models.py","language":"Python","lines":329,"hash":"sha256:25593ac2a73668a9d0965620da307f2824a78a63c8707cace30dedd28dded3ec","area":"src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Timestamp-based IDs may collide.","Relationship checks do not run when fields are changed later.","Uses an older validation style that may print warnings or need updates.","No tests are visible."]},"terms":[{"term":"Pydantic","meaning":"a library that checks data types and ranges when objects are created"},{"term":"validator","meaning":"a rule that runs automatically when an object is created and rejects bad values"},{"term":"enum","meaning":"a fixed list of allowed choices, such as low, medium or high"},{"term":"ID","meaning":"a unique code that identifies one item so other items can refer to it"},{"term":"ISO format","meaning":"a standard text layout for dates and times"}],"depends_on":["pydantic"],"used_by":["src/content_generator.py","src/approach_replicator.py","src/exports.py"],"sections":[{"start":1,"end":11,"kind":"setup","name":"File setup","id":"s1","hash":"6cd1f1c8e4d219c6","title":"Imports and file purpose","what":"Brings in the type tools, the validation library, date handling and the enum helper. The header says the file holds the data models for the Proposal Builder.","why":"Needed for the checks and defaults used by every class below.","watch_out":"The validator and class config styles are from an older version of the validation library, so an upgrade may change how they behave."},{"start":12,"end":18,"kind":"class","name":"RiskLevel","id":"s2","hash":"cd523a69653534cf","title":"Risk level choices","what":"Lists the three risk levels for activities: low, medium and high.","why":"Keeps risk values to a known set of words.","watch_out":"The values are stored as plain text, so the app must send exactly these spellings."},{"start":19,"end":26,"kind":"class","name":"GovernanceFrequency","id":"s3","hash":"a3b7d3620665ae3e","title":"Governance meeting frequency choices","what":"Lists the allowed meeting rhythms: weekly, biweekly, monthly and milestone.","why":"Keeps meeting frequency to known options.","watch_out":"The workstream default is monthly, so a workstream with no stated frequency will show monthly meetings."},{"start":27,"end":41,"kind":"class","name":"Evidence","id":"s4","hash":"f1f7ff9cb9feb6b6","title":"Evidence record","what":"Stores one piece of past proposal text that the search found, with its source file, document type, similarity score, extra details and time of retrieval.","why":"Lets the app show where a recommendation came from.","watch_out":"The document type is free text described only by a comment, so nothing stops a mistyped value."},{"start":42,"end":63,"kind":"class","name":"Activity","id":"s5","hash":"78ddcf3070be8338","title":"Activity record","what":"Describes one task inside a module: its name, duration between half a week and 20 weeks, outputs, dependencies, resources, risk, critical path flag and start and end weeks. The end week is worked out from the start and duration when the object is created.","why":"Lets the plan show the detail below each module.","watch_out":"The end week is calculated only once, so changing the start week later leaves the end week out of date. A start week of zero is treated as missing."},{"start":64,"end":96,"kind":"class","name":"Module","id":"s6","hash":"439fbb49e23602c5","title":"Module record","what":"Describes one module inside a workstream: its name, duration, start week, deliverables, activities, dependencies and governance notes. It can report its end week, and it checks that its activities do not add up to much more than its duration.","why":"The 1.5 times allowance lets some activities run in parallel, so the total can be larger than the module length. Likely reason: the code comment says the allowance is for parallel work.","watch_out":"The allowance is a fixed multiplier, so a large activity list can exceed the module length by up to half and still pass."},{"start":97,"end":137,"kind":"class","name":"Workstream","id":"s7","hash":"791e266a3282cd1d","title":"Workstream record","what":"Describes a top-level workstream: its name, duration between one and 52 weeks, start week, modules, dependencies, parallel work, meeting frequency, workshop flag, confidence and source files. Its check confirms that its modules fit within its duration.","why":"Keeps the plan in a shape that the timeline and exports can trust.","watch_out":"The module fit check runs only when the workstream is created. Assigning modules later, as the content generator does, skips the check, so an overfull workstream can slip through."},{"start":138,"end":162,"kind":"class","name":"DependencyGraph","id":"s8","hash":"19d83cfcb0eedc74","title":"Dependency map","what":"Holds the lists of what each workstream, module and activity depends on, plus groups of items that can run in parallel and the critical path items. Two helpers add a dependency and a parallel group.","why":"Keeps all the ordering rules in one place, so the timeline and exports read the same information.","watch_out":"The parallel group helper compares whole lists, so the same group written in a different order will be added twice."},{"start":163,"end":178,"kind":"class","name":"OptimizationResult","id":"s9","hash":"538d334a365ce19d","title":"Timeline optimization result","what":"Stores the before and after durations, the weeks saved, adjustments made, parallel blocks, risks, recommendations, the reasoning and a confidence score.","why":"Gives a record of what the optimizer changed and why.","watch_out":"The weeks saved is a stored number, not a calculation, so it can disagree with the two durations if one changes."},{"start":179,"end":195,"kind":"class","name":"AgentReasoning","id":"s10","hash":"cf4ccff3992385ea","title":"Agent reasoning record","what":"Records what one agent did: its name, what it was given, the evidence it used, its steps, its output, its confidence, how long it took and when.","why":"Makes the agents' decisions visible so a person can review them.","watch_out":"The content generator creates these records but does not save them, so reviews may find nothing."},{"start":196,"end":254,"kind":"class","name":"ProjectStructure (part 1)","id":"s11","hash":"6266a8d882739103","title":"Project record and basic checks","what":"The top-level container for a whole proposal: project name, RFP text, workstreams, dependencies, durations, governance, confidence, evidence, reasoning log, timestamps and optimization result. It can find a workstream by its ID and can report the total duration. The total is the optimized duration when it exists, or the latest end week otherwise.","why":"Gives the app one object to save, pass around and export.","watch_out":"The last modified time is reset every time the object is checked, so it does not show when a person last changed the plan."},{"start":255,"end":299,"kind":"method","name":"ProjectStructure: get_module_by_id","id":"s12","hash":"45a0cb13ede4cb26","title":"Finding modules and checking the whole structure","what":"Finds a module by its ID across all workstreams. Also runs a full check and returns a list of plain-language problems: duplicate workstream names, duplicate module names, a plan longer than the target, and workstream dependencies that point to missing items.","why":"Lets the app flag problems before a proposal is exported.","watch_out":"The full check runs only when called, and it does not check module dependencies, so some broken links will not be reported."},{"start":300,"end":329,"kind":"class","name":"ExportConfig","id":"s13","hash":"532202c0c7869f3d","title":"Export settings","what":"Holds the export choices: which extras to include, the color scheme, company and project names, and default lists of Excel sheets and PowerPoint slides.","why":"Gives one place to change export options.","watch_out":"The exporters in exports.py do not read these settings; they use their own fixed sheet and slide lists, so changing these defaults has no effect on the output."}],"explained_at":"2026-11-11T23:44:23+00:00","explained_by":"haiku","summary":"Defines the shapes of the project data, such as workstreams, modules and activities, and checks that values make sense when they are created.","purpose":"Gives the whole app one agreed structure for project data, so that errors are caught early.","why":"Likely reason: the AI output is free text, so these checks stop bad values from spreading through the app.","how":"Each class is a template with named fields. When a value is given, the library checks its type and range. Some classes also check relationships, such as whether modules fit inside a workstream's duration. Dates and IDs get default values when not supplied.","inputs":"Values for each field, usually produced by the agents or read from files.","outputs":"Validated objects that other modules read, plus a list of structure problems from ProjectStructure validation.","risks":"Relationship checks run only when an object is created, so later edits can break the rules. IDs are built from timestamps, so two items created at the same moment could share an ID. The export settings are not read by the exporters.","debug":"If creation fails, read the error text: it names the field and the limit that was broken. For a missing ID, check the ID's timestamp source. For odd duration totals, check whether modules were edited after creation.","summary_hash":"sha256:25593ac2a73668a9d0965620da307f2824a78a63c8707cace30dedd28dded3ec","fresh":true},"src/exports.py":{"schema_version":1,"path":"src/exports.py","language":"Python","lines":634,"hash":"sha256:9d127565ae196da8eaedd4deedf87bb0c21004668eeb3d0a180ce9834710a3aa","area":"src","status":"explained","summary_stale":false,"readiness":{"status":"not-ready","reasons":["Read by reading only, not run: the Excel timeline sheet appears to fail because range needs whole numbers but durations are decimal numbers, and the export stops before saving.","The output folder argument is accepted but never used.","End week values are one higher than the data model's own end week.","Unused imports such as pandas must still be installed or the file will not load."]},"terms":[{"term":"openpyxl","meaning":"a library that creates and styles Excel files"},{"term":"pandas","meaning":"a library for working with tables of data, imported here but not used in the visible code"},{"term":"range","meaning":"a Python instruction that counts through whole numbers from a start to an end"},{"term":"workbook","meaning":"an Excel file that holds one or more sheets"},{"term":"template","meaning":"a saved record of a past proposal's look, such as colors, fonts and sizes"}],"depends_on":["pandas","openpyxl","python-pptx","src/data_models.py","src/template_extractor.py"],"used_by":["Not visible in the files provided"],"sections":[{"start":1,"end":32,"kind":"setup","name":"File setup","id":"s1","hash":"7c0b1a6be9d88823","title":"Imports and file purpose","what":"Brings in the Excel and PowerPoint libraries, the project data types and the template reader. The header says the file creates professional Excel and PowerPoint exports.","why":"Needed so the file can build both kinds of output.","watch_out":"Several imports, such as pandas and the chart tools, are not used in the visible code, but the file will not load if they are missing."},{"start":33,"end":72,"kind":"class","name":"ExcelExporter (part 1)","id":"s2","hash":"78f398b5c48b7758","title":"Excel exporter setup and styling helpers","what":"Creates an empty workbook and removes its default sheet. Also provides two helpers: one that colors header rows dark blue with white bold text, and one that adds thin borders around a block of cells.","why":"Keeps every sheet looking the same without repeating the styling code.","watch_out":"The helpers assume the cell range is correct, so a wrong range puts borders or colors in the wrong place."},{"start":73,"end":132,"kind":"method","name":"ExcelExporter: create_summary_sheet","id":"s3","hash":"0201001501a45d2a","title":"Executive summary sheet","what":"Creates the first sheet with the project name, counts of workstreams, modules and activities, the total duration, the export time, and a table of workstreams with their start, duration, counts and end week.","why":"Gives a one-page overview a reader can check before opening the detailed sheets.","watch_out":"The end week is the start plus the duration, which is one week more than the last active week. The total duration also fails if the project has no workstreams."},{"start":133,"end":185,"kind":"class","name":"ExcelExporter (part 3)","id":"s4","hash":"ccc2c9fd11f00a03","title":"Workstreams sheet","what":"Creates a sheet with one row per workstream: its ID, name, start week, duration, end week, and the names of the workstreams it depends on or runs in parallel with.","why":"Gives a flat list that is easy to filter or sort in Excel.","watch_out":"The end week uses the same start plus duration rule and can be one week too long."},{"start":186,"end":225,"kind":"method","name":"ExcelExporter: create_modules_sheet","id":"s5","hash":"3ed1e8cebf53719e","title":"Modules sheet","what":"Creates a sheet with one row per module: its workstream, ID, name, start week, duration, end week and activity count.","why":"Lets a reader scan all modules across workstreams in one table.","watch_out":"The end week has the same one-week-too-long issue, and the sheet is blank when no modules exist."},{"start":226,"end":279,"kind":"method","name":"ExcelExporter: create_activities_sheet","id":"s6","hash":"e56df0fd48f13499","title":"Activities sheet","what":"Creates a sheet with one row per activity: workstream, module, ID, name, duration, risk level, the first three outputs, and dependency IDs.","why":"Gives the most detailed view of the plan for delivery teams.","watch_out":"Dependencies show raw IDs rather than activity names, which is hard for a non-programmer to read."},{"start":280,"end":326,"kind":"method","name":"ExcelExporter: create_timeline_sheet","id":"s7","hash":"f42af19d0af815c3","title":"Timeline sheet","what":"Creates a text timeline with one row per workstream and one column per week. Active weeks are filled with a solid block and a blue background.","why":"Gives a visual Gantt view that works without any chart tools.","watch_out":"It appears to crash: the week counts come from decimal durations, but the week loop needs whole numbers. Because export calls this step before saving, no Excel file is produced. Also, column letters past Z are wrong."},{"start":327,"end":360,"kind":"method","name":"ExcelExporter: export","id":"s8","hash":"cc53eb4b685783b1","title":"Building and saving the Excel file","what":"Creates all five sheets in order, names the file from the project name with unsafe characters removed, saves it to output/exports and returns the path.","why":"Puts the sheets together into the single file the user receives.","watch_out":"The output folder is fixed, so the file always goes to output/exports, and any failure in an earlier sheet stops the save."},{"start":361,"end":397,"kind":"class","name":"PowerPointExporter (part 1)","id":"s9","hash":"93e5d2784653e92e","title":"PowerPoint exporter setup","what":"Creates an empty deck, then gets its style either from a template passed in or by reading the template from the proposals folder. It sets the slide size and stores the colors and fonts for later use.","why":"Makes the deck match real proposals rather than a generic look.","watch_out":"If the proposal template is missing or lacks the expected keys, this step fails before any slide is made."},{"start":398,"end":454,"kind":"method","name":"PowerPointExporter: _add_title_slide","id":"s10","hash":"36382f2ef01933d8","title":"Title slide and bullet slide helper","what":"Adds the title slide with the project name, a Proposal Structure subtitle and today's date. Also defines a helper that adds a titled slide with a bulleted list of items.","why":"Gives every deck a consistent title, and the helper avoids repeating the bullet code.","watch_out":"The bullet helper uses a layout with a built-in content area that is left empty, which may show an empty placeholder in PowerPoint's edit view."},{"start":455,"end":494,"kind":"method","name":"PowerPointExporter: _add_summary_slide","id":"s11","hash":"91f4f2ee6535e503","title":"Summary and workstream slides","what":"Adds an executive summary slide with four key counts and duration. Also builds the workstream overview slide and one detail slide per workstream that has modules, listing duration, start week and each module with its activity count.","why":"Walks the reader from the overall picture to the details.","watch_out":"Long module lists have no size control, so they can run past the bottom of the slide."},{"start":495,"end":549,"kind":"method","name":"PowerPointExporter: _add_timeline_slide","id":"s12","hash":"1e4862c870fe28c2","title":"Timeline slide drawing","what":"Adds a slide titled Project Timeline with one labeled colored bar per workstream, placed by start week and sized by duration. Colors cycle through the template's chart colors.","why":"Gives a quick visual of when each workstream runs.","watch_out":"The code comment says the slide uses a blank layout, but layout number 5 is commonly a title layout, which may leave an empty title box. Bar positions use decimal values that have not been tested in PowerPoint."},{"start":550,"end":603,"kind":"class","name":"PowerPointExporter (part 5)","id":"s13","hash":"a59efe724f88f6f3","title":"Timeline bar labels and file saving","what":"Writes each bar's duration label in white, such as 4w. Then the export step builds all slides in order, names the deck from the project name, saves it to output/exports and returns the path.","why":"Labels make each bar readable at a glance.","watch_out":"Calling export twice on the same object adds the slides twice, so create a new exporter for each file."},{"start":604,"end":634,"kind":"function","name":"export_project","id":"s14","hash":"800055ec3548714e","title":"One-step export function","what":"Runs the Excel and PowerPoint exports for a project, prints each saved path, and returns a dictionary of the two file paths.","why":"Gives the user a single call to produce both files.","watch_out":"The output folder argument is accepted but never passed on, so the files always go to the fixed default folder."}],"explained_at":"2026-11-11T23:44:23+00:00","explained_by":"haiku","summary":"Writes the finished project to an Excel workbook and a PowerPoint deck, with summary tables, a text timeline and bar timelines.","purpose":"Lets the user take the generated plan out of the app and into files they can share or edit.","why":"Likely reason: proposals are normally delivered as Excel and PowerPoint files, so the app produces both.","how":"Builds a workbook with five sheets: summary, workstreams, modules, activities and timeline. Builds a deck with a title, summary, workstream list, one slide per workstream and a timeline. Each file is saved under output/exports.","inputs":"A ProjectStructure with workstreams, modules and activities. An optional template for the PowerPoint look, which is otherwise read from the proposals folder.","outputs":"An Excel file and a PowerPoint file in output/exports, with the paths printed and returned.","risks":"The Excel timeline sheet appears to crash because it uses decimal durations where whole numbers are required. The output folder setting is ignored. Several end week values are one week too long.","debug":"If Excel export fails, look at the timeline sheet first. If the file lands in the wrong folder, look at export_project and the fixed output paths. If the deck looks wrong, check the template that was read from the proposals folder.","summary_hash":"sha256:9d127565ae196da8eaedd4deedf87bb0c21004668eeb3d0a180ce9834710a3aa","fresh":true},"src/governance_calculator.py":{"schema_version":1,"path":"src/governance_calculator.py","language":"Python","lines":366,"hash":"sha256:d9415e73d26ea5babd8e330fa7c9ad2fd2052b6a10e1f642266d42d055eaa8b7","area":"src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No tests are visible.","Several bare except clauses can hide errors.","The weekly schedule is not driven by the evidence."]},"terms":[{"term":"SteerCo","meaning":"the steering committee, the senior group that oversees a project"},{"term":"RAG engine","meaning":"the component that searches stored past documents by meaning"},{"term":"Median","meaning":"the middle value in a sorted list, which is less affected by one extreme value than an average"},{"term":"Regular expression","meaning":"a text pattern used to find numbers or phrases in writing"},{"term":"Evidence","meaning":"the past proposal text that the estimate is based on"}],"depends_on":["a RAG engine object passed in by the caller","Python standard library: re, statistics, collections"],"used_by":[],"sections":[{"start":1,"end":15,"kind":"setup","name":"File setup","id":"s1","hash":"78b10de95b3a0bfa","title":"Module setup and imports","what":"Loads the helpers for pattern matching, counting and averages, and describes the module as a schedule estimator.","why":"These helpers are needed by the calculations below.","watch_out":""},{"start":16,"end":75,"kind":"class","name":"GovernanceCalculator (part 1)","id":"s2","hash":"6829478c8d55e5d7","title":"Creating the calculator and starting the estimate","what":"Stores the RAG engine and the verbose setting. The main estimate searches past proposals, reads their meeting patterns, and then calculates the SteerCo and weekly schedules.","why":"Likely reason: the calculator needs past evidence before it can estimate anything.","watch_out":"Workstreams are read by their name attribute, so each item in the list must be an object that has a name."},{"start":76,"end":121,"kind":"class","name":"GovernanceCalculator (part 2)","id":"s3","hash":"22de077854d6e148","title":"Assembling the result and finding similar projects","what":"Packs the two schedules and the evidence count into one result. The similar-project search asks the RAG engine for governance and meeting text, then keeps only passages that mention SteerCo, steering, governance or meeting.","why":"Likely reason: the similar-project search supplies the raw evidence the rest of the calculation depends on.","watch_out":"Good evidence phrased with other words is dropped, because only four keywords pass the filter."},{"start":122,"end":173,"kind":"method","name":"GovernanceCalculator: _extract_steerco_patterns","id":"s4","hash":"5af1938a3d7b85e7","title":"Reading SteerCo frequency","what":"Scans each past project's text for how often the SteerCo meets, such as bi-weekly, fortnightly or monthly, or a stated number of weeks.","why":"Turns free-form proposal wording into numbers the calculation can use.","watch_out":"Only the first matching frequency phrase in each project is used, and phrases in unrelated sentences can match."},{"start":174,"end":228,"kind":"class","name":"GovernanceCalculator (part 4)","id":"s5","hash":"5497141b22f9813b","title":"Reading meeting counts, lengths and weekly meetings","what":"Finds the stated number of SteerCo meetings (kept only between 2 and 20) and project lengths in weeks (4 to 52, with months converted to weeks). It also counts projects that mention weekly meetings.","why":"Likely reason: the range limits discard numbers that are unlikely to be meeting counts or project lengths.","watch_out":"Meeting counts and lengths are stored in separate lists, so a project's length can be paired with another project's meeting count."},{"start":229,"end":286,"kind":"method","name":"GovernanceCalculator: _calculate_steerco_schedule","id":"s6","hash":"66d80c9c4e905700","title":"Estimating the SteerCo meeting count","what":"Turns the evidence into a SteerCo meeting count using the median of past length-to-meeting ratios, falling back to frequency when that is not possible. It then keeps the count within a reasonable range and prints the working when verbose.","why":"Likely reason: a median limits the effect of one unusual past project.","watch_out":"Because the pairing is by list position, one misaligned pair can shift the whole estimate."},{"start":287,"end":326,"kind":"class","name":"GovernanceCalculator (part 6)","id":"s7","hash":"500d3ec6a6b8c7a5","title":"Building the SteerCo result and weekly schedule","what":"Returns the SteerCo result (count, frequency, description and evidence count) and the weekly schedule. The weekly schedule always equals the project length in weeks.","why":"Likely reason: weekly meetings are assumed by design, and the historical share is shown only for information.","watch_out":"The weekly count is not checked against the evidence, so it stays at one per week even if past projects rarely held weekly meetings."},{"start":327,"end":366,"kind":"method","name":"GovernanceCalculator: _describe_cadence","id":"s8","hash":"8cedd5fd039a7a5d","title":"Turning a frequency into plain words","what":"Converts a frequency in weeks into a label such as Weekly, Bi-weekly, Monthly, or Every N weeks. It also prints the summary of the results when verbose.","why":"So readers see a label such as Bi-weekly rather than a decimal number.","watch_out":"The ranges are fixed, so a frequency just outside a range gets the generic Every N weeks label."}],"explained_at":"2026-11-11T23:48:18+00:00","explained_by":"haiku","summary":"Estimates how many Steering Committee (SteerCo) meetings and weekly meetings a project should have, using patterns found in similar past proposals.","purpose":"Suggest a governance meeting plan for a new proposal, with a count of the evidence behind it.","why":"Likely reason: so the meeting plan reflects what similar past projects did rather than a guess. The module docstring states this.","how":"Search past proposals for governance text, pull out meeting frequency, meeting counts and project lengths, then estimate the number of SteerCo meetings. Weekly meetings are set to one per project week.","inputs":"A list of workstream objects (each needs a name), the project length in weeks, and a RAG engine for searching past proposals.","outputs":"A dictionary with a SteerCo entry (total meetings, frequency, description, evidence count), a weekly entry, and the number of similar projects found.","risks":"Weekly meetings always equal the project length, regardless of evidence. SteerCo lengths and meeting counts are paired by list position, not by source project. With no evidence, a bi-weekly default is used without any warning in the result.","debug":"Turn on verbose to see the count of historical data points. A count of zero means the search found no governance text, so check the query, the indexed proposals and the RAG engine.","summary_hash":"sha256:d9415e73d26ea5babd8e330fa7c9ad2fd2052b6a10e1f642266d42d055eaa8b7","fresh":true},"src/human_in_loop.py":{"schema_version":1,"path":"src/human_in_loop.py","language":"Python","lines":319,"hash":"sha256:1d315f95345523983a28a3209ecca680769073a60c286b2927e4e7abaa0bb142","area":"src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No tests are visible.","Behavior depends on keyboard input, which is hard to test automatically.","The RFP list lookup may miss files."]},"terms":[{"term":"Human in the loop","meaning":"a design where a person can check or override automated steps"},{"term":"RAG engine","meaning":"the component that searches stored past documents by meaning"},{"term":"Similarity score","meaning":"a number that says how close a match is, where lower means closer in this code"},{"term":"Interactive mode","meaning":"the setting that turns the prompts on or off"},{"term":"Default template","meaning":"the built-in fallback used when no specific template is chosen"}],"depends_on":["Python standard library: pathlib, typing","a RAG engine object (for get_all_rfps_from_rag)"],"used_by":[],"sections":[{"start":1,"end":11,"kind":"setup","name":"File setup","id":"s1","hash":"20cc1e60706d5cc0","title":"Module setup","what":"Loads the path and type helpers and describes the module as the place for human check points.","why":"Needed for file path handling and type labels.","watch_out":""},{"start":12,"end":71,"kind":"class","name":"HumanInLoop (part 1)","id":"s2","hash":"b494e3001319328a","title":"Setup and RFP match confirmation","what":"Creates the class with an interactive switch. It then shows the automatic RFP match and its score, and asks whether to accept it, pick another, or skip matching.","why":"Likely reason: an automatic match can be wrong, so a person can confirm it.","watch_out":"When interactive is off, the automatic match is accepted silently."},{"start":72,"end":120,"kind":"class","name":"HumanInLoop (part 2)","id":"s3","hash":"cc5c3330e589a2a9","title":"Template confirmation","what":"Shows the automatically chosen proposal template and asks whether to accept it, pick another, or use the default.","why":"Likely reason: the same as the RFP check, the automatic choice may be wrong.","watch_out":"Choosing the default returns nothing, so the caller must handle a None value."},{"start":121,"end":171,"kind":"method","name":"HumanInLoop: review_generated_content","id":"s4","hash":"42563fb2173f0776","title":"Review of generated content","what":"Shows the project name, workstreams, durations and first two modules of each workstream, then asks whether to continue or stop the run.","why":"Lets a person catch a poor structure before it is used.","watch_out":"Only the first two modules per workstream are shown, so problems in later modules are hidden here."},{"start":172,"end":218,"kind":"method","name":"HumanInLoop: review_governance","id":"s5","hash":"af2d56087b34ea89","title":"Governance schedule review","what":"Shows the SteerCo and weekly meeting plan and asks whether to keep it or use the standard bi-weekly SteerCo and weekly meetings.","why":"A person can reject an estimate built on weak evidence.","watch_out":"The menu says use defaults but the function returns False, so the caller must treat False as use defaults, not stop."},{"start":219,"end":253,"kind":"method","name":"HumanInLoop: _select_rfp_manually","id":"s6","hash":"6710a17401375c76","title":"Manual RFP selection","what":"Lists the RFP files, lets the user type a number, and returns that file name, or nothing if 0 is typed.","why":"Gives a fallback when the automatic match is wrong.","watch_out":"Entries that are not numbers are rejected and asked again, and typing 0 returns None rather than an error."},{"start":254,"end":296,"kind":"method","name":"HumanInLoop: _select_template_manually","id":"s7","hash":"9489f895fb871a8b","title":"Manual template selection","what":"Lists the proposal template files in the folder, sorted by name, and returns the full path of the chosen one, or nothing for the default.","why":"Likely reason: same as the RFP choice, to let a person override the automatic template.","watch_out":"Sorting is by file name, so the numbers shift when a file is added or renamed."},{"start":297,"end":319,"kind":"function","name":"get_all_rfps_from_rag","id":"s8","hash":"66ef789ba055c433","title":"Listing RFPs from the database","what":"Asks the RAG database for RFP text and returns a sorted list of unique RFP file names.","why":"Feeds the RFP choice list so the user picks from files that really exist in the database.","watch_out":"It fetches only the top 100 matching chunks for one general query, so RFPs with little matching text can be missing from the list."}],"explained_at":"2026-11-11T23:48:18+00:00","explained_by":"haiku","summary":"Provides the console prompts that let a person check and override the automatic RFP match, template choice, generated content and governance schedule.","purpose":"Let a person approve or change automated decisions before the proposal is built.","why":"The module docstring states it provides human oversight at key decision points.","how":"Each check prints a summary, shows numbered choices, waits for a typed answer, and repeats until the answer is valid. Some choices open a numbered list of RFPs or proposal templates.","inputs":"Typed answers from the keyboard, plus the matched RFP name or template path, similarity score, governance dictionary and project structure.","outputs":"The chosen RFP file name or None, the chosen template path or None, and True or False for proceed or accept.","risks":"The prompts block until someone types an answer, so an automated run must set interactive to False. A False answer on governance means defaults are used, which is easy to misread.","debug":"If a prompt seems stuck, check whether the interactive setting is on and whether the program is waiting for input. If lists are empty, check the database query and the proposals folder path.","summary_hash":"sha256:1d315f95345523983a28a3209ecca680769073a60c286b2927e4e7abaa0bb142","fresh":true},"src/rag_engine.py":{"schema_version":1,"path":"src/rag_engine.py","language":"Python","lines":650,"hash":"sha256:8cbc67255f2e81f7200e487a2c4ac502e1d8d8b706fdc42ad1c2111b99fe5946","area":"src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No tests are visible.","Re-indexing duplicates chunks.","Relies on private database library attributes.","Most failures are printed and turned into empty results."]},"terms":[{"term":"RAG","meaning":"retrieval augmented generation, a method that looks up stored text before a language model answers"},{"term":"Embedding","meaning":"a list of numbers that represents the meaning of a piece of text"},{"term":"Vector database","meaning":"a store that finds the stored items whose embeddings are closest to a query"},{"term":"Chunk","meaning":"a piece of a document, small enough to store and search on its own"},{"term":"Chroma","meaning":"the vector database library used here"},{"term":"Chunk overlap","meaning":"text repeated at the edge of neighboring chunks so context is not lost at a cut"},{"term":"pdfplumber","meaning":"a library that reads text from PDF files"},{"term":"python-pptx","meaning":"a library that reads and writes PowerPoint files"}],"depends_on":["pdfplumber","python-pptx","langchain-openai","langchain-text-splitters","langchain-chroma or langchain-community","src/data_models.py"],"used_by":["src/rfp_matcher.py","src/semantic_approach_detector.py","src/governance_calculator.py","src/human_in_loop.py"],"sections":[{"start":1,"end":26,"kind":"setup","name":"File setup","id":"s1","hash":"5940eb607ef6d03d","title":"Imports and fallback database library","what":"Loads the PDF and PowerPoint readers, the embedding and text-splitting tools, and the vector database. If the newer database package is missing, it falls back to the older one.","why":"The fallback lets the program run with either version of the database package.","watch_out":"If neither package is installed, the program stops when this file loads."},{"start":27,"end":62,"kind":"class","name":"RAGEngine (part 1)","id":"s2","hash":"edc2fd8f183386f8","title":"Creating the engine","what":"Creates the database folder, sets the embedding model, chunk size and overlap, and opens the collection that holds RFPs and proposals.","why":"Chunk settings control how much text each search result contains.","watch_out":"Changing the embedding model later makes stored vectors incompatible with new ones, so the database must be rebuilt."},{"start":63,"end":116,"kind":"method","name":"RAGEngine: extract_pdf_text","id":"s3","hash":"8e8386dbd201f667","title":"Reading PDF and slide text","what":"Pulls text out of each page of a PDF, labeling each page and skipping pages that fail. It also collects the text from each PowerPoint slide, labeling each slide so later results can cite slide numbers. A file that cannot be read returns empty text.","why":"Likely reason: one bad page should not lose the whole RFP.","watch_out":"Image-only pages produce no text, and shapes without a text attribute, such as many tables and groups, may be skipped."},{"start":117,"end":171,"kind":"method","name":"RAGEngine: extract_approach_section","id":"s4","hash":"4748d8e1c55f185f","title":"Approach-only slide extraction","what":"Keeps only slides that mention approach-related words such as timeline, governance, module or Gantt, and labels them as approach slides.","why":"Likely reason: those slides are the most useful pattern source, so they are indexed again with extra weight.","watch_out":"A keyword anywhere on a slide counts, so a slide with an unrelated use of schedule can be included."},{"start":172,"end":217,"kind":"method","name":"RAGEngine: chunk_document","id":"s5","hash":"42fbbacb5a980abc","title":"Splitting text into chunks","what":"Splits proposal text slide by slide, and splits large slides by paragraph. It splits RFP text into overlapping pieces. Each piece is tagged with its source and type.","why":"Likely reason: proposals keep slides whole for context, and RFPs use overlap so context is not cut at a boundary.","watch_out":"Chunk sizes count characters, not meaning, so a chunk can end mid-thought."},{"start":218,"end":275,"kind":"class","name":"RAGEngine (part 5)","id":"s6","hash":"b28fb9db2f84c2f6","title":"Chunk splitting, continued","what":"Finishes the paragraph split for large slides and keeps small slides whole. For RFP pieces it checks the first three lines for words such as scope or deliverable, and stores the first matching line as a section label.","why":"Likely reason: the section label lets results show which part of the RFP they came from.","watch_out":"Only the first three lines are checked, so a piece without those words gets an empty label."},{"start":276,"end":332,"kind":"method","name":"RAGEngine: index_documents","id":"s7","hash":"9cca5fac2f0ee75a","title":"Indexing RFP files","what":"Goes through every RFP PDF in the RFP folder, extracts and splits its text, and stores the pieces. It then moves on to the proposal files.","why":"Keeps RFPs and proposals as separate kinds so searches can target one kind.","watch_out":"Nothing checks whether a file is already stored, so running this again adds duplicate pieces."},{"start":333,"end":389,"kind":"class","name":"RAGEngine (part 7)","id":"s8","hash":"0bf1ed9a32fe2a4e","title":"Indexing proposal files","what":"Goes through every proposal file, stores its full text, and stores a second weighted copy of its approach slides. It records how many pieces each file produced.","why":"Likely reason: approach pieces are marked high priority so retrieval can favor them.","watch_out":"A proposal that fails is recorded as an error and skipped, while the rest still index."},{"start":390,"end":439,"kind":"class","name":"RAGEngine (part 8)","id":"s9","hash":"697c6dc803e9a336","title":"Indexing summary log","what":"Records the indexing result (total pieces, counts by kind, errors, time taken) in a log, prints a summary when verbose, and finishes the indexing run.","why":"Gives a record to check after a run to see what was indexed.","watch_out":"The log is kept in memory only and is lost when the program stops."},{"start":440,"end":498,"kind":"class","name":"RAGEngine (part 9)","id":"s10","hash":"52938af65bf872bf","title":"Running a search","what":"Runs a similarity search for the query, optionally limited to some document kinds. It turns the results into evidence records sorted with the closest first, and logs the search.","why":"Likely reason: if the filter is not supported, it searches a wider set and filters the results by hand.","watch_out":"Sorting is ascending because a lower score means a closer match."},{"start":499,"end":556,"kind":"class","name":"RAGEngine (part 10)","id":"s11","hash":"0e0fbb1f5d1369b3","title":"Search results and error handling","what":"Returns the ranked results, or an empty list if the search fails. It also starts the approach-focused search by building its query.","why":"Likely reason: failures return empty results instead of stopping the run.","watch_out":"An empty result looks the same whether nothing matched or the search failed, so errors show only in printed output."},{"start":557,"end":601,"kind":"class","name":"RAGEngine (part 11)","id":"s12","hash":"59e54babdb4ff850","title":"Approach-focused search ranking","what":"Ranks approach-section results ahead of general ones by lowering their score by 30 percent, then returns approach results only or a 70 to 30 mix.","why":"Likely reason: pattern learning should mostly use approach-section material.","watch_out":"Because the boost changes the score, a weaker raw match can rank above a stronger one."},{"start":602,"end":650,"kind":"method","name":"RAGEngine: get_collection_stats","id":"s13","hash":"31775511bdc62cd5","title":"Database statistics and reset","what":"Reports how many pieces and sources are stored, split into RFP and proposal counts. It can also delete and recreate the collection to clear it.","why":"Lets the owner check the database and wipe it before a clean re-index.","watch_out":"The reset uses private parts of the database library, which may break after an upgrade, and its failures are only printed."}],"explained_at":"2026-11-11T23:48:18+00:00","explained_by":"haiku","summary":"Reads RFP PDFs and proposal PowerPoint files, splits them into pieces, stores them in a searchable vector database, and returns the pieces most similar to a question.","purpose":"Give the other agents a searchable memory of past RFPs and proposals, with a log of what was found.","why":"Likely reason: similarity search finds related past work by meaning rather than exact words. The module docstring states it provides visibility into retrieval.","how":"Extract text from PDFs and slides, optionally extract approach slides with extra weight, split the text into chunks, store the chunks with embeddings, then answer searches with ranked results and logs.","inputs":"An API key for the embedding service, the database folder, the RFP and proposal folders, chunk size and overlap settings, and for searches the query text, optional document types and the number of results wanted.","outputs":"Indexing summaries and logs, lists of Evidence records (source file, type, content, score), and collection statistics.","risks":"Indexing the same files again adds duplicate chunks because nothing checks for existing ones. A lower score means a closer match, which is easy to misread. The clear and stats methods use private parts of the database library that can change between versions. Embedding calls use the paid API.","debug":"Read the indexing summary for errors. If searches return nothing, check the collection stats and whether indexing ran. For duplicate results, clear the collection and index again. If searches fail, check the API key.","summary_hash":"sha256:8cbc67255f2e81f7200e487a2c4ac502e1d8d8b706fdc42ad1c2111b99fe5946","fresh":true},"src/rfp_matcher.py":{"schema_version":1,"path":"src/rfp_matcher.py","language":"Python","lines":151,"hash":"sha256:e3527335956e11c961e6aa6efb242df9407b15f71b2f33952be520af2626421c","area":"src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No tests are visible.","Averaging is a judgment call that may not reflect true similarity.","The return type does not match the value returned when nothing is found."]},"terms":[{"term":"RFP","meaning":"request for proposal, the document a client issues to ask for bids"},{"term":"Similarity score","meaning":"a number for how close two pieces of text are, where lower means closer here"},{"term":"Chunk","meaning":"a piece of a document stored for search"},{"term":"Dataclass","meaning":"a simple Python record type that stores named fields"}],"depends_on":["src/rag_engine.py (the RAG engine object passed in)"],"used_by":[],"sections":[{"start":1,"end":12,"kind":"setup","name":"File setup","id":"s1","hash":"357eba9b54b3444a","title":"Module setup","what":"Loads the typing, file path and record helpers, and describes the module's job.","why":"Needed for the record type and file names.","watch_out":""},{"start":13,"end":21,"kind":"class","name":"RFPMatch","id":"s2","hash":"ca1be2eddc726871","title":"Match result record","what":"Defines the record that holds the matched file name, its score, how many pieces matched, and the top snippets.","why":"Gives the rest of the program one standard result shape.","watch_out":""},{"start":22,"end":80,"kind":"class","name":"RFPMatcher (part 1)","id":"s3","hash":"f0d186901ef87461","title":"Setup and search for similar RFPs","what":"Stores the RAG engine and runs the search on the first 2000 characters of the new RFP. It asks for five times the requested number of results so there is enough to group.","why":"Likely reason: more results give a fuller picture per file before averaging.","watch_out":"Only the first 2000 characters are used, so later requirements do not affect the match."},{"start":81,"end":130,"kind":"class","name":"RFPMatcher (part 2)","id":"s4","hash":"32f46aed96213649","title":"Ranking RFPs by average score","what":"Groups results by source file, averages each file's scores, sorts so the lowest (closest) comes first, and returns the best one. Alternatives are printed when verbose.","why":"Averaging gives one number per file to compare.","watch_out":"A file with a single strong match can outrank a file with many good matches, because only the average is compared."},{"start":131,"end":151,"kind":"method","name":"RFPMatcher: extract_rfp_name","id":"s5","hash":"8631e653b9565ce0","title":"Turning a file name into a base name","what":"Removes the file extension and common RFP suffixes such as _RFP from a file name, returning a short base name such as a client name.","why":"Likely reason: templates are named by client, so the file name must be cleaned to match.","watch_out":"The suffix is removed wherever it appears in the name, not only at the end."}],"explained_at":"2026-11-11T23:48:18+00:00","explained_by":"haiku","summary":"Finds which past RFP in the database is most similar to a new RFP, so that RFP's proposal can serve as the template.","purpose":"Pick the closest historical RFP automatically.","why":"The module docstring states it determines which proposal template to use.","how":"Take the first 2000 characters of the new RFP, search stored RFP pieces, group results by source file, average each file's scores, and pick the file with the lowest average.","inputs":"The new RFP's text and a number of alternatives to show.","outputs":"A match record with the file name, average similarity score, number of matching pieces and top snippets. Returns nothing when no RFPs are stored.","risks":"Averages ignore how many pieces matched. Only the first 2000 characters are used. The return type says RFPMatch but None is returned when nothing is found, so callers must check.","debug":"Confirm that RFPs are indexed. Read the printed alternatives and scores. If the wrong file wins, compare match counts and consider the opening text used.","summary_hash":"sha256:e3527335956e11c961e6aa6efb242df9407b15f71b2f33952be520af2626421c","fresh":true},"src/rfp_parser.py":{"schema_version":1,"path":"src/rfp_parser.py","language":"Python","lines":106,"hash":"sha256:a1b72f548215cea5c8b271c2bfc6d0039b963ecf0fdbae37b871eacd1c106b0a","area":"src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No tests are visible.","The label search can pick up wrong phrases.","Scanned PDFs are not supported."]},"terms":[{"term":"PDF","meaning":"a portable document file format"},{"term":"pdfplumber","meaning":"a library that reads text from PDF files"},{"term":"OCR","meaning":"optical character recognition, reading text from images of pages"},{"term":"Regular expression","meaning":"a text pattern used to find labels or phrases"},{"term":"Dictionary","meaning":"a set of named values, such as a project name and a page count"}],"depends_on":["pdfplumber"],"used_by":[],"sections":[{"start":1,"end":12,"kind":"setup","name":"File setup","id":"s1","hash":"e5b85a6dcd6e25fb","title":"Module setup","what":"Loads the PDF reader, the file path helper, the type labels and the pattern-matching tool.","why":"Needed to read PDFs and search their text.","watch_out":""},{"start":13,"end":67,"kind":"function","name":"parse_rfp (part 1)","id":"s2","hash":"35f60450143605f3","title":"Reading the PDF and the file-name project name","what":"Checks the file exists, reads text from every page into one block, and takes a starting project name from the file name with RFP suffixes removed.","why":"Likely reason: a page that fails is skipped with a warning so one bad page does not stop the whole read.","watch_out":"A PDF with no extractable text raises an error that is re-wrapped with a general message."},{"start":68,"end":94,"kind":"function","name":"parse_rfp (part 2)","id":"s3","hash":"890987fb79e1e161","title":"Finding a project name inside the text","what":"Searches the text for labels such as Project Name, Project or Client, and uses the first short match as the project name. It then returns the text, name, page count and path together.","why":"Likely reason: a name written in the document is usually more accurate than the file name.","watch_out":"The plain Project label can match ordinary phrases, which then become the project name."},{"start":95,"end":106,"kind":"function","name":"extract_text_from_pdf","id":"s4","hash":"34d4e3cdc8a010ba","title":"Text-only helper","what":"Returns only the full text of a PDF by calling the main reader and keeping that part.","why":"Likely reason: a convenience for callers that need only the text.","watch_out":""}],"explained_at":"2026-11-11T23:48:18+00:00","explained_by":"haiku","summary":"Reads an RFP PDF, extracts all its text, and works out a project name from the file name or from labels in the text.","purpose":"Turn an uploaded RFP PDF into plain text and basic details for the rest of the pipeline.","why":"The module docstring says it parses RFP PDFs and extracts text, which is the input for matching and generation.","how":"Open the PDF, read each page's text, and stop with an error if nothing is found. Take a starting project name from the file name, then look for labels such as Project Name or Client in the text and use the first short match.","inputs":"Path to a PDF file and a verbose flag.","outputs":"A dictionary with the full text, project name, page count and file path. The helper function returns only the text.","risks":"Image-only (scanned) PDFs produce an error because no OCR is used. The label search can match ordinary phrases such as project management. A missing file raises an error.","debug":"If the error says no text, open the PDF to check whether it is scanned. If the project name is wrong, compare the label patterns with the document wording.","summary_hash":"sha256:a1b72f548215cea5c8b271c2bfc6d0039b963ecf0fdbae37b871eacd1c106b0a","fresh":true},"src/sema
