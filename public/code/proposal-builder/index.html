eadiness":{"status":"needs-work","reasons":["No tests are visible for this file.","Bare except blocks can hide real errors and produce incomplete blueprints without warning.","The output does not match what the visualizations module expects, so the two files do not work together yet.","Height zero can crash the 16 by 9 check."]},"terms":[{"term":"PPTX","meaning":"The file format used by Microsoft PowerPoint presentations."},{"term":"EMU","meaning":"A tiny unit of length used by PowerPoint. One inch equals 914400 of them."},{"term":"Blueprint","meaning":"A plain record of how a deck is built, meant to be copied when making a new one."},{"term":"Title placeholder","meaning":"The special box on a slide that PowerPoint marks as the slide title."},{"term":"RGB","meaning":"A color written as three numbers for red, green, and blue."},{"term":"Bare except","meaning":"A catch-all error handler that ignores every error, which can hide problems."}],"depends_on":["python-pptx"],"used_by":["src/visualizations.py (expects a function named extract_proposal_template, which this file does not define)"],"sections":[{"start":1,"end":14,"kind":"setup","name":"File setup","id":"s1","hash":"886f17bcbabd3bcf","title":"Imports and module purpose","what":"Loads the libraries this module needs and explains that it extracts formatting from one matched proposal.","why":"Likely reason: reading PowerPoint files and counting values requires these tools.","watch_out":""},{"start":15,"end":69,"kind":"class","name":"TemplateExtractor (part 1)","id":"s2","hash":"ed7fd1f3929a0ce0","title":"Measuring slide size and starting extraction","what":"Opens the proposal and records its width, height, and ratio. It checks whether the slide is close to widescreen 16 by 9 and prints these values when verbose.","why":"Likely reason: the rebuilt slides must match the original page shape exactly.","watch_out":"The 16 by 9 check divides by height without a zero check, so a damaged file with zero height can crash it."},{"start":70,"end":109,"kind":"class","name":"TemplateExtractor (part 2)","id":"s3","hash":"292c1d40075adf85","title":"Sorting slides into groups","what":"Gives each slide a kind, records its layout, and files it under one of four groups. It prints the group counts and assembles the final blueprint.","why":"Likely reason: later steps need one example layout per kind of slide, so slides are grouped first.","watch_out":"Slides that match no keyword are dropped from the blueprint without any message."},{"start":110,"end":142,"kind":"method","name":"TemplateExtractor: _identify_slide_type","id":"s4","hash":"9491c8769d795ed2","title":"Guessing each slide's kind","what":"Reads the words on a slide and labels it timeline, governance, modules, workstream, or none, based on keyword lists.","why":"Likely reason: the decks have no labels, so keywords stand in for the slide kind.","watch_out":"Simple word matching can mislabel slides, and the order of the checks decides which label wins."},{"start":143,"end":188,"kind":"method","name":"TemplateExtractor: _extract_slide_blueprint","id":"s5","hash":"ee96290b73192f6c","title":"Recording one slide's layout","what":"Builds the full record for one slide, including its number, its title, and each shape sorted into table, chart, text, or other.","why":"Likely reason: keeping each shape's exact placement allows the slide to be rebuilt.","watch_out":"The title is found only when the slide has a real title placeholder, so other slides get no title."},{"start":189,"end":245,"kind":"method","name":"TemplateExtractor: _extract_shape_blueprint","id":"s6","hash":"952cdad4f1df047c","title":"Recording one shape's look","what":"Records a single shape's position, size, fill color, text style, and any table or chart details.","why":"Likely reason: each shape has to be recreated with the same look.","watch_out":"Table and chart reading errors are silently swallowed, so a missing detail leaves no sign."},{"start":246,"end":296,"kind":"method","name":"TemplateExtractor: _extract_text_format","id":"s7","hash":"c39eae307f5c5916","title":"Recording text font and color","what":"Collects font names, sizes, bold flags, colors, and alignment for the text in a shape.","why":"Likely reason: fonts and colors are what make new slides match the example.","watch_out":"Text whose font comes from the theme records nothing, so the blueprint can miss styling."},{"start":297,"end":342,"kind":"method","name":"TemplateExtractor: _create_timeline_template","id":"s8","hash":"d8cb469284e91aaf","title":"Summarizing each slide group","what":"Summarizes the timeline slides with a count, a common title style, a visual type, and one example slide. The other three groups receive only a count and an example.","why":"Likely reason: a few typical examples are kept instead of every slide.","watch_out":"The governance and workstream groups have little formatting detail compared with the timeline group."},{"start":343,"end":395,"kind":"method","name":"TemplateExtractor: _find_common_title_format","id":"s9","hash":"09733e8e740e93db","title":"Finding common title and table styles","what":"Picks the most frequent title font, size, and color, and the most common table row and column counts in a group.","why":"Likely reason: one typical style is easier to reuse than many slightly different ones.","watch_out":"When no title style is found, the code silently uses Calibri, size 32, and black, which may not match the real deck."}],"explained_at":"2026-11-11T23:50:15+00:00","explained_by":"haiku","summary":"Reads one matched proposal slide deck and records its exact layout, fonts, colors, and tables as a blueprint that later steps can copy.","purpose":"Give newly built proposals the same look as one real example proposal.","why":"Likely reason: the code takes its format from a single example deck so that the output copies one proven design. The reason for using one deck rather than several is not stated in the code.","how":"Open the deck. Record the slide width, height, and whether it is close to widescreen 16 by 9. For each slide, guess its kind from keywords in its text. Record each slide's title and shapes, including position, fill color, text style, tables, and charts. Group the slides by kind, build a short summary for each group, and return one blueprint dictionary.","inputs":"The path to a PowerPoint (pptx) proposal file. Verbose mode prints progress.","outputs":"A dictionary with the source file name, the slide dimensions, and four group templates: timeline, governance, modules, and workstream. Each group template holds a count and an example slide, and some hold common styles.","risks":"Slide kinds are guessed from keywords, so a slide can be filed under the wrong group. The file has no function named extract_proposal_template, which the visualizations module imports. The output has no colors entry, which the visualizations module expects. The 16 by 9 check divides by height without a zero check. Many errors are hidden by bare except blocks. Slides that match no keyword are dropped silently.","debug":"Run with verbose on and read the printed slide dimensions and the group counts. If a slide is in the wrong group, check the keyword lists in the slide kind function. If a title is missing, check whether the slide has a real title placeholder. If the visualizations module fails with an import error or a missing key, the mismatch is in this file's exports. If opening the deck fails, check that the file is a real pptx and not corrupted.","summary_hash":"sha256:33b567c0aac03e9d0d3fd585f36c2a61e0486aa33dbfa07ab6d0508813cfb67f","fresh":true},"src/template_selector.py":{"schema_version":1,"path":"src/template_selector.py","language":"Python","lines":172,"hash":"sha256:aacf8a8a854dde032ff2b7e1cf2928020f0f03184fa2ab5d70c241000fc897dc","area":"src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The looser search can pick the wrong file, and its choice can change from one machine to another.","No tests are visible for this file.","The default folder path depends on where the program is run."]},"terms":[{"term":"Glob","meaning":"A search pattern that lists files matching a name such as all files ending in pptx."},{"term":"Stem","meaning":"A file name without its extension."},{"term":"Fuzzy matching","meaning":"A loose search that accepts near matches rather than exact ones."},{"term":"Relative path","meaning":"A file location measured from the folder the program starts in."}],"depends_on":["pathlib (Python standard library)","typing (Python standard library)"],"used_by":["Not visible in the packet."],"sections":[{"start":1,"end":11,"kind":"setup","name":"File setup","id":"s1","hash":"c39059eb96b8e423","title":"Setup and imports","what":"Loads the standard tools for handling file paths and type labels.","why":"Likely reason: file lookup needs these tools. No other reason is stated in the code.","watch_out":""},{"start":12,"end":68,"kind":"class","name":"TemplateSelector (part 1)","id":"s2","hash":"0c23059bf1fd9bc0","title":"Trying exact proposal file names","what":"Takes the RFP file name, works out its base name, and builds five likely proposal file names to try in order.","why":"Likely reason: the naming convention is known, so exact names are tried before any looser search.","watch_out":"Only the proposals folder is searched, so a proposal stored anywhere else will not be found."},{"start":69,"end":127,"kind":"class","name":"TemplateSelector (part 2)","id":"s3","hash":"cc438ab395133dbc","title":"Returning the match or the failure","what":"Returns the first exact file found. If none exists, it runs the looser search. If that also fails, it lists the available proposals and returns nothing. It also removes the file extension and RFP-style suffixes to form the base name.","why":"Likely reason: trying the most exact match first avoids picking a wrong file.","watch_out":"Suffix removal only matches the listed spellings, so an unusual RFP name may keep extra words."},{"start":128,"end":172,"kind":"class","name":"TemplateSelector (part 3)","id":"s4","hash":"d2fea0f81bb5e5c6","title":"Looser search and file listing","what":"Searches the proposal folder for any deck whose name contains the base name, ignoring case, and returns the first one found. It also provides a sorted list of all proposal files.","why":"Likely reason: file names are not always exact, so a name-contains check catches close matches.","watch_out":"Short base names match many files, and the first match depends on the order the operating system lists files."}],"explained_at":"2026-11-11T23:50:15+00:00","explained_by":"haiku","summary":"Finds the proposal template file that matches a matched RFP by comparing file names.","purpose":"Choose the right example proposal deck for each RFP.","why":"The docstring states the convention: a file named ProjectName_RFP is matched to ProjectName_Proposal. The code does not say why the looser search is also included.","how":"Remove the file extension and any RFP-style suffix to get a base name. Try five likely proposal file names in order. If none exists, search the proposal folder for any deck whose name contains the base name. If nothing matches, print the proposal files available and return nothing.","inputs":"The matched RFP file name, and the proposals folder, which defaults to data/proposals relative to where the program runs.","outputs":"The path to the matching proposal file as text, or nothing when no match exists. A separate function returns a sorted list of all proposal paths.","risks":"A very short base name can match many files. The looser search returns the first file found, and the order of files depends on the operating system. A base name that is empty matches every file. The default folder is relative, so the program can find nothing if run from another folder.","debug":"Turn on verbose output and check the printed base name. Confirm the expected file exists in data/proposals with the exact spelling. Read the list of available proposals printed on failure. If the wrong deck is picked, the looser search is the likely cause.","summary_hash":"sha256:aacf8a8a854dde032ff2b7e1cf2928020f0f03184fa2ab5d70c241000fc897dc","fresh":true},"src/utils.py":{"schema_version":1,"path":"src/utils.py","language":"Python","lines":466,"hash":"sha256:97f150418a14a97a948b1088ff4d4497918a60c3aa38daf1fe55293a27131038","area":"src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Loading pickle files is unsafe with untrusted files.","The JSON export uses an older method that may break with newer library versions.","No tests are visible for this file."]},"terms":[{"term":"Pickle","meaning":"Python's built-in way to save an object to a file and read it back, which can run code if the file is tampered with."},{"term":"JSON","meaning":"A plain text format for structured data that many tools can read."},{"term":"Environment variable","meaning":"A named setting held by the operating system that programs can read, such as the API key."},{"term":".env file","meaning":"A text file of named settings that the app can read, kept out of shared code."},{"term":"Data model","meaning":"A definition of the shape a piece of data must have, such as a project."}],"depends_on":["data_models (ProjectStructure)","pickle, os, pathlib, typing, datetime (Python standard library)","pptx, langchain_openai, langchain_chroma, pdfplumber, openpyxl (checked by the environment check)"],"used_by":["Not visible in the packet."],"sections":[{"start":1,"end":14,"kind":"setup","name":"File setup","id":"s1","hash":"e1a067b5672c74b0","title":"Imports and shared data model","what":"Loads the standard tools and the project data model that the helpers work with.","why":"Likely reason: the helpers need to know the shape of a project to save, read, and summarize it.","watch_out":"Every helper depends on the project data model, so renaming it breaks all of them."},{"start":15,"end":42,"kind":"function","name":"save_project","id":"s2","hash":"319b81e25b192d6b","title":"Saving a project to a file","what":"Writes the project into the output folder. If no name is given, it builds one from the project name and the time. It returns the file path.","why":"Likely reason: saving lets a user keep work and reopen it later.","watch_out":"The cleaning of unsafe characters applies only when no name is passed, so a name supplied by the caller is used as is."},{"start":43,"end":58,"kind":"function","name":"load_project","id":"s3","hash":"0d4af820b6b4a7a6","title":"Reopening a saved project","what":"Reads a saved project file and returns the project as it was stored.","why":"Likely reason: it pairs with saving so work can be resumed.","watch_out":"Pickle files can run code when opened, so only open files this app created."},{"start":59,"end":115,"kind":"function","name":"list_saved_projects","id":"s4","hash":"bd8eca44f2b5052d","title":"Listing saved projects with readable names","what":"Finds saved project files in the output folder, newest first, and gives each a readable name and a date.","why":"Likely reason: lets a user choose a project from a list.","watch_out":"The name is rebuilt from the file name, so names with extra underscores may look odd, and the date is the file's last-change time, not the save time."},{"start":116,"end":142,"kind":"function","name":"format_evidence_for_display","id":"s5","hash":"fc7e3d78bfe4d3c1","title":"Summarizing source evidence for display","what":"Turns a list of supporting excerpts into a short numbered list, showing at most five and noting how many are left out.","why":"Likely reason: keeps the display readable when there are many matches.","watch_out":"Excerpts are cut at 200 characters without regard to word boundaries."},{"start":143,"end":183,"kind":"function","name":"format_reasoning_for_display","id":"s6","hash":"1779f7c127a13d12","title":"Formatting an agent's reasoning trace","what":"Builds a readable report of one agent's run, including its name, time, duration, confidence, input, evidence, steps, and output.","why":"Likely reason: lets the owner judge how an agent reached its result.","watch_out":"Only the first three evidence items are shown, and the report fails if the timestamp is missing."},{"start":184,"end":242,"kind":"function","name":"validate_environment","id":"s7","hash":"4871a0223fcfef2b","title":"Checking settings and folders","what":"Checks for the API key, the env file, the data folders, and required packages. It returns whether the setup is valid, with errors and warnings.","why":"Likely reason: catches common setup mistakes before the app runs.","watch_out":"It does not load the env file itself, so the key check sees only variables that were already loaded elsewhere."},{"start":243,"end":300,"kind":"function","name":"get_color_scheme","id":"s8","hash":"45276ca7e5bdc213","title":"Named color palettes for charts","what":"Returns one of three named color sets for charts, and falls back to the first set when the name is unknown.","why":"Likely reason: gives charts a consistent look without repeating color codes.","watch_out":"A misspelled name silently returns the default set, so the mistake is not reported."},{"start":301,"end":318,"kind":"function","name":"truncate_text","id":"s9","hash":"f7642c43c666fb95","title":"Cutting text to a set length","what":"Shortens text to a given length and adds dots when it is cut.","why":"Likely reason: keeps labels and cells from overflowing.","watch_out":"Very small limits can leave almost no text because the dots take up space."},{"start":319,"end":342,"kind":"function","name":"format_duration","id":"s10","hash":"4049567aa9bbd245","title":"Turning weeks into readable time","what":"Converts a number of weeks into words such as one week, three weeks, or about two months.","why":"Likely reason: plans are easier to read in months once they pass a month.","watch_out":"Months are counted as four weeks each, so the month figure is an estimate."},{"start":343,"end":396,"kind":"function","name":"calculate_project_metrics","id":"s11","hash":"c4667d315be510ca","title":"Totals and risk counts for a project","what":"Counts workstreams, modules, and activities, reads the durations and any time saved, and counts activities marked high risk.","why":"Likely reason: summary screens and reports need these numbers in one place.","watch_out":"Assumes each risk level has a value field and that durations are filled in, so missing data gives errors or zeros."},{"start":397,"end":427,"kind":"function","name":"export_to_json","id":"s12","hash":"728e72f18c0b177d","title":"Writing project data to a JSON file","what":"Writes the whole project to a readable JSON file in the output folder and returns the file path.","why":"Likely reason: JSON can be read by other tools and by people.","watch_out":"Uses an older model conversion method that may fail or warn with newer versions of the data library."},{"start":428,"end":466,"kind":"function","name":"print_project_summary","id":"s13","hash":"2c3163161957c199","title":"Printing a project overview to screen","what":"Prints the project's counts, timeline, savings, structure, risk count, confidence, and last-modified time in one block.","why":"Likely reason: gives a quick check from the command line.","watch_out":"Crashes if the last-modified time is missing, and shows savings only when an optimized duration exists."}],"explained_at":"2026-11-11T23:50:15+00:00","explained_by":"haiku","summary":"A set of shared helper functions for saving, loading, listing, formatting, checking, and summarizing the proposal project.","purpose":"Hold common tasks in one place so the rest of the app can reuse them.","why":"Likely reason: the code groups repeated work into shared helpers. The code does not state the reason directly.","how":"Saving writes the project to a pickle file in the output folder. Loading reads that file back. Listing scans the output folder for saved projects. Formatting helpers turn evidence, reasoning, durations, and text into readable strings. The environment check looks for the API key, the data folders, and required packages. Metrics count the parts of a project. The export writes JSON. The summary prints a short overview.","inputs":"Project objects, file names, the output folder, a color scheme name, week counts, text, and reasoning or evidence records.","outputs":"File paths, a loaded project, lists of saved projects, dictionaries of checks and metrics, formatted strings, and printed output.","risks":"Loading a pickle file can run harmful code if the file was altered, so only trusted files should be opened. A filename passed in is used without cleaning. The environment check does not load the env file itself. The JSON export uses an older model conversion call that may stop working with newer data library versions. The summary print fails when the last-modified time is missing. Metrics assume risk levels have a value field.","debug":"For saved file problems, check the output folder and confirm the file came from this app. For JSON export failures, check the version of the data library. If the key check reports missing, confirm the env file was loaded. If metrics show zeros, check that the project fields are filled. If the summary print crashes, check the last-modified value.","summary_hash":"sha256:97f150418a14a97a948b1088ff4d4497918a60c3aa38daf1fe55293a27131038","fresh":true},"src/visualizations.py":{"schema_version":1,"path":"src/visualizations.py","language":"Python","lines":687,"hash":"sha256:b389d958f378d09162a12b405bc16add34ccefd5c82dca91903e1be66bceff1d","area":"src","status":"explained","summary_stale":false,"readiness":{"status":"not-ready","reasons":["The module cannot be imported because the function it imports does not exist in the template file.","The template from the template extractor lacks the colors entry needed to build the palette.","Empty projects make some charts crash.","No tests are visible for this file."]},"terms":[{"term":"Plotly","meaning":"A charting library that draws interactive charts in a web page."},{"term":"Gantt chart","meaning":"A bar chart that shows when each task starts and ends on a timeline."},{"term":"Subplot","meaning":"A smaller chart placed inside a larger figure with others."},{"term":"Hex color","meaning":"A color written as a code such as a hash followed by six characters."},{"term":"DataFrame","meaning":"A table of rows and columns used for data analysis."},{"term":"Circular layout","meaning":"Placing nodes evenly around a circle, which shows order but not distance."}],"depends_on":["plotly","pandas","numpy","data_models (ProjectStructure, Workstream, Module, Activity, DependencyGraph, OptimizationResult)","template_extractor"],"used_by":["Not visible in the packet."],"sections":[{"start":1,"end":29,"kind":"setup","name":"File setup","id":"s1","hash":"56c88f4b6fb68955","title":"Imports of charting and data tools","what":"Loads the charting, table, math, and project data tools that this module uses.","why":"Likely reason: charts are drawn with Plotly, and the template helper is imported to pick colors.","watch_out":"Imports a function named extract_proposal_template from template_extractor, which the shown template file does not define, so this import fails."},{"start":30,"end":76,"kind":"class","name":"ProjectVisualizer (part 1)","id":"s2","hash":"44c5af6013124eca","title":"Setting up the chart builder","what":"Stores the project and a template, then builds the palette of workstream colors from that template.","why":"Likely reason: matches the charts to the example proposal's colors, as the docstring says.","watch_out":"Expects a colors entry holding chart colors, which the template extractor does not produce."},{"start":77,"end":131,"kind":"method","name":"ProjectVisualizer: create_gantt_chart","id":"s3","hash":"076bc4e13f6c86fb","title":"Building the timeline data","what":"Prepares the task rows for the main timeline chart, with one row per workstream and optionally one per module.","why":"Likely reason: a timeline chart needs a flat list of tasks with start and end weeks.","watch_out":"Colors are picked by position, so an optimized list with a different count than the palette can run out of colors."},{"start":132,"end":187,"kind":"class","name":"ProjectVisualizer (part 3)","id":"s4","hash":"cd8b867d86c38a7b","title":"Drawing the timeline bars","what":"Adds one bar per task with hover details, then sets the week range, height, and white background.","why":"Likely reason: hover text shows exact start and end weeks so the reader can check dates.","watch_out":"An empty project makes the maximum-week calculation fail."},{"start":188,"end":246,"kind":"method","name":"ProjectVisualizer: create_timeline_comparison","id":"s5","hash":"d27a2c71d8eadb5c","title":"Original versus optimized timeline","what":"Draws two stacked timelines, the original and the optimized one, with a heading that states the weeks saved.","why":"Likely reason: shows the effect of optimization at a glance.","watch_out":"The heading reads weeks saved from the result object, so a missing result stops the chart."},{"start":247,"end":298,"kind":"class","name":"ProjectVisualizer (part 5)","id":"s6","hash":"996ea6cc826b2f0d","title":"Comparison axes and dependency node setup","what":"Gives both comparison panels the same week range and sets the heading style. It also starts the dependency network by listing each workstream as a node in start-week order.","why":"Likely reason: a shared range makes the two panels comparable, and ordering by start week keeps the layout close to the timeline.","watch_out":"The empty-data check depends on the dependencies object being falsy, which a data object usually is not, so the empty message may never appear."},{"start":299,"end":354,"kind":"class","name":"ProjectVisualizer (part 6)","id":"s7","hash":"e1cd2809724a4047","title":"Placing dependency nodes on a circle","what":"Places each workstream on a circle, draws a line from each dependency to the workstream that needs it, and adds the labels.","why":"Likely reason: a circle is a simple layout that needs no extra graph library.","watch_out":"Positions show order only, not real timing, and dependencies that point to unknown IDs are skipped without a message."},{"start":355,"end":414,"kind":"class","name":"ProjectVisualizer (part 7)","id":"s8","hash":"bbb5054da6fcb0ac","title":"Finishing the network and listing breakdown rows","what":"Sets the network title, hides the axes, and returns the figure. The breakdown builder then lists each module and its activities as rows.","why":"Likely reason: a plain figure keeps the network easy to read.","watch_out":"Activity start weeks add up one after another inside each module, so activities are assumed to run in sequence even if they overlap."},{"start":415,"end":451,"kind":"class","name":"ProjectVisualizer (part 8)","id":"s9","hash":"293dcdb4c30ee3d3","title":"Drawing module and activity bars","what":"Draws module bars in blue and activity bars in a lighter grey, then sets the title and height.","why":"Likely reason: color and tone separate the main items from their parts.","watch_out":"Colors are fixed in this function rather than taken from the template, so this view will not match the proposal's style."},{"start":452,"end":502,"kind":"method","name":"ProjectVisualizer: create_resource_allocation_chart","id":"s10","hash":"2e96b2340f7c4164","title":"Counting busy workstreams each week","what":"Counts how many workstreams are active in each week and draws the counts as a colored bar chart.","why":"Likely reason: shows where the workload peaks across the timeline.","watch_out":"Finding the last week fails on a project with no workstreams."},{"start":503,"end":559,"kind":"method","name":"ProjectVisualizer: create_summary_dashboard","id":"s11","hash":"268bfc8ff477a736","title":"Building the four-panel dashboard","what":"Creates a four-panel layout and fills the first two panels: workstream durations as bars and module counts as a pie chart.","why":"Likely reason: one page gives the owner a quick overview of the project.","watch_out":""},{"start":560,"end":609,"kind":"class","name":"ProjectVisualizer (part 11)","id":"s12","hash":"20c4529964540f94","title":"Timeline and activity panels of dashboard","what":"Adds a timeline line for each workstream and an activity-count bar chart, then labels all the axes.","why":"Likely reason: the two panels give one schedule view and one count view.","watch_out":"Axis labels follow the list order, so reordering the workstreams without updating the labels would mislabel them."},{"start":610,"end":642,"kind":"class","name":"ProjectVisualizer (part 12)","id":"s13","hash":"cdcdc9591ab285bc","title":"Dashboard title and blank placeholder chart","what":"Sets the dashboard title and size, adding the weeks saved when a result is given. It also provides a blank chart with a short message for when there is nothing to show.","why":"Likely reason: the blank chart avoids a crash when a chart has no data.","watch_out":"The blank chart is used only by the network and breakdown views, so other charts with no data may still fail."},{"start":643,"end":687,"kind":"method","name":"ProjectVisualizer: export_all_charts","id":"s14","hash":"db097c25ebdaa759","title":"Exporting all charts to files","what":"Creates the output folder, builds four main charts, saves each as an HTML file, prints a count, and returns the file paths.","why":"Likely reason: HTML files open in any web browser and can be shared without Python.","watch_out":"The docstring promises PNG images, but only HTML files are written."}],"explained_at":"2026-11-11T23:50:15+00:00","explained_by":"haiku","summary":"Builds interactive Plotly charts of the project timeline, dependencies, resource load, and a summary dashboard, and saves four of them as HTML files.","purpose":"Let the owner see the project plan visually and check it before use.","why":"The docstring says the charts use colors taken from an example proposal so they match its look. The reason for the other chart choices is not stated in the code.","how":"The visualizer stores the project and a template, and builds a color palette from the template. Each chart method builds its own Plotly figure. The export method creates the output folder, builds four charts, and writes each to an HTML file.","inputs":"A ProjectStructure object, an optional template dictionary, optional optimized workstream lists, an OptimizationResult, and an output folder.","outputs":"Plotly figure objects that the app can show, four HTML files in output/visualizations, and a dictionary of their file paths.","risks":"The module imports a function named extract_proposal_template from template_extractor, which that file does not define, so the import fails. The palette expects a colors entry in the template, which the template extractor does not produce. An empty project crashes the Gantt and resource charts. Palette colors are chosen by position, so an optimized list of a different length can run out of colors. The export docstring promises PNG images, but only HTML is written. The dependency network uses a circle layout rather than a true graph layout.","debug":"First look at the import error, since it stops the whole module. Next check the template dictionary for a colors key. For a maximum-of-empty error, confirm the project has workstreams. For color errors, compare the length of the optimized list with the original. To view results, open the HTML files in a browser.","summary_hash":"sha256:b389d958f378d09162a12b405bc16add34ccefd5c82dca91903e1be66bceff1d","fresh":true}}}</script>
<script>

  "use strict";

  var main = document.getElementById("main");

    if ((f.terms || []).length) {
      html += sec(++n, "Words used here", "define", '<dl class="terms">' + f.terms.map(function (t) {
        return "<dt>" + esc(t.term) + "</dt><dd>" + fmt(t.meaning) + "</dd>"; }).join("") + "</dl>");
    }
    var rows = (f.sections || []).map(function (s) {
      var code = "";
      if (lines) {
        for (var k = s.start; k <= s.end && k <= lines.length; k++) {
          code += '<span class="ln"><span class="no">' + k + "</span>" + (esc(lines[k - 1]) || " ") + "</span>";
        }
      }
      var kind = KIND_LABELS[s.kind] || s.kind || "";
      return '<div class="row' + (s.id === sectionId ? " sel" : "") + '" id="sec-' + esc(s.id) + '">' +
        (lines ? '<div class="code" role="region" aria-label="Lines ' + s.start + " to " + s.end + '"><pre><code>' + code + "</code></pre></div>" :
          '<div class="code no-code">' + both(SITE.private ? "This repository is private, so its code is not published here. The owner can open these lines on GitHub from the link beside the note." :
            "The code is not published for this repository; the notes describe it.", "// source not published") + "</div>") +
        '<aside class="note"><div class="note-inner"><p class="label"><a href="' + fileHref(path, s.id) + '">Lines ' + s.start + "\u2013" + s.end +
        "</a>" + (kind ? "<span>" + esc(kind) + "</span>" : "") + '<span class="nerd-only">' + esc(s.name || "") + "</span>" + lineLink(path, s) +
        "</p><h4>" + esc(s.title || s.name) + "</h4>" +
        (s.what ? "<p>" + fmt(s.what) + "</p>" : '<p class="pending">Not explained yet.</p>') +
        (s.why ? '<p><span class="k">Why</span>' + fmt(s.why) + "</p>" : "") +
        (s.watch_out ? '<p><span class="k">Watch out</span>' + fmt(s.watch_out) + "</p>" : "") + "</div></aside></div>";
    }).join("");
    html += sec(++n, "Read it section by section", "cat -n " + base(path),
      '<p class="hint">Each row pairs a piece of the code with a note. Every line of the file belongs to exactly one row.</p><div class="rows">' + rows + "</div>");
    return html;
  }

  function viewReadiness() {
    var r = REPO.readiness || {};
    var html = '<p class="label head-meta"><span>' + both("Readiness review", "cat readiness") + "</span>" + (r.checked_at ? "<span>Checked " +
      esc(String(r.checked_at).slice(0, 10)) + "</span>" : "") + '</p><h2 class="display">Is it production-ready?</h2><p class="punch">' +
      checkBadge(r.overall) + " " + (r.summary ? fmt(r.summary) : '<span class="pending">No readiness review yet. In Claude Code, ask for a production check.</span>') + "</p>";
    var n = 0;
    var checks = r.checks || [];
    if (checks.length) {
      html += sec(++n, "Twelve questions", "checks", '<div class="table-wrap"><table class="checks"><thead><tr><th scope="col">Question</th>' +
        '<th scope="col">Answer</th><th scope="col">Evidence</th><th scope="col">Next step</th></tr></thead><tbody>' + checks.map(function (c) {
          return "<tr><td>" + esc(c.question) + "</td><td>" + checkBadge(c.status) + "</td><td>" + (fmt(c.evidence) || "") + "</td><td>" +
            (fmt(c.next_step) || "") + "</td></tr>"; }).join("") + "</tbody></table></div>");
    }
    var groups = { "not-ready": [], "needs-work": [] };
    PATHS.forEach(function (p) { var st = (FILES[p].readiness || {}).status; if (groups[st]) groups[st].push(p); });
    [["not-ready", "Files that are not ready", "grep not-ready"], ["needs-work", "Files that need work", "grep needs-work"]].forEach(function (g) {
      var list = groups[g[0]];
      if (!list.length) return;
      html += sec(++n, g[1] + " (" + list.length + ")", g[2], '<ul class="rows-list">' + list.map(function (p, i) {
        var reasons = (FILES[p].readiness.reasons || []).map(fmt).join(" ");
        return '<li><a class="rowlink" href="' + fileHref(p) + '"><span class="label num">' + pad(i + 1) + '</span><span class="name">' + esc(base(p)) +
          '<span class="dirp">' + esc(dir(p)) + "</span></span>" + fileBadge(FILES[p]) + '<span class="sub">' + reasons + "</span></a></li>"; }).join("") + "</ul>");
    });
    return html;
  }

  function viewDecisions() {
    var list = REPO.decisions || [];
    var html = '<p class="label head-meta"><span>' + both("Decision records", "git log --decisions") + "</span><span>" + list.length +
      ' recorded</span></p><h2 class="display">Why it is built this way</h2><p class="punch">Each decision records what was chosen, why, what else was considered, and when to revisit it.</p>';
    if (!list.length) return html + '<p class="pending" style="margin-top:30px">No decisions recorded yet. The plan-first skill adds one whenever there is a real choice to make.</p>';
    return html + sec(1, "Decisions", "decisions", list.map(function (d) {
      return '<article class="card"><h3>' + esc((d.id ? d.id + ". " : "") + (d.title || "Decision")) + '</h3><dl class="facts">' +
        fact("What was decided", fmt(d.decision)) + fact("Why", fmt(d.why)) + fact("Alternatives considered", fmt(d.alternatives)) +
        fact("Trade-offs", fmt(d.tradeoffs)) + fact("Revisit when", fmt(d.revisit_when)) + fact("Files", linkList(d.files)) + "</dl></article>"; }).join(""));
  }

  function viewDebug() {
    var html = '<p class="label head-meta"><span>' + both("Debugging guide", "man debug") + '</span></p><h2 class="display">When something breaks</h2>' +
      '<p class="punch">A calm method that works for any bug, then the problems this app is most likely to have and where to look.</p>';
    html += sec(1, "The method", "procedure", '<ol class="method">' +
      "<li><strong>Make it happen again on purpose.</strong> Write down the exact steps, what you expected and what happened instead.</li>" +
      "<li><strong>Read the error in plain words.</strong> Copy the full message. Ask Claude what it means before asking it to fix anything.</li>" +
      "<li><strong>Find the area.</strong> Use the map on the overview to pick the area, then the file, then the section.</li>" +
      "<li><strong>Prove it with a small test.</strong> Ask Claude for a test that fails because of the bug. A fix without a failing test first is a guess.</li>" +
      "<li><strong>Fix the cause, not the symptom.</strong> Hiding an error message is not a fix. If two attempts fail, stop and rethink.</li>" +
      "<li><strong>Keep it fixed.</strong> Keep the test, refresh these notes, and record the problem below if it could happen again.</li></ol>");
    var list = REPO.debug_playbook || [];
    html += sec(2, "Known problems", "known issues", list.length ? list.map(function (item) {
      var area = AREA_BY_ID[item.likely_area];
      return '<article class="card"><h3>' + esc(item.symptom || "Problem") + '</h3><dl class="facts">' +
        fact("Likely area", area ? '<a href="#/area/' + encodeURIComponent(area.id) + '">' + area.num + " / " + esc(area.name) + "</a>" : esc(item.likely_area || "")) +
        fact("Where to look", linkList(item.where_to_look)) +
        fact("What to try", (item.steps || []).length ? '<ol class="method">' + item.steps.map(function (s) { return "<li>" + fmt(s) + "</li>"; }).join("") + "</ol>" : "") +
        "</dl></article>"; }).join("") : '<p class="pending">No known problems recorded yet.</p>');
    return html;
  }

  function viewGlossary() {
    var terms = {};
    (REPO.glossary || []).forEach(function (t) { if (t && t.term) terms[t.term.toLowerCase()] = { term: t.term, meaning: t.meaning, files: [] }; });
    PATHS.forEach(function (p) {
      (FILES[p].terms || []).forEach(function (t) {
        if (!t || !t.term) return;
        var key = t.term.toLowerCase();
        if (!terms[key]) terms[key] = { term: t.term, meaning: t.meaning, files: [] };
        if (terms[key].files.length < 5) terms[key].files.push(p);
      });
    });
    var keys = Object.keys(terms).sort();
    var html = '<p class="label head-meta"><span>' + both("Glossary", "grep glossary") + "</span><span>" + keys.length +
      ' terms</span></p><h2 class="display">Glossary</h2><p class="punch">Technical words used in this codebase, in plain English.</p>';
    if (!keys.length) return html + '<p class="pending" style="margin-top:30px">No terms recorded yet.</p>';
    return html + sec(1, "Terms", "terms", '<label><span class="sr-only">Filter the glossary</span><input class="filter" id="gfilter" type="search" placeholder="Filter terms"></label>' +
      '<dl class="glossary" id="glist">' + keys.map(function (k) {
        var t = terms[k];
        return '<dt data-k="' + esc(k) + '">' + esc(t.term) + '</dt><dd data-k="' + esc(k) + '">' + fmt(t.meaning) +
          (t.files.length ? '<div class="used">Used in ' + t.files.map(function (p) { return '<a href="' + fileHref(p) + '">' + esc(base(p)) + "</a>"; }).join(", ") + "</div>" : "") +
          "</dd>"; }).join("") + "</dl>");
  }

  function notFound(message) {
    return '<p class="label head-meta"><span>404</span></p><h2 class="display">Not found</h2><p class="punch">' + esc(message) +
      '</p><p style="margin-top:24px"><a class="u" href="#/overview">Back to the overview</a></p>';
  }

  // ---- Router ------------------------------------------------------------
  function render() {
    var raw = (location.hash || "#/overview").slice(2);
    var parts = raw.split("/");
    var view = parts[0] || "overview";
    var arg = parts[1] ? decodeURIComponent(parts[1]) : "";
    var extra = parts[2] ? decodeURIComponent(parts[2]) : "";
    currentPath = null;
    var html;
    if (view === "file") html = viewFile(arg, extra);
    else if (view === "area") html = viewArea(arg);
    else if (view === "readiness") html = viewReadiness();
    else if (view === "decisions") html = viewDecisions();
    else if (view === "debug") html = viewDebug();
    else if (view === "glossary") html = viewGlossary();
    else { view = "overview"; html = viewOverview(); }
    main.innerHTML = html;
    document.querySelectorAll(".views a").forEach(function (link) {
      if (link.getAttribute("data-view") === view) link.setAttribute("aria-current", "page"); else link.removeAttribute("aria-current");
    });
    renderTree();
    if (view === "overview") drawMap();
    if (view === "glossary") {
      var gf = document.getElementById("gfilter");
      if (gf) gf.addEventListener("input", function () {
        var q = gf.value.trim().toLowerCase();
        var text = {};
        document.querySelectorAll("#glist [data-k]").forEach(function (el) { var k = el.getAttribute("data-k"); text[k] = (text[k] || "") + " " + el.textContent.toLowerCase(); });
        document.querySelectorAll("#glist [data-k]").forEach(function (el) { var k = el.getAttribute("data-k"); el.style.display = !q || text[k].indexOf(q) >= 0 ? "" : "none"; });
      });
    }
    var target = extra ? document.getElementById("sec-" + extra) : null;
    if (target && target.scrollIntoView) target.scrollIntoView({ block: "start" });
    else if (window.scrollTo) { try { window.scrollTo(0, 0); } catch (error) { /* not available */ } }
    main.focus({ preventScroll: true });
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
