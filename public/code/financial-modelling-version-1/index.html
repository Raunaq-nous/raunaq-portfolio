ingle list.","why":"Likely reason: one call gives the app the whole model along with its working.","watch_out":"The result says complete even when defaults filled the gaps, and nothing in it shows which inputs were real."}],"explained_at":"2026-11-12T00:30:23+00:00","explained_by":"haiku","summary":"Runs the whole modelling workflow in order, from researching a company through to a finished model, by calling the other agents.","purpose":"A single entry point that turns a company name into a profile, comparables, assumptions, and a finished model.","why":"Likely reason: the workflow has several steps that depend on each other, so one class keeps them in the right order.","how":"discover_company builds a company profile from web searches and the model. find_and_analyze_comparables finds peers and benchmarks. determine_model_assumptions asks the model for assumptions. build_progressive_model runs the model builder for the income statement, cash flow, and valuation.","inputs":"Company name, then the profile, the comparables data, and the assumptions dictionary as each step is called.","outputs":"A profile dictionary, comparables data, an assumptions dictionary, and a complete model dictionary marked with status complete.","risks":"Failed model calls are often hidden as fallback data. Assumption key names may not match what the model builder reads, so defaults apply silently. The model is marked complete even when defaults were used.","debug":"Check each stage's output in order: profile, comparables, assumptions, then model. If a value looks like a default, compare the assumption keys with those the model builder reads. Look at raw_response fields for model text that did not parse. Confirm web search is configured.","summary_hash":"sha256:979c171964cf9d062cbf84c29dc06827510aad596e0a1a3b683f8424d87f1b8a","fresh":true},"backend/agents/questionnaire.py":{"schema_version":1,"path":"backend/agents/questionnaire.py","language":"Python","lines":244,"hash":"sha256:475516f9f7c67f151d963d409ab00d21f1611a7fe24e2587abbcd33c6f793f09","area":"backend-agents","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Fallbacks hide model failures.","The question loop that collects answers is not in this file.","No test is visible for this file."]},"terms":[{"term":"Discovery interview","meaning":"a set of questions used to learn about a company before building a model"},{"term":"Classification","meaning":"a label that places a company in an industry and business type"},{"term":"Conversation history","meaning":"a record of earlier messages in a chat, so the model can refer back to them"}],"depends_on":["backend/agents/base.py"],"used_by":[],"sections":[{"start":1,"end":14,"kind":"setup","name":"File setup","id":"s1","hash":"f16badcc97240893","title":"File purpose and imports","what":"Describes an agent that asks questions to learn about a company before modelling. Brings in the base agent and logging.","why":"Likely reason: modelling needs company facts the user may not have typed in.","watch_out":"Only the question steps are visible here; no loop that asks and records answers is present in this file."},{"start":15,"end":67,"kind":"class","name":"QuestionnaireAgent (part 1)","id":"s2","hash":"7450c676a6fa78d2","title":"Setting up and writing the first questions","what":"Creates the agent with a conversation list that is set up but never filled in the visible code. Builds instructions asking for five to seven questions about products, revenue, business model, stage, costs, and growth, then sends them with the company name and optional description.","why":"Likely reason: the model writes the questions so they suit the specific company.","watch_out":"The conversation history is created empty and no visible code adds to it, so the agent has no memory of earlier answers."},{"start":68,"end":110,"kind":"class","name":"QuestionnaireAgent (part 2)","id":"s3","hash":"fd98c4cf2625f9da","title":"Reading the questions and a standard backup","what":"Tries to read the model's answer as JSON and adds the prompt, model name, and time taken. If reading fails, returns five standard questions with the company name filled in.","why":"Likely reason: the app always has questions to show, even when the model's answer is messy.","watch_out":"When the model call fails, the standard questions are returned as if they came from the model, with the raw text attached."},{"start":111,"end":167,"kind":"method","name":"QuestionnaireAgent: analyze_answers_and_classify","id":"s4","hash":"a4f0da78469c075e","title":"Classifying the interview answers","what":"Builds the list of question and answer pairs and asks the model to classify the company's industry, business and revenue model, stage, key insights, comparable companies, and a confidence score.","why":"Turns interview answers into the labels the rest of the workflow uses.","watch_out":"The confidence score is the model's own estimate, not a measured accuracy."},{"start":168,"end":226,"kind":"class","name":"QuestionnaireAgent (part 4)","id":"s5","hash":"958319ee2470e67a","title":"Reading the classification and starting the input list","what":"Reads the classification as JSON, or falls back to an Unknown industry with the raw text. Then starts the request for the financial inputs needed for this type of company, with the classification and context attached.","why":"Likely reason: the input list is generated from the company type so the form fits the business.","watch_out":"The fallback sets the industry to Unknown, which later steps may treat as a real industry."},{"start":227,"end":244,"kind":"class","name":"QuestionnaireAgent (part 5)","id":"s6","hash":"46fb6acc1160352a","title":"Reading the required inputs","what":"Sends the input-list request, tries to read the answer as JSON, and records the prompt and timing. If reading fails, returns an empty list of inputs with the raw text.","why":"Keeps the prompt and raw text so a user can see what was asked and what came back.","watch_out":"An empty input list on failure looks like the company needs no inputs, which can hide a real problem."}],"explained_at":"2026-11-12T00:30:23+00:00","explained_by":"haiku","summary":"Agent that writes interview questions about a company, classifies the answers, and lists the financial inputs the model will need.","purpose":"Helps a user describe a company in plain answers so the model builder can be set up for that kind of business.","why":"Likely reason: a financial model fits better when the business type is known first.","how":"Asks the model for five to seven questions. After answers are given, it sends the question and answer pairs to the model for a classification. Then it asks for a list of inputs needed for that type of company. Each step reads the answer as JSON and falls back to basic content if reading fails.","inputs":"Company name, an optional description, question and answer pairs, and the classification from earlier steps.","outputs":"Dictionaries holding questions, a classification, and a list of required inputs. Each includes the prompt used, and raw text when reading failed.","risks":"Failed model calls return standard questions or empty lists as if they were real output. The conversation history is set up but not filled in the visible code. An Unknown industry label can flow into later steps.","debug":"If questions look generic, the model call probably failed; check raw_response. Confirm the provider and model in settings. If the input list is empty, read the raw_response text from that step.","summary_hash":"sha256:475516f9f7c67f151d963d409ab00d21f1611a7fe24e2587abbcd33c6f793f09","fresh":true},"backend/agents/reasoning.py":{"schema_version":1,"path":"backend/agents/reasoning.py","language":"Python","lines":289,"hash":"sha256:71365aaaf73346a41577e894287dc1d83ec26a034a108f95f83367c933b3d1e8","area":"backend-agents","status":"explained","summary_stale":false,"readiness":{"status":"unknown","reasons":["Only the first 16 lines were given.","It is not clear from this packet whether the file is used anywhere."]},"terms":[{"term":"Logging","meaning":"recording messages from the code to a log so problems can be reviewed later"}],"depends_on":["backend/agents/base.py"],"used_by":[],"sections":[{"start":1,"end":16,"kind":"setup","name":"File setup","id":"s1","hash":"bf8d3af2f5dbdb5c","title":"File purpose and imports","what":"Describes a helper that gives step-by-step reasons for modelling choices, with full logging. The shown part only imports libraries and sets up logging; the reasoning functions are not in this packet.","why":"Reason not stated in the code beyond the description at the top of the file.","watch_out":"Because the rest of the file is not visible, what it actually does cannot be confirmed."},{"start":17,"end":72,"kind":"class","name":"ReasoningAgent (part 1)","id":"s2","hash":"9f4791901511856a","title":"Reasoning agent setup and model analysis","what":"Creates the reasoning agent with low randomness and runs the full analysis through `analyze_model_inputs`. It sends the company, industry and model inputs to the AI and asks for reasoning steps, findings, recommendations, warnings and a confidence score.","why":"Likely reason: a fixed instruction asks the AI for one JSON layout so the app can read every answer the same way.","watch_out":"If the AI reply is not valid JSON, the fallback result looks like a normal answer, so the warning text must be checked."},{"start":73,"end":132,"kind":"class","name":"ReasoningAgent (part 2)","id":"s3","hash":"1fc6cdb419e1fb87","title":"Parsing analysis and starting benchmark comparison","what":"Reads the analysis reply as JSON and adds the agent name, a copy of the step log, the model used and the time taken. It then builds the prompt for `compare_to_benchmarks`, which asks how the company's metrics compare with its industry.","why":"Reason not stated in the code for the parsing fallback beyond keeping the app from crashing on a bad reply.","watch_out":"Benchmark comparison relies on the research data passed in; without it, the AI uses only its own memory of industry averages."},{"start":133,"end":186,"kind":"class","name":"ReasoningAgent (part 3)","id":"s4","hash":"667c5f3e21e542d5","title":"Benchmark result and calculation explanation","what":"Finishes the benchmark comparison, returning the AI reply as JSON or wrapping raw text if parsing fails. `explain_calculation` then asks the AI to explain a named calculation in plain terms, including inputs, result and typical range.","why":"Likely reason: the explanation is meant for a non-expert reader, so the prompt asks for plain language.","watch_out":"Both bare except clauses catch every error, not only bad JSON, which can hide real bugs."},{"start":187,"end":236,"kind":"class","name":"ReasoningAgent (part 4)","id":"s5","hash":"8d6b20ad1c4d570d","title":"Explanation return and scenario suggestions","what":"Returns the calculation explanation with its log. `suggest_scenario_analysis` asks the AI for bull and bear case assumptions with reasons, probability estimates and key drivers, and returns them as JSON or as raw text.","why":"Reason not stated in the code for why scenarios are AI guesses rather than rule-based.","watch_out":"The probabilities and adjusted values come from the AI and are not checked against any rule, so they need human review before use."},{"start":237,"end":289,"kind":"method","name":"ReasoningAgent: _build_analysis_prompt","id":"s6","hash":"d9b675b557778e64","title":"Building the analysis prompt","what":"Assembles the text sent to the AI: the model inputs, any research data, and a fixed checklist covering revenue growth, margins, capital spending and working capital, valuation inputs, and red flags.","why":"Likely reason: a fixed checklist makes every analysis cover the same areas.","watch_out":"The whole inputs dictionary is pasted in as text, so a very large model can make the prompt too long for the AI."}],"explained_at":"2026-11-12T00:35:09+00:00","explained_by":"haiku","summary":"Module meant to hold a step-by-step reasoning helper for modelling choices. Only its imports and logging setup are in this packet.","purpose":"According to its description, it explains the thinking behind modelling decisions with full logging. The working code is not in this packet.","why":"Reason not stated in the code for the parts that are not shown.","how":"The visible part imports the JSON and time helpers, the typing names, the base agent, and logging, then creates a logger for this file. The rest is not visible.","inputs":"Not visible in this packet.","outputs":"Not visible in this packet.","risks":"Most of the file is missing from this packet, so its behaviour cannot be confirmed.","debug":"Open the full file and find the class that extends the base agent. Check the logs recorded under this file's name.","summary_hash":"sha256:71365aaaf73346a41577e894287dc1d83ec26a034a108f95f83367c933b3d1e8","fresh":true},"backend/agents/research.py":{"schema_version":1,"path":"backend/agents/research.py","language":"Python","lines":312,"hash":"sha256:ccdb46ea7628ab1dbfef5ed2159843b64f790c0c942c1ef255c590272eb48115","area":"backend-agents","status":"explained","summary_stale":false,"readiness":{"status":"unknown","reasons":["Only setup lines were given.","The orchestrator's use of tavily_client cannot be confirmed from this packet."]},"terms":[{"term":"Web research","meaning":"collecting facts from public web pages to support a decision"},{"term":"Tavily","meaning":"a web search service built for AI apps"}],"depends_on":["backend/agents/base.py","config"],"used_by":["backend/agents/orchestrator.py"],"sections":[{"start":1,"end":18,"kind":"setup","name":"File setup","id":"s1","hash":"d7076849c45da160","title":"File purpose and imports","what":"Describes the research agent as analysing web research and suggesting model inputs, using Tavily search when available. Brings in the base agent, settings, logging, and the JSON and time helpers.","why":"Likely reason: web search gives current facts for model inputs when a search key exists.","watch_out":"Whether the Tavily client is actually created here cannot be seen in this packet."},{"start":19,"end":73,"kind":"class","name":"ResearchAgent (part 1)","id":"s2","hash":"cdb7832051094d26","title":"Research agent setup and valuation request","what":"Sets up the research agent. If a Tavily search key is present, it creates a web search client; if not, it logs a warning and the agent later relies on the AI's memory. The valuation request asks the AI for beta, risk premiums, risk-free rate and sector margins.","why":"Likely reason: the app still works without a paid search key.","watch_out":"A missing key does not stop the app, so results can quietly come from AI memory only. Check the logs to see which path ran."},{"start":74,"end":128,"kind":"class","name":"ResearchAgent (part 2)","id":"s3","hash":"7883a5a1a4111f79","title":"Valuation answer and start of company research","what":"Returns the valuation suggestions as raw AI text with the sector, country and data sources. Then `research_company` resets the research log, sets default topics if none were given and creates an empty result container.","why":"Reason not stated in the code for returning unparsed text.","watch_out":"The valuation answer is free text, not numbers, so any code that expects numbers will fail. Also, the research log resets on every call, so earlier logs are lost."},{"start":129,"end":183,"kind":"class","name":"ResearchAgent (part 3)","id":"s4","hash":"c051c02bdf79bcc0","title":"Searching each research topic","what":"For each topic, runs a web search with up to five results at advanced depth and keeps the answer and source links, skipping duplicate sources. If search is not available, the AI answers each topic from memory. Errors are stored as text inside the findings.","why":"Likely reason: the search gives sources a reader can check, and the AI fallback keeps the feature working without search.","watch_out":"Each advanced search is a paid external call, so five topics cost more and take longer. A failed search is stored as a text message, not raised as an error, so it can look like data."},{"start":184,"end":235,"kind":"method","name":"ResearchAgent: research_industry_benchmarks","id":"s5","hash":"814f4d3ab63a865b","title":"Industry benchmark search","what":"Starts `research_industry_benchmarks`. It sets default metrics such as gross margin and EBITDA margin, then searches for typical industry averages for each metric with three results per search.","why":"Reason not stated in the code for the choice of three results instead of five.","watch_out":"The fallback path without search returns no source links, so AI-only benchmarks carry no citations."},{"start":236,"end":273,"kind":"class","name":"ResearchAgent (part 5)","id":"s6","hash":"201baf1e201a98ee","title":"Benchmark results and AI fallback","what":"Collects source links for each benchmark and records any search error as text. If search is not available, asks the AI for ranges and tries to parse them as JSON, otherwise keeps the raw reply.","why":"Likely reason: keeps the result usable even when a search or parse step fails.","watch_out":"Because failures become text rather than errors, a broken search may look like a normal benchmark. Check the findings text for the words Search failed."},{"start":274,"end":312,"kind":"method","name":"ResearchAgent: _synthesize_research","id":"s7","hash":"b928a94aec6ab8a6","title":"Turning research into modelling advice","what":"Sends all findings to the AI and asks for key insights, recommended assumptions, uncertainties and suggested ranges for inputs such as growth and margins. Returns the reply as text.","why":"Likely reason: turns raw search results into guidance a modeller can use.","watch_out":"The output is free text, so check any suggested numbers before using them as model inputs."}],"explained_at":"2026-11-12T00:35:09+00:00","explained_by":"haiku","summary":"Research agent meant to analyse web research and suggest values for model inputs, using the Tavily web search service when it is set up.","purpose":"Provides web research support for the other agents.","why":"Likely reason: web search gives current facts the model can use for inputs.","how":"Only the setup part is visible: it imports the base agent, settings, logging, and the JSON and time helpers. The search and synthesis steps are not in this packet.","inputs":"Not visible in this packet beyond the settings it imports.","outputs":"Not visible in this packet.","risks":"The orchestrator reads a tavily_client attribute on this agent, and that attribute is not visible here, so the link cannot be confirmed.","debug":"Search the file for tavily_client to confirm it is set when a key exists. Check the logs for research steps.","summary_hash":"sha256:ccdb46ea7628ab1dbfef5ed2159843b64f790c0c942c1ef255c590272eb48115","fresh":true},"backend/api/routes/agents.py":{"schema_version":1,"path":"backend/api/routes/agents.py","language":"Python","lines":535,"hash":"sha256:97054f0037e05c4efa4a2a8ed9b4a951c2f64ca0233295753290db7435d95c1e","area":"backend-api","status":"explained","summary_stale":false,"readiness":{"status":"unknown","reasons":["Only the first 22 lines were shown, so the routes and their error handling could not be checked.","No tests were visible."]},"terms":[{"term":"API route","meaning":"a web address that other programs can call to ask the app for something"},{"term":"Router","meaning":"a group of routes that is attached to the main web app"},{"term":"Streaming","meaning":"sending results piece by piece as they are produced, rather than all at once at the end"},{"term":"Pydantic","meaning":"a library that checks incoming data has the expected shape before the code uses it"}],"depends_on":["fastapi","pydantic","agents.research","agents.reasoning","agents.questionnaire","agents.comparables","config"],"used_by":["not visible in the files shown"],"sections":[{"start":1,"end":22,"kind":"setup","name":"File setup","id":"s1","hash":"0d7f32438086b4d5","title":"Imports and router setup","what":"Nothing runs for users here. It loads the web framework, the four agent classes, and the settings, then creates the router and a logger for recording messages.","why":"Gives the rest of the file the tools and the router that the routes attach to.","watch_out":""},{"start":23,"end":29,"kind":"class","name":"CompanyResearchRequest","id":"s2","hash":"6b2d4516b7f9c542","title":"Request shape for company research","what":"Describes what a caller must send to ask for company research: the company name, its industry, and an optional list of topics to look into.","why":"Likely reason: lets the server reject incomplete requests before any research work starts.","watch_out":"Renaming a field here causes callers that still use the old name to get an error."},{"start":30,"end":35,"kind":"class","name":"IndustryBenchmarkRequest","id":"s3","hash":"a8610f17de775d53","title":"Request shape for industry benchmarks","what":"Describes a request for industry benchmark figures: an industry name and an optional list of the measures wanted.","why":"Likely reason: same purpose as the other request shapes, so the server knows what to expect.","watch_out":"The industry name is free text, so spelling differences can produce different results."},{"start":36,"end":43,"kind":"class","name":"ModelAnalysisRequest","id":"s4","hash":"ab30da42b3c247c0","title":"Request shape for model analysis","what":"Describes a request to analyze a company's model: company name, industry, a free-form set of inputs, and optional research data.","why":"Likely reason: the inputs are free-form so the analysis can accept different kinds of model data.","watch_out":"Because inputs are not checked by name here, missing values are left for the reasoning agent to handle."},{"start":44,"end":50,"kind":"class","name":"BenchmarkComparisonRequest","id":"s5","hash":"2981c1592577b7e8","title":"Request shape for benchmark comparison","what":"Describes a request to compare a company's measures with industry figures: industry, measures as numbers, and optional research data.","why":"Likely reason: the measures are numbers so they can be compared directly with benchmarks.","watch_out":"Text values in the measures will be rejected by the server before the comparison runs."},{"start":51,"end":78,"kind":"function","name":"research_company","id":"s6","hash":"7100ed3063e948d3","title":"One-shot company research","what":"Runs company research once and returns the complete findings, sources and reasoning log in a single reply. If the research fails, the caller gets a server error that includes the error text.","why":"Likely reason: the simple version for callers that do not need live progress updates.","watch_out":"The raw error text is sent back to the caller, which can reveal internal details."},{"start":79,"end":105,"kind":"function","name":"research_industry_benchmarks","id":"s7","hash":"bac386dfa8727014","title":"One-shot industry benchmark research","what":"Asks the research agent to look up industry benchmark figures and returns them with their sources.","why":"Reason not stated in the code.","watch_out":"The code does not check that the figures are current; the quality depends on what the agent finds."},{"start":106,"end":134,"kind":"function","name":"analyze_model","id":"s8","hash":"f3b9d0fb2f16a99d","title":"One-shot model analysis","what":"Sends the company's model inputs to the reasoning agent and returns its analysis with a step-by-step reasoning log.","why":"Reason not stated in the code.","watch_out":"Input values are passed through without checks, so bad inputs produce bad analysis without any warning."},{"start":135,"end":162,"kind":"function","name":"compare_benchmarks","id":"s9","hash":"d0692a1ba150d742","title":"Benchmark comparison","what":"Compares the company's measures with industry benchmarks and returns an explained comparison.","why":"Reason not stated in the code.","watch_out":"The usefulness of the comparison depends entirely on the agent and the research data supplied."},{"start":163,"end":222,"kind":"function","name":"research_company_stream (part 1)","id":"s10","hash":"dea26365b1bb27a6","title":"Live research progress stream","what":"Sends progress messages while research runs, then the research log, then the final result. The progress steps are sent before the real research starts, so the progress is largely cosmetic.","why":"Likely reason: lets the interface show activity during a long wait. The code comments say the agent work is not truly asynchronous.","watch_out":"The research call blocks the server while it runs, so other requests may stall until it finishes."},{"start":223,"end":223,"kind":"function","name":"research_company_stream (part 2)","id":"s11","hash":"da39a3ee5e6b4b0d","title":"End of research stream code","what":"Only a blank line. It has no behavior of its own.","why":"Reason not stated in the code.","watch_out":""},{"start":224,"end":274,"kind":"function","name":"analyze_model_stream","id":"s12","hash":"a02f95f2b7552c7a","title":"Live model analysis stream","what":"Runs the model analysis, then sends its log entries, reasoning steps and final result as a stream. The analysis finishes before streaming starts, so the stream replays finished work.","why":"Likely reason: lets the interface show results in order without changing the agent code.","watch_out":"An error is sent inside the stream while the web status still shows success, so the caller must read the message."},{"start":275,"end":329,"kind":"function","name":"get_agent_status (part 1)","id":"s13","hash":"952dcc83179f6d19","title":"Provider status check, part one","what":"Checks whether the Ollama service answers and lists its models. Checks whether an OpenAI key is set and the client can be created.","why":"Likely reason: lets the settings screen show which AI providers can be used.","watch_out":"OpenAI is reported as available when a key exists. The key is not tested with a real request."},{"start":330,"end":353,"kind":"function","name":"get_agent_status (part 2)","id":"s14","hash":"ae51829893ab8d95","title":"Provider status check, part two","what":"Reports Tavily search as available when its key is set and its library loads, then returns the full status summary.","why":"Likely reason: same purpose as the earlier checks, so the screen can show every provider in one reply.","watch_out":"A wrong key is still reported as available, because no test call is made."},{"start":354,"end":359,"kind":"class","name":"QuestionnaireRequest","id":"s15","hash":"0b9775dcd618f3a4","title":"Request shape for starting questions","what":"Describes a request to start the questionnaire: a company name and an optional short description.","why":"Likely reason: the first step of the question-and-answer process.","watch_out":"The description is optional, so the questions may be generic when it is left out."},{"start":360,"end":365,"kind":"class","name":"AnswersRequest","id":"s16","hash":"b4957f22cd09d63f","title":"Request shape for answers","what":"Describes a request carrying the question and answer pairs the user has given.","why":"Likely reason: the answers are sent back as text pairs so the agent can classify the company.","watch_out":"Only text is accepted, so any numeric answers must be sent as text."},{"start":366,"end":373,"kind":"class","name":"ComparablesRequest","id":"s17","hash":"8c13c5e7cec87114","title":"Request shape for finding comparables","what":"Describes a request to find similar public companies: company name, industry, business model, and how many to find (default 5).","why":"Reason not stated in the code.","watch_out":"The number requested is not capped here, so a very large number could make the search slow."},{"start":374,"end":400,"kind":"function","name":"generate_questions","id":"s18","hash":"62c63f27d0e46560","title":"Starting discovery questions","what":"Asks the questionnaire agent to produce the first set of discovery questions for a company.","why":"Likely reason: starts the interview the user answers before modeling.","watch_out":"Errors are returned as server errors with the error text."},{"start":401,"end":427,"kind":"function","name":"analyze_answers","id":"s19","hash":"24ade46aa331f4bc","title":"Classifying the company from answers","what":"Sends the answers to the questionnaire agent, which returns an industry classification and a suggested modeling approach.","why":"Reason not stated in the code.","watch_out":"The classification is only as good as the answers the user gave."},{"start":428,"end":456,"kind":"function","name":"find_comparables","id":"s20","hash":"f22b71d1e39bb441","title":"Finding comparable companies","what":"Asks the comparables agent to find similar listed companies, with reasons, up to the number requested.","why":"Reason not stated in the code.","watch_out":"The search depends on web search results, which may be incomplete or outdated."},{"start":457,"end":480,"kind":"function","name":"analyze_comparables","id":"s21","hash":"c7c06299b7ec4571","title":"Analyzing comparable companies","what":"Takes a list of comparable companies and returns financial analysis for each, with sources.","why":"Reason not stated in the code.","watch_out":"The body must be a plain list of text pairs; a longer list means a longer wait."},{"start":481,"end":504,"kind":"function","name":"synthesize_benchmarks","id":"s22","hash":"b99f49717c59f000","title":"Building industry benchmarks from comparables","what":"Combines the analyses of several comparable companies into benchmark ranges with statistics.","why":"Reason not stated in the code.","watch_out":"It expects the output of the earlier analysis step, so callers must pass that output back unchanged."},{"start":505,"end":510,"kind":"class","name":"InputsRequest","id":"s23","hash":"9e50316c87215168","title":"Request shape for required inputs","what":"Describes a request carrying a company classification and its context, both as free-form dictionaries.","why":"Likely reason: the structure of the classification can vary, so it is accepted loosely.","watch_out":"Nothing checks the dictionary shape, so a wrong structure is only caught later, if at all."},{"start":511,"end":535,"kind":"function","name":"determine_inputs","id":"s24","hash":"d6985e24e8669927","title":"Determining required financial inputs","what":"Given the company's classification, returns the financial inputs the user must supply, with guidance on each.","why":"Reason not stated in the code.","watch_out":"Depends on the classification having the expected fields; the code does not confirm this."}],"explained_at":"2026-11-12T00:25:29+00:00","explained_by":"haiku","summary":"Defines the web routes that let the app ask AI agents to research companies, benchmark industries, analyze models, and suggest inputs, with some results streamed back as they are produced.","purpose":"Exposes the agent features to the front end or other programs. Based on the outline, it covers company research, industry benchmarks, model analysis, questionnaires, comparables, and input suggestions.","why":"Likely reason: keeps the web interface separate from the agent logic in the other modules.","how":"Only the setup part was read. From the outline, the file defines request shapes for each feature and then the routes that use them. Some routes have streaming versions.","inputs":"Request bodies defined in the outline, such as company research, industry benchmark, model analysis, benchmark comparison, questionnaire, answers, comparables, and inputs requests.","outputs":"Not visible in the part read. The outline suggests normal responses and streamed responses.","risks":"Not visible in the part read. The routes, their error handling, and what they return were not read.","debug":"Not visible in the part read. Start by checking the imports, the router, and the agent classes that the routes call.","summary_hash":"sha256:97054f0037e05c4efa4a2a8ed9b4a951c2f64ca0233295753290db7435d95c1e","fresh":true},"backend/api/routes/calculations.py":{"schema_version":1,"path":"backend/api/routes/calculations.py","language":"Python","lines":28,"hash":"sha256:a51aa832d566b928b889af87c5c18d2906fa6060ef69fbab227a43ab135329e7","area":"backend-api","status":"explained","summary_stale":false,"readiness":{"status":"not-ready","reasons":["Returns invented financial figures labeled as a completed calculation.","The database session is accepted but never used."]},"terms":[{"term":"endpoint","meaning":"a web address the frontend can call to ask the server to do something."},{"term":"placeholder","meaning":"temporary stand-in code that returns fixed values until the real version is written."}],"depends_on":["db.database","api.schemas","fastapi","sqlalchemy"],"used_by":[],"sections":[{"start":1,"end":13,"kind":"setup","name":"File setup","id":"s1","hash":"a32537f5b5b110f1","title":"Imports and router setup","what":"Loads the web tools, the database connection and the shared request and reply shapes, and creates the router that collects this file's routes.","why":"Likely reason: every route file in this folder follows the same pattern so the main app can attach them.","watch_out":"Other code expects the name router, so renaming it breaks how these routes are attached."},{"start":14,"end":28,"kind":"function","name":"run_calculation","id":"s2","hash":"ac78f416724ae55f","title":"Scenario calculation placeholder","what":"Accepts a scenario id and returns a fixed success reply with two fixed number lists, not a real calculation.","why":"Likely reason: a placeholder while the calculation engine is not connected. The code comment says it would call the engine.","watch_out":"Do not treat its output as real model results until the placeholder is replaced."}],"explained_at":"2026-11-12T00:25:29+00:00","explained_by":"haiku","summary":"Provides a calculation endpoint that is meant to run the full model math for a scenario, but currently returns fixed placeholder numbers.","purpose":"Give the frontend a place to request a scenario's results. At present it does not calculate anything.","why":"Likely reason: a stub added so screens can be built before the real calculation engine is connected. The code comment says this.","how":"The caller sends a scenario id. The route ignores the database session and returns that id with a success message and two fixed lists of revenue and net income.","inputs":"A scenario id in the request body, checked against the request shape in the schemas file.","outputs":"A reply with the scenario id, status success, a message saying the calculation completed, and fixed numbers for revenue and net income.","risks":"The numbers look like real results but are invented. A user could make decisions based on them.","debug":"If results look wrong, confirm whether the real calculation engine is wired in elsewhere. This route returns the same numbers for every scenario.","summary_hash":"sha256:a51aa832d566b928b889af87c5c18d2906fa6060ef69fbab227a43ab135329e7","fresh":true},"backend/api/routes/defaults.py":{"schema_version":1,"path":"backend/api/routes/defaults.py","language":"Python","lines":90,"hash":"sha256:50fe30666beac11e18ba332cc55217a9b50d5f74ce40c11319ef4903995edfc2","area":"backend-api","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Errors are not caught here, so an unexpected failure returns a raw server error.","The enhanced route describes using AI, but that logic is in another file and is not shown here.","No tests are visible."]},"terms":[{"term":"forecast period","meaning":"one future year or time block that the model projects."},{"term":"default assumption","meaning":"a starting number the model uses when the user gives none."}],"depends_on":["defaults.industry_defaults","fastapi","pydantic"],"used_by":[],"sections":[{"start":1,"end":17,"kind":"setup","name":"File setup","id":"s1","hash":"a7fbb4f5288f77f7","title":"Imports and router setup","what":"Loads the web tools and the three functions from the defaults module, then creates the router.","why":"Likely reason: keeps the route code thin and the data logic in the defaults module.","watch_out":"The three function names must match the defaults module exactly, or the app will fail to start."},{"start":18,"end":24,"kind":"class","name":"EnhancedDefaultsRequest","id":"s2","hash":"9b468f89b3406a94","title":"Request shape for enhanced defaults","what":"Describes the enhanced defaults request: a required industry, an optional company name, and periods defaulting to 5.","why":"Likely reason: the shape the enhanced route checks before it runs.","watch_out":"Unlike the GET route, periods here has no minimum or maximum."},{"start":25,"end":38,"kind":"function","name":"list_industries","id":"s3","hash":"b8a009ae2da943e6","title":"Listing supported industries","what":"Returns the supported industries with their descriptions and examples.","why":"Likely reason: lets the frontend build an industry picker.","watch_out":"The list comes from the defaults module, so an industry added there appears here automatically."},{"start":39,"end":63,"kind":"function","name":"get_defaults_for_industry","id":"s4","hash":"cceeb9d682b86abc","title":"Defaults for one industry","what":"Returns default assumptions for one industry over a set number of periods, with periods limited to 1 to 20.","why":"Likely reason: the simple lookup route the screens use before any AI refinement.","watch_out":"How an unknown industry name is handled is decided in the defaults module and is not visible here."},{"start":64,"end":90,"kind":"function","name":"get_enhanced_defaults","id":"s5","hash":"90de03724056d682","title":"AI-enhanced defaults","what":"Passes the industry, company name and periods to the AI-enhanced defaults function and returns what it produces.","why":"Likely reason: a planned step to adjust defaults using company research. The docstring describes this as future behavior.","watch_out":"If no AI provider is available, the result may fall back to plain defaults or fail. This file does not show which."}],"explained_at":"2026-11-12T00:25:29+00:00","explained_by":"haiku","summary":"Provides routes that return default financial assumptions for an industry, plus a route meant to add AI-refined values.","purpose":"Let the user start a model with sensible starting numbers for their industry instead of typing everything in.","why":"Likely reason: saves time and gives a reasonable starting point for each industry.","how":"One route lists the supported industries. Another returns defaults for one industry over a chosen number of periods. A third sends the industry and company name to the AI-enhanced function. Periods are limited to 1 to 20 only on the GET route.","inputs":"An industry name in the web address or request body, an optional company name, and the number of periods (default 5).","outputs":"A success status with the industry and periods used, and a defaults dictionary whose structure comes from the defaults module.","risks":"The enhanced route has no range check on periods, so very large numbers are accepted. An industry name containing a slash will not match the route.","debug":"If the defaults look wrong, check the defaults module, not this file. If the enhanced route fails, check what get_ai_enhanced_defaults does with the company name and whether an AI provider is set up.","summary_hash":"sha256:50fe30666beac11e18ba332cc55217a9b50d5f74ce40c11319ef4903995edfc2","fresh":true},"backend/api/routes/export.py":{"schema_version":1,"path":"backend/api/routes/export.py","language":"Python","lines":224,"hash":"sha256:9a4d1d9181cbf5f4ca4738c2015ca3c129527afeb594bc835c784086df7c9071","area":"backend-api","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["PDF export is a placeholder.","Temporary files accumulate and are never cleaned up.","Many separate database queries are made, which can be slow for large models.","No tests are visible."]},"terms":[{"term":"database session","meaning":"a connection used to read and write stored data during one request."},{"term":"temp folder","meaning":"a scratch area on the computer where temporary files are kept."},{"term":"optional dependency","meaning":"a library that is not required; when it is missing, a feature is switched off."}],"depends_on":["db.database","db.models","export.excel","export.pdf (optional)","fastapi","sqlalchemy"],"used_by":[],"sections":[{"start":1,"end":23,"kind":"setup","name":"File setup","id":"s1","hash":"ce212841e9d83d97","title":"Imports and optional PDF setup","what":"Loads the web tools, the database, the Excel writer, and tries to load the PDF writer, recording whether that worked.","why":"Likely reason: the PDF library may not be installed, and a failed import should not stop the whole app.","watch_out":"If the PDF import fails for any reason, PDF is silently turned off, as the HAS_PDF flag shows."},{"start":24,"end":83,"kind":"function","name":"export_excel (part 1)","id":"s2","hash":"3c4543bdbd3227fa","title":"Loading a scenario's data","what":"Loads the scenario, its model, time periods, drivers, driver values, segments, lines, line inputs and stored results. Stops with a not-found error if the scenario or model is missing.","why":"Reason not stated in the code.","watch_out":"If no results were calculated, the result lists are simply empty, and the export will still succeed."},{"start":84,"end":139,"kind":"function","name":"export_excel (part 2)","id":"s3","hash":"ad765c23852a7b9a","title":"Shaping data for the Excel writer","what":"Sorts the loaded data into the plain shapes the Excel writer expects: model details, driver values by year, and each line's base volume and price.","why":"Likely reason: the Excel writer uses plain dictionaries so it does not depend on the database.","watch_out":"Base volume and price are read only from inputs named Base_Vol_Y0 and Base_Price e shape."},{"start":22,"end":27,"kind":"class","name":"AssumptionsRequest","id":"s3","hash":"9c6c9453ef464480","title":"Request shape for assumptions","what":"Holds the company profile and the comparables data, both as free-form dictionaries.","why":"Likely reason: these come from earlier steps and their exact shape can change.","watch_out":"Whatever the caller sends is passed on without checks."},{"start":28,"end":68,"kind":"function","name":"discover_company","id":"s4","hash":"277ea857abf390b4","title":"Discovering a company","what":"Runs two steps in order: first a company profile, then comparables and benchmarks. Returns them together.","why":"Reason not stated in the code.","watch_out":"The two agent calls run one after the other, so a slow web search slows the whole request."},{"start":69,"end":100,"kind":"function","name":"determine_assumptions","id":"s5","hash":"d8a98102a9369552","title":"Setting model assumptions","what":"Turns the profile and comparables into a full set of model assumptions backed by research, so the user can review and edit them before building.","why":"Likely reason: the docstring says the user reviews assumptions first, which is why this is a separate step.","watch_out":"The assumptions are only as good as the research behind them, so the user should check the numbers."},{"start":101,"end":107,"kind":"class","name":"BuildModelRequest","id":"s6","hash":"b7c6e43f91043e02","title":"Request shape for building a model","what":"Holds the profile, the assumptions and the number of years, which defaults to 5.","why":"Reason not stated in the code.","watch_out":"The year count is not limited here."},{"start":108,"end":141,"kind":"function","name":"build_progressive_model","id":"s7","hash":"af99e0d09340be9b","title":"Building the full model","what":"Builds the three-statement model from the profile and assumptions over the chosen years, and returns it with its formulas and steps.","why":"Reason not stated in the code.","watch_out":"Assumption names must match what the agent expects, or the build may fail or leave gaps."},{"start":142,"end":183,"kind":"function","name":"build_quick_model","id":"s8","hash":"aad08e39682b56f7","title":"Quick test model","what":"Builds a five-year model for a company name using fixed starting numbers, not the company's own data.","why":"Likely reason: the docstring says it is a simplified endpoint for testing.","watch_out":"The model looks like a real forecast but uses the same starting revenue and growth for every company."}],"explained_at":"2026-11-12T00:25:29+00:00","explained_by":"haiku","summary":"Routes that run the whole modeling workflow in steps: discover a company, set its assumptions, build a model, and build a quick test model with fixed numbers.","purpose":"Let the user type a company name and get a profile, comparable companies, benchmarks, assumptions and a finished model.","why":"Likely reason: replaces the older question-and-answer process, as the discovery docstring says.","how":"Discover asks the orchestrator agent for a profile, then finds comparables and benchmarks. Assumptions turns the profile and comparables into numbers. Build model creates a model over a number of years from those assumptions. Quick model uses hardcoded assumptions and the company name only.","inputs":"A company name; profile and comparables dictionaries; an assumptions dictionary and a year count defaulting to 5.","outputs":"A success status with the profile, comparables, benchmarks, assumptions or model.","risks":"The quick model builds from invented numbers, not the company's data. Web research results may be outdated or wrong, and nothing here checks them.","debug":"If discovery fails, check the orchestrator agent and the AI provider setting. Errors are logged with full traces in the server log, so start there.","summary_hash":"sha256:b9c1e20792c8ba357c8ca266410d092a10203a824afbf93e625193a43a51735b","fresh":true},"backend/api/routes/research.py":{"schema_version":1,"path":"backend/a plained_by":"haiku","summary":"Routes that read and change the app's AI provider and API key settings while it runs, and list the available providers.","purpose":"Let the user switch between the free local AI service (Ollama) and paid OpenAI, and set an OpenAI key, from the interface.","why":"Likely reason: lets the user change providers without editing files. The docstring notes the changes are not saved.","how":"Reading returns the current settings without the key, only saying whether one is set. Updating changes the provider (only ollama or openai allowed), the key, and two OpenAI model names, in memory. The providers route returns descriptions and model names for both.","inputs":"An update body with any of: provider, OpenAI key, OpenAI research model, OpenAI ingestion model.","outputs":"Current settings, a confirmation message, or a bad-request error for an unknown provider.","risks":"There is no login check, so anyone who can reach the server can change the provider and the key. Changes are lost on restart. The cost and privacy wording is fixed text.","debug":"If the provider does not change, check the spelling in the request. After a restart, values return to the environment settings, so check the environment file for the saved defaults.","summary_hash":"sha256:1fd6049892e90c409daf0189872025d06cf6631401f499a94b9968c26f4bf1ed","fresh":true},"backend/api/schemas.py":{"schema_version":1,"path":"backend/api/schemas.py","language":"Python","lines":67,"hash":"sha256:57d1348d5e5c33d1d5f5beb32c1b3e3ca92913bcd227780f14daf7ff21fcc7fa","area":"backend-api","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No tests are visible.","Two classes use an older configuration style.","The Field import is not used in the shown code."]},"terms":[{"term":"schema","meaning":"a written description of the shape that data must have."},{"term":"validation","meaning":"automatic checking that data has the expected fields and types."},{"term":"default value","meaning":"the value used when the caller leaves a field out."}],"depends_on":["pydantic","typing","datetime"],"used_by":["backend/api/routes/models.py","backend/api/routes/scenarios.py","backend/api/routes/calculations.py"],"sections":[{"start":1,"end":9,"kind":"setup","name":"File setup","id":"s1","hash":"6fe0b0062431d2b6","title":"Imports for the shapes","what":"Loads the validation tools and the standard type names used by the shapes below.","why":"Reason not stated in the code.","watch_out":"Removing an import that a shape uses will stop the file from loading."},{"start":10,"end":19,"kind":"class","name":"ModelCreate","id":"s2","hash":"33f4c38f099f7c20","title":"Shape for creating a model","what":"Describes a new model: name, start year and horizon years are required. Currency, unit divisor and granularity have defaults.","why":"Likely reason: makes the common fields optional while keeping the core ones required.","watch_out":"Changing a default silently changes what every new model receives."},{"start":20,"end":35,"kind":"class","name":"ModelResponse","id":"s3","hash":"04dafeb709944c0d","title":"Shape for a model reply","what":"Describes a model returned to the caller, including its id and timestamps. It can be built straight from a database record.","why":"Likely reason: lets the route return the database record without copying fields by hand.","watch_out":"Every field here must exist on the database model, or replies will fail."},{"start":36,"end":43,"kind":"class","name":"ScenarioCreate","id":"s4","hash":"a222db3e96f1a48d","title":"Shape for creating a scenario","what":"Describes a new scenario: model id and name are required, description is optional, and the default flag is false unless set.","why":"Reason not stated in the code.","watch_out":"Nothing here checks that the model id exists."},{"start":44,"end":56,"kind":"class","name":"ScenarioResponse","id":"s5","hash":"b86f097df5f16980","title":"Shape for a scenario reply","what":"Describes a scenario returned to the caller, built from a database record.","why":"Same reason as the model reply shape.","watch_out":"Same rule as the model reply: fields must match the database."},{"start":57,"end":61,"kind":"class","name":"CalculationRequest","id":"s6","hash":"eaef3cbdce8f4943","title":"Shape for a calculation request","what":"Describes a calculation request that carries only a scenario id.","why":"Reason not stated in the code.","watch_out":"The request does not say which parts of the model to calculate."},{"start":62,"end":67,"kind":"class","name":"CalculationResponse","id":"s7","hash":"51e7aaa3e3e532a7","title":"Shape for a calculation reply","what":"Describes a calculation reply: scenario id, status, message and optional results.","why":"Reason not stated in the code.","watch_out":"Results are a loose dictionary, so their contents are not checked."}],"explained_at":"2026-11-12T00:25:29+00:00","explained_by":"haiku","summary":"Defines the shapes of data sent to and returned by the model, scenario and calculation routes, and checks them automatically.","purpose":"Give every route a clear, checked format so bad input is rejected early.","why":"Likely reason: keeps requests and replies consistent and lets the API describe itself.","how":"Each class lists fields with their types and default values. The framework checks incoming data against them. Response classes can be built straight from database records.","inputs":"Request data from callers and database records.","outputs":"Checked data and the reply shapes sent back.","risks":"Changing a field name or type changes what the API accepts and returns, which can break the frontend. Response fields must exist on the database records.","debug":"If a request fails validation, compare its field names and types with the matching class. If a reply is missing data, check that the database record has that field.","summary_hash":"sha256:57d1348d5e5c33d1d5f5beb32c1b3e3ca92913bcd227780f14daf7ff21fcc7fa","fresh":true},"backend/calc/capex.py":{"schema_version":1,"path":"backend/calc/capex.py","language":"Python","lines":168,"hash":"sha256:73702963c9fd78d1130120cb494cfc30a1c0dda2010dcf08db1b895c0cbb654c","area":"backend-calc","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The first year's spending is left out of gross assets while still being depreciated, which gives wrong asset figures.","Opening gross assets are never depreciated, and the code does not say whether that is intended.","No tests or input checks were visible."]},"terms":[{"term":"CapEx (capital expenditure)","meaning":"money spent on long-lived assets such as buildings, machines, or equipment"},{"term":"Depreciation","meaning":"the yearly write-off of an asset's cost over the years it is used"},{"term":"Gross PPE","meaning":"the total original cost of long-lived assets, before any write-off"},{"term":"Accumulated depreciation","meaning":"the total write-off taken so far"},{"term":"Net PPE","meaning":"gross cost minus accumulated write-off, the book value of the assets"},{"term":"Straight-line","meaning":"writing off the same amount each year"},{"term":"Tranche","meaning":"one batch of spending that is depreciated as a group"},{"term":"Useful life","meaning":"the number of years an asset is expected to be used"}],"depends_on":["backend/calc/utils.py"],"used_by":["backend/calc/statements.py (its build_three_statement_model reads these results)"],"sections":[{"start":1,"end":24,"kind":"setup","name":"File setup","id":"s1","hash":"e79050337ef82037","title":"Module overview and imports","what":"Nothing runs here. It describes what the module does and the core formulas, and loads the helper that makes exact decimal numbers.","why":"Gives the reader the big picture and formulas before the detail.","watch_out":""},{"start":25,"end":42,"kind":"function","name":"calculate_capex_percent_revenue","id":"s2","hash":"2b58c34b7802d9ed","title":"Capital spending as share of revenue","what":"Turns each year's revenue into a capital spending amount by multiplying by one chosen percentage.","why":"Likely reason: lets spending rise and fall with sales without manual entry.","watch_out":"The percentage must be a decimal such as 0.05 for 5 percent; entering 5 would make spending 100 times too high."},{"start":43,"end":57,"kind":"function","name":"calculate_capex_fixed","id":"s3","hash":"7865aad29bfef98f","title":"Fixed capital spending schedule","what":"Returns the yearly spending list exactly as it was given.","why":"Likely reason: keeps the same shape as the percentage option so both can be used the same way.","watch_out":"It does no checking, so an empty or missing list passes straight through to later steps."},{"start":58,"end":117,"kind":"function","name":"calculate_depreciation_tranches (part 1)","id":"s4","hash":"766df99d8a0aede0","title":"Building gross assets and yearly depreciation","what":"Goes year by year, adds each year's spending to the asset total, and works out how much each earlier spending batch is written off that year.","why":"Depreciation spreads each purchase's cost over its useful life, so it affects profit and asset values.","watch_out":"First-year spending is depreciated but never added to gross assets, so the asset figures can disagree with each other."},{"start":118,"end":129,"kind":"function","name":"calculate_depreciation_tranches (part 2)","id":"s5","hash":"fe88fc4fc9560fce","title":"Net assets and returned results","what":"Subtracts accumulated depreciation from gross PPE to get net PPE, then returns capex, depreciation, gross PPE, accumulated depreciation and net PPE in one dictionary.","why":"Net PPE is the book value of fixed assets after depreciation.","watch_out":"The capex entry is the original schedule object, not a copy, so later changes to it alter the result. The other series are converted to floats."},{"start":130,"end":168,"kind":"function","name":"calculate_capex_full","id":"s6","hash":"eddc69f7db476b20","title":"Choosing spending method and running schedule","what":"Picks between the percentage of revenue method and the fixed schedule, then runs the full depreciation calculation. Any other type causes an error.","why":"Gives the rest of the model a single entry point, so callers do not need the individual steps.","watch_out":"A type spelled differently, such as with a capital letter, stops the run with an error."}],"explained_at":"2026-11-12T00:19:48+00:00","explained_by":"haiku","summary":"Works out how much the company spends on long-lived assets each year and how that spending is written off as depreciation over time.","purpose":"Produces yearly capital spending, depreciation, and the asset balances (gross, accumulated depreciation, and net) used by the three-statement model.","why":"Large purchases such as buildings and machines are not treated as one-year costs. Their cost is spread over several years, so the model needs a yearly schedule for them.","how":"1. Get yearly capital spending either as a share of revenue or from a fixed list. 2. Add each year's spending to the gross asset total. 3. For each earlier spending batch still within its useful life, take one equal slice as depreciation. 4. Add the year's depreciation to the running total. 5. Subtract accumulated depreciation from gross assets to get net assets.","inputs":"A revenue list per year; a spending type of percent_revenue or fixed; a percent (for percent_revenue) or a yearly spending list (for fixed); a useful life in years (default 5); optional opening gross assets and opening accumulated depreciation.","outputs":"A dictionary with the spending list, depreciation list, gross asset list, accumulated depreciation list, and net asset list, one value per year.","risks":"Spending in the first year is depreciated but never added to gross assets, so net assets are understated by that amount. Opening gross assets are never depreciated. A useful life of zero stops the calculation. A missing spending list or percentage causes an error. Negative spending is ignored when calculating depreciation.","debug":"If net assets look too low, compare first-year gross assets with first-year spending. If the balance sheet looks wrong, check the asset lines it receives from this file. To check by hand, use one spending value and a useful life of 1.","summary_hash":"sha256:73702963c9fd78d1130120cb494cfc30a1c0dda2010dcf08db1b895c0cbb654c","fresh":true},"backend/calc/cogs.py":{"schema_version":1,"path":"backend/calc/cogs.py","language":"Python","lines":151,"hash":"sha256:ae88df63a248cab51e4078659a3f9fff873ade2c536cdc35f22c6ea40d1517e8","area":"backend-calc","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Lists of different lengths are cut short silently.","No tests or input checks were visible."]},"terms":[{"term":"COGS (cost of goods sold)","meaning":"the direct cost of making or delivering what the company sells"},{"term":"Variable cost","meaning":"a cost that rises with each unit made or sold"},{"term":"Fixed cost","meaning":"a cost that does not depend on volume in the short run"},{"term":"Inflation rate","meaning":"the yearly percentage rise in prices"},{"term":"Unit divisor","meaning":"a number used to change units, such as dividing by 1000 to show thousands"}],"depends_on":["backend/calc/utils.py"],"used_by":["backend/calc/statements.py (its build_three_statement_model reads total_cogs)"],"sections":[{"start":1,"end":23,"kind":"setup","name":"File setup","id":"s1","hash":"779daa0c3f661a14","title":"Module overview and imports","what":"Nothing runs here. It explains how cost of goods sold is built and loads the helper tools.","why":"Gives the reader the formulas before the code.","watch_out":""},{"start":24,"end":63,"kind":"function","name":"calculate_cogs_line","id":"s2","hash":"08e231f13237c584","title":"Variable cost for one product line","what":"For one product line, grows the cost per unit each year with inflation and multiplies by volume to get that line's variable cost.","why":"Each product's cost follows its own volume and inflation, so each line is calculated separately.","watch_out":"Results stop at the shorter of the volume list and the cost list, so a mismatch drops years without warning."},{"start":64,"end":85,"kind":"function","name":"calculate_fixed_cogs","id":"s3","hash":"0f52c02fadcbabb7","title":"Fixed cost growing with inflation","what":"Grows a starting fixed cost by the yearly inflation rates to give the fixed cost for each year.","why":"Likely reason: fixed costs are kept apart because they do not follow sales, but they still rise over time.","watch_out":"Fixed cost is not linked to sales volume, so higher sales will not raise it."},{"start":86,"end":145,"kind":"function","name":"calculate_cogs_full (part 1)","id":"s4","hash":"c75fa89441491aeb","title":"Adding up all lines and fixed cost","what":"Works out every line's variable cost and the fixed cost, then adds the variable costs of all lines for each year.","why":"The model needs one total cost figure for each year.","watch_out":"The number of years comes from the longest line, and shorter lines are skipped in the later years without a warning."},{"start":146,"end":151,"kind":"function","name":"calculate_cogs_full (part 2)","id":"s5","hash":"e163bf8ca7d1fbed","title":"Returning the cost results","what":"Packages the line results, fixed cost, variable total, and grand total into one result.","why":"Gives the statements builder a single result to read.","watch_out":"Total cost adds the two lists by position and stops at the shorter one, so a length mismatch drops years."}],"explained_at":"2026-11-12T00:19:48+00:00","explained_by":"haiku","summary":"Works out the cost of goods sold each year, split into costs that move with volume and costs that stay roughly fixed, with both growing with inflation.","purpose":"Produces variable cost per product line, fixed cost, and total cost of goods sold for each year.","why":"Cost of goods sold is a major cost in the income statement and drives the stock and supplier-payment balances.","how":"1. For each product line, grow its cost per unit using its inflation rates. 2. Multiply volume by cost per unit and divide by the unit divisor. 3. Add all lines' variable costs for each year. 4. Grow the fixed cost using its inflation rates. 5. Add variable and fixed cost for each year.","inputs":"A list of line data (line_id, volumes, base cost per unit, cost inflation rates); a base fixed cost; fixed cost inflation rates; a unit divisor.","outputs":"A dictionary with results per line, the fixed cost list, the total variable cost list, and the total cost list.","risks":"Years are matched by position, so lists of different lengths are cut short without warning. Fixed cost is not linked to volume, so higher sales do not change it. The unit divisor must match the one used for revenue, or margins will be wrong.","debug":"If total cost looks wrong, check each line's volumes and cost per unit first, then the unit divisor. If a line is missing from the totals, check that its line_id matches what the caller expects.","summary_hash":"sha256:ae88df63a248cab51e4078659a3f9fff873ade2c536cdc35f22c6ea40d1517e8","fresh":true},"backend/calc/debt.py":{"schema_version":1,"path":"backend/calc/debt.py","language":"Python","lines":157,"hash":"sha256:3fa6919cfd6f8b93137be8743831bab549a95bcc28e425f7831808acd596bbad","area":"backend-calc","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The opening balance list is one item short of the other lists.","No tests or input checks were visible."]},"terms":[{"term":"Interest rate","meaning":"the yearly cost of borrowing, as a share of the amount owed"},{"term":"Opening balance","meaning":"the amount owed at the start of a year"},{"term":"Closing balance","meaning":"the amount owed at the end of a year"},{"term":"Repayment","meaning":"paying back part of what is owed"}],"depends_on":["backend/calc/utils.py"],"used_by":["backend/calc/statements.py (its build_three_statement_model reads the interest and closing debt lists)"],"sections":[{"start":1,"end":23,"kind":"setup","name":"File setup","id":"s1","hash":"845cd2bd39ee501a","title":"Module overview and imports","what":"Nothing runs here. It describes the debt calculation and loads the helper tools.","why":"Gives the reader the formulas before the code.","watch_out":""},{"start":24,"end":53,"kind":"function","name":"calculate_interest_expense","id":"s2","hash":"0aa0bf8ac62a58de","title":"Interest charged on each year's balance","what":"Multiplies each year's balance by the interest rate to get that year's interest cost.","why":"Interest is a yearly cost that reduces profit.","watch_out":"The schedule builder works out its own interest instead of calling this function, so the two can drift apart if one is changed."},{"start":54,"end":108,"kind":"function","name":"calculate_debt_schedule","id":"s3","hash":"10c18eeedabb7a65","title":"Year-by-year debt movements","what":"Goes through the years, charging interest on the opening balance, adding new borrowing, subtracting repayments, and carrying the closing balance forward.","why":"Keeps debt, interest, and repayments consistent with each other from year to year.","watch_out":"The opening balance list it returns is one item shorter than the other lists."},{"start":109,"end":157,"kind":"function","name":"calculate_debt_auto","id":"s4","hash":"cbd60d71ba21153e","title":"Repayments as a share of debt","what":"Sets each year's repayment as a fixed share of the opening balance, then builds the borrowing and repayment lists and passes them to the schedule builder.","why":"Likely reason: lets the user express repayment as a rule instead of typing in amounts.","watch_out":"It works out its own balance list and then discards it, so only the repayment amounts it produces affect the result."}],"explained_at":"2026-11-12T00:19:48+00:00","explained_by":"haiku","summary":"Tracks how much the company owes each year, the interest it pays, and how new borrowing and repayments change the balance.","purpose":"Produces interest expense and the debt balance for each year, for use in the income statement and balance sheet.","why":"Interest reduces profit and debt appears on the balance sheet, so the model needs a yearly debt schedule.","how":"1. Start with the opening debt. 2. Each year, charge interest on the opening balance. 3. Add new borrowing and subtract repayments to get the closing balance. 4. Carry the closing balance into the next year. The automatic version first works out repayments as a share of the balance.","inputs":"Starting debt; annual interest rate; lists of new borrowing and repayments by year; number of years. The automatic version takes a repayment rate and an optional list of new borrowing instead of a repayment list.","outputs":"Interest expense per year, opening balance per year, closing balance per year, and the borrowing and repayment lists.","risks":"The opening balance list comes out one item shorter than the other lists, which can cause mismatched years. Repayments are expected as positive numbers, but the cash flow code describes them as negative. Interest uses the opening balance, so new borrowing in a year does not add interest in that year.","debug":"When results look shifted by a year, check the length of the opening balance list. If cash flow looks wrong, confirm repayments are entered as positive numbers. Check interest by multiplying the opening balance by the rate.","summary_hash":"sha256:3fa6919cfd6f8b93137be8743831bab549a95bcc28e425f7831808acd596bbad","fresh":true},"backend/calc/opex.py":{"schema_version":1,"path":"backend/calc/opex.py","language":"Python","lines":123,"hash":"sha256:3ad4dc8fc7f1e290415477a6f57b921609fb9c724bbe52a137b904bb7804bc9a","area":"backend-calc","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Categories with the same name overwrite each other silently.","No tests or input checks were visible."]},"terms":[{"term":"OpEx (operating expenses)","meaning":"the costs of running the business other than the direct cost of goods sold"},{"term":"Category","meaning":"a named group of related costs"},{"term":"Inflation rate","meaning":"the yearly percentage rise in prices"}],"depends_on":["backend/calc/utils.py"],"used_by":["backend/calc/statements.py (its build_three_statement_model reads total_opex)"],"sections":[{"start":1,"end":23,"kind":"setup","name":"File setup","id":"s1","hash":"1068adb8e7660de9","title":"Module overview and imports","what":"Nothing runs here. It explains the two ways expenses are calculated and loads the helper tools.","why":"Gives the reader the formulas before the code.","watch_out":""},{"start":24,"end":45,"kind":"function","name":"calculate_opex_percent_revenue","id":"s2","hash":"5887c2af2ba63f12","title":"Operating cost as share of revenue","what":"Multiplies each year's revenue by a percentage to get that year's cost for the category.","why":"Likely reason: lets a cost grow with sales, which is how some expenses usually behave.","watch_out":"The percentage must be a decimal such as 0.15, not 15."},{"start":46,"end":67,"kind":"function","name":"calculate_opex_fixed","id":"s3","hash":"2cfd9ac896a24561","title":"Fixed operating cost growing with inflation","what":"Starts from a base amount and grows it year by year using the inflation rates.","why":"Likely reason: costs such as rent or salaries have a set size but still rise with prices.","watch_out":"The length of the inflation list sets how many years are produced, which may not match the revenue list."},{"start":68,"end":123,"kind":"function","name":"calculate_opex_full","id":"s4","hash":"fe71fe9508d597fc","title":"Totals across all categories","what":"Runs each category, stores its results under its name, and adds all categories together for each year.","why":"Gives the income statement one total operating expense figure per year.","watch_out":"Categories are stored by name, so two categories with the same name overwrite each other."}],"explained_at":"2026-11-12T00:19:48+00:00","explained_by":"haiku","summary":"Works out operating expenses, the costs of running the business apart from goods sold, by category, and adds them into a yearly total.","purpose":"Produces the yearly cost of each expense category and the total operating expenses for each year.","why":"Operating expenses such as sales, admin, and research costs are a large part of the income statement.","how":"1. For each category, decide whether it is a share of revenue or a fixed amount growing with inflation. 2. Work out that category's yearly values. 3. Store the values under the category name. 4. Add all categories together for each year.","inputs":"A revenue list; a list of categories, each with a name, a type (percent_revenue or fixed), and either a percentage or a base amount with inflation rates.","outputs":"Yearly values for each category, and the total operating expenses for each year.","risks":"Two categories with the same name overwrite each other without a warning. A fixed category shorter than the revenue list is dropped for the missing years without a warning. Fixed base amounts are not divided by a unit divisor, so they must already be in the model's units.","debug":"If the total is too low, check for a category missing from the output or two categories sharing a name. If fixed costs look too large or too small, compare their units with revenue.","summary_hash":"sha256:3ad4dc8fc7f1e290415477a6f57b921609fb9c724bbe52a137b904bb7804bc9a","fresh":true},"backend/calc/revenue.py":{"schema_version":1,"path":"backend/calc/revenue.py","language":"Python","lines":195,"hash":"sha256:e7793936866475ed89dd17099a10d10dbba6f4fb60d64eb6dd9156c43c8a314a","area":"backend-calc","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Lines with different year counts can cause errors or silently cut years.","No tests were visible. The worked example in the comments does match the formula when checked by hand."]},"terms":[{"term":"Volume","meaning":"the number of units sold"},{"term":"Price","meaning":"the amount charged per unit"},{"term":"Growth rate","meaning":"the yearly percentage change applied to a value"},{"term":"Unit divisor","meaning":"a number used to change units, such as dividing by 1000 to show thousands"},{"term":"Decimal","meaning":"a number type that stores values exactly, avoiding small rounding errors that ordinary decimal numbers can create"}],"depends_on":["backend/calc/utils.py"],"used_by":["backend/calc/statements.py (its build_three_statement_model reads the total revenue)"],"sections":[{"start":1,"end":24,"kind":"setup","name":"File setup","id":"s1","hash":"ed0d5efb3609e5a7","title":"Module overview and imports","what":"Nothing runs here. It explains how revenue is built and loads the helper tools.","why":"Gives the reader the formulas before the code.","watch_out":""},{"start":25,"end":79,"kind":"function","name":"calculate_revenue_line (part 1)","id":"s2","hash":"b1ae3764867168cc","title":"Volume, price and revenue for one line","what":"For one product line, grows volume and price each year and multiplies them to get revenue, keeping exact values throughout.","why":"The code comment says it converts to exact decimals for precision, since revenue is built from several multiplications.","watch_out":"Volume and price lists are matched by year position, so unequal growth lists quietly shorten the result."},{"start":80,"end":87,"kind":"function","name":"calculate_revenue_line (part 2)","id":"s3","hash":"ece685f91ae3ab23","title":"Returning plain numbers for one line","what":"Converts the exact values back to ordinary numbers and returns the three lists for the line.","why":"Likely reason: the rest of the app expects ordinary numbers rather than exact decimal values.","watch_out":"Converting back to ordinary numbers can add tiny differences in the stored results."},{"start":88,"end":119,"kind":"function","name":"aggregate_revenue","id":"s4","hash":"9eb43ce68810afaf","title":"Adding lines together for each year","what":"Adds the revenue of all lines for each year to give one total revenue list.","why":"The income statement needs one total sales figure for each year.","watch_out":"The year count is taken from the first line, so a shorter line causes an error and a longer line loses its extra years."},{"start":120,"end":147,"kind":"function","name":"calculate_revenue_growth","id":"s5","hash":"7c33653dd7d016ce","title":"Year-over-year revenue growth","what":"Works out the percentage change in revenue from one year to the next. If the earlier year is zero, it returns zero growth.","why":"Likely reason: gives a simple growth figure for reporting and for checking assumptions.","watch_out":"Returning zero growth after a zero year hides the real change, and the list has one fewer item than the revenue list."},{"start":148,"end":195,"kind":"function","name":"calculate_revenue_full","id":"s6","hash":"26e1bb12872c51d1","title":"Running all lines and totalling revenue","what":"Runs the line calculation for each product line, stores each line's results by its name, and returns those results with the total revenue.","why":"Gives the model one entry point for all revenue.","watch_out":"It returns a pair of values, and the statements builder reads the total by position (index 1), so changing the return shape breaks it."}],"explained_at":"2026-11-12T00:19:48+00:00","explained_by":"haiku","summary":"Works out sales revenue for each year and product line by growing volume and price, then adds the lines together.","purpose":"Produces volume, price, and revenue for each line, and total revenue for each year.","why":"Revenue is the starting point of the income statement, and most other figures are measured against it.","how":"1. Start each line at its base volume and base price. 2. Grow volume and price each year by their growth rates. 3. Multiply volume by price and divide by the unit divisor. 4. Add all lines together for each year. A separate helper also works out year-over-year revenue growth.","inputs":"A list of product lines, each with a line_id, base volume, base price, volume growth rates, and price growth rates; a unit divisor.","outputs":"Volume, price, and revenue lists for each line; a total revenue list; and, from the growth helper, a list of yearly growth rates.","risks":"Volume and price lists are matched by position and cut to the shorter one. The total assumes all lines have the same number of years and fails or drops years if they do not. Growth rates must be decimals, such as 0.05 for 5 percent.","debug":"If total revenue is wrong, compare each line's revenue list first. Check the base volume and price, then the growth rates. Confirm the unit divisor matches the one used by the cost modules.","summary_hash":"sha256:e7793936866475ed89dd17099a10d10dbba6f4fb60d64eb6dd9156c43c8a314a","fresh":true},"backend/calc/sensitivity.py":{"schema_version":1,"path":"backend/calc/sensitivity.py","language":"Python","lines":215,"hash":"sha256:d769a9e81819a225567e000ac704a4d92dbde97ad59111149c0da3c93c9ea939","area":"backend-calc","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The cost of capital and revenue growth tables rely on the model function reading keys that this file never sets up or checks.","Missing outputs fail silently.","No tests were visible."]},"terms":[{"term":"Sensitivity analysis","meaning":"testing how a result changes when assumptions change"},{"term":"Grid","meaning":"a table with one variable in the rows and another in the columns"},{"term":"WACC (weighted average cost of capital)","meaning":"the blended yearly return the company must earn for its funders"},{"term":"Terminal growth rate","meaning":"the growth assumed for cash flows after the forecast years"},{"term":"Equity value","meaning":"the value belonging to shareholders, after debt is subtracted"}],"depends_on":["Python standard library (copy, typing)"],"used_by":["not visible in the files shown"],"sections":[{"start":1,"end":21,"kind":"setup","name":"File setup","id":"s1","hash":"6f04c7d6a9aea4d0","title":"Module overview and imports","what":"Nothing runs here. It explains the two kinds of sensitivity test and loads the copy tool.","why":"Gives the reader the purpose before the code.","watch_out":""},{"start":22,"end":77,"kind":"function","name":"sensitivity_1way","id":"s2","hash":"3a8d97f83ba72ec5","title":"Testing one input across a range","what":"Reruns the model once for each value in a list, changing only one input, and records one output from each run.","why":"Shows how a single assumption moves the result.","watch_out":"A missing output name silently records an empty value for that run."},{"start":78,"end":137,"kind":"function","name":"sensitivity_2way (part 1)","id":"s3","hash":"8306f25cf68f1dc2","title":"Building the two-input grid","what":"For each pair of values from the two lists, reruns the model with both inputs set and records the output in a grid, one row per first-variable value.","why":"Shows how two assumptions work together.","watch_out":"Rows follow the first variable and columns follow the second, so swapping the two lists turns the table sideways."},{"start":138,"end":146,"kind":"function","name":"sensitivity_2way (part 2)","id":"s4","hash":"a66689e790d841d5","title":"Returning the grid and labels","what":"Returns the grid together with the names and values of both variables.","why":"Gives the caller everything needed to label the table.","watch_out":""},{"start":147,"end":189,"kind":"function","name":"create_wacc_terminal_growth_sensitivity","id":"s5","hash":"b10ceb919323dba6","title":"Cost of capital against terminal growth table","what":"Sets up the usual table of cost of capital against terminal growth. If no ranges are given, it uses default ranges around the base cost of capital and from 1 to 5 percent growth, and tracks equit
