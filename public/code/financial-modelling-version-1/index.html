,"what":"Styles the company name box, the description box, and section titles. A focused field gets a green glow so the user can see where they are typing.","why":"Likely reason: makes inputs easy to read and shows which field is active.","watch_out":"These form styles also apply to the answer boxes that are created later, so changing them changes those boxes too."},{"start":165,"end":216,"kind":"setup","name":"File setup (part 4)","id":"s4","hash":"6cf5fd0b48f15531","title":"Button and spinner styles","what":"Defines the green primary buttons, grey secondary buttons, the dimmed look for disabled buttons, and the spinning indicator shown while work runs.","why":"Likely reason: shows which action is the main one and when a step is busy.","watch_out":"The spinner and button styles are matched by class name, so the class names in the script must match these exactly."},{"start":217,"end":276,"kind":"setup","name":"File setup (part 5)","id":"s5","hash":"35e1d0d848d1b3c1","title":"Question and classification card styles","what":"Styles each discovery question with its explanation, and the grid of classification tiles that show industry, business model, stage, and confidence.","why":"Likely reason: makes each question easy to scan and the classification results easy to compare.","watch_out":"The question text comes from the server and is placed on the page as raw HTML, so styles alone do not protect against unexpected content."},{"start":277,"end":335,"kind":"setup","name":"File setup (part 6)","id":"s6","hash":"8575ee3c77fdc471","title":"Comparable company and agent panel styles","what":"Styles each comparable company card with name, ticker badge, similarity score, and reason. It also styles the right-side agent panel, which stays in view while the user scrolls.","why":"Likely reason: keeps the live agent status visible during long pages.","watch_out":"The agent panel has a height based on the window size, so it may look cramped on short screens."},{"start":336,"end":393,"kind":"setup","name":"File setup (part 7)","id":"s7","hash":"e8a9ed1427372859","title":"Agent log entry styles","what":"Styles the scrolling activity log. Prompt entries are blue, success entries are green, and error entries are red.","why":"Likely reason: lets the user tell the kind of each log line at a glance.","watch_out":"Colors are picked by a class name the script sets, so a mistyped class name leaves the entry in the default green."},{"start":394,"end":451,"kind":"setup","name":"File setup (part 8)","id":"s8","hash":"29f7999c19a0d0d6","title":"Reasoning, prompt box, and metric styles","what":"Styles purple reasoning entries, the boxed and scrollable view of full AI prompts, and metric tiles for key numbers.","why":"Likely reason: prompts are long, so they need a scrollable monospace box to be readable.","watch_out":"The metric tile styles are defined here, but the code in this file does not use them, so they may be unused."},{"start":452,"end":509,"kind":"setup","name":"File setup (part 9)","id":"s9","hash":"f91681acae80ce0a","title":"Collapsible sections and small-screen layout","what":"Styles panels that open and close, and switches the page to a single column on screens narrower than 1200 pixels.","why":"Likely reason: lets long details be hidden and keeps the page usable on smaller screens.","watch_out":"Collapsible content has a maximum height of 2000 pixels, so anything taller is cut off. The script in this file does not appear to use these panels."},{"start":510,"end":568,"kind":"setup","name":"File setup (part 10)","id":"s10","hash":"f4a39a42837a110d","title":"Hidden class and status message styles","what":"Provides a class that hides any element, and styled success and error message boxes.","why":"Likely reason: the script shows and hides whole steps by adding or removing the hidden class.","watch_out":"The hidden class is marked as overriding other display rules, so new display rules can conflict with it."},{"start":569,"end":623,"kind":"setup","name":"File setup (part 11)","id":"s11","hash":"d0bd2ab7fce304d0","title":"Steps 1 to 3 page markup","what":"Lays out step 1, where the user enters the company and description, step 2, where questions and answer boxes appear, and step 3, where classification and comparable companies are shown, with their buttons.","why":"Likely reason: the workflow is split into numbered steps that are shown one at a time.","watch_out":"The script finds steps by their IDs (step1 to step4), so those IDs must not change."},{"start":624,"end":679,"kind":"setup","name":"File setup (part 12)","id":"s12","hash":"6becfc6fa22c6caa","title":"Step 4 and agent side panel markup","what":"Holds the financial analysis area with benchmarks and required inputs, the build model button, and the right-side status panel with the initial list of four agents.","why":"Likely reason: the last step shows analysis results before the model is built.","watch_out":"The build model button only shows a placeholder alert, so it does not build a model yet."},{"start":680,"end":738,"kind":"setup","name":"File setup (part 13)","id":"s13","hash":"aae8d9a60553a6a3","title":"Script state and starting discovery","what":"Sets up the state object that holds everything gathered so far, runs an initial log message on page load, and starts discovery. Discovery checks that a company name was typed, then sends it and the optional description to the server.","why":"Likely reason: one shared state object lets each later step read what earlier steps produced.","watch_out":"The state object is also reset in startOver, so any new field must be added in both places or it will not clear."},{"start":739,"end":792,"kind":"setup","name":"File setup (part 14)","id":"s14","hash":"c23f432a9cf89425","title":"Showing discovery questions","what":"On success, saves the questions, logs the AI's reasoning and the number of questions, and builds one card per question with an answer box. Then it moves the user to step 2. On failure it logs an error and shows an alert.","why":"Reason not stated in the code.","watch_out":"Answer boxes are named from the question ID, or from the position if no ID exists, so repeated IDs could send answers to the wrong box."},{"start":793,"end":851,"kind":"setup","name":"File setup (part 15)","id":"s15","hash":"37478e485fd0204c","title":"Checking and sending answers","what":"Collects every answer, stops and shows a message if any are blank, then sends the questions and answers to the server for classification.","why":"Likely reason: classification needs complete answers to be accurate.","watch_out":"The only check is that an answer is not blank, so a meaningless answer still passes."},{"start":852,"end":898,"kind":"setup","name":"File setup (part 16)","id":"s16","hash":"f7f880be466be782","title":"Showing the company classification","what":"Shows six tiles for industry, sub-industry, business model, revenue model, stage, and confidence. Then it adds the key insights as a list.","why":"Likely reason: gives the user a summary to check before the model is built.","watch_out":"The values come from the AI response and are placed on the page as raw HTML, so odd text could break the display."},{"start":899,"end":957,"kind":"setup","name":"File setup (part 17)","id":"s17","hash":"f9de4a0dd24057c8","title":"Modeling approach and comparables search","what":"Shows the recommended modeling approach text, then asks the server for comparable public companies based on industry and business model.","why":"Likely reason: comparable companies are used to guide the model's assumptions.","watch_out":"If the comparables search fails, the error is only written to the log, so the user may see an empty list without a clear reason."},{"start":958,"end":1008,"kind":"setup","name":"File setup (part 18)","id":"s18","hash":"0711bd51245f5d8c","title":"Showing comparable companies","what":"Builds one card for each comparable company with its name, ticker, similarity percentage, and reason. If none were found, it shows a short message instead.","why":"Reason not stated in the code.","watch_out":"Names and reasons are placed on the page as raw HTML, and a missing similarity score is shown as zero percent."},{"start":1009,"end":1062,"kind":"setup","name":"File setup (part 19)","id":"s19","hash":"17ef7c91cffdc933","title":"Analyzing comparables and moving to step 4","what":"Sends the comparable companies for financial analysis, then asks for industry benchmarks. Once both finish, it moves the user to step 4. On failure it shows an alert and restores the button.","why":"Likely reason: the next step needs finished analysis data.","watch_out":"The benchmark step logs its own errors and does not stop the move to step 4, so the user can reach step 4 with no benchmarks."},{"start":1063,"end":1119,"kind":"setup","name":"File setup (part 20)","id":"s20","hash":"f89b1accf6acdc30","title":"Showing benchmarks and required inputs","what":"Shows the benchmark results and asks the server which financial inputs the model will need. Both are displayed as raw data text.","why":"Likely reason: the user should know what data is needed before building the model.","watch_out":"Results are shown as raw JSON rather than a table, which is hard for a non-programmer to read. Errors here are only logged."},{"start":1120,"end":1176,"kind":"setup","name":"File setup (part 21)","id":"s21","hash":"eb6b04f8d0854ef4","title":"Build model placeholder and navigation","what":"The build model button only shows an alert saying the builder is coming. The back button returns to an earlier step, and start over clears the saved data and returns to step 1.","why":"Likely reason: the build step is not finished, so it only announces itself.","watch_out":"Start over clears the saved data and inputs but not the activity log, so old log entries remain on screen."},{"start":1177,"end":1216,"kind":"setup","name":"File setup (part 22)","id":"s22","hash":"382f3e8fe73ff5b9","title":"Activity log and helper functions","what":"Adds timestamped entries to the activity log in color, adds full AI prompts with safe escaping, updates the status line, and starts the page setup on load.","why":"Likely reason: the log lets the user see what each AI agent was asked and what it returned.","watch_out":"The agent log puts its messages on the page as raw HTML, while the prompt log escapes them, so messages with outside text could change the layout."}],"explained_at":"2026-11-12T00:39:07+00:00","explained_by":"haiku","summary":"An older, longer version of the Financial Modeling AI web page that walks the user through company discovery, questions, classification, comparable companies, benchmarks, and required inputs, with a live log of what each AI agent did.","purpose":"Lets a user type a company name, answer AI-generated questions, review the AI's classification and comparable companies, and see the benchmarks and inputs it needs before building a financial model.","why":"Likely reason: the page is split into numbered steps so the user checks each AI result before the next step. The side panel shows the prompts and reasoning so the user can judge the AI's work.","how":"First, the page loads its styles and layout. The user enters a company name and optional description, then clicks start discovery. The page asks the server for questions and shows them one at a time. After the user answers all of them, the page sends the answers for classification, then looks up comparable companies. Next it asks for financial analysis and industry benchmarks, then for the required inputs. Every AI prompt and reply is written to the side log. The build model button only shows a placeholder message.","inputs":"Typed company name, optional description, and written answers to each question. These are sent to server routes under /api/agents/ (questionnaire, comparables). The server code is not in this packet.","outputs":"Question cards, a classification summary with key insights and a modeling approach, comparable company cards, benchmark data shown as raw text, a list of required inputs shown as raw text, and a running log with full prompts.","risks":"The build model step is not finished and only shows an alert. Several AI results are placed on the page as raw HTML, so unexpected text could break the display or insert markup. Some failures only write to the log, so the user can move on without seeing a clear error. Benchmark and input results are raw JSON, which is hard for a non-programmer to read.","debug":"Open the browser developer console and check for failed requests to the /api/agents/ routes. Check the side log first, because each step writes its prompts and errors there. If a step seems to skip, look at the matching function (for example findComparables, synthesizeBenchmarks, or determineRequiredInputs), since those catch errors and only log them. If the start over button leaves old data, check that the state object is reset in startOver.","summary_hash":"sha256:ba49f4b6737dd21baae3016bf634d3b5066589d3b52c07872b5aa9b8807c0eed","fresh":true},"static/app_questionnaire_backup.html":{"schema_version":1,"path":"static/app_questionnaire_backup.html","language":"HTML","lines":1216,"hash":"sha256:ba49f4b6737dd21baae3016bf634d3b5066589d3b52c07872b5aa9b8807c0eed","area":"static","status":"explained","summary_stale":false,"readiness":{"status":"unknown","reasons":["Only the style sections were provided, so the working script could not be checked.","It appears to be a backup and is not linked from the other pages shown.","No tests or example runs are visible in this packet."]},"terms":[{"term":"HTML","meaning":"the language that describes what a web page contains, such as text boxes and buttons"},{"term":"CSS","meaning":"the style rules that control colors, spacing, and layout on a web page"},{"term":"Backup","meaning":"an earlier saved copy of a file, kept in case it is needed later"}],"depends_on":["Google Fonts (external stylesheet for the Inter and JetBrains Mono fonts)"],"used_by":["Not visible in this packet. No page shown links to this file."],"sections":[{"start":1,"end":54,"kind":"setup","name":"File setup (part 1)","id":"s1","hash":"6a8f44f6af96e243","title":"Page basics and color theme","what":"Sets the page title, loads the fonts, and defines the dark color scheme. It also keeps the top bar in place while the page scrolls.","why":"Likely reason: keeps a consistent dark look across the whole page.","watch_out":"The color settings are shared, so changing one value changes every part of the page that uses it."},{"start":55,"end":112,"kind":"setup","name":"File setup (part 2)","id":"s2","hash":"004e055635c22b68","title":"Header and main two-column layout","what":"Styles the top bar with logo and status line, and the main grid with a workflow column and an agent panel. It also gives cards their basic look.","why":"Likely reason: keeps the steps and the live agent log visible together.","watch_out":"The right column has a fixed width, so narrow screens rely on the responsive rule near the end of the file."},{"start":113,"end":164,"kind":"setup","name":"File setup (part 3)","id":"s3","hash":"b122b3b4e45ce1fd","title":"Form fields and card titles","what":"Styles the text boxes and section titles, and adds a green glow to the field the user is typing in.","why":"Likely reason: makes inputs readable and shows which field is active.","watch_out":"These styles also apply to any answer boxes created later on the page."},{"start":165,"end":216,"kind":"setup","name":"File setup (part 4)","id":"s4","hash":"6cf5fd0b48f15531","title":"Button and spinner styles","what":"Defines primary and secondary buttons, the dimmed disabled look, and the spinning indicator used while work runs.","why":"Likely reason: shows the main action and when a step is busy.","watch_out":"Buttons and the spinner are matched by class name, so the script must use the same names."},{"start":217,"end":276,"kind":"setup","name":"File setup (part 5)","id":"s5","hash":"35e1d0d848d1b3c1","title":"Question and classification card styles","what":"Styles each question card with its explanation, and the grid of classification tiles.","why":"Likely reason: makes questions and results easy to scan.","watch_out":"Question text is placed on the page from server data, so the styles offer no protection from unexpected content."},{"start":277,"end":335,"kind":"setup","name":"File setup (part 6)","id":"s6","hash":"8575ee3c77fdc471","title":"Comparable company and agent panel styles","what":"Styles comparable company cards with name, ticker, score, and reason, and the right-side agent panel.","why":"Likely reason: keeps the agent status visible while the user scrolls.","watch_out":"The agent panel uses a height based on the window size, so it may be cramped on short screens."},{"start":336,"end":393,"kind":"setup","name":"File setup (part 7)","id":"s7","hash":"e8a9ed1427372859","title":"Agent log entry styles","what":"Styles the scrolling activity log so prompt, success, and error entries show in different colors.","why":"Likely reason: lets the user tell the kind of each log line at a glance.","watch_out":"Colors depend on class names set by the script, so a mismatched name leaves the default color."},{"start":394,"end":451,"kind":"setup","name":"File setup (part 8)","id":"s8","hash":"29f7999c19a0d0d6","title":"Prompt box and metric styles","what":"Styles the scrollable monospace box for full AI prompts, and metric tiles for showing key numbers.","why":"Likely reason: prompts are long and need a scrollable box to be readable.","watch_out":"The prompt box has a maximum height, so long prompts need scrolling to be read."},{"start":452,"end":509,"kind":"setup","name":"File setup (part 9)","id":"s9","hash":"f91681acae80ce0a","title":"Collapsible sections and small-screen layout","what":"Styles panels that open and close, and switches to a single column on screens narrower than 1200 pixels.","why":"Likely reason: lets long details be hidden and keeps the page usable on small screens.","watch_out":"Collapsible content is capped at 2000 pixels, so anything taller is cut off."},{"start":510,"end":568,"kind":"setup","name":"File setup (part 10)","id":"s10","hash":"f4a39a42837a110d","title":"Status message styles and page header","what":"Sets how success and error messages look, then builds the top bar that shows the FINANCIAL AI logo and a 'multi-agent system active' status light. The page is a standalone backup of an older discovery questionnaire flow.","why":"Likely reason: the page needs visible feedback for success and error states, and a header that matches the main app.","watch_out":""},{"start":569,"end":623,"kind":"setup","name":"File setup (part 11)","id":"s11","hash":"d0bd2ab7fce304d0","title":"Start discovery button and step containers","what":"Adds the Start Discovery button and the markup for step 2 (questions), step 3 (classification and comparables) and their buttons. Only the first step is visible when the page loads, and each step is shown or hidden by script.","why":"Likely reason: the page moves the user through steps by hiding and showing blocks rather than loading new pages.","watch_out":"Each step's buttons call functions by name, so renaming a function in the script breaks the button silently."},{"start":624,"end":679,"kind":"setup","name":"File setup (part 12)","id":"s12","hash":"6becfc6fa22c6caa","title":"Benchmarks, required inputs and agent panel","what":"Adds step 4 (benchmarks, required inputs and a Build Model button) and the right-hand agent panel. The panel starts with a fixed list of four agents that are shown as ready.","why":"Reason not stated in the code.","watch_out":"The Build Model button only shows a placeholder alert, so this step does not yet build anything."},{"start":680,"end":738,"kind":"setup","name":"File setup (part 13)","id":"s13","hash":"aae8d9a60553a6a3","title":"App state and the start of question generation","what":"Creates the shared state object that holds the company name, questions, answers, classification, comparables, benchmarks and required inputs. Then the start of the generate step reads the form, checks the company name is filled, and sends it to the server.","why":"Likely reason: one state object keeps each step's results available to the next step.","watch_out":"The same empty state shape is written again in the reset function, so any new field must be added in both places."},{"start":739,"end":792,"kind":"setup","name":"File setup (part 14)","id":"s14","hash":"c23f432a9cf89425","title":"Finishing question generation and drawing questions","what":"Finishes the generate step: it logs the questions and the agent's reasoning, shows step 2, and re-enables the button afterwards. The display function then builds one card per question with a text box for each answer.","why":"Likely reason: the error and re-enable steps sit in a finally block so the button always comes back, even after a failure.","watch_out":"Answer boxes are named from the question id, and missing ids fall back to the list position, so the two must stay in sync."},{"start":793,"end":851,"kind":"setup","name":"File setup (part 15)","id":"s15","hash":"37478e485fd0204c","title":"Submitting answers and getting a classification","what":"Collects every answer, refuses to continue if any are blank, and sends the question and answer pairs to the server for analysis. On success it shows the classification, looks up comparable companies, and moves to step 3.","why":"Likely reason: the check for blank answers stops incomplete input before a paid analysis call is made.","watch_out":"Errors from the analysis call show an alert, but the failure from the comparables step is only logged, so the user may not notice it."},{"start":852,"end":898,"kind":"setup","name":"File setup (part 16)","id":"s16","hash":"f7f880be466be782","title":"Showing the company classification","what":"Draws a grid of six classification facts (industry, sub-industry, business model, revenue model, stage and confidence) and then lists the key insights as bullet lines.","why":"Reason not stated in the code.","watch_out":"Values from the server are inserted directly into the page as HTML, so unexpected text from the model could change how the page looks."},{"start":899,"end":957,"kind":"setup","name":"File setup (part 17)","id":"s17","hash":"f9de4a0dd24057c8","title":"Recommended modeling approach and finding comparables","what":"Shows the recommended modeling approach as a text block when the server provides one. Then the find step asks the server for five similar public companies using the industry and business model.","why":"Reason not stated in the code.","watch_out":"The modeling approach text is also inserted as raw HTML, so it is not escaped."},{"start":958,"end":1008,"kind":"setup","name":"File setup (part 18)","id":"s18","hash":"0711bd51245f5d8c","title":"Showing comparable companies and starting their analysis","what":"Draws one card per comparable with its name, ticker, similarity percentage and reason, or a note saying none were found. The analyze step then sends the comparables to the server for financial research.","why":"Reason not stated in the code.","watch_out":"The page assumes each comparable has a similarity score and a ticker, and shows missing values as blanks or zero."},{"start":1009,"end":1062,"kind":"setup","name":"File setup (part 19)","id":"s19","hash":"17ef7c91cffdc933","title":"Finishing analysis and building benchmarks","what":"Finishes the analysis step and moves to step 4. The benchmark step sends the research results to the server and then shows the benchmark ranges returned.","why":"Reason not stated in the code.","watch_out":"The benchmark step has no visible error message for the user, only a log entry."},{"start":1063,"end":1119,"kind":"setup","name":"File setup (part 20)","id":"s20","hash":"f89b1accf6acdc30","title":"Showing benchmarks and finding required inputs","what":"Shows the benchmark ranges as raw JSON text, then asks the server which financial inputs this company needs and stores the answer.","why":"Likely reason: the raw JSON view shows exactly what the server returned, which helps while the layout is still being designed.","watch_out":"Raw JSON is shown as is, so the owner sees a dump rather than a clean table."},{"start":1120,"end":1176,"kind":"setup","name":"File setup (part 21)","id":"s21","hash":"eb6b04f8d0854ef4","title":"Required inputs view, build placeholder and reset","what":"Shows the required inputs as raw JSON. The Build Model button only shows a message that the builder is coming next. The go back function shows the previous step, and the start over function clears all state and returns to step 1.","why":"Likely reason: the build step is a placeholder, so this page marks where the real builder will go.","watch_out":"Start over clears the state object but the logs stay on screen, so old results can still be read after a reset."},{"start":1177,"end":1216,"kind":"setup","name":"File setup (part 22)","id":"s22","hash":"382f3e8fe73ff5b9","title":"Logging, prompt display and page load","what":"Adds helpers that write messages and full prompt text into the agent log, update the status line, and escape prompt text so it shows as text. The last part runs the initial setup when the page finishes loading.","why":"Likely reason: prompt text is escaped so that any HTML inside it is shown as plain text.","watch_out":"Only prompt text is escaped. Ordinary log messages are inserted as HTML, so server text in those messages is not protected."}],"explained_at":"2026-11-12T00:40:04+00:00","explained_by":"haiku","summary":"A backup copy of the first part of the older Financial Modeling AI page, of which only the style rules were provided for review.","purpose":"Keeps a saved copy of the questionnaire version of the page so an earlier working state can be restored if needed.","why":"Likely reason: a backup was made before changes to app_old.html. The file name suggests this, but the code does not say so.","how":"The file loads the same fonts and style rules as app_old.html. Only the style sections were provided, so the page's steps and script could not be reviewed.","inputs":"Only the page code in this file. The page appears to call the same server routes as app_old.html, but this was not checked.","outputs":"Visually, the same styled page as app_old.html, based on the style sections shown.","risks":"Because it is a copy, it may drift out of date and mislead anyone who edits the wrong file. It has the same unescaped display risk if its script matches app_old.html.","debug":"Compare this file with app_old.html to find which copy is current. If a fix is missing, check whether it was made in app_old.html only.","summary_hash":"sha256:ba49f4b6737dd21baae3016bf634d3b5066589d3b52c07872b5aa9b8807c0eed","fresh":true},"static/index.html":{"schema_version":1,"path":"static/index.html","language":"HTML","lines":861,"hash":"sha256:7d838147b1931cc6582d475557c1688730eac174cee68895ecd807cb201ccf49","area":"static","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The research summary, assumptions and log counts are fixed text, so the page can show results that were never calculated for the company.","The assumption fields and Update button do not change the model, and the page says a recalculation will be added later.","The Excel export claims formulas but writes only values.","Server text is placed into the page as HTML without escaping, which is a risk if the model returns unexpected markup.","No automated tests or error handling for missing fields were found in this file."]},"terms":[{"term":"API endpoint","meaning":"a web address on the server that this page sends a request to, such as the quick-model address, to ask for data or a calculation"},{"term":"CDN","meaning":"a shared web host that serves libraries such as Chart.js and the Excel library, so the page does not need its own copies"},{"term":"Chart.js","meaning":"a library that draws the line and bar charts on the page"},{"term":"Excel library (xlsx)","meaning":"a library that builds and downloads Excel files in the browser"},{"term":"Three-statement model","meaning":"a financial model that links the income statement, the cash flow statement and the balance sheet"},{"term":"Income statement","meaning":"a report of revenue, costs and profit over a year"},{"term":"Free cash flow","meaning":"the cash a business has left after paying for its running costs and investments, which is used to judge its value"},{"term":"DCF valuation","meaning":"a way of valuing a company by adding up the cash it is expected to make in the future, discounted back to today"},{"term":"WACC","meaning":"the average rate of return a company must pay to its lenders and owners, used as the discount rate in a DCF"},{"term":"Enterprise value","meaning":"the value of the whole business, before subtracting debt or adding cash"},{"term":"Terminal value","meaning":"the estimated value of the business after the explicit forecast years, which is often a large share of the total"}],"depends_on":["/api/orchestrator/quick-model (server endpoint)","chart.js 4.4.0 from cdn.jsdelivr.net","xlsx 0.18.5 from cdnjs.cloudflare.com","Google Fonts (Space Grotesk and JetBrains Mono)"],"used_by":["No caller is visible in this file. It is probably served by the backend as the main page."],"sections":[{"start":1,"end":56,"kind":"setup","name":"File setup (part 1)","id":"s1","hash":"4d5ef3348ffbddbd","title":"Page setup and colour theme","what":"Loads the fonts and the chart and Excel libraries, then sets the page colours and the fixed top bar. The colours are kept in one place so the whole page can be restyled from here.","why":"Likely reason: keeping colours in one place lets the look change without editing each element.","watch_out":"The page needs internet access to load these libraries, so charts and export stop working offline."},{"start":57,"end":110,"kind":"setup","name":"File setup (part 2)","id":"s2","hash":"cb7c1263b643de7b","title":"Header, two-column layout and timeline line","what":"Styles the logo, the export button, and the two-column layout with a main flow on the left and an activity panel on the right. A thin glowing line runs down the left side to link the steps.","why":"Reason not stated in the code.","watch_out":"The layout uses fixed heights based on the header size, so changing the header height means changing these values too."},{"start":111,"end":168,"kind":"setup","name":"File setup (part 3)","id":"s3","hash":"8ca7e46d67558f47","title":"Step cards and company name box","what":"Styles each numbered step with a glowing dot on the timeline, and styles the company name box with an orange glow when it is selected.","why":"Reason not stated in the code.","watch_out":""},{"start":169,"end":227,"kind":"setup","name":"File setup (part 4)","id":"s4","hash":"f55b5ade3b4920e2","title":"Buttons, cards and assumption rows","what":"Styles the main orange button, its hover and disabled looks, the content cards, and the rows used to show each assumption.","why":"Reason not stated in the code.","watch_out":"The disabled style is the only signal that a build is running, so it matters for the user."},{"start":228,"end":284,"kind":"setup","name":"File setup (part 5)","id":"s5","hash":"8b2594c89f0d1b4b","title":"Assumption inputs, chart area and tables","what":"Styles the small number boxes used for assumptions, the Update button, the fixed-height chart area, and the financial tables.","why":"Reason not stated in the code.","watch_out":"Charts are given a fixed height, so they will not resize to fit their content."},{"start":285,"end":339,"kind":"setup","name":"File setup (part 6)","id":"s6","hash":"1673b11f7beda005","title":"Agent panel and hiding helper","what":"Styles the table row highlight, the right-hand activity panel, its entries, and the rule that hides any element with the hidden class.","why":"Likely reason: the hidden rule uses a strong override so that other styles cannot keep an element visible.","watch_out":"Hiding and showing steps depends on the hidden rule, so removing it would show every step at once."},{"start":340,"end":387,"kind":"setup","name":"File setup (part 7)","id":"s7","hash":"12d41d25420a5c29","title":"Loading spinner and tab styles","what":"Styles the spinning loader shown during a build and the three tabs for the financial statements, including which tab is active.","why":"Reason not stated in the code.","watch_out":""},{"start":388,"end":443,"kind":"setup","name":"File setup (part 8)","id":"s8","hash":"4557abf600b13e07","title":"Small-screen layout and the first two steps","what":"Changes the layout to a single column on narrow screens. Then the page markup for the header, the export button (hidden at first) and steps 1 and 2 is added.","why":"Likely reason: the export button starts hidden so that it only appears after a model exists.","watch_out":"The export button is shown only by the build code, so it stays hidden if the build path changes."},{"start":444,"end":503,"kind":"setup","name":"File setup (part 9)","id":"s9","hash":"58bf23a25765a571","title":"Steps 3 to 5 and the start of the script","what":"Adds the markup for the assumptions step, the three-tab statements step, and the charts and valuation step. Then the script begins with the state object that stores the company, the model, the assumptions and the active tab.","why":"Reason not stated in the code.","watch_out":""},{"start":504,"end":548,"kind":"setup","name":"File setup (part 10)","id":"s10","hash":"d7c80b6cd5082c00","title":"Starting the model build","what":"When the user clicks Build or presses Enter, this sends the company name to the quick-model endpoint. On success it keeps the reply and shows steps 2 to 5 and the export button. On failure it shows an alert and restores the button.","why":"Reason not stated in the code.","watch_out":"The build assumes the reply contains a list of steps and the summary sections. If any of these are missing, the page shows an error after part of the results may already be drawn."},{"start":549,"end":594,"kind":"setup","name":"File setup (part 11)","id":"s11","hash":"d474609a98f7456b","title":"Assumptions and research summary","what":"Returns a fixed set of assumptions (starting revenue, growth rates, margins, tax, cost of capital) and writes a fixed research summary into step 2. The summary names a fixed industry and model along with the company name.","why":"Reason not stated in the code.","watch_out":"These values are typed in, not read from the server. The page can show them as if they came from the research, so they must not be treated as results."},{"start":595,"end":632,"kind":"setup","name":"File setup (part 12)","id":"s12","hash":"096256a2ffffee5f","title":"Assumption inputs and statement section setup","what":"Builds the assumption boxes for starting revenue, first-year growth, gross margin and research cost, each with an Update button. Then the statement section starts by reading the revenue figures from the reply.","why":"Reason not stated in the code.","watch_out":"The number boxes are not connected to the model, so changing them has no effect on the results."},{"start":633,"end":691,"kind":"setup","name":"File setup (part 13)","id":"s13","hash":"59aa5882458f7cc1","title":"Income statement and cash flow tables","what":"Builds the income statement table (revenue, gross profit, EBITDA and net income) and the cash flow table (free cash flow), each showing five years in millions of dollars. The balance sheet tab only shows a message saying it is not built yet.","why":"Reason not stated in the code.","watch_out":"The table headers always say Year 1 to Year 5, so a model with a different number of years would be shown incorrectly."},{"start":692,"end":738,"kind":"setup","name":"File setup (part 14)","id":"s14","hash":"9c6721191aa954d2","title":"Revenue line chart","what":"Draws a line chart of revenue over five years, in millions, using the page's orange and grey colours.","why":"Reason not stated in the code.","watch_out":"The chart uses the same five labels as the tables, so it depends on there being exactly five years."},{"start":739,"end":796,"kind":"setup","name":"File setup (part 15)","id":"s15","hash":"5b8a49d89fe27bd0","title":"Cash flow chart and valuation cards","what":"Draws a bar chart of free cash flow and then shows three valuation figures: enterprise value, WACC and terminal value. The Update action for recalculation only shows a message that it is not built yet.","why":"Reason not stated in the code.","watch_out":"The recalculate function is a placeholder, so the page cannot yet update results from changed inputs."},{"start":797,"end":855,"kind":"setup","name":"File setup (part 16)","id":"s16","hash":"20750167467e2bc8","title":"Tabs, Excel export and activity log","what":"Switches between the three statement tabs. Export builds an Excel file with three sheets (income statement, cash flow and valuation) and downloads it. The activity log function adds a labelled entry to the right-hand panel.","why":"Reason not stated in the code.","watch_out":"The export writes the numbers only. The activity log says it includes formulas, which is not true, so a user checking the file will not find working formulas."},{"start":856,"end":861,"kind":"setup","name":"File setup (part 17)","id":"s17","hash":"9e1020af5667792b","title":"Enter key starts the build","what":"Listens for the Enter key in the company name box and runs the build. This gives the same result as clicking the button.","why":"Reason not stated in the code.","watch_out":"The Enter key is not blocked while a build is running, so a quick second press can send a second request."}],"explained_at":"2026-11-12T00:40:04+00:00","explained_by":"haiku","summary":"This is the main ORACLE web page. It takes a company name, asks the server to build a simple three-statement financial model for it, and shows the income statement, cash flow, a revenue chart and a valuation, with an Excel export.","purpose":"It is the front end of the financial model builder. The user types a company name and sees the results on one page, while a side panel shows what the agents did.","why":"Likely reason: one plain page with no build step keeps the front end simple while the server does the modeling. The file also has placeholders, which suggests it is an early version that is still being built.","how":"First, the page loads its styles and the Chart.js and Excel libraries. When the user clicks Build Financial Model or presses Enter, the page calls the quick-model endpoint on the server. It saves the reply in a state object. Then it fills the research section with fixed text, the assumptions section with fixed numbers, the income and cash flow tables, two charts, and the valuation cards. Export to Excel writes three sheets from the saved reply. Switching tabs only changes which table is visible.","inputs":"The company name typed in the text box. The reply from the server, which must include the all_steps list, the income statement summary, the cash flow summary and the valuation summary. The numbers in the assumptions boxes are shown but not used.","outputs":"Visible sections on the page: research summary, assumption boxes, income and cash flow tables, two line and bar charts, valuation cards, and an activity log. An Excel file named after the company is downloaded when Export is clicked.","risks":"Several values on screen are fixed text or fixed numbers, not results. The industry (Technology / Software), business model (SaaS), comparable count, and 'Performed 5 web searches' and '45 calculation steps' messages are typed in, so they may not match the company. The Update button in the assumptions section only shows an alert. The Excel export says it includes formulas but writes plain numbers. Server text is placed into the page as HTML without escaping. The Enter key can start a build while the button is disabled.","debug":"If the page shows an alert saying the build failed, check the reply from the quick-model endpoint in the browser's network tab. If charts are missing, check that the Chart.js library loaded from its CDN. If Export does nothing, check that the xlsx library loaded. If numbers look wrong, compare them with the reply, since every money value is divided by one million for display. If the research text does not match the company, that is expected, because it is fixed text. The activity log keeps growing across builds because a reset is not run between them.","summary_hash":"sha256:7d838147b1931cc6582d475557c1688730eac174cee68895ecd807cb201ccf49","fresh":true}}}</script>
<script>
(function () {
  "use strict";

  var main = document.getElementById("main");
  var DATA = null;
  try { DATA = JSON.parse(document.getElementById("clarity-data").textContent); } catch (error) { DATA = null; }

  // ---- Mode (shared with the portfolio through the same storage key) ----
  var modeButton = document.getElementById("mode");
  function currentMode() { return document.documentElement.getAttribute("data-mode") === "nerd" ? "nerd" : "calm"; }
  function syncModeLabel() { modeButton.setAttribute("aria-label", "Switch to " + (currentMode() === "calm" ? "nerd" : "calm") + " mode"); }
  modeButton.addEventListener("click", function () {
    var next = currentMode() === "calm" ? "nerd" : "calm";
    document.documentElement.setAttribute("data-mode", next);
    try { localStorage.setItem("site-mode", next); } catch (error) { /* private browsing: fine */ }
    syncModeLabel();
  });
  syncModeLabel();

  if (!DATA || !DATA.repo) {
    main.innerHTML = '<div class="empty"><p class="label">No notes yet</p><h2 class="display" style="margin-top:14px">This page is empty</h2>' +
      '<p class="punch">Open the repository in Claude Code and run <code>python3 .claude/clarity/clarity.py build</code> to fill it.</p></div>';
    return;
  }

  var REPO = DATA.repo;
  var SITE = DATA.site || {};
  var FILES = DATA.files || {};
  var PATHS = Object.keys(FILES).sort();
  var TITLE = SITE.project_name || REPO.name || "Repository";
  var FILE_STATES = {
    "ready": ["\u2713", "Ready", "ok"], "needs-work": ["!", "Needs work", "warn"],
    "not-ready": ["\u00D7", "Not ready", "bad"], "unknown": ["?", "Not checked", "unk"]
  };
  var CHECK_STATES = {
    "pass": ["\u2713", "Yes", "ok"], "partial": ["!", "Partly", "warn"], "fail": ["\u00D7", "No", "bad"],
    "unknown": ["?", "Not checked", "unk"], "ready": ["\u2713", "Ready", "ok"],
    "needs-work": ["!", "Needs work", "warn"], "not-ready": ["\u00D7", "Not ready", "bad"]
  };
  var KIND_LABELS = { "setup": "setup", "function": "function", "class": "class", "method": "method",
    "type": "data shape", "value": "settings or data", "route": "web address", "export": "export",
    "statement": "database statement", "block": "block", "rule": "style rule", "entry point": "starting point",
    "test group": "tests", "event handler": "reacts to an event" };

  function esc(value) {
    return String(value == null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function fmt(value) {
    if (!value) return "";
    return esc(value).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\n/g, "<br>");
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function trunc(value, n) { value = String(value || ""); return value.length > n ? value.slice(0, n - 1) + "\u2026" : value; }
  function base(path) { var i = path.lastIndexOf("/"); return i < 0 ? path : path.slice(i + 1); }
  function dir(path) { var i = path.lastIndexOf("/"); return i < 0 ? "" : path.slice(0, i + 1); }
  function fileHref(path, section) { return "#/file/" + encodeURIComponent(path) + (section ? "/" + section : ""); }
  function both(calm, nerd) { return '<span class="calm-only">' + calm + '</span><span class="nerd-only">' + nerd + "</span>"; }
  function badge(states, status) {
    var s = states[status] || states.unknown;
    return '<span class="badge b-' + s[2] + '"><span aria-hidden="true">' + s[0] + "</span>" + esc(s[1]) + "</span>";
  }
  function fileBadge(card) { return badge(FILE_STATES, (card.readiness && card.readiness.status) || "unknown"); }
  function checkBadge(status) { return badge(CHECK_STATES, status || "unknown"); }
  function explainState(card) {
    if (!card.fresh) return ["\u25D0", "Code changed after these notes were written"];
    if (card.status === "explained") return ["\u25CF", "Explained"];
    if (card.status === "partial") return ["\u25D0", "Partly explained"];
    return ["\u25CB", "Not explained yet"];
  }
  function sec(n, title, nerdTitle, body) {
    return '<section class="sec"><p class="label">' + pad(n) + " / " + both(esc(title), esc(nerdTitle || title)) +
      '</p><div class="sec-body">' + body + "</div></section>";
  }

  // ---- Breadcrumb back into the portfolio -------------------------------
  var SITE_ROOT = SITE.url ? SITE.url.replace(/\/?$/, "/") : "";
  var PROJECT_URL = SITE_ROOT && SITE.project ? SITE_ROOT + "work/" + SITE.project + "/" : "";
  (function () {
    var crumbs = document.getElementById("crumbs");
    var parts = [];
    if (SITE_ROOT) {
      parts.push('<a class="link-quiet" href="' + esc(SITE_ROOT) + '">' + esc(SITE.owner || "Home") + "</a>");
      parts.push('<span aria-hidden="true">/</span><a class="link-quiet" href="' + esc(SITE_ROOT + "code/") + '">Code</a>');
      parts.push('<span aria-hidden="true">/</span><span class="here">' + esc(TITLE) + "</span>");
    } else {
      parts.push('<span class="here">' + esc(TITLE) + '</span><span aria-hidden="true">/</span><span>' + both("Code explorer", "./explore") + "</span>");
    }
    crumbs.innerHTML = parts.join("");
    if (PROJECT_URL) {
      var who = document.querySelector(".rail .who");
      if (who) who.insertAdjacentHTML("afterend", '<p class="label" style="margin:10px 0 0"><a class="link-quiet" href="' + esc(PROJECT_URL) +
        '">' + both("See the project page", "cd ../work/" + esc(SITE.project)) + "</a></p>");
    }
  })();
  function lineLink(path, s) {
    if (!SITE.repo_url || !REPO.commit) return "";
    var url = SITE.repo_url.replace(/\/$/, "") + "/blob/" + encodeURIComponent(REPO.commit) + "/" +
      path.split("/").map(encodeURIComponent).join("/") + "#L" + s.start + "-L" + s.end;
    return '<a class="link-quiet" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer"' +
      (SITE.private ? ' title="Private repository: opens for the owner after signing in to GitHub"' : "") + ">" +
      both(SITE.private ? "GitHub (owner only)" : "Open on GitHub", "git show") + "</a>";
  }

  // ---- Areas -------------------------------------------------------------
  var AREAS = [];
  var AREA_BY_ID = {};
  (function buildAreas() {
    (REPO.areas || []).forEach(function (a) {
      if (!AREA_BY_ID[a.id]) { var copy = Object.assign({}, a, { files: [] }); AREAS.push(copy); AREA_BY_ID[a.id] = copy; }
    });
    PATHS.forEach(function (p) {
      var id = FILES[p].area || "other";
      if (!AREA_BY_ID[id]) {
        var made = { id: id, name: id === "other" ? "Everything else" : id, summary: "", why: "", debug_tips: "", files: [] };
        AREAS.push(made); AREA_BY_ID[id] = made;
      }
      AREA_BY_ID[id].files.push(p);
    });
    AREAS = AREAS.filter(function (a) { return a.files.length > 0; });
    AREAS.forEach(function (a, i) { a.num = pad(i + 1); });
  })();

  var START = (REPO.start_here || []).filter(function (p) { return FILES[p]; });
  function sortFiles(list) {
    return list.slice().sort(function (a, b) {
      var sa = START.indexOf(a), sb = START.indexOf(b);
      if (sa !== sb) return (sa < 0 ? 999 : sa) - (sb < 0 ? 999 : sb);
      return (FILES[b].lines || 0) - (FILES[a].lines || 0) || a.localeCompare(b);
    });
  }
  function stats() {
    var out = { files: 0, explained: 0, sections: 0, noted: 0, stale: 0, lines: 0 };
    PATHS.forEach(function (p) {
      var f = FILES[p];
      out.files += 1; out.lines += f.lines || 0;
      if (f.status === "explained") out.explained += 1;
      (f.sections || []).forEach(function (s) { out.sections += 1; if (s.what) out.noted += 1; });
      if (!f.fresh || f.summary_stale) out.stale += 1;
    });
    return out;
  }

  // ---- Sidebar -----------------------------------------------------------
  document.getElementById("repo-name").textContent = TITLE;
  document.title = "Code explorer: " + TITLE;
  var builtBits = [];
  if (DATA.built_at) builtBits.push("Built " + DATA.built_at.slice(0, 10));
  if (REPO.commit) builtBits.push("commit " + REPO.commit);
  if (SITE.mode === "notes") builtBits.push("notes only");
  document.getElementById("built").textContent = builtBits.join(" / ");

  var tree = document.getElementById("tree");
  var search = document.getElementById("q");
  var currentPath = null, currentArea = null, openArea = null;

  function matches(path, q) {
    var f = FILES[path];
    if (path.toLowerCase().indexOf(q) >= 0) return true;
    if ((f.summary || "").toLowerCase().indexOf(q) >= 0) return true;
    return (f.terms || []).some(function (t) { return (t.term || "").toLowerCase().indexOf(q) >= 0; });
  }
  function renderTree() {
    var q = (search.value || "").trim().toLowerCase();
    var html = '<p class="label tree-title">' + both("Files by area", "ls -R") + "</p>";
    var shown = 0;
    AREAS.forEach(function (a) {
      var files = sortFiles(a.files).filter(function (p) { return !q || matches(p, q); });
      if (!files.length) return;
      var open = q || a.id === currentArea ? " open" : "";
      html += '<details class="t-area"' + open + ' data-area="' + esc(a.id) + '"><summary><span class="label">' + a.num +
        '</span><span class="t-name">' + esc(a.name) + '</span><span class="label t-count">' + files.length + "</span></summary><ul>";
      files.forEach(function (p) {
        var st = explainState(FILES[p]);
        var cur = p === currentPath ? ' aria-current="page"' : "";
        html += '<li><a href="' + fileHref(p) + '"' + cur + ' title="' + esc(p) + '"><span class="dot" title="' + esc(st[1]) +
          '" aria-label="' + esc(st[1]) + '">' + st[0] + '</span><span class="t-base">' + esc(base(p)) +
          '</span><span class="t-dir">' + esc(dir(p)) + "</span></a></li>";
        shown += 1;
      });
      html += "</ul></details>";
    });
    if (!shown) html += '<p class="t-empty">No files match \u201C' + esc(search.value) + '\u201D.</p>';
    tree.innerHTML = html;
  }
  var timer = null;
  search.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(renderTree, 120); });
  search.addEventListener("keydown", function (event) {
    if (event.key !== "Enter") return;
    var first = tree.querySelector("li a");
    if (first) location.hash = first.getAttribute("href");
  });
  document.addEventListener("keydown", function (event) {
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if (event.key === "/" && !/input|textarea/i.test(tag)) { event.preventDefault(); search.focus(); }
  });

  // ---- Mind map ----------------------------------------------------------
  function edge(x1, y1, x2, y2, opacity) {
    var mx = (x1 + x2) / 2;
    return '<path class="mm-edge" d="M' + x1 + " " + y1 + " C" + mx + " " + y1 + ", " + mx + " " + y2 + ", " + x2 + " " + y2 +
      '" stroke-opacity="' + opacity + '"/>';
  }
  function drawMap() {
    var wrap = document.getElementById("mm");
    var detail = document.getElementById("mm-detail");
    if (!wrap) return;
    if (!AREAS.length) { wrap.innerHTML = '<p class="pending">No source files yet.</p>'; return; }
    var ROW = 40, H = 30, TOP = 10, X0 = 4, W0 = 200, X1 = 250, W1 = 268, X2 = 566, W2 = 292;
    var ys = AREAS.map(function (_, i) { return TOP + i * ROW; });
    var open = AREA_BY_ID[openArea] || null;
    var fnodes = [];
    if (open) {
      var sorted = sortFiles(open.files);
      var shown = sorted.slice(0, 14);
      fnodes = shown.map(function (p) { return { kind: "file", path: p }; });
      if (sorted.length > shown.length) fnodes.push({ kind: "more", n: sorted.length - shown.length });
    }
    var oi = open ? AREAS.indexOf(open) : -1;
    var fTop = open ? Math.max(TOP, ys[oi] - ((fnodes.length - 1) * ROW) / 2) : TOP;
    var lastA = ys[ys.length - 1];
    var lastF = fnodes.length ? fTop + (fnodes.length - 1) * ROW : 0;
    var height = Math.max(lastA, lastF) + H + TOP;
    var width = (open ? X2 + W2 : X1 + W1) + 6;
    var rootY = (ys[0] + lastA) / 2;
    var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + width + " " + height + '" width="' + width + '" height="' +
      height + '" role="group" aria-label="Mind map of ' + esc(TITLE) + '">';
    AREAS.forEach(function (a, i) { s += edge(X0 + W0, rootY + H / 2, X1, ys[i] + H / 2, open && a !== open ? 0.12 : 0.4); });
    fnodes.forEach(function (_, j) { s += edge(X1 + W1, ys[oi] + H / 2, X2, fTop + j * ROW + H / 2, 0.4); });
    s += '<g class="mm-root"><rect x="' + X0 + '" y="' + rootY + '" width="' + W0 + '" height="' + H + '" rx="15"/><text x="' +
      (X0 + 16) + '" y="' + (rootY + 19) + '">' + esc(trunc(TITLE, 24)) + "</text></g>";
    AREAS.forEach(function (a, i) {
      var isOpen = a === open;
      s += '<g class="mm-node mm-area' + (isOpen ? " is-open" : "") + (open && !isOpen ? " is-dim" : "") + '" tabindex="0" role="button" aria-expanded="' +
        isOpen + '" aria-label="' + esc(a.name) + ", " + a.files.length + ' files" data-area="' + esc(a.id) + '"><rect class="box" x="' + X1 +
        '" y="' + ys[i] + '" width="' + W1 + '" height="' + H + '" rx="15"/><text class="mm-num" x="' + (X1 + 14) + '" y="' + (ys[i] + 19) + '">' +
        a.num + '</text><text x="' + (X1 + 44) + '" y="' + (ys[i] + 19) + '">' + esc(trunc(a.name, 25)) + '</text><text class="mm-count" x="' +
        (X1 + W1 - 14) + '" y="' + (ys[i] + 19) + '" text-anchor="end">' + a.files.length + "</text></g>";
    });
    fnodes.forEach(function (f, j) {
      var y = fTop + j * ROW;
      if (f.kind === "more") {
        s += '<g class="mm-node mm-more" tabindex="0" role="link" aria-label="' + f.n + ' more files in this area" data-more="' + esc(open.id) +
          '"><rect class="box" x="' + X2 + '" y="' + y + '" width="' + W2 + '" height="' + H + '" rx="4"/><text x="' + (X2 + 14) + '" y="' + (y + 19) +
          '">' + f.n + " more files in this area</text></g>";
        return;
      }
      var card = FILES[f.path];
      var st = explainState(card);
      s += '<g class="mm-node mm-file" tabindex="0" role="link" aria-label="' + esc(f.path) + ", " + esc(st[1]) + '" data-path="' + esc(f.path) +
        '"><rect class="box" x="' + X2 + '" y="' + y + '" width="' + W2 + '" height="' + H + '" rx="4"/><text x="' + (X2 + 14) + '" y="' + (y + 19) + '">' +
        esc(trunc(base(f.path), 32)) + '</text><text class="mm-glyph" x="' + (X2 + W2 - 14) + '" y="' + (y + 19) + '" text-anchor="end">' + st[0] +
        "</text><title>" + esc(f.path) + (card.summary ? ": " + esc(card.summary) : "") + "</title></g>";
    });
    wrap.innerHTML = s + "</svg>";
    if (open) {
      detail.innerHTML = '<p class="label legend">' + open.num + " / " + both("Area", "dir") + "</p><h3>" + esc(open.name) + "</h3>" +
        (open.summary ? "<p>" + fmt(open.summary) + "</p>" : '<p class="pending">This area has no plain-English summary yet.</p>') +
        '<p><a class="u" href="#/area/' + encodeURIComponent(open.id) + '">Read about this area and all ' + open.files.length + " of its files</a></p>";
    } else {
      detail.innerHTML = '<p class="label legend">\u25CF explained \u00A0 \u25D0 partly explained or out of date \u00A0 \u25CB not explained yet</p>';
    }
  }
  main.addEventListener("click", function (event) { mapAction(event.target); });
  main.addEventListener("keydown", function (event) {
    if (event.key !== "Enter" && event.key !== " ") return;
    if (mapAction(event.target)) event.preventDefault();
  });
  function mapAction(target) {
    var node = target && target.closest ? target.closest(".mm-node") : null;
    if (!node) return false;
    if (node.getAttribute("data-area")) {
      var id = node.getAttribute("data-area");
      openArea = openArea === id ? null : id;
      drawMap();
      var again = document.querySelector('.mm-area[data-area="' + String(id).replace(/["\\]/g, "\\$&") + '"]');
      if (again) again.focus();
    } else if (node.getAttribute("data-path")) {
      location.hash = fileHref(node.getAttribute("data-path"));
    } else if (node.getAttribute("data-more")) {
      location.hash = "#/area/" + encodeURIComponent(node.getAttribute("data-more"));
    }
    return true;
  }

  // ---- Views -------------------------------------------------------------
  function fact(label, value) { return value ? '<dt class="label">' + esc(label) + "</dt><dd>" + value + "</dd>" : ""; }
  function linkList(list) {
    if (!list || !list.length) return "";
    return list.map(function (item) {
      return FILES[item] ? '<a href="' + fileHref(item) + '">' + esc(item) + "</a>" : "<code>" + esc(item) + "</code>";
    }).join(", ");
  }

  function viewOverview() {
    var st = stats();
    var r = REPO.readiness || {};
    var html = '<p class="label head-meta"><span>' + both("Code explorer", "./explore") + "</span><span>" + st.files + " files</span><span>" +
      st.lines.toLocaleString("en") + " lines</span><span>" + st.sections + ' sections</span><span class="em">' +
      ((CHECK_STATES[r.overall] || CHECK_STATES.unknown)[1]) + "</span></p>" +
      '<h1 class="display">' + esc(TITLE) + "</h1>" +
      (REPO.summary ? '<p class="punch">' + fmt(REPO.summary) + "</p>" :
        '<p class="punch pending">No plain-English summary yet. In Claude Code, ask it to explain this repository.</p>') +
      '<dl class="pair"><div><dt class="label">Who it is for</dt><dd>' + (fmt(REPO.who_its_for) || '<span class="pending">Not written yet.</span>') +
      '</dd></div><div><dt class="label">How it runs</dt><dd>' + (fmt(REPO.how_it_runs) || '<span class="pending">Not written yet.</span>') + "</dd></div></dl>";
    var n = 0;
    html += sec(++n, "How complete these notes are", "coverage",
      '<ul class="stats"><li><span class="n">' + st.explained + "/" + st.files + '</span><span class="label">files explained</span></li>' +
      '<li><span class="n">' + st.noted + "/" + st.sections + '</span><span class="label">sections with notes</span></li>' +
      '<li><span class="n">' + st.stale + '</span><span class="label">notes older than the code</span></li>' +
      '<li><span class="n"><a class="link-quiet" href="#/readiness">' + checkBadge(r.overall) + '</a></span><span class="label">production-ready?</span></li></ul>');
    var mapExtra = SITE.map ? '<p class="hint" style="margin-top:14px">' + both("Want every function and link? ", "full graph: ") +
      '<a class="u" href="' + esc(SITE.map) + '">' + both("Open the technical map", "./map.html") + "</a></p>" : "";
    html += sec(++n, "How the parts fit together", "tree --areas",
      '<p class="hint">Pick an area to see its files, then pick a file to read its code with a plain-English note beside every section.</p>' +
      '<div class="mm-wrap" id="mm"></div><div class="mm-detail" id="mm-detail" aria-live="polite"></div>' + mapExtra);
    if (START.length) {
      html += sec(++n, "Read these first", "head -n " + START.length, '<ol class="rows-list">' + START.map(function (p, i) {
        return '<li><a class="rowlink" href="' + fileHref(p) + '"><span class="label num">' + pad(i + 1) + '</span><span class="name">' +
          esc(base(p)) + '<span class="dirp">' + esc(dir(p)) + "</span></span>" + fileBadge(FILES[p]) + '<span class="sub">' +
          fmt(FILES[p].summary || "") + "</span></a></li>"; }).join("") + "</ol>");
    }
    var skipped = REPO.skipped || [];
    if (skipped.length) {
      html += '<details class="skipped"><summary class="label">' + skipped.length + " files were left out of these notes</summary><ul>" +
        skipped.slice(0, 200).map(function (s) { return "<li><code>" + esc(s.path) + "</code>: " + esc(s.reason) + "</li>"; }).join("") + "</ul></details>";
    }
    return html;
  }

  function viewArea(id) {
    var a = AREA_BY_ID[id];
    if (!a) return notFound("That area does not exist in these notes.");
    currentArea = id;
    var html = '<p class="label head-meta"><a class="link-quiet" href="#/overview">' + both("Overview", "cd ..") + "</a><span>" + a.num +
      " / " + both("Area", "dir") + "</span><span>" + a.files.length + ' files</span></p><h2 class="display">' + esc(a.name) + "</h2>" +
      (a.summary ? '<p class="punch">' + fmt(a.summary) + "</p>" : "");
    var n = 0;
    if (a.why || a.debug_tips) html += sec(++n, "Why it exists", "why", '<dl class="facts">' + fact("Why this area exists", fmt(a.why)) +
      fact("If something here breaks", fmt(a.debug_tips)) + "</dl>");
    html += sec(++n, "Files in this area", "ls", '<ul class="rows-list">' + sortFiles(a.files).map(function (p, i) {
      var f = FILES[p];
      return '<li><a class="rowlink" href="' + fileHref(p) + '"><span class="label num">' + pad(i + 1) + '</span><span class="name">' + esc(base(p)) +
        '<span class="dirp">' + esc(dir(p)) + "</span></span>" + fileBadge(f) + '<span class="sub">' +
        (f.summary ? fmt(f.summary) : '<span class="pending">Not explained yet.</span>') + "</span></a></li>"; }).join("") + "</ul>");
    return html;
  }

  function viewFile(path, sectionId) {
    var f = FILES[path];
    if (!f) return notFound("There is no file called " + path + " in these notes.");
    currentPath = path; currentArea = f.area;
    var a = AREA_BY_ID[f.area];
    var lines = typeof f.code === "string" ? f.code.split("\n") : null;
    var html = '<p class="label head-meta"><a class="link-quiet" href="#/overview">' + both("Overview", "cd ~") + "</a>" +
      (a ? '<a class="link-quiet" href="#/area/' + encodeURIComponent(a.id) + '">' + a.num + " / " + esc(a.name) + "</a>" : "") +
      "<span>" + esc(f.language || "") + "</span><span>" + (f.lines || 0) + " lines</span>" + fileBadge(f) + "</p>" +
      '<h2 class="display">' + esc(base(path)) + '</h2><p class="path">' + esc(path) + "</p>";
    if (!f.fresh) {
      html += '<p class="banner warn">The code in this file changed after these notes were written. Treat the notes as a guide, and ask Claude to re-explain this file.</p>';
    } else if (f.status !== "explained") {
      html += '<p class="banner">Some parts of this file are not explained yet.</p>';
    }
    var summary = [f.summary, f.purpose].filter(Boolean).join(" ");
    var reasons = (f.readiness && f.readiness.reasons) || [];
    var n = 0;
    html += sec(++n, "In plain English", "man " + base(path), summary || f.why || f.how ? '<dl class="facts">' +
      fact("What it does", fmt(summary)) + fact("Why it exists", fmt(f.why)) + fact("How it works", fmt(f.how)) +
      fact("Takes in", fmt(f.inputs)) + fact("Gives back", fmt(f.outputs)) + fact("Relies on", linkList(f.depends_on)) +
      fact("Used by", linkList(f.used_by)) + fact("What can go wrong", fmt(f.risks)) + fact("If it breaks", fmt(f.debug)) +
      fact("Ready for real use?", fileBadge(f) + (reasons.length ? '<ul class="reasons">' + reasons.map(function (r) {
        return "<li>" + fmt(r) + "</li>"; }).join("") + "</ul>" : "")) + "</dl>" :
      '<p class="pending">This file has no plain-English summary yet.</p>');
    if ((f.terms || []).length) {
      html += sec(++n, "Words used here", "define", '<dl class="terms">' + f.terms.map(function (t) {
        return "<dt>" + esc(t.term) + "</dt><dd>" + fmt(t.meaning) + "</dd>"; }).join("") + "</dl>");
    }
    var rows = (f.sections || []).map(function (s) {
      var code = "";
      if (lines) {
        for (var k = s.start; k <= s.end && k <= lines.length; k++) {
          code += '<span class="ln"><span class="no">' + k + "</span>" + (esc(lines[k - 1]) || " ") + "</span>";
        }
      }
      var kind = KIND_LABELS[s.kind] || s.kind || "";
      return '<div class="row' + (s.id === sectionId ? " sel" : "") + '" id="sec-' + esc(s.id) + '">' +
        (lines ? '<div class="code" role="region" aria-label="Lines ' + s.start + " to " + s.end + '"><pre><code>' + code + "</code></pre></div>" :
          '<div class="code no-code">' + both(SITE.private ? "This repository is private, so its code is not published here. The owner can open these lines on GitHub from the link beside the note." :
            "The code is not published for this repository; the notes describe it.", "// source not published") + "</div>") +
        '<aside class="note"><div class="note-inner"><p class="label"><a href="' + fileHref(path, s.id) + '">Lines ' + s.start + "\u2013" + s.end +
        "</a>" + (kind ? "<span>" + esc(kind) + "</span>" : "") + '<span class="nerd-only">' + esc(s.name || "") + "</span>" + lineLink(path, s) +
        "</p><h4>" + esc(s.title || s.name) + "</h4>" +
        (s.what ? "<p>" + fmt(s.what) + "</p>" : '<p class="pending">Not explained yet.</p>') +
        (s.why ? '<p><span class="k">Why</span>' + fmt(s.why) + "</p>" : "") +
        (s.watch_out ? '<p><span class="k">Watch out</span>' + fmt(s.watch_out) + "</p>" : "") + "</div></aside></div>";
    }).join("");
    html += sec(++n, "Read it section by section", "cat -n " + base(path),
      '<p class="hint">Each row pairs a piece of the code with a note. Every line of the file belongs to exactly one row.</p><div class="rows">' + rows + "</div>");
    return html;
  }

  function viewReadiness() {
    var r = REPO.readiness || {};
    var html = '<p class="label head-meta"><span>' + both("Readiness review", "cat readiness") + "</span>" + (r.checked_at ? "<span>Checked " +
      esc(String(r.checked_at).slice(0, 10)) + "</span>" : "") + '</p><h2 class="display">Is it production-ready?</h2><p class="punch">' +
      checkBadge(r.overall) + " " + (r.summary ? fmt(r.summary) : '<span class="pending">No readiness review yet. In Claude Code, ask for a production check.</span>') + "</p>";
    var n = 0;
    var checks = r.checks || [];
    if (checks.length) {
      html += sec(++n, "Twelve questions", "checks", '<div class="table-wrap"><table class="checks"><thead><tr><th scope="col">Question</th>' +
        '<th scope="col">Answer</th><th scope="col">Evidence</th><th scope="col">Next step</th></tr></thead><tbody>' + checks.map(function (c) {
          return "<tr><td>" + esc(c.question) + "</td><td>" + checkBadge(c.status) + "</td><td>" + (fmt(c.evidence) || "") + "</td><td>" +
            (fmt(c.next_step) || "") + "</td></tr>"; }).join("") + "</tbody></table></div>");
    }
    var groups = { "not-ready": [], "needs-work": [] };
    PATHS.forEach(function (p) { var st = (FILES[p].readiness || {}).status; if (groups[st]) groups[st].push(p); });
    [["not-ready", "Files that are not ready", "grep not-ready"], ["needs-work", "Files that need work", "grep needs-work"]].forEach(function (g) {
      var list = groups[g[0]];
      if (!list.length) return;
      html += sec(++n, g[1] + " (" + list.length + ")", g[2], '<ul class="rows-list">' + list.map(function (p, i) {
        var reasons = (FILES[p].readiness.reasons || []).map(fmt).join(" ");
        return '<li><a class="rowlink" href="' + fileHref(p) + '"><span class="label num">' + pad(i + 1) + '</span><span class="name">' + esc(base(p)) +
          '<span class="dirp">' + esc(dir(p)) + "</span></span>" + fileBadge(FILES[p]) + '<span class="sub">' + reasons + "</span></a></li>"; }).join("") + "</ul>");
    });
    return html;
  }

  function viewDecisions() {
    var list = REPO.decisions || [];
    var html = '<p class="label head-meta"><span>' + both("Decision records", "git log --decisions") + "</span><span>" + list.length +
      ' recorded</span></p><h2 class="display">Why it is built this way</h2><p class="punch">Each decision records what was chosen, why, what else was considered, and when to revisit it.</p>';
    if (!list.length) return html + '<p class="pending" style="margin-top:30px">No decisions recorded yet. The plan-first skill adds one whenever there is a real choice to make.</p>';
    return html + sec(1, "Decisions", "decisions", list.map(function (d) {
      return '<article class="card"><h3>' + esc((d.id ? d.id + ". " : "") + (d.title || "Decision")) + '</h3><dl class="facts">' +
        fact("What was decided", fmt(d.decision)) + fact("Why", fmt(d.why)) + fact("Alternatives considered", fmt(d.alternatives)) +
        fact("Trade-offs", fmt(d.tradeoffs)) + fact("Revisit when", fmt(d.revisit_when)) + fact("Files", linkList(d.files)) + "</dl></article>"; }).join(""));
  }

  function viewDebug() {
    var html = '<p class="label head-meta"><span>' + both("Debugging guide", "man debug") + '</span></p><h2 class="display">When something breaks</h2>' +
      '<p class="punch">A calm method that works for any bug, then the problems this app is most likely to have and where to look.</p>';
    html += sec(1, "The method", "procedure", '<ol class="method">' +
      "<li><strong>Make it happen again on purpose.</strong> Write down the exact steps, what you expected and what happened instead.</li>" +
      "<li><strong>Read the error in plain words.</strong> Copy the full message. Ask Claude what it means before asking it to fix anything.</li>" +
      "<li><strong>Find the area.</strong> Use the map on the overview to pick the area, then the file, then the section.</li>" +
      "<li><strong>Prove it with a small test.</strong> Ask Claude for a test that fails because of the bug. A fix without a failing test first is a guess.</li>" +
      "<li><strong>Fix the cause, not the symptom.</strong> Hiding an error message is not a fix. If two attempts fail, stop and rethink.</li>" +
      "<li><strong>Keep it fixed.</strong> Keep the test, refresh these notes, and record the problem below if it could happen again.</li></ol>");
    var list = REPO.debug_playbook || [];
    html += sec(2, "Known problems", "known issues", list.length ? list.map(function (item) {
      var area = AREA_BY_ID[item.likely_area];
      return '<article class="card"><h3>' + esc(item.symptom || "Problem") + '</h3><dl class="facts">' +
        fact("Likely area", area ? '<a href="#/area/' + encodeURIComponent(area.id) + '">' + area.num + " / " + esc(area.name) + "</a>" : esc(item.likely_area || "")) +
        fact("Where to look", linkList(item.where_to_look)) +
        fact("What to try", (item.steps || []).length ? '<ol class="method">' + item.steps.map(function (s) { return "<li>" + fmt(s) + "</li>"; }).join("") + "</ol>" : "") +
        "</dl></article>"; }).join("") : '<p class="pending">No known problems recorded yet.</p>');
    return html;
  }

  function viewGlossary() {
    var terms = {};
    (REPO.glossary || []).forEach(function (t) { if (t && t.term) terms[t.term.toLowerCase()] = { term: t.term, meaning: t.meaning, files: [] }; });
    PATHS.forEach(function (p) {
      (FILES[p].terms || []).forEach(function (t) {
        if (!t || !t.term) return;
        var key = t.term.toLowerCase();
        if (!terms[key]) terms[key] = { term: t.term, meaning: t.meaning, files: [] };
        if (terms[key].files.length < 5) terms[key].files.push(p);
      });
    });
    var keys = Object.keys(terms).sort();
    var html = '<p class="label head-meta"><span>' + both("Glossary", "grep glossary") + "</span><span>" + keys.length +
      ' terms</span></p><h2 class="display">Glossary</h2><p class="punch">Technical words used in this codebase, in plain English.</p>';
    if (!keys.length) return html + '<p class="pending" style="margin-top:30px">No terms recorded yet.</p>';
    return html + sec(1, "Terms", "terms", '<label><span class="sr-only">Filter the glossary</span><input class="filter" id="gfilter" type="search" placeholder="Filter terms"></label>' +
      '<dl class="glossary" id="glist">' + keys.map(function (k) {
        var t = terms[k];
        return '<dt data-k="' + esc(k) + '">' + esc(t.term) + '</dt><dd data-k="' + esc(k) + '">' + fmt(t.meaning) +
          (t.files.length ? '<div class="used">Used in ' + t.files.map(function (p) { return '<a href="' + fileHref(p) + '">' + esc(base(p)) + "</a>"; }).join(", ") + "</div>" : "") +
          "</dd>"; }).join("") + "</dl>");
  }

  function notFound(message) {
    return '<p class="label head-meta"><span>404</span></p><h2 class="display">Not found</h2><p class="punch">' + esc(message) +
      '</p><p style="margin-top:24px"><a class="u" href="#/overview">Back to the overview</a></p>';
  }

  // ---- Router ------------------------------------------------------------
  function render() {
    var raw = (location.hash || "#/overview").slice(2);
    var parts = raw.split("/");
    var view = parts[0] || "overview";
    var arg = parts[1] ? decodeURIComponent(parts[1]) : "";
    var extra = parts[2] ? decodeURIComponent(parts[2]) : "";
    currentPath = null;
    var html;
    if (view === "file") html = viewFile(arg, extra);
    else if (view === "area") html = viewArea(arg);
    else if (view === "readiness") html = viewReadiness();
    else if (view === "decisions") html = viewDecisions();
    else if (view === "debug") html = viewDebug();
    else if (view === "glossary") html = viewGlossary();
    else { view = "overview"; html = viewOverview(); }
    main.innerHTML = html;
    document.querySelectorAll(".views a").forEach(function (link) {
      if (link.getAttribute("data-view") === view) link.setAttribute("aria-current", "page"); else link.removeAttribute("aria-current");
    });
    renderTree();
    if (view === "overview") drawMap();
    if (view === "glossary") {
      var gf = document.getElementById("gfilter");
      if (gf) gf.addEventListener("input", function () {
        var q = gf.value.trim().toLowerCase();
        var text = {};
        document.querySelectorAll("#glist [data-k]").forEach(function (el) { var k = el.getAttribute("data-k"); text[k] = (text[k] || "") + " " + el.textContent.toLowerCase(); });
        document.querySelectorAll("#glist [data-k]").forEach(function (el) { var k = el.getAttribute("data-k"); el.style.display = !q || text[k].indexOf(q) >= 0 ? "" : "none"; });
      });
    }
    var target = extra ? document.getElementById("sec-" + extra) : null;
    if (target && target.scrollIntoView) target.scrollIntoView({ block: "start" });
    else if (window.scrollTo) { try { window.scrollTo(0, 0); } catch (error) { /* not available */ } }
    main.focus({ preventScroll: true });
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
