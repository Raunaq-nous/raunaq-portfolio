ets the model use a higher premium for countries that are riskier than the US.","watch_out":"Values come from fixed column positions, so a shifted column gives a wrong premium with no error."},{"start":222,"end":260,"kind":"method","name":"DamodaranScraper: fetch_all_datasets","id":"s6","hash":"07aaba69620c4da5","title":"Fetch all datasets and build citations","what":"Runs all three downloads, adds up the record counts and logs them. Also builds a citation line for a record.","why":"Likely reason: one entry point gets all the data, and citations are needed to credit each source.","watch_out":"If one download fails, the others still run, so the total can look normal while one dataset is empty."}],"explained_at":"2026-11-12T00:38:00+00:00","explained_by":"haiku","summary":"Downloads three data tables from Aswath Damodaran's NYU website (industry betas, implied equity risk premium and country risk premiums) and turns them into standard records with citations.","purpose":"Supplies sourced market numbers that could feed valuation inputs.","why":"Likely reason: the valuation needs current market data, and the code keeps the source with each number.","how":"1. For each dataset, downloads the page with a 30 second limit. 2. Finds the first table on the page. 3. Reads the table and turns each row into a record with source, title, date, value and unit. 4. Skips rows that cannot be read. 5. Returns all records grouped by dataset. 6. Builds a citation for a record when asked.","inputs":"The fixed Damodaran web addresses in the code, and an optional cache folder.","outputs":"Lists of records for each dataset, empty lists when a download fails, and citation text.","risks":"Column positions are guessed, and the code itself calls this a simplified example, so values may come from the wrong column. A failure returns an empty list with only a log line, so 'no data' and 'site down' look the same. The cache folder is created but never used in the code shown. The default folder is a fixed path that may not exist or may not be writable. The website layout can change without warning. The Excel valuation tab uses fixed numbers, so these results do not reach the workbook.","debug":"If results are empty, check the log for fetch errors, then open the page in a browser to see whether its layout changed. If values look wrong, print one row and compare its columns with the page. Check the internet connection and any proxy settings. Confirm the cache folder exists and is writable.","summary_hash":"sha256:bc4b9ca4dc4285d74635a4bb237081c31dc814cd9165558e189dd4df9f75c84c","fresh":true},"backend/research/normalizer.py":{"schema_version":1,"path":"backend/research/normalizer.py","language":"Python","lines":47,"hash":"sha256:27d0c452cadae1a0356b9fec6b3d52716b768fc760175224d01e147dd2c1d01e","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No tests are visible.","The default access date can mislead.","Empty text defaults hide missing data."]},"terms":[{"term":"normalize","meaning":"reshape data so it follows one standard format"},{"term":"dictionary","meaning":"a set of named fields and their values"},{"term":"raw data","meaning":"the untouched original record"}],"depends_on":["Python standard library (typing, datetime)"],"used_by":["Not visible in the code provided. The module description says it prepares records for database storage."],"sections":[{"start":1,"end":10,"kind":"setup","name":"File setup","id":"s1","hash":"495754f0e3fb8851","title":"Imports for normalizing","what":"Loads the type helpers and the date tool.","why":"Likely reason: the date tool is needed for the default access date.","watch_out":""},{"start":11,"end":36,"kind":"function","name":"normalize_research_record","id":"s2","hash":"df84697f3f3066f7","title":"Standard shape for one record","what":"Copies each known field from a raw record into the standard shape, fills blanks with defaults, and keeps the untouched original.","why":"Likely reason: every saved record then has the same fields.","watch_out":"A missing access date is set to the current time, which is not the real access date."},{"start":37,"end":47,"kind":"function","name":"normalize_batch","id":"s3","hash":"3e6275127f77772b","title":"Normalizing a whole list","what":"Applies the single-record step to every item in a list and returns the new list.","why":"Likely reason: lets the caller clean a whole batch in one call.","watch_out":"If any item is not a dictionary, the error stops the whole batch."}],"explained_at":"2026-11-12T00:38:00+00:00","explained_by":"haiku","summary":"Makes research records follow one fixed set of field names and fills blank fields with defaults, so the database receives consistent records.","purpose":"Keeps stored research uniform no matter which source each record came from.","why":"Likely reason: records from different scrapers may have different shapes, so one shape is applied before saving.","how":"1. For each record, copies each standard field and uses a default when it is missing. 2. Sets the access date to the current time when none is given. 3. Keeps the original record in a raw field. 4. For a list, applies the same step to every item.","inputs":"Raw records as dictionaries from the scrapers.","outputs":"Standard records with the fields source_url, title, author, date_accessed, series_name, country, sector, metric, value, unit, note and raw_data.","risks":"A missing access date is replaced with the time of normalizing, not the real access time. Missing text fields become empty text, which can look like real data. The raw copy stores the data twice.","debug":"If stored dates look recent for old data, check whether the source record had an access date. If a field is blank, check the field name in the source record. Compare the raw field to see what came in.","summary_hash":"sha256:27d0c452cadae1a0356b9fec6b3d52716b768fc760175224d01e147dd2c1d01e","fresh":true},"backend/research/scraper.py":{"schema_version":1,"path":"backend/research/scraper.py","language":"Python","lines":71,"hash":"sha256:8884adae42dc10a2d0b55fed99383e5f520dabf4bdc9fa4d931ee793b361e5b9","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Errors are hidden as empty results.","No tests are visible.","Some sites may refuse requests without a browser identity."]},"terms":[{"term":"CSS selector","meaning":"a short pattern that picks one element on a web page"},{"term":"timeout","meaning":"the longest time to wait before giving up on a request"},{"term":"HTTP error","meaning":"an error code sent back by a web server, such as not found"},{"term":"lxml","meaning":"a library that reads HTML and XML, used behind the table reader"}],"depends_on":["requests","beautifulsoup4","pandas","lxml"],"used_by":["Not visible in the code provided"],"sections":[{"start":1,"end":15,"kind":"setup","name":"File setup","id":"s1","hash":"26c93ca6c8651304","title":"Imports for web reading","what":"Loads the web request, HTML reading, table and logging tools.","why":"Likely reason: these cover downloading, reading and tabling data.","watch_out":""},{"start":16,"end":35,"kind":"function","name":"fetch_url","id":"s2","hash":"4ad677be69c0298f","title":"Downloading a page","what":"Downloads a page and returns its text, or nothing if anything goes wrong.","why":"Likely reason: returning nothing instead of crashing lets research continue past one bad page.","watch_out":"A caller that does not check for nothing will fail later with an unclear error."},{"start":36,"end":53,"kind":"function","name":"parse_html_tables","id":"s3","hash":"3c2dc8793f3e70e4","title":"Reading tables from HTML","what":"Reads every table in an HTML text into a list of tables, or an empty list if reading fails.","why":"Likely reason: a shared way to turn web tables into data the code can use.","watch_out":"A page with no tables and a failed read both return an empty list, so they look the same."},{"start":54,"end":71,"kind":"function","name":"extract_text","id":"s4","hash":"35ba129bb7498b60","title":"Pulling text with a CSS selector","what":"Finds the first element matching a CSS selector and returns its text with spaces trimmed, or nothing if there is no match or an error.","why":"Likely reason: lets a scraper pick one value, such as a title or a number, from a page.","watch_out":"A selector that matches the wrong element returns text from the wrong place with no warning."}],"explained_at":"2026-11-12T00:38:00+00:00","explained_by":"haiku","summary":"Provides three small helpers: download a web page, read every table on a page, and pull the text from one element chosen by a CSS selector.","purpose":"Shared web reading tools for research code.","why":"Likely reason: keeps the download and reading steps in one place so other scrapers can reuse them.","how":"1. Download: requests the page with a timeout, checks for an error code, and returns the text or nothing. 2. Tables: reads every table in the HTML into table objects, or returns an empty list on failure. 3. Text: finds the first element matching a CSS selector and returns its trimmed text, or nothing.","inputs":"A web address and a timeout in seconds (default 30). HTML text. A CSS selector text.","outputs":"Page text or nothing. A list of tables. A text value or nothing.","risks":"Every error is logged and turned into an empty result, so a caller may treat a failed download as no data. The download sends no identifying browser header, so some sites may refuse it. There are no rate limits or retries. Table reading needs the lxml library.","debug":"If a fetch returns nothing, read the error line in the log for that address and try it in a browser. If tables come back empty, check that the page has HTML tables and that lxml is installed. If text is missing, test the CSS selector in the browser's developer tools.","summary_hash":"sha256:8884adae42dc10a2d0b55fed99383e5f520dabf4bdc9fa4d931ee793b361e5b9","fresh":true},"docker-compose.yml":{"schema_version":1,"path":"docker-compose.yml","language":"Configuration","lines":78,"hash":"sha256:a7cd6f18cf7ca2441f959410ce0414edbe1499770aea6ff65f40b80cdb5dde4d","area":"root-files","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The backend start command names main:app, which may not match the file reviewed in this project.","The frontend uses a development server command rather than a production build.","Ollama requires an NVIDIA GPU, which is not checked or explained in the file.","A placeholder password appears in the commented PostgreSQL block. It is not active, but it should be replaced if the block is turned on."]},"terms":[{"term":"Docker Compose","meaning":"a tool that starts several programs, called services, together from one settings file"},{"term":"Container","meaning":"a sealed package that runs one program with everything it needs"},{"term":"Service","meaning":"one program in the compose file, such as the backend or Redis"},{"term":"Port","meaning":"a numbered door on a machine that a program listens on for connections"},{"term":"Volume","meaning":"a storage space outside the container that keeps data when a container restarts"},{"term":"Environment variable","meaning":"a named setting passed into a program when it starts"},{"term":"Ollama","meaning":"a program that runs AI language models on your own machine"},{"term":"Redis","meaning":"a fast storage program often used to hold short-lived data or task queues"},{"term":"GPU","meaning":"a graphics card, which can speed up AI work"},{"term":"Uvicorn","meaning":"the server program that runs the Python backend"}],"depends_on":["frontend/Dockerfile","backend/Dockerfile","ollama/ollama image","redis:7-alpine image"],"used_by":[],"sections":[{"start":1,"end":52,"kind":"setup","name":"File setup (part 1)","id":"s1","hash":"db246d46a3ec730d","title":"Frontend, backend, and Ollama services","what":"Describes three programs to run together: the web screen on port 3000, the Python backend on port 8001, and the Ollama language model server, which needs a graphics card.","why":"Likely reason: lets one command start every part of the app with the right connections already set.","watch_out":"The backend start command loads a module named main, but the backend code reviewed here is named app_backend.py. Confirm the backend folder has a main.py before starting."},{"start":53,"end":78,"kind":"setup","name":"File setup (part 2)","id":"s2","hash":"a9f5706fa3b2bb5e","title":"Redis and optional PostgreSQL database","what":"Starts a Redis service that saves its data to disk, and declares the storage volumes that keep data between restarts. A PostgreSQL database setup is kept in comments so it can be switched on.","why":"Likely reason: Redis is set up as a task queue for background work, and PostgreSQL is an option for a larger database. The comments say the PostgreSQL block is optional.","watch_out":"The commented PostgreSQL block contains a simple password. If someone turns it on, they should replace it first. The backend also lists Redis as a startup requirement, although the code reviewed here does not show it being used."}],"explained_at":"2026-11-12T00:27:33+00:00","explained_by":"haiku","summary":"Starts the frontend web screen, the Python backend, the Ollama language model server and Redis together as containers.","purpose":"Lets one command start the whole app stack with the connections between parts already set.","why":"Likely reason: avoids setting up each program by hand and keeps the ports and addresses in one place.","how":"1. Builds the frontend from the frontend folder and runs its development server on port 3000. 2. Builds the backend from the backend folder, stores data in the data folder, connects it to Ollama and Redis, and runs it on port 8000 inside the container, shown on port 8001. 3. Runs Ollama with access to an NVIDIA graphics card and keeps downloaded models in a volume. 4. Runs Redis with saved data. 5. Keeps a PostgreSQL database setup in comments, ready to switch on.","inputs":"The Dockerfile in the frontend folder, the Dockerfile in the backend folder, the environment settings listed in this file, and the data folder.","outputs":"Four running services on ports 3000, 8001, 11434 and 6379, plus stored data in the volumes.","risks":"The backend command loads a module named main, but the backend code reviewed here is named app_backend.py. The frontend runs a development server, which is not meant for live use. Ollama needs an NVIDIA GPU or it will not start. Ports are opened to the machine network.","debug":"Run the compose logs command for the service that fails. For the backend, confirm the backend folder has a main.py file. For Ollama, confirm the NVIDIA driver and container toolkit are installed. Check that ports 3000, 8001, 11434 and 6379 are not already in use.","summary_hash":"sha256:a7cd6f18cf7ca2441f959410ce0414edbe1499770aea6ff65f40b80cdb5dde4d","fresh":true},"excel_exporter_enhanced.py":{"schema_version":1,"path":"excel_exporter_enhanced.py","language":"Python","lines":841,"hash":"sha256:8cfa31b36a85372fb7a5fb3f80722ac9049b18c66004e9018adc8a7e6dd57cc9","area":"root-files","status":"explained","summary_stale":false,"readiness":{"status":"not-ready","reasons":["Export is likely to stop at the assumptions sheet because the inputs dictionary lacks keys this exporter reads, such as the model name and revenue growth rates.","The DCF sheet links to a fixed WACC cell that appears to be empty, so valuation may calculate with a WACC of zero.","The sensitivity tables are placeholders and show no values.","Tax rate and risk-free rate are typed into the formulas or cells rather than read from inputs or market data.","The charts sheet contains instructions only and creates no charts.","No tests were shown for this file."]},"terms":[{"term":"xlsxwriter","meaning":"a Python tool that writes Excel files, including formulas and formatting"},{"term":"Workbook","meaning":"an Excel file, which holds one or more sheets"},{"term":"Sheet","meaning":"a single page or tab inside an Excel workbook"},{"term":"Formula","meaning":"a cell calculation that updates when the cells it uses change"},{"term":"Cell reference","meaning":"the address of a cell, such as B15, used by formulas"},{"term":"WACC","meaning":"the weighted average cost of capital, the rate used to discount future cash"},{"term":"DCF","meaning":"discounted cash flow, a method that values a company by discounting its future cash flows to today"},{"term":"Enterprise value","meaning":"the estimated total value of the business, before its debt is subtracted"},{"term":"Sensitivity analysis","meaning":"a table showing how the result changes when one assumption changes"}],"depends_on":["os","datetime","typing","pandas","xlsxwriter"],"used_by":["app_backend.py"],"sections":[{"start":1,"end":12,"kind":"setup","name":"File setup","id":"s1","hash":"f6cd0a54b5b973cb","title":"Libraries used by the exporter","what":"Loads the tools for file paths, dates, data tables and Excel writing. The file describes itself as an exporter for models with real formulas.","why":"Likely reason: the exporter needs data handling and Excel writing, which these imports provide.","watch_out":""},{"start":13,"end":70,"kind":"class","name":"EnhancedExcelExporter (part 1)","id":"s2","hash":"d14306cf99aa0045","title":"Exporter setup and main export","what":"Creates the export folder when the exporter starts. The main export method builds a named Excel file, writes its sheets in a fixed order, and returns the file path.","why":"Likely reason: the summary sheet is written first so it is the first tab the user sees.","watch_out":"The file name is built from the model name with spaces replaced by underscores. Unusual characters in the name can still cause a problem when the file is saved."},{"start":71,"end":129,"kind":"class","name":"EnhancedExcelExporter (part 2)","id":"s3","hash":"2bdd5d6577108767","title":"Building sheets and cell styles","what":"Finishes the main export by writing the DCF, sensitivity and chart sheets, saves the workbook, and prints a confirmation. It also defines the cell styles, such as header colours, currency and percentage formats.","why":"Likely reason: one shared set of styles keeps the sheets looking consistent.","watch_out":"The file is only written to disk when the workbook is closed. If an error happens before that step, no file is saved."},{"start":130,"end":186,"kind":"method","name":"EnhancedExcelExporter: _write_summary_dashboard","id":"s4","hash":"1e5c5074bccbfe92","title":"Executive summary dashboard","what":"Builds the first sheet, which shows revenue, EBITDA, EBITDA margin and net income by year, with a growth figure for revenue.","why":"Likely reason: gives the user a one-page overview before they open the detailed sheets.","watch_out":"The links to the income statement appear to use a changing row number for each year rather than a changing column, so the figures may point to the wrong cells. Check them against the Income Statement sheet."},{"start":187,"end":238,"kind":"class","name":"EnhancedExcelExporter (part 4)","id":"s5","hash":"25ff4a3e6afeb714","title":"Dashboard tail and assumptions start","what":"Adds free cash flow and the valuation summary to the dashboard, then starts the Assumptions sheet with company details and base revenue.","why":"Likely reason: valuation results sit beside the operating figures so the user sees both together.","watch_out":"The valuation summary reads specific keys from the results. If a key is missing, the export stops."},{"start":239,"end":276,"kind":"class","name":"EnhancedExcelExporter (part 5)","id":"s6","hash":"225caa3cc1f374d0","title":"Assumptions sheet: growth and cost tables","what":"Writes the revenue growth rates and the cost percentages by year onto the Assumptions sheet, so the user can see what drives the model.","why":"Likely reason: the cost formulas on the income statement point to these cells, so the assumptions must be written here.","watch_out":"This step reads a model name and revenue growth rates from the inputs. The backend does not supply those names, so the export is likely to stop here."},{"start":277,"end":329,"kind":"method","name":"EnhancedExcelExporter: _write_income_statement_formulas","id":"s7","hash":"40a25db566aa5adb","title":"Income statement with live formulas","what":"Writes the income statement lines. Revenue is entered as fixed numbers, while cost lines are formulas that use the cost percentages on the Assumptions sheet.","why":"Likely reason: so that changing a cost percentage in Excel updates the cost lines.","watch_out":"Revenue is not linked to the growth assumptions, so changing growth in Excel will not change revenue. The cost formulas also depend on fixed cell positions in the Assumptions sheet."},{"start":330,"end":383,"kind":"class","name":"EnhancedExcelExporter (part 7)","id":"s8","hash":"7ae0206b06cbee43","title":"Operating expenses and operating profit","what":"Writes R\u0026D, sales and admin costs, total operating costs, EBITDA, depreciation and EBIT, mostly as formulas.","why":"Likely reason: builds profit step by step in the normal order of an income statement.","watch_out":"Depreciation and interest are typed numbers, so they will not change inside Excel."},{"start":384,"end":443,"kind":"class","name":"EnhancedExcelExporter (part 8)","id":"s9","hash":"72b8a213f5526f72","title":"Taxes, net income and cash flow start","what":"Calculates pre-tax profit, income tax and net income, then starts the Cash Flow sheet with net income and depreciation.","why":"Likely reason: follows the usual order from the income statement to the cash flow statement.","watch_out":"Tax is calculated with a fixed rate of 25 percent inside the formula, not with the tax rate the user entered. Changing the tax rate will not change the tax in this sheet."},{"start":444,"end":483,"kind":"class","name":"EnhancedExcelExporter (part 9)","id":"s10","hash":"e36abad28f58b86a","title":"Cash flow totals and free cash flow","what":"Writes the working capital change, operating cash flow, capital spending, investing cash flow and free cash flow, mostly as formulas.","why":"Likely reason: free cash flow is the number the valuation uses, so it is calculated here.","watch_out":"The cash flow sheet refers to the income statement by fixed row numbers. Inserting a row there would break these links. Capital spending is a typed number."},{"start":484,"end":536,"kind":"method","name":"EnhancedExcelExporter: _write_balance_sheet_formulas","id":"s11","hash":"5efe168187fdcc0d","title":"Balance sheet values","what":"Writes receivables, inventory, payables, debt and retained earnings as typed numbers, with no formulas.","why":"Likely reason: the app's balance sheet is a simplified report, so values are copied in rather than built in Excel.","watch_out":"There is no check that assets equal liabilities plus equity, so the sheet is not proven to balance."},{"start":537,"end":584,"kind":"method","name":"EnhancedExcelExporter: _write_revenue_detail","id":"s12","hash":"cbb208680210511e","title":"Revenue detail sheet","what":"Shows the starting revenue, the growth rate for each year, revenue by year linked to the income statement, and the change from one year to the next.","why":"Likely reason: lets the user see how revenue is built, step by step.","watch_out":"The first year's change formula uses unusual row references, so the first figure may not be a true year-over-year change. Check it before relying on it."},{"start":585,"end":642,"kind":"method","name":"EnhancedExcelExporter: _write_wacc_calculation","id":"s13","hash":"34fdb32fae334044","title":"WACC sheet: cost of equity and debt","what":"Lists the risk-free rate, market return, beta, equity risk premium, cost of equity, interest rate, tax rate and after-tax cost of debt, mostly as visible steps.","why":"Likely reason: shows the cost of capital as a visible calculation the user can follow.","watch_out":"The risk-free rate of 4.2 percent and market return of 10 percent are typed in here, not taken from the market data the app fetches. Excel may therefore disagree with the app's WACC."},{"start":643,"end":699,"kind":"class","name":"EnhancedExcelExporter (part 13)","id":"s14","hash":"ec83ca3142772930","title":"Capital mix and WACC result","what":"Writes the debt and equity shares of total funding, then the final WACC formula. It also starts the DCF sheet with the free cash flow and discount periods.","why":"Likely reason: the final figure blends the cost of equity and the cost of debt by their share of funding.","watch_out":"The DCF sheet reads the WACC from cell B15 on this sheet. That cell appears to be a blank heading here, while the WACC result is written further down. The DCF could then use a WACC of zero, so check this link first."},{"start":700,"end":758,"kind":"class","name":"EnhancedExcelExporter (part 14)","id":"s15","hash":"b4950cbf774ec2bb","title":"DCF valuation and enterprise value","what":"Calculates the present value of each year's free cash flow, the terminal value after the forecast, its present value, and the total enterprise value, all as formulas.","why":"Likely reason: this is the standard discounted cash flow method for putting a value on a business.","watch_out":"The terminal value formula gives nonsense if the WACC is not higher than the terminal growth rate. The sheet also inherits the WACC link problem described above."},{"start":759,"end":795,"kind":"method","name":"EnhancedExcelExporter: _write_sensitivity_analysis","id":"s16","hash":"6a7592f3efa96d7a","title":"Sensitivity sheet placeholders","what":"Sets up the WACC and terminal growth tables with their headings, but the value cells only contain text saying formulas would go there.","why":"Reason not stated in the code. The text marks this as unfinished work.","watch_out":"A user may think this table works, but it shows no numbers at all."},{"start":796,"end":833,"kind":"method","name":"EnhancedExcelExporter: _write_charts","id":"s17","hash":"421d413c6abcbfd5","title":"Charts sheet instructions only","what":"Writes step-by-step instructions for making charts by hand in Excel. It does not create any charts.","why":"Likely reason: charts were planned but not built in code.","watch_out":"The final instruction says all charts update automatically, which is only true if the formula links work correctly."},{"start":834,"end":841,"kind":"entry point","name":"entry point","id":"s18","hash":"f0c41361ccba16fc","title":"Command-line load message","what":"If this file is run directly, it prints a short list of features and does nothing else. No Excel file is created.","why":"Likely reason: a quick check that the file loads without errors.","watch_out":"Printing the list does not prove that the features work."}],"explained_at":"2026-11-12T00:27:33+00:00","explained_by":"haiku","summary":"Writes the financial model into an Excel workbook, with many cells as live formulas that recalculate when inputs change.","purpose":"Turns the model results into a file the owner can open, check and change in Excel.","why":"Likely reason: a finance user usually wants to see and trace the calculations in Excel, which is why formulas are used instead of only fixed numbers.","how":"1. Creates a file in the exports folder named from the model name and the current time. 2. Writes the summary dashboard. 3. Writes the assumptions sheet. 4. Writes the income statement, cash flow and balance sheet with formulas. 5. Writes the revenue detail, the cost of capital sheet and the DCF valuation. 6. Writes the sensitivity and chart pages. 7. Saves and closes the file, then returns its path.","inputs":"A model name, the three statement tables, the valuation results, the cost of capital results, and a dictionary of all input assumptions.","outputs":"An .xlsx Excel file in the exports folder, and the file path returned to the caller.","risks":"Some input names the exporter reads are not provided by the backend, so export can stop early. Several cells use typed numbers rather than inputs, such as the tax rate and risk-free rate. The DCF sheet reads the WACC from a fixed cell that appears to be empty. The sensitivity tables contain placeholder text only. The exports folder keeps every file with no cleanup.","debug":"Look at the server console traceback first. A KeyError means an input name is missing from the inputs dictionary. Open the DCF Valuation sheet and check whether the WACC cell is zero or blank. Compare the dashboard figures with the statement sheets. Try a simple test model with few years to narrow the problem.","summary_hash":"sha256:8cfa31b36a85372fb7a5fb3f80722ac9049b18c66004e9018adc8a7e6dd57cc9","fresh":true},"financial_modeling_core.py":{"schema_version":1,"path":"financial_modeling_core.py","language":"Python","lines":364,"hash":"sha256:f9ff1ac26399dd93d5921b2493a97e8f0052616ee6fb0a7e3708c0c2ee2aeffa","area":"root-files","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No tests or input checks were shown in the code.","Zero depreciation years and a WACC at or below terminal growth are not protected against.","The balance sheet is simplified and not checked to balance.","This packet covers 8 of 11 sections. The market data class, DamodaranResearch, and its entry point were not reviewed here."]},"terms":[{"term":"WACC","meaning":"weighted average cost of capital, the blended rate a business pays to its owners and lenders, used to discount future cash"},{"term":"CAPM","meaning":"capital asset pricing model, a formula that estimates the return owners expect from a stock using the risk-free rate, beta and market return"},{"term":"Beta","meaning":"a measure of how much a company's value moves compared with the whole market"},{"term":"DCF","meaning":"discounted cash flow, a valuation method that shrinks future cash back to today's value"},{"term":"Terminal value","meaning":"the estimated value of all cash flows after the forecast years"},{"term":"Enterprise value","meaning":"the estimated total value of the business before its debt is subtracted"},{"term":"Free cash flow","meaning":"cash left after running costs and spending on assets, available to pay owners and lenders"},{"term":"EBITDA","meaning":"earnings before interest, tax, depreciation and amortisation, a rough measure of operating profit"},{"term":"Depreciation","meaning":"spreading the cost of an asset over the years it is used"},{"term":"Working capital","meaning":"money tied up in customer bills, stock and supplier bills, net of what is owed to suppliers"}],"depends_on":["pandas","numpy","typing"],"used_by":["app_backend.py"],"sections":[{"start":1,"end":10,"kind":"setup","name":"File setup","id":"s1","hash":"3b1fa95460bc1d56","title":"Imports for the calculation engine","what":"Brings in the type-hint helpers, the table tool and the number tool that the calculations rely on. It also states what the module is for.","why":"Likely reason: lists and tables are needed throughout the calculations.","watch_out":""},{"start":11,"end":67,"kind":"class","name":"FinancialCalculator (part 1)","id":"s2","hash":"78204a4e3afc1f0d","title":"Setup, revenue and cost of goods","what":"Stores the start year and number of years. Builds yearly revenue from a starting figure and growth rates, then yearly cost of goods sold, gross profit and gross margin from cost percentages.","why":"Likely reason: revenue is the starting point, so the other lines are built on top of it. Segment input is accepted but not used in the calculation.","watch_out":"The code pairs lists with zip, which silently drops extra items when lists differ in length, so a short list can cut off years without an error."},{"start":68,"end":111,"kind":"method","name":"FinancialCalculator: calculate_opex","id":"s3","hash":"1c469ea4ecf61c16","title":"Operating costs and depreciation","what":"Works out research and sales costs for each year from percentages. Spreads each year's capital spending evenly over the chosen number of years to get depreciation.","why":"Likely reason: even spreading, called straight-line depreciation, is the simplest standard method. The docstring names the method.","watch_out":"A depreciation period of zero causes a divide-by-zero error. Spending that falls after the forecast window is not depreciated inside the model."},{"start":112,"end":143,"kind":"method","name":"FinancialCalculator: calculate_working_capital","id":"s4","hash":"69a17051e85742fe","title":"Working capital from days","what":"Estimates the money tied up in customer bills, stock and supplier bills using days outstanding. Then works out the change in that money from one year to the next.","why":"Likely reason: days outstanding is a common way to estimate working capital. The defaults of 45, 60 and 30 days are set in the code.","watch_out":"The first year's change is set to zero, so any opening balance is ignored. The sign of the change matters later when it is subtracted in the cash flow."},{"start":144,"end":202,"kind":"method","name":"FinancialCalculator: build_three_statements","id":"s5","hash":"6c9eabf2e05550e1","title":"Building the income statement","what":"Turns the pieces into the income statement: operating profit before depreciation, depreciation, operating profit, interest on debt, pre-tax profit, tax and net income. Tax is never negative, so losses produce no tax credit.","why":"Likely reason: the no-credit rule on losses is the cautious choice and is written directly into the code. Reason not stated otherwise.","watch_out":"Interest is the same debt amount times the rate every year, with no repayment, so debt never falls in this model."},{"start":203,"end":235,"kind":"class","name":"FinancialCalculator (part 5)","id":"s6","hash":"4f67386606d05316","title":"Cash flow and simplified balance sheet","what":"Builds the cash flow statement with operating cash flow, investing cash flow and free cash flow. Also builds a simplified balance sheet with receivables, inventory, payables, debt and a running total of profit.","why":"Likely reason: free cash flow is needed for the valuation. The balance sheet is labelled simplified in the code.","watch_out":"The balance sheet is not checked to balance, and retained earnings are only a running sum of profit with no dividends, so treat it as an estimate."},{"start":236,"end":270,"kind":"method","name":"FinancialCalculator: calculate_dcf_valuation","id":"s7","hash":"6751188d718e95c5","title":"Discounted cash flow valuation","what":"Shrinks each year's free cash flow back to today using the WACC, adds a terminal value for years beyond the forecast, and adds everything to get enterprise value.","why":"Likely reason: this is the standard way to put a present value on future cash. The choice to treat each cash flow as arriving at year end is not explained in the code.","watch_out":"If the WACC is not above the terminal growth rate, the terminal value formula gives a meaningless or negative number, and nothing in the code prevents this."},{"start":271,"end":299,"kind":"method","name":"FinancialCalculator: calculate_wacc","id":"s8","hash":"dcd08fca2a2bea64","title":"Cost of capital calculation","what":"Works out the cost of equity with the CAPM method, which is the risk-free rate plus beta times the market premium. Blends that with the after-tax cost of debt, weighted by the share of debt, to get WACC.","why":"Likely reason: this is the standard textbook formula for WACC. The docstring names the CAPM method.","watch_out":"The debt ratio is not checked to be between zero and one, and the result is only as good as the market inputs supplied to it."},{"start":300,"end":348,"kind":"class","name":"DamodaranResearch (part 1)","id":"s9","hash":"e4045cda97bd6a36","title":"Industry beta and margin lookup tables","what":"Holds a small built-in table of typical stock risk (beta) and profit margins for several industries, and returns the matching values for an industry name. Unknown industries get a default beta of 1.0 and a default margin set.","why":"Likely reason: the code comments say these are sample values standing in for data that would be pulled from the Damodaran research site later.","watch_out":"These are hand-entered sample numbers, not current Damodaran data, and an unknown industry silently receives the defaults."},{"start":349,"end":360,"kind":"method","name":"DamodaranResearch: get_market_data","id":"s10","hash":"e23a9211a7337bfa","title":"Fixed market assumptions for valuation","what":"Returns a fixed set of market figures: a 4.2 percent risk-free rate, a 5.8 percent equity risk premium, a 10 percent market return, and a 25 percent default tax rate. The same values come back every time.","why":"Likely reason: placeholder values so valuation can run before live market data is connected. Reason not stated in the code.","watch_out":"The comments call these current or historical figures, but nothing updates them, so they can go stale."},{"start":361,"end":364,"kind":"entry point","name":"entry point","id":"s11","hash":"acbadcab1c4ce03e","title":"Simple load check when run directly","what":"When the file is run from the command line, it prints a short message confirming the module loaded and naming its two classes. It runs no calculations.","why":"Likely reason: a quick check that the file loads without errors.","watch_out":"A successful message does not mean the calculations are correct."}],"explained_at":"2026-11-12T00:30:23+00:00","explained_by":"haiku","summary":"Holds the calculations that build revenue, costs, the three financial statements, the cost of capital (WACC) and the discounted cash flow valuation.","purpose":"Does the core financial math for the model, so the web routes in app_backend.py only need to call it.","why":"Likely reason: keeps all the number work in one place, separate from the web code. The code does not state this directly.","how":"1. Stores the start year and number of years. 2. Builds revenue from a starting figure and growth rates. 3. Builds cost of goods sold, operating costs, and depreciation from percentages and capital spending. 4. Builds working capital from days outstanding. 5. Combines these into the income statement, cash flow statement and a simplified balance sheet. 6. Works out the cost of equity and the WACC. 7. Discounts the free cash flows and adds a terminal value to get enterprise value.","inputs":"Starting revenue, growth rates by year, cost percentages by year, capital spending by year, depreciation years, working capital days, tax rate, interest rate, initial debt, beta, terminal growth rate, risk-free rate, market return, debt ratio and cost of debt.","outputs":"Tables for revenue, costs, capital spending and working capital, a set of three statements, a valuation result with enterprise value, and a cost of capital result.","risks":"Lists of different lengths are silently cut short, which can hide missing years. Zero depreciation years cause a divide-by-zero error. A WACC that is not above terminal growth gives a meaningless value. The balance sheet is not checked to balance. Tax is never credited on losses. Debt is never repaid. Free cash flow starts from net income after interest, which shifts it toward an equity-based figure.","debug":"Start with the method named in the error traceback. Check that every list of inputs has one value per year. Print the WACC and terminal growth rate and confirm WACC is higher. Set initial debt to zero to see whether interest is causing a surprise. Do not treat the balance sheet as proof of accuracy.","summary_hash":"sha256:f9ff1ac26399dd93d5921b2493a97e8f0052616ee6fb0a7e3708c0c2ee2aeffa","fresh":true},"frontend/Dockerfile":{"schema_version":1,"path":"frontend/Dockerfile","language":"Configuration","lines":13,"hash":"sha256:4a6618f6238c1e94abca75f6ad81e98a3ec59751b1cf3b90f88f023f62f764fe","area":"frontend","status":"explained","summary_stale":false,"readiness":{"status":
