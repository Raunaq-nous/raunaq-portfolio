y value.","why":"Likely reason: this is a common table in valuation work.","watch_out":"The cost of capital is passed in as a plain input, but the valuation function calculates its own, so this table may not change anything."},{"start":190,"end":215,"kind":"function","name":"create_revenue_growth_sensitivity","id":"s6","hash":"9fd3332d41a966af","title":"Revenue growth against equity value","what":"Sets up a one-way test of equity value across revenue growth rates, by default from minus 5 percent to 10 percent.","why":"Likely reason: shows how a sales downturn or boom changes value.","watch_out":"Only works if the model function reads a key named revenue_growth; otherwise every value gives the same result."}],"explained_at":"2026-11-12T00:19:48+00:00","explained_by":"haiku","summary":"Tests how a result changes when one or two inputs change, by rerunning the model for each setting and producing tables of results.","purpose":"Produces tables showing equity value across ranges of cost of capital, terminal growth, or revenue growth.","why":"Shows how sensitive the valuation is to its assumptions, which is important when judging risk.","how":"1. Copy the base inputs. 2. Set the tested variable to one value. 3. Rerun the calculation function. 4. Read the chosen output. 5. Repeat for every value; for two variables, repeat for every combination.","inputs":"A dictionary of base inputs; the names and ranges of the variables to test; a function that runs the model and returns a dictionary of results; the name of the output to track.","outputs":"For one variable, the tested values and matching outputs. For two variables, a grid of outputs with row and column labels.","risks":"Setting a variable does nothing unless the model function reads it. The cost of capital and revenue growth tables depend on keys that this file does not check. A missing output name gives empty values without an error. If the base inputs have no wacc key, a default of 10 percent is used.","debug":"If every row of the grid is the same, the model function is probably not reading the changed input. If results are empty, check the output name. Test one value and compare it with the base model result.","summary_hash":"sha256:d769a9e81819a225567e000ac704a4d92dbde97ad59111149c0da3c93c9ea939","fresh":true},"backend/calc/statements.py":{"schema_version":1,"path":"backend/calc/statements.py","language":"Python","lines":318,"hash":"sha256:bafad3518f8d9b361c2736acb4b28b0148979813977a0e7038494fc629d26c19","area":"backend-calc","status":"explained","summary_stale":false,"readiness":{"status":"not-ready","reasons":["Equity is a balancing figure, so the balance check cannot detect errors.","The working capital change in the final year is dropped from cash flow.","The starting equity input is accepted but never used."]},"terms":[{"term":"Income statement","meaning":"a report of revenue, costs, and profit over a period"},{"term":"Cash flow statement","meaning":"a report of the cash coming in and going out, split into operating, investing, and financing"},{"term":"Balance sheet","meaning":"a snapshot of what the company owns, owes, and the owners' share"},{"term":"Balance check","meaning":"a test that assets equal liabilities plus equity"},{"term":"Plug","meaning":"a figure calculated to force totals to match, rather than from real data"},{"term":"Working capital","meaning":"money tied up in day-to-day operations, such as unpaid customer bills and stock"},{"term":"Free cash flow (FCF)","meaning":"cash left after paying for the spending needed to keep the business running"},{"term":"EBITDA","meaning":"profit before interest, tax, depreciation, and amortization"},{"term":"EBIT","meaning":"profit before interest and tax"}],"depends_on":["backend/calc/utils.py"],"used_by":["not visible in the files shown"],"sections":[{"start":1,"end":26,"kind":"setup","name":"File setup","id":"s1","hash":"71c76a577ec03a19","title":"Module overview and imports","what":"Nothing runs here. It describes the three statements and the balance check, and loads a helper.","why":"Gives the reader the big picture before the code.","watch_out":""},{"start":27,"end":81,"kind":"function","name":"build_income_statement","id":"s2","hash":"817a26ff3fdd8a78","title":"Income statement from sales to net income","what":"Takes yearly revenue, costs, expenses, depreciation, interest, and tax, and works down to gross profit, EBITDA, EBIT, pretax income, and net income.","why":"Likely reason: this is the standard layout that shows profit at each stage.","watch_out":"Lists are matched by position and stop at the shortest one, so unequal lengths silently drop years."},{"start":82,"end":140,"kind":"function","name":"build_cash_flow_statement (part 1)","id":"s3","hash":"751cfcc47234f901","title":"Operating, investing and financing cash flows","what":"Works out operating cash flow by adding back depreciation and taking off the working capital increase, then works out investing and financing cash flows.","why":"Depreciation is not a cash payment, so it is added back. The working capital increase ties up cash, so it is taken off.","watch_out":"The padding used to line up the working capital list drops the change for the final year."},{"start":141,"end":166,"kind":"function","name":"build_cash_flow_statement (part 2)","id":"s4","hash":"92ba4394e8650798","title":"Net cash change and running cash total","what":"Adds the three cash flows for each year to get the net change, then adds those changes into a running cash balance.","why":"The cash line on the balance sheet comes from this running total.","watch_out":"The running total starts at zero, so the cash balance is only right if the company truly begins with no cash."},{"start":167,"end":226,"kind":"function","name":"build_balance_sheet (part 1)","id":"s5","hash":"ae9e7eea12109735","title":"Assets, liabilities and equity calculation","what":"Adds up assets and liabilities, works out equity as whatever is left over, and computes the balance check.","why":"The code comment says equity is the plug that makes the sheet balance.","watch_out":"Because equity is forced to balance, the balance check always returns zero and proves nothing."},{"start":227,"end":245,"kind":"function","name":"build_balance_sheet (part 2)","id":"s6","hash":"e2fdd59aab5de4f5","title":"Returning the balance sheet lines","what":"Packages every balance sheet line into one result.","why":"Gives the caller all the balance sheet lines in one place.","watch_out":"The starting equity setting is accepted but never used, so it has no effect."},{"start":246,"end":302,"kind":"function","name":"build_three_statement_model (part 1)","id":"s7","hash":"7a03045f35a63305","title":"Gathering inputs and building the first two statements","what":"Pulls the needed lists from the other modules and builds the income statement and cash flow statement.","why":"Acts as the single entry point that connects the modules.","watch_out":"It relies on exact key names and on the revenue result being a pair, so a renamed key or changed return shape causes an error."},{"start":303,"end":318,"kind":"function","name":"build_three_statement_model (part 2)","id":"s8","hash":"a38103c6dc73923c","title":"Building the balance sheet and returning results","what":"Builds the balance sheet from cash, working capital, net assets, and debt, then returns all three statements.","why":"Completes the set of three statements.","watch_out":"The balance sheet inherits the plug equity described earlier, so a passing balance check here does not show the model is correct."}],"explained_at":"2026-11-12T00:19:48+00:00","explained_by":"haiku","summary":"Combines the calculation parts into three linked financial statements (income statement, cash flow statement, and balance sheet) for each year, with a balance check.","purpose":"Produces the three statements and the balance check that is meant to confirm they agree.","why":"The three statements are the final picture of the company's finances, and they must agree with each other.","how":"1. Build the income statement from revenue, costs, expenses, depreciation, interest, and tax. 2. Build the cash flow statement from net income, depreciation, working capital, capital spending, and debt. 3. Build the balance sheet from cash, receivables, stock, net assets, payables, and debt. 4. Calculate equity as the balancing figure. 5. Return all three statements.","inputs":"Result dictionaries from the revenue, cost, expense, capital spending, working capital, debt, and tax modules.","outputs":"A dictionary holding income_statement, cash_flow_statement, and balance_sheet, each a dictionary of yearly lists.","risks":"Equity is calculated as assets minus liabilities, so the balance check always shows zero and cannot catch errors. The working capital change in the final year is dropped from cash flow. Opening cash is taken as zero and the starting equity input is ignored. Capital spending and debt repayments are expected as positive numbers, though some docstrings describe them as negative.","debug":"Do not rely on the balance check alone, since it always passes. Compare the cash balance line with the balance sheet cash line year by year. For a gap in the final year, look at the working capital change in that year. Confirm each input list has the same length.","summary_hash":"sha256:bafad3518f8d9b361c2736acb4b28b0148979813977a0e7038494fc629d26c19","fresh":true},"backend/calc/taxes.py":{"schema_version":1,"path":"backend/calc/taxes.py","language":"Python","lines":156,"hash":"sha256:e0c5b3ffd7d06f822c034c16058303ca6a3840c0b5efdd984e293df693e84a61","area":"backend-calc","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The loss pool has no yearly cap, and the code does not say whether that is intended.","No tests or input checks were visible."]},"terms":[{"term":"EBIT","meaning":"profit before interest and tax"},{"term":"Pretax income","meaning":"profit after interest but before tax"},{"term":"Net operating loss (NOL)","meaning":"a loss that can be carried forward to reduce taxes in later profitable years"},{"term":"Tax rate","meaning":"the share of taxable profit paid as tax"},{"term":"Carryforward","meaning":"moving a loss or unused amount into a later year"}],"depends_on":["backend/calc/utils.py"],"used_by":["backend/calc/statements.py (its build_three_statement_model reads tax and net income)"],"sections":[{"start":1,"end":22,"kind":"setup","name":"File setup","id":"s1","hash":"2c18d6e803c95f58","title":"Module overview and imports","what":"Nothing runs here. It explains how pretax income and tax are found and loads the helper tools.","why":"Gives the reader the formulas before the code.","watch_out":""},{"start":23,"end":53,"kind":"function","name":"calculate_tax_simple","id":"s2","hash":"ccb5d3fd6013dc3d","title":"Simple tax with no loss carryover","what":"Charges tax at the rate on each positive pretax year. Loss years pay no tax and get no refund.","why":"Likely reason: this is the simplest treatment, and the code notes it as an assumption.","watch_out":"Losses earn no tax relief here, so a company with losses in some years shows more tax than it would under loss carryforward."},{"start":54,"end":107,"kind":"function","name":"calculate_tax_with_nol (part 1)","id":"s3","hash":"a995278d7d4fb197","title":"Tax with past losses carried forward","what":"Each year, adds losses to a pool, and uses that pool to cut taxable profit in profit years before the rate is applied.","why":"Likely reason: many tax systems let losses offset later profits, so this mode is closer to that.","watch_out":"The whole pool can be used in one year with no limit, which may overstate tax relief."},{"start":108,"end":116,"kind":"function","name":"calculate_tax_with_nol (part 2)","id":"s4","hash":"111c7199bd52b244","title":"Returning loss-mode results","what":"Returns the loss pool balance, taxable income, tax, and net income for each year.","why":"Lets the reader see how losses were stored and used.","watch_out":""},{"start":117,"end":156,"kind":"function","name":"calculate_net_income","id":"s5","hash":"ce6b3a08c277f5f1","title":"Choosing a tax method and building net income","what":"Works out pretax income from EBIT and interest, then applies either the simple or the loss carryforward tax method, depending on the switch.","why":"Likely reason: a single entry point means the rest of the model does not need to know which method is used.","watch_out":"The starting loss pool is quietly ignored when the switch is off."}],"explained_at":"2026-11-12T00:19:48+00:00","explained_by":"haiku","summary":"Works out income tax each year and net income after tax, with an optional mode that carries past losses forward to reduce future tax.","purpose":"Produces pretax income, tax, and net income for each year.","why":"Tax depends on profit, and net income feeds the statements and the cash flow.","how":"1. Pretax income equals EBIT minus interest. 2. In simple mode, positive pretax income is taxed at the rate and loss years pay no tax. 3. In loss carryforward mode, losses go into a pool and are used to reduce later taxable profit before the rate is applied. 4. Net income equals pretax income minus tax.","inputs":"An EBIT list; an interest list; a tax rate; an optional switch for loss carryforward; an optional starting loss pool.","outputs":"Pretax income, tax, and net income lists. Loss mode also returns the loss pool balance per year and taxable income.","risks":"Simple mode gives no tax relief for losses, which can overstate tax. The loss pool has no yearly cap on how much can be used, and the code does not explain why. The starting loss pool is ignored unless the carryforward switch is on. Results stop at the shorter input list.","debug":"Compare pretax income with tax. Tax should be zero in loss years. In loss mode, check the loss pool list to see losses being stored and then used up.","summary_hash":"sha256:e0c5b3ffd7d06f822c034c16058303ca6a3840c0b5efdd984e293df693e84a61","fresh":true},"backend/calc/utils.py":{"schema_version":1,"path":"backend/calc/utils.py","language":"Python","lines":78,"hash":"sha256:51646cae9cb35c4f2712dbc3b6ffe8d14ddd22e73d00ba81e2dbf1f774b5c7da","area":"backend-calc","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The helpers are short and clear, but no tests were visible.","Converting an empty or missing value raises an unclear error."]},"terms":[{"term":"Decimal","meaning":"a number type that stores values exactly, avoiding small rounding errors"},{"term":"Growth series","meaning":"a list of values where each one is the previous value grown by a rate"},{"term":"Interpolation","meaning":"filling in evenly spaced values between a start and an end"}],"depends_on":["Python standard library (typing, decimal)"],"used_by":["backend/calc/capex.py","backend/calc/cogs.py","backend/calc/debt.py","backend/calc/opex.py","backend/calc/revenue.py","backend/calc/statements.py","backend/calc/taxes.py","backend/calc/valuation.py","backend/calc/working_capital.py"],"sections":[{"start":1,"end":10,"kind":"setup","name":"File setup","id":"s1","hash":"cff88ba7bc6c589a","title":"Module overview and imports","what":"Nothing runs here. It states the purpose of the file and loads the standard tools.","why":"Shows that these are shared helpers rather than calculations for one area.","watch_out":""},{"start":11,"end":17,"kind":"function","name":"to_decimal","id":"s2","hash":"a0d5bd0524bd29f2","title":"Converting any value to exact decimal","what":"Turns a number into an exact decimal form, and leaves values that are already decimals unchanged.","why":"Likely reason: ordinary decimal numbers can carry tiny errors, while exact decimals keep money figures precise.","watch_out":"The conversion goes through text, so a value such as None raises an error."},{"start":18,"end":25,"kind":"function","name":"round_decimal","id":"s3","hash":"7d77df54f4b4dbc2","title":"Rounding to set decimal places","what":"Rounds a decimal to a chosen number of places, rounding halves up.","why":"Likely reason: reports need tidy numbers.","watch_out":"None of the calculation files shown call this helper, so no rounding is applied in them."},{"start":26,"end":32,"kind":"function","name":"safe_divide","id":"s4","hash":"5489921580cb491d","title":"Dividing without crashing on zero","what":"Divides two decimals and returns a default value instead when the divisor is zero.","why":"Likely reason: stops a zero denominator from crashing the calculation.","watch_out":"The default is returned silently, which can hide missing data."},{"start":33,"end":37,"kind":"function","name":"apply_growth","id":"s5","hash":"b2e1b1711d0b05db","title":"Growing one value by one rate","what":"Multiplies a value by one plus the growth rate.","why":"This is the single step behind every yearly growth calculation.","watch_out":"Rates must be decimals; passing 5 instead of 0.05 grows the value by 500 percent."},{"start":38,"end":56,"kind":"function","name":"cumulative_growth","id":"s6","hash":"ef08ba1833e7954e","title":"Series of values from a starting value","what":"Starts from a base value and applies each rate in turn, returning the base plus one value per rate.","why":"Likely reason: builds the yearly path for prices, costs, and volumes.","watch_out":"The returned list is one longer than the rate list, because the base is included, so years must be matched carefully."},{"start":57,"end":61,"kind":"function","name":"sum_list","id":"s7","hash":"7bc7b76257b336b0","title":"Adding a list of decimals","what":"Adds all the decimals in a list and returns zero for an empty list.","why":"Likely reason: gives a safe way to total yearly lists.","watch_out":"An empty list returns zero, which can hide missing data."},{"start":62,"end":78,"kind":"function","name":"interpolate","id":"s8","hash":"63634791d26b5efe","title":"Evenly spaced values between two numbers","what":"Creates evenly spaced values from a start to an end, including the start but not the end.","why":"Reason not stated in the code.","watch_out":"With one or fewer periods it returns only the start value, which may surprise a caller."}],"explained_at":"2026-11-12T00:19:48+00:00","explained_by":"haiku","summary":"Holds small shared helper functions for exact decimal conversion, rounding, safe division, growth, summing, and even spacing between two values.","purpose":"Provides the building blocks used across the calculation files.","why":"Keeps common logic in one place so every module handles numbers the same way.","how":"Each helper does one job: convert a value to an exact decimal, round a value, divide safely, apply one growth step, build a series of growing values, add a list, or space values evenly between two numbers.","inputs":"Numbers, exact decimals, lists of growth rates, and period counts.","outputs":"Exact decimal values or lists of them. Safe division returns a default value when dividing by zero.","risks":"Converting a value goes through its text form, so an empty or non-numeric value raises an error. Only round_decimal does rounding, and it is not called by the calculation files shown. Dividing by zero is only handled in safe_divide.","debug":"If a module gives a surprising number, check the helper it uses here first. Test a helper with a known value to confirm it behaves as expected.","summary_hash":"sha256:51646cae9cb35c4f2712dbc3b6ffe8d14ddd22e73d00ba81e2dbf1f774b5c7da","fresh":true},"backend/calc/valuation.py":{"schema_version":1,"path":"backend/calc/valuation.py","language":"Python","lines":289,"hash":"sha256:506bd96a5e8ed030a36010b026ec2415527f9ae819b1ac57163ae078abf462e0","area":"backend-calc","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The timing used for the first cash flow and the terminal value is unclear and may be off by a year.","There is no check that the terminal growth rate is below the cost of capital.","No tests were visible."]},"terms":[{"term":"Discounted cash flow (DCF)","meaning":"a valuation that adds up future cash, each reduced to what it is worth today"},{"term":"Present value","meaning":"what a future amount is worth today"},{"term":"WACC (weighted average cost of capital)","meaning":"the blended cost of funding from owners and lenders"},{"term":"Beta","meaning":"a measure of how much a company's share price moves with the market"},{"term":"Unlevered and levered beta","meaning":"beta before and after taking debt into account"},{"term":"CAPM (capital asset pricing model)","meaning":"a formula linking the expected return on shares to the risk-free rate and beta"},{"term":"Terminal value","meaning":"the value of all cash flows after the forecast period"},{"term":"Enterprise value","meaning":"the value of the whole business before debt is subtracted"},{"term":"Net debt","meaning":"debt minus cash"},{"term":"Country risk premium","meaning":"extra return demanded for operating in a riskier country"}],"depends_on":["backend/calc/utils.py","Python standard library (math, decimal, typing)"],"used_by":["not visible in the files shown"],"sections":[{"start":1,"end":38,"kind":"setup","name":"File setup","id":"s1","hash":"63108195170d2a85","title":"Module overview and inputs","what":"Nothing runs here. It explains the valuation steps and the market inputs it expects.","why":"Gives the reader the method before the code.","watch_out":""},{"start":39,"end":65,"kind":"function","name":"calculate_relevered_beta","id":"s2","hash":"19c45d9c7a158a76","title":"Adjusting beta for debt","what":"Raises the unlevered beta to account for the target debt level and the tax benefit of interest.","why":"Likely reason: debt makes shareholder risk higher, so the beta used for equity must include it.","watch_out":"It uses a target debt ratio, so the result depends on that chosen target rather than the actual debt level."},{"start":66,"end":95,"kind":"function","name":"calculate_cost_of_equity","id":"s3","hash":"6d7079cd2c5f6ea8","title":"Required return for shareholders","what":"Works out the return shareholders should expect, using the risk-free rate, beta, and the equity and country risk premiums.","why":"Likely reason: it is the discount rate for equity.","watch_out":"Both premiums are multiplied by beta, so a high beta also magnifies country risk; check this is intended."},{"start":96,"end":133,"kind":"function","name":"calculate_wacc","id":"s4","hash":"f19b878848c5f04e","title":"Blended cost of capital","what":"Blends the cost of equity and the after-tax cost of debt, weighted by the target debt-to-equity mix, to give one discount rate.","why":"Likely reason: the discounting needs a single rate that reflects both sources of funding.","watch_out":"The weights come from the debt-to-equity ratio, so a wrong ratio gives a wrong rate."},{"start":134,"end":165,"kind":"function","name":"discount_cash_flows","id":"s5","hash":"1bb8df9606f149d8","title":"Present value of each year's cash flow","what":"Discounts each year's cash flow back to today using the discount rate, compounding by year, with the first year left as it is.","why":"Money received in the future is worth less than money today.","watch_out":"The first cash flow is not discounted, so the list must begin at the current year or every value is overstated."},{"start":166,"end":206,"kind":"function","name":"calculate_terminal_value","id":"s6","hash":"f683ff910d9856bc","title":"Value beyond the forecast period","what":"Estimates the value of all cash flows after the forecast using a growing perpetuity, then discounts that value back to today.","why":"Forecasts cannot run forever, so the terminal value captures the rest.","watch_out":"The terminal value is discounted by the full number of forecast years, which may be one year more than the timing of the last cash flow implies. The growth rate must also be below the discount rate."},{"start":207,"end":261,"kind":"function","name":"calculate_dcf_valuation (part 1)","id":"s7","hash":"a65b94ce1ef6b10b","title":"Running the full valuation steps","what":"Runs the steps in order: beta, cost of equity, cost of capital, present values, terminal value, and enterprise value, then subtracts net debt to get equity value.","why":"Gives callers a single entry point for a valuation.","watch_out":"Net debt is subtracted as given, so debt and cash must be in the same units as the cash flows."},{"start":262,"end":289,"kind":"function","name":"calculate_dcf_valuation (part 2)","id":"s8","hash":"871805507bfa4005","title":"Returning the valuation components","what":"Returns all rates, cash flows, terminal value, and final values in one result, so each step can be traced.","why":"Lets the reader check every stage of the valuation.","watch_out":"Values are ordinary numbers and the result is not per share, so a per-share value needs a separate step."}],"explained_at":"2026-11-12T00:19:48+00:00","explained_by":"haiku","summary":"Estimates what the company is worth today by discounting its future free cash flows and a terminal value, using a cost of capital built from market inputs.","purpose":"Produces the discount rates, present values, enterprise value, and equity value.","why":"Discounting expected future cash is a standard way to value a business.","how":"1. Adjust beta for the target debt level. 2. Work out the cost of equity with the capital asset pricing model. 3. Blend the cost of equity and the after-tax cost of debt into one cost of capital. 4. Discount each year's free cash flow. 5. Value the years after the forecast with a terminal value and discount it. 6. Add these to get enterprise value, then subtract net debt to get equity value.","inputs":"Free cash flow list; risk-free rate; equity risk premium; country risk premium; unlevered beta; pre-tax cost of debt; target debt-to-equity ratio; tax rate; terminal growth rate; net debt.","outputs":"A dictionary with all rates and inputs, the cash flows and their present values, the terminal value, enterprise value, and equity value.","risks":"The first cash flow is not discounted, so if it is a future year, the value is overstated. The terminal value is discounted by the number of forecast years, which may be one year more than the timing of the cash flows suggests. Nothing stops the terminal growth rate reaching or exceeding the cost of capital, which gives wrong results or an error. Results are ordinary numbers, not per-share values.","debug":"Start by checking the cost of capital is in a sensible range. Check the terminal growth rate is below it. Confirm the first cash flow is the current year. Compare the sum of present values with the individual values.","summary_hash":"sha256:506bd96a5e8ed030a36010b026ec2415527f9ae819b1ac57163ae078abf462e0","fresh":true},"backend/calc/working_capital.py":{"schema_version":1,"path":"backend/calc/working_capital.py","language":"Python","lines":135,"hash":"sha256:4d23a9c43b277cdc1377c27bd93c54e0ad0c10874c45ffa66c6e65436b4c00a8","area":"backend-calc","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The change list is one item shorter than the others and is not padded in this file.","No tests were visible. The formulas match the comments."]},"terms":[{"term":"Working capital","meaning":"money tied up in day-to-day operations"},{"term":"Receivables","meaning":"money customers owe the company"},{"term":"Payables","meaning":"money the company owes its suppliers"},{"term":"Days sales outstanding (DSO)","meaning":"the average number of days taken to collect payment"},{"term":"Days inventory held","meaning":"the average number of days stock is held before it is sold"},{"term":"Days payable outstanding (DPO)","meaning":"the average number of days taken to pay suppliers"}],"depends_on":["backend/calc/utils.py"],"used_by":["backend/calc/statements.py (its build_three_statement_model reads the receivables, inventory, payables, and yearly change)"],"sections":[{"start":1,"end":25,"kind":"setup","name":"File setup","id":"s1","hash":"5773f1562f4e3360","title":"Module overview and imports","what":"Nothing runs here. It explains the formulas and the meaning of the day counts, and loads the helper tools.","why":"Gives the reader the formulas before the code.","watch_out":""},{"start":26,"end":47,"kind":"function","name":"calculate_ar","id":"s2","hash":"3b897f44a5cc5edb","title":"Money owed by customers each year","what":"Works out the yearly receivable balance from revenue and the days it usually takes to collect payment.","why":"Likely reason: unpaid sales are income the company has earned but not yet received.","watch_out":"The days value must be a count of days; a rate typed in its place gives wrong balances."},{"start":48,"end":65,"kind":"function","name":"calculate_inventory","id":"s3","hash":"f195ff52c787a45d","title":"Stock held each year","what":"Works out the value of stock held, based on cost of goods and the days of stock held.","why":"Likely reason: stock is cash already spent but not yet sold, so it ties up money.","watch_out":"It is based on cost of goods rather than sales, so a change in selling prices alone does not change stock."},{"start":66,"end":83,"kind":"function","name":"calculate_ap","id":"s4","hash":"6edeafde27ee29e7","title":"Money owed to suppliers each year","what":"Works out what the company owes suppliers, based on cost of goods and the days taken to pay.","why":"Likely reason: unpaid supplier bills give the business a free source of funding.","watch_out":"A longer payment period lowers cash needs, so a wrong days figure can make cash look better than it is."},{"start":84,"end":135,"kind":"function","name":"calculate_working_capital_full","id":"s5","hash":"66583faefbda5b23","title":"Net working capital and yearly change","what":"Combines receivables and stock, subtracts payables, then works out the year-to-year change in that net figure.","why":"The yearly change is what affects cash, so it is calculated here.","watch_out":"The change list has one fewer entry than the others, so the first year has no change figure."}],"explained_at":"2026-11-12T00:19:48+00:00","explained_by":"haiku","summary":"Works out how much money is tied up in customer bills, stock, and supplier bills each year, and how that amount changes from one year to the next.","purpose":"Produces receivables, inventory, payables, net working capital, and the yearly change.","why":"Money tied up in unpaid bills and stock affects cash, so the cash flow needs the yearly change.","how":"1. Receivables equal revenue times days to collect, divided by 365. 2. Inventory equals cost of goods times days of stock, divided by 365. 3. Payables equal cost of goods times days to pay suppliers, divided by 365. 4. Net working capital equals receivables plus inventory minus payables. 5. The change is the difference from one year to the next.","inputs":"Revenue list; cost of goods list; days sales outstanding; days inventory held; days payable outstanding.","outputs":"Receivables, inventory, payables, and net working capital lists, plus a change list that is one item shorter.","risks":"The 365-day year is fixed in the code. The change list is one item shorter than the others, so it does not line up by year without an adjustment.","debug":"Check the days inputs first. If cash flow looks wrong, compare the change list with the difference in net working capital between years.","summary_hash":"sha256:4d23a9c43b277cdc1377c27bd93c54e0ad0c10874c45ffa66c6e65436b4c00a8","fresh":true},"backend/config.py":{"schema_version":1,"path":"backend/config.py","language":"Python","lines":115,"hash":"sha256:90aa2b837683c3a441093c90782301b326a6e37d74a46ce2ddff98aab7cd952a","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No validation of setting values.","No tests visible.","An unused import is present."]},"terms":[{"term":"Environment variable","meaning":"A named value set outside the code, such as in the operating system."},{"term":".env file","meaning":"A text file of name and value pairs that the app reads at startup."},{"term":"Provider","meaning":"The source of the AI models, here either Ollama or OpenAI."},{"term":"Redis","meaning":"A fast in-memory data store used for caching and queues."},{"term":"TTL","meaning":"Time to live, the length of time cached data is kept."}],"depends_on":["pydantic_settings","a .env file in the backend folder"],"used_by":["backend/db/database.py","backend agents such as backend/agents/research.py"],"sections":[{"start":1,"end":12,"kind":"setup","name":"File setup","id":"s1","hash":"ed427e0bae5b6bd6","title":"Imports","what":"Brings in file path, typing and the settings library.","why":"Likely reason: needed for the settings class.","watch_out":""},{"start":13,"end":69,"kind":"class","name":"Settings (part 1)","id":"s2","hash":"8cc42452cfefd92f","title":"List of settings","what":"Declares every configurable value with its default: server address, database, AI provider and model names, search key, Redis, cache and embedding model.","why":"Likely reason: lets the app run with sensible defaults and override them.","watch_out":"Renaming a setting breaks any .env file that uses the old name."},{"start":70,"end":115,"kind":"method","name":"Settings: get_data_dir","id":"s3","hash":"2dd0ad85add50776","title":"Folder and model-name helpers","what":"Creates the data and cache folders when asked, and returns the model name for a given agent type from the chosen provider.","why":"Likely reason: keeps model selection in one place so switching providers is one setting.","watch_out":"An unknown agent type silently uses the research model, which can hide typos."}],"explained_at":"2026-11-12T00:35:09+00:00","explained_by":"haiku","summary":"Central place that reads settings from environment variables and the .env file and provides the model name for each agent type.","purpose":"Holds the app's configurable values, such as database address, AI provider and model names, in one place.","why":"Likely reason: keeps keys and choices out of the code.","how":"The Settings class declares each setting with a default. Values from the .env file or environment override the defaults. Two helpers create folders on request. The model helper picks a model name based on the provider and agent type. One shared settings object is created when the file loads.","inputs":"The .env file, environment variables and the defaults in the code.","outputs":"The settings object used across the backend, model name text and created folders.","risks":"Defaults point to local services such as Ollama, Redis and a SQLite file that may not exist. The research cache default is a Linux path and will fail or create odd folders elsewhere. Unknown agent types silently fall back to the research model. Missing keys produce no error at startup.","debug":"If the wrong model runs, check model_provider and the environment. If a key is ignored, check the .env file is in the backend folder and the name matches. For folder errors, check permissions on the cache path.","summary_hash":"sha256:90aa2b837683c3a441093c90782301b326a6e37d74a46ce2ddff98aab7cd952a","fresh":true},"backend/db/database.py":{"schema_version":1,"path":"backend/db/database.py","language":"Python","lines":81,"hash":"sha256:dbd9dfcba5bdaa0a8e9c894be73ed71aef4f4a7874e7675eb74e456b38f54dd3","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No migrations, so table changes do not reach existing databases.","No tests visible.","drop_all has no safety check."]},"terms":[{"term":"SQLAlchemy","meaning":"A Python library for talking to databases using Python classes."},{"term":"Engine","meaning":"The object that holds the connection to the database."},{"term":"Session","meaning":"A short working space for reading and writing database rows."},{"term":"SQLite","meaning":"A small database stored in a single file."},{"term":"Foreign key","meaning":"A link from one table row to a row in another table that must exist."},{"term":"Migration","meaning":"A managed change to a database structure over time."}],"depends_on":["sqlalchemy","backend/config.py","backend/db/models.py"],"used_by":["backend/db/models.py","FastAPI route files (not in packet)"],"sections":[{"start":1,"end":38,"kind":"setup","name":"File setup","id":"s1","hash":"ae6ddd7a8ce0481d","title":"Connection setup","what":"Creates the database engine, turns on foreign key checks for SQLite, and builds the session factory and base class for tables.","why":"Likely reason: one shared connection setup for the whole backend.","watch_out":"The foreign key switch only applies to SQLite databases."},{"start":39,"end":54,"kind":"function","name":"get_db","id":"s2","hash":"c9d22e0f95c07fd7","title":"Per-request session","what":"Opens a database session for a web request and closes it when the request ends.","why":"Likely reason: prevents sessions from being left open.","watch_out":"The return type says Session, but the function yields one, which is a looser contract than it looks."},{"start":55,"end":70,"kind":"function","name":"get_db_context","id":"s3","hash":"30e3c5afd35f8031","title":"Session for scripts","what":"Provides the same open-and-close behaviour for scripts or one-off tasks.","why":"Likely reason: lets non-web code use the database safely.","watch_out":"Code that forgets to use the with statement can leave sessions open."},{"start":71,"end":77,"kind":"function","name":"init_db","id":"s4","hash":"52abe58707d1fdaa","title":"Create tables","what":"Imports the models and creates every table that does not exist yet.","why":"Likely reason: sets up a new database in one call.","watch_out":"Existing tables are not updated when the models change."},{"start":78,"end":81,"kind":"function","name":"drop_all","id":"s5","hash":"ebfe8c9181fd4e68","title":"Drop all tables","what":"Deletes every table and all their data.","why":"Likely reason: for resetting a development database.","watch_out":"This erases all data with no confirmation. Never run it against real data."}],"explained_at":"2026-11-12T00:35:09+00:00","explained_by":"haiku","summary":"Sets up the database connection, gives code a way to open a session, and creates or drops all tables.","purpose":"The connection layer that every database operation uses.","why":"Likely reason: one shared setup for the whole backend. SQLite foreign key checks are switched on because SQLite leaves them off by default.","how":"Creates the engine from the database address. For SQLite, allows multi-thread use and turns on foreign keys for each connection. Builds a session factory and a base class for tables. get_db gives FastAPI a session per request and closes it afterwards. get_db_context does the same for scripts. init_db creates tables from the models. drop_all deletes them.","inputs":"The database_url setting and the table definitions in models.py.","outputs":"Database sessions and tables in the database.","risks":"drop_all deletes all data with no confirmation. init_db creates only missing tables and does not change existing ones, and no migration tool is visible. The declarative base import location is older and may warn with newer SQLAlchemy.","debug":"For no such table errors, run init_db. For foreign key errors, confirm the database is SQLite. For connection failures, check database_url in the .env file.","summary_hash":"sha256:dbd9dfcba5bdaa0a8e9c894be73ed71aef4f4a7874e7675eb74e456b38f54dd3","fresh":true},"backend/db/models.py":{"schema_version":1,"path":"backend/db/models.py","language":"Python","lines":320,"hash":"sha256:9ddf7d72042bf595d175a84a60c7e69ade9e4a67b0b568cb708eb8b2581fbe18","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No migrations.","No tests visible.","Expected values are described only in comments."]},"terms":[{"term":"Table","meaning":"A grid of rows and columns in a database."},{"term":"Column","meaning":"One named field in a table."},{"term":"Primary key","meaning":"The column that uniquely identifies each row."},{"term":"Index","meaning":"A lookup aid that makes searches faster."},{"term":"Cascade delete","meaning":"Deleting a parent row also deletes its linked child rows."},{"term":"Scenario","meaning":"A named set of assumptions, such as base, upside or downside."},{"term":"Driver","meaning":"A model-wide assumption such as a tax rate."},{"term":"Time bucket","meaning":"One time period, such as Year 1 or Q1 2024."},{"term":"Balance sheet","meaning":"A summary of what a company owns, owes and has as equity at a point in time."},{"term":"WACC","meaning":"Weighted average cost of capital, the discount rate used to value a company."},{"term":"Enterprise value","meaning":"The value of a company's operations before subtracting net debt."}],"depends_on":["sqlalchemy","backend/db/database.py"],"used_by":["backend/db/database.py","backend routes and calculation code (not in packet)"],"sections":[{"start":1,"end":19,"kind":"setup","name":"File setup","id":"s1","hash":"16fd6835639897de","title":"Imports and base class","what":"Brings in the column types, relationship tools, timestamps and the shared base class.","why":"Likely reason: needed to define every table.","watch_out":"The base class must come from database.py or the tables will not be registered."},{"start":20,"end":24,"kind":"function","name":"generate_uuid","id":"s2","hash":"c8af659a46d27842","title":"Row id generator","what":"Creates a unique text id for each new row.","why":"Likely reason: avoids clashes and lets ids be made before saving.","watch_out":"The ids are random text, so sorting by id does not give creation order."},{"start":25,"end":44,"kind":"class","name":"Model","id":"s3","hash":"fbdbb51bb802a3b8","title":"Model table","what":"Stores one financial model: name, currency, unit scale, start year, forecast length and granularity, plus links to its scenarios, drivers and segments.","why":"Likely reason: the top-level record that everything else belongs to.","watch_out":"The unit divisor must be applied consistently in every calculation; nothing here enforces it."},{"start":45,"end":64,"kind":"class","name":"Scenario","id":"s4","hash":"fe03a563b4334305","title":"Scenario table","what":"Stores a named version of a model, such as base, upside or downside, with a default flag and links to its periods, driver values and inputs.","why":"Likely reason: lets one model be tested under several sets of assumptions.","watch_out":"Nothing stops two scenarios in one model from both being marked default."},{"start":65,"end":82,"kind":"class","name":"TimeBucket","id":"s5","hash":"8101047ae752987d","title":"Time bucket table","what":"Stores one period within a scenario, with a label, dates, granularity and an ordering number.","why":"Likely reason: calculations need a fixed order of periods.","watch_out":"Gaps or duplicate ordering numbers would confuse calculations."},{"start":83,"end":99,"kind":"class","name":"Driver","id":"s6","hash":"8ff9e803abb9fe5d","title":"Driver table","what":"Stores a model-wide assumption with its key, description and unit.","why":"Likely reason: one definition shared by all scenarios.","watch_out":"The key is free text, so a typo creates a new driver instead of matching the old one."},{"start":100,"end":116,"kind":"class","name":"DriverValue","id":"s7","hash":"11640f09e70a47ee","title":"Driver value table","what":"Stores the value of one driver for one scenario in one period.","why":"Likely reason: lets the same driver change over time and between scenarios.","watch_out":"A unique index allows only one value per scenario, driver and period, so a duplicate insert will fail."},{"start":117,"end":133,"kind":"class","name":"Segment","id":"s8","hash":"5287e141c01d40b8","title":"Segment table","what":"Stores a business part defined by region and product code, which holds lines.","why":"Likely reason: groups related revenue and cost items.","watch_out":"Region and product code are free text, so spelling differences split a segment."},{"start":134,"end":149,"kind":"class","name":"Line","id":"s9","hash":"310d941a5390e85a","title":"Line table","what":"Stores one revenue or cost item inside a segment, with an on or off switch.","why":"Likely reason: the switch lets a user test a line without deleting it.","watch_out":"Whether inactive lines are excluded from results is not visible in this file."},{"start":150,"end":169,"kind":"class","name":"LineInput","id":"s10","hash":"0a42c2e581e39d51","title":"Line input table","what":"Stores one input number for a line, such as volume, price or growth rate, for a scenario and optional period.","why":"Likely reason: the inputs that drive every calculation.","watch_out":"Metric names are free text and must match exactly what calculations look for. The unique index may not block duplicates when the period is empty, because databases treat empty values as distinct."},{"start":170,"end":184,"kind":"class","name":"ResultRevenue","id":"s11","hash":"e0fff8d1c029fc55","title":"Revenue result table","what":"Stores calculated volume, price and revenue for each line and period.","why":"Likely reason: saves results so they need not be recalculated on every view.","watch_out":"These are saved outputs, so they go stale if inputs change and nothing recalculates them."},{"start":185,"end":200,"kind":"class","name":"ResultCOGS","id":"s12","hash":"760248f1045c14d7","title":"Cost of goods result table","what":"Stores calculated variable and fixed cost of goods sold, plus the cost per unit, for each line and period.","why":"Likely reason: same purpose as the revenue results table.","watch_out":"Same stale-result risk as the revenue table."},{"start":201,"end":251,"kind":"class","name":"ResultStatement","id":"s13","hash":"83529b08fff5e6ff","title":"Financial statement result table","what":"Stores the income statement, cash flow and balance sheet figures for each period in one table.","why":"Likely reason: keeps the three statements together for easy reading.","watch_out":"The balance check should be zero when the model is correct. A non-zero value means the model has an error. Many columns allow empty values."},{"start":252,"end":285,"kind":"class","name":"ResultValuation","id":"s14","hash":"a9e5cb67eb55cb4a","title":"Valuation result table","what":"Stores the discount rate parts and valuation outputs, with one row per scenario.","why":"Likely reason: one set of valuation numbers per scenario.","watch_out":"The scenario link is unique, so rerunning the valuation must replace the old row, not add another."},{"start":286,"end":309,"kind":"class","name":"ResearchData","id":"s15","hash":"62121ee06f7be6c6","title":"Research data table","what":"Stores facts gathered from outside sources, such as a metric, value, country and sector, with the original data kept as JSON.","why":"Likely reason: caches research so it is not fetched again each time.","watch_out":"This table does not expire old rows. Expiry, if any, is controlled elsewhere; the code that does it is not in the packet."},{"start":310,"end":320,"kind":"class","name":"ResearchCitation","id":"s16","hash":"6e0ed8b296cd0f6e","title":"Research citation table","what":"Stores a short citation key and full reference text, linked to one research data row.","why":"Likely reason: keeps the source of each number traceable.","watch_out":"Citations are deleted automatically when their research row is deleted."}],"explained_at":"2026-11-12T00:35:09+00:00","explained_by":"haiku","summary":"Defines every database table the app uses: models, scenarios, drivers, segments, lines, inputs, calculated results and research data.","purpose":"Describes the shape of all stored data in one file.","why":"Likely reason: one file keeps the tables and their links consistent.","how":"Each class becomes one table. Each row gets a generated text id. Foreign keys link child tables to parents, and cascade rules remove children when a parent is deleted. Indexes speed up lookups. Results tables store calculated numbers.","inputs":"Data written by the app and its calculation code.","outputs":"Rows stored in the tables defined here.","risks":"Changing a column later will not update existing databases, since no migrations are visible. Several result columns allow empty values. The balance check is only a comment; nothing enforces it. Deleting a parent can remove many child rows at once.","debug":"After a model change, a missing column error means the database predates the change, so it needs migrating or recreating, which loses data. Check table name text matches the class.","summary_hash":"sha256:9ddf7d72042bf595d175a84a60c7e69ade9e4a67b0b568cb708eb8b2581fbe18","fresh":true},"backend/defaults/__init__.py":{"schema_version":1,"path":"backend/defaults/__init__.py","language":"Python","lines":1,"hash":"sha256:bf94a332fdfb1099e385ecf22d27c81e187995facdde7f787fd57e362200076d","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"unknown","reasons":["Nothing to test; it is only a marker."]},"terms":[{"term":"Package","meaning":"A folder of Python files that can be imported together."},{"term":"Import","meaning":"Loading code from another file so it can be used."}],"depends_on":[],"used_by":["backend/defaults/industry_defaults.py"],"sections":[{"start":1,"end":1,"kind":"setup","name":"File setup","id":"s1","hash":"6d37b9c9227693a1","title":"Package description","what":"A one-line description that says the folder holds industry default assumptions.","why":"Likely reason: lets Python and readers see what the package is for.","watch_out":""}],"explained_at":"2026-11-12T00:35:09+00:00","explained_by":"haiku","summary":"Package marker with a one-line description. It has no logic of its own.","purpose":"Lets Python treat the defaults folder as a package that other files can import from.","why":"Likely reason: Python needs this file to import from a folder.","how":"Holds only a description string.","inputs":" ":11,"end":70,"kind":"class","name":"Industry (part 1)","id":"s2","hash":"8d19d689ca102b6f","title":"Industry list and first profiles","what":"Defines the ten allowed industry names and the starting numbers for SaaS and Software.","why":"Likely reason: a fixed list keeps industry names consistent across the app.","watch_out":"The names are the exact text the frontend and database must send, so renaming one breaks lookups."},{"start":71,"end":130,"kind":"class","name":"Industry (part 2)","id":"s3","hash":"0a56427946a6abb7","title":"Rest of Software, E-commerce and start of Manufacturing","what":"Finishes the Software profile, then gives the E-commerce numbers, with high product costs and inventory, and starts the Manufacturing profile.","why":"Likely reason: each industry has its own cost and cash pattern, so each gets its own numbers.","watch_out":"E-commerce earns small margins on large costs, so a small change in a cost percentage shifts profit a lot."},{"start":131,"end":190,"kind":"class","name":"Industry (part 3)","id":"s4","hash":"aba9b18803fc7b26","title":"Manufacturing, Healthcare and start of Retail","what":"Finishes Manufacturing with heavy capital spending and high inventory, gives Healthcare numbers with long insurance payment delays, and starts the Retail profile.","why":"Likely reason: these industries have distinct capital needs and payment timing.","watch_out":"Healthcare's 75 receivable days strongly affect cash flow, so a user switching industries will see a large change. The rest of the Retail profile was not reviewed."},{"start":191,"end":250,"kind":"class","name":"Industry (part 4)","id":"s5","hash":"ae53b937f40872d2","title":"Industry benchmark numbers, part 4","what":"Finishes the default numbers for one industry (its name is above this section) and starts the Fintech block at line 213. These numbers are starting assumptions for a model: cost shares, margin targets, days to collect and pay, capital spending and valuation inputs.","why":"Likely cent.","why":"Likely reason: a first version of revenue. The code comment says growth should come from an input cell instead.","watch_out":"The 5 percent is built into every formula, so changing the growth driver does nothing."},{"start":357,"end":415,"kind":"class","name":"ExcelExporter (part 7)","id":"s8","hash":"91cd6ac73feda0f5","title":"Price table and revenue headers","what":"Writes the price table in the same way: the base price is typed in, and each later year grows by a fixed 2 percent. It then writes the revenue section headers.","why":"Likely reason: the same pattern as volume, so price and volume can be multiplied together later.","watch_out":"The 2 percent price growth is fixed in the formula and not read from any input."},{"start":416,"end":474,"kind":"class","name":"ExcelExporter (part 8)","id":"s9","hash":"065fdfd6ef738bed","title":"Revenue by product line and total","what":"Works out revenue for each product line in each year as volume times price, divided by the unit divisor. Then adds a total row for all lines.","why":"Likely reason: the division converts to the reporting unit, such as thousands, so totals read cleanly.","watch_out":"The total adds a fixed block of rows, so the layout must stay in step with this code if rows are added or removed."},{"start":475,"end":531,"kind":"method","name":"ExcelExporter: create_working_capital_tab","id":"s10","hash":"5dc59e152e398355","title":"Placeholder tabs and start of valuation","what":"Writes titles only for the Working_Capital, Debt_Equity, Taxes, Three_Statement and KPIs tabs. Then starts the Valuation_DCF tab with a title and the first WACC input lines.","why":"Reason not stated in the code. The empty tabs appear to be placeholders for later work.","watch_out":"Several financial statements are empty, so the balance check and the valuation cannot be relied on yet."},{"start":532,"end":565,"kind":"class","name":"ExcelExporter (part 10)","id":"s11","hash":"5ea8fc8790b5774b","title":"Valuation inputs and cost of equity","what":"Writes the WACC inputs: risk-free rate 4 percent, equity risk premium 5.5 percent, country risk 0, and unlevered beta 1.0, each with a source label. It then writes the cost of equity formula from those cells.","why":"Likely reason: shows each valuation input next to a source label so the user can check it.","watch_out":"The cost of equity uses the unlevered beta with no adjustment for debt, which may be wrong for a company that carries debt."},{"start":566,"end":604,"kind":"method","name":"ExcelExporter: create_checks_log_tab","id":"s12","hash":"bedc4968d7597a97","title":"Balance check tab","what":"Writes the Checks_Log tab with one check: the balance sheet should balance. It shows PASS in green when the difference is under 0.01, and FAIL in red otherwise. It reads its value from a cell on the Three_Statement tab, which is not built.","why":"Likely reason: a built-in test that the balance sheet adds up.","watch_out":"The value cell points to an empty cell, so the check shows PASS even when the model is unbalanced."},{"start":605,"end":618,"kind":"function","name":"export_to_excel","id":"s13","hash":"e7aedb8e9596e52d","title":"Simple entry point for the export","what":"Takes the model data, scenario data and a file name, runs the exporter and returns the file name.","why":"Likely reason: callers do not need to know how the exporter class works inside.","watch_out":"Errors are not caught here, so the code that calls this must handle them."}],"explained_at":"2026-11-12T00:38:00+00:00","explained_by":"haiku","summary":"Writes the financial model to an Excel workbook, using formulas so that changing an input updates the results, but most tabs are still empty placeholders.","purpose":"Lets the user download the model as an Excel file they can open, check and edit.","why":"Likely reason: formulas instead of fixed numbers let the user test what-if changes inside Excel itself. The header comment states this as a critical requirement.","how":"1. Creates the workbook file. 2. Defines the colour styles for inputs, formulas, headers and pass or fail. 3. Creates each tab in a fixed order. 4. On the Control_Timeline tab, writes the start year, horizon, unit divisor and currency, and gives names to the key cells. 5. On the Assumptions_Drivers tab, writes driver values and names their first-year cells. 6. On the Revenue_Build tab, writes volume and price rows with growth formulas, then revenue as volume times price divided by the unit divisor. 7. On the Valuation_DCF tab, writes fixed WACC inputs and a cost of equity formula. 8. On the Checks_Log tab, writes one balance check. 9. Saves and closes the file. Most other tabs only write a title.","inputs":"model_data with name, currency, start_year, horizon_years and unit_divisor. scenario_data with name, drivers and lines (each line with region, product, line_id, base_volume and base_price). A file name to write to.","outputs":"An .xlsx Excel file at the given path. The function returns the same file name.","risks":"Revenue growth is fixed at 5 percent for volume and 2 percent for price inside the formulas, so the drivers and inputs for growth do nothing. Valuation inputs (risk-free rate 4 percent, equity risk premium 5.5 percent, beta 1.0) are typed in and are not taken from the research code, although the labels cite Damodaran. The balance check reads an empty cell, so it can show PASS even when the model does not balance. Missing driver values default to zero, which can silently switch off a rate. Most tabs are titles only, so the workbook looks more complete than it is. The file is only saved at the end, so an error midway can leave no complete file.","debug":"Do not trust the Checks_Log PASS yet, because it reads an empty cell. If a KeyError appears, check that model_data and scenario_data contain the listed keys. If a formula shows an error in Excel, click the cell and follow what it points to. Check that the driver names in the scenario match the names in the driver list. Look for log lines from this module's logger to see which tab was being built when things failed.","summary_hash":"sha256:5692fbd86def7c4d50a326e78d0ff2e82aba26417f70326d2fc6211ddc8e6223","fresh":true},"backend/export/pdf.py":{"schema_version":1,"path":"backend/export/pdf.py","language":"Python","lines":106,"hash":"sha256:1a72fbde26a98dbda5195db45d5395599a158a495d04f7dc922cb84bbe3cd7d7","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Report tables are placeholders, so the output has no figures.","Names are not escaped before going into the HTML.","No tests are visible.","Errors are not caught with a clear message."]},"terms":[{"term":"PDF","meaning":"a fixed-layout document format used for printing and sharing"},{"term":"HTML","meaning":"the markup language that gives web pages their structure"},{"term":"CSS","meaning":"style rules that control colours, fonts and spacing in a web page"},{"term":"WeasyPrint","meaning":"a Python library that turns HTML and CSS into a PDF file"},{"term":"income statement","meaning":"a report of revenue, costs and profit over a period"},{"term":"balance sheet","meaning":"a snapshot of what a company owns, what it owes and the owners' stake"},{"term":"DCF","meaning":"discounted cash flow, a valuation that reduces future cash to today's value"}],"depends_on":["weasyprint","Python logging module"],"used_by":["Not visible in the code provided"],"sections":[{"start":1,"end":13,"kind":"setup","name":"File setup","id":"s1","hash":"648cdce975f88896","title":"Module setup and PDF library","what":"Describes the module and loads WeasyPrint, the type helpers and the logger.","why":"The module description says this file creates PDF reports from results.","watch_out":"If WeasyPrint or its system libraries are missing, this import fails, and the app may fail to start."},{"start":14,"end":72,"kind":"function","name":"generate_html_report (part 1)","id":"s2","hash":"0ccef4f66299e514","ti e exact third-party libraries the backend needs, each with a fixed version number, so the installation is repeatable.","purpose":"Lets someone install the same libraries the project was built with.","why":"Likely reason: fixed versions prevent surprises when a library is updated.","how":"1. Groups the libraries by purpose: web framework, database, data checks, calculations, export, web scraping, AI and search, optional queue, testing, utilities, OpenAI and Tavily. 2. Each line fixes one version. 3. The installer reads the list and installs everything.","inputs":"The file is read by pip, the Python installer.","outputs":"A set of installed libraries in the Python environment.","risks":"Several libraries are large or need system software (WeasyPrint, lxml, sentence-transformers, faiss-cpu, psycopg2). Optional services (psycopg2, redis, rq, openai) are installed along with required ones. Old pinned versions may have known security issues. Changing one line alone can cause version conflicts.","debug":"If installation fails, read the first error line. Many failures come from WeasyPrint or lxml needing system libraries. Check that the Python version matches the project's requirement.","summary_hash":"sha256:d121f049f8b01d49ad240807113c92ce011032aed2e112697009d7427e0a61d1","fresh":true},"backend/research/cache.py":{"schema_version":1,"path":"backend/research/cache.py","language":"Python","lines":104,"hash":"sha256:7da2de34d6475116038c4765ae7fd612b4b3576ba87cfcf5645922ed400a2019","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Keys are not checked before being used as file names.","Save failures are silent to the caller.","No tests are visible.","Expiry depends on the local clock."]},"terms":[{"term":"cache","meaning":"a saved copy kept so it can be reused quickly"},{"term":"TTL (time to live)","meaning":"how long a saved copy stays valid"},{"term":"JSON","meaning":"a plain text format for storing structured data"},
