    return esc(value).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\n/g, "<br>");
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function trunc(value, n) { value = String(value || ""); return value.length > n ? value.slice(0, n - 1) + "\u2026" : value; }
  function base(path) { var i = path.lastIndexOf("/"); return i < 0 ? path : path.slice(i + 1); }
  function dir(path) { var i = path.lastIndexOf("/"); return i < 0 ? "" : path.slice(0, i + 1); }
  function fileHref(path, section) { return "#/file/" + encodeURIComponent(path) + (section ? "/" + section : ""); }
  function both(calm, nerd) { return '<span class="calm-only">' + calm + '</span><span class="nerd-only">' + nerd + "</span>"; }
  function badge(states, status) {
    var s = states[status] || states.unknown;
    return '<span class="badge b-' + s[2] + '"><span aria-hidden="true">' + s[0] + "</span>" + esc(s[1]) + "</span>";
  }
  function fileBadge(card) { return badge(FILE_STATES, (card.readiness && card.readiness.status) || "unknown"); }
  function checkBadge(status) { return badge(CHECK_STATES, status || "unknown"); }
  function explainState(card) {
    if (!card.fresh) return ["\u25D0", "Code changed after these notes were written"];
    if (card.status === "explained") return ["\u25CF", "Explained"];
    if (card.status === "partial") return ["\u25D0", "Partly explained"];
    return ["\u25CB", "Not explained yet"];
  }
  function sec(n, title, nerdTitle, body) {
    return '<section class="sec"><p class="label">' + pad(n) + " / " + both(esc(title), esc(nerdTitle || title)) +
      '</p><div class="sec-body">' + body + "</div></section>";
  }

  // ---- Breadcrumb back into the portfolio -------------------------------
  var SITE_ROOT = SITE.url ? SITE.url.replace(/\/?$/, "/") : "";
  var PROJECT_URL = SITE_ROOT && SITE.project ? SITE_ROOT + "work/" + SITE.project + "/" : "";
  (function () {
    var crumbs = document.getElementById("crumbs");
    var parts = [];
    if (SITE_ROOT) {
      parts.push('<a class="link-quiet" href="' + esc(SITE_ROOT) + '">' + esc(SITE.owner || "Home") + "</a>");
      parts.push('<span aria-hidden="true">/</span><a class="link-quiet" href="' + esc(SITE_ROOT + "code/") + '">Code</a>');
      parts.push('<span aria-hidden="true">/</span><span class="here">' + esc(TITLE) + "</span>");
    } else {
      parts.push('<span class="here">' + esc(TITLE) + '</span><span aria-hidden="true">/</span><span>' + both("Code explorer", "./explore") + "</span>");
    }
    crumbs.innerHTML = parts.join("");
    if (PROJECT_URL) {
      var who = document.querySelector(".rail .who");
      if (who) who.insertAdjacentHTML("afterend", '<p class="label" style="margin:10px 0 0"><a class="link-quiet" href="' + esc(PROJECT_URL) +
        '">' + both("See the project page", "cd ../work/" + esc(SITE.project)) + "</a></p>");
    }
  })();
  function lineLink(path, s) {
    if (!SITE.repo_url || !REPO.commit) return "";
    var url = SITE.repo_url.replace(/\/$/, "") + "/blob/" + encodeURIComponent(REPO.commit) + "/" +
      path.split("/").map(encodeURIComponent).join("/") + "#L" + s.start + "-L" + s.end;
    return '<a class="link-quiet" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer"' +
      (SITE.private ? ' title="Private repository: opens for the owner after signing in to GitHub"' : "") + ">" +
      both(SITE.private ? "GitHub (owner only)" : "Open on GitHub", "git show") + "</a>";
  }

  // ---- Areas -------------------------------------------------------------
  var AREAS = [];
  var AREA_BY_ID = {};
  (function buildAreas() {
    (REPO.areas || []).forEach(function (a) {
      if (!AREA_BY_ID[a.id]) { var copy = Object.assign({}, a, { files: [] }); AREAS.push(copy); AREA_BY_ID[a.id] = copy; }
    });
    PATHS.forEach(function (p) {
      var id = FILES[p].area || "other";
      if (!AREA_BY_ID[id]) {
        var made = { id: id, name: id === "other" ? "Everything else" : id, summary: "", why: "", debug_tips: "", files: [] };
        AREAS.push(made); AREA_BY_ID[id] = made;
      }
      AREA_BY_ID[id].files.push(p);
    });
    AREAS = AREAS.filter(function (a) { return a.files.length > 0; });
    AREAS.forEach(function (a, i) { a.num = pad(i + 1); });
  })();

  var START = (REPO.start_here || []).filter(function (p) { return FILES[p]; });
  function sortFiles(list) {
    return list.slice().sort(function (a, b) {
      var sa = START.indexOf(a), sb = START.indexOf(b);
      if (sa !== sb) return (sa < 0 ? 999 : sa) - (sb < 0 ? 999 : sb);
      return (FILES[b].lines || 0) - (FILES[a].lines || 0) || a.localeCompare(b);
    });
  }
  function stats() {
    var out = { files: 0, explained: 0, sections: 0, noted: 0, stale: 0, lines: 0 };
    PATHS.forEach(function (p) {
      var f = FILES[p];
      out.files += 1; out.lines += f.lines || 0;
      if (f.status === "explained") out.explained += 1;
      (f.sections || []).forEach(function (s) { out.sections += 1; if (s.what) out.noted += 1; });
      if (!f.fresh || f.summary_stale) out.stale += 1;
    });
    return out;
  }

  // ---- Sidebar -----------------------------------------------------------
  document.getElementById("repo-name").textContent = TITLE;
  document.title = "Code explorer: " + TITLE;
  var builtBits = [];
  if (DATA.built_at) builtBits.push("Built " + DATA.built_at.slice(0, 10));
  if (REPO.commit) builtBits.push("commit " + REPO.commit);
  if (SITE.mode === "notes") builtBits.push("notes only");
  document.getElementById("built").textContent = builtBits.join(" / ");

  var tree = document.getElementById("tree");
  var search = document.getElementById("q");
  var currentPath = null, currentArea = null, openArea = null;

  function matches(path, q) {
    var f = FILES[path];
    if (path.toLowerCase().indexOf(q) >= 0) return true;
    if ((f.summary || "").toLowerCase().indexOf(q) >= 0) return true;
    return (f.terms || []).some(function (t) { return (t.term || "").toLowerCase().indexOf(q) >= 0; });
  }
  function renderTree() {
    var q = (search.value || "").trim().toLowerCase();
    var html = '<p class="label tree-title">' + both("Files by area", "ls -R") + "</p>";
    var shown = 0;
    AREAS.forEach(function (a) {
      var files = sortFiles(a.files).filter(function (p) { return !q || matches(p, q); });
      if (!files.length) return;
      var open = q || a.id === currentArea ? " open" : "";
      html += '<details class="t-area"' + open + ' data-area="' + esc(a.id) + '"><summary><span class="label">' + a.num +
        '</span><span class="t-name">' + esc(a.name) + '</span><span class="label t-count">' + files.length + "</span></summary><ul>";
      files.forEach(function (p) {
        var st = explainState(FILES[p]);
        var cur = p === currentPath ? ' aria-current="page"' : "";
        html += '<li><a href="' + fileHref(p) + '"' + cur + ' title="' + esc(p) + '"><span class="dot" title="' + esc(st[1]) +
          '" aria-label="' + esc(st[1]) + '">' + st[0] + '</span><span class="t-base">' + esc(base(p)) +
          '</span><span class="t-dir">' + esc(dir(p)) + "</span></a></li>";
        shown += 1;
      });
      html += "</ul></details>";
    });
    if (!shown) html += '<p class="t-empty">No files match \u201C' + esc(search.value) + '\u201D.</p>';
    tree.innerHTML = html;
  }
  var timer = null;
  search.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(renderTree, 120); });
  search.addEventListener("keydown", function (event) {
    if (event.key !== "Enter") return;
    var first = tree.querySelector("li a");
    if (first) location.hash = first.getAttribute("href");
  });
  document.addEventListener("keydown", function (event) {
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if (event.key === "/" && !/input|textarea/i.test(tag)) { event.preventDefault(); search.focus(); }
  });

  // ---- Mind map ----------------------------------------------------------
  function edge(x1, y1, x2, y2, opacity) {
    var mx = (x1 + x2) / 2;
    return '<path class="mm-edge" d="M' + x1 + " " + y1 + " C" + mx + " " + y1 + ", " + mx + " " + y2 + ", " + x2 + " " + y2 +
      '" stroke-opacity="' + opacity + '"/>';
  }
  function drawMap() {
    var wrap = document.getElementById("mm");
    var detail = document.getElementById("mm-detail");
    if (!wrap) return;
    if (!AREAS.length) { wrap.innerHTML = '<p class="pending">No source files yet.</p>'; return; }
    var ROW = 40, H = 30, TOP = 10, X0 = 4, W0 = 200, X1 = 250, W1 = 268, X2 = 566, W2 = 292;
    var ys = AREAS.map(function (_, i) { return TOP + i * ROW; });
    var open = AREA_BY_ID[openArea] || null;
    var fnodes = [];
    if (open) {
      var sorted = sortFiles(open.files);
      var shown = sorted.slice(0, 14);
      fnodes = shown.map(function (p) { return { kind: "file", path: p }; });
      if (sorted.length > shown.length) fnodes.push({ kind: "more", n: sorted.length - shown.length });
    }
    var oi = open ? AREAS.indexOf(open) : -1;
    var fTop = open ? Math.max(TOP, ys[oi] - ((fnodes.length - 1) * ROW) / 2) : TOP;
    var lastA = ys[ys.length - 1];
    var lastF = fnodes.length ? fTop + (fnodes.length - 1) * ROW : 0;
    var height = Math.max(lastA, lastF) + H + TOP;
    var width = (open ? X2 + W2 : X1 + W1) + 6;
    var rootY = (ys[0] + lastA) / 2;
    var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + width + " " + height + '" width="' + width + '" height="' +
      height + '" role="group" aria-label="Mind map of ' + esc(TITLE) + '">';
    AREAS.forEach(function (a, i) { s += edge(X0 + W0, rootY + H / 2, X1, ys[i] + H / 2, open && a !== open ? 0.12 : 0.4); });
    fnodes.forEach(function (_, j) { s += edge(X1 + W1, ys[oi] + H / 2, X2, fTop + j * ROW + H / 2, 0.4); });
    s += '<g class="mm-root"><rect x="' + X0 + '" y="' + rootY + '" width="' + W0 + '" height="' + H + '" rx="15"/><text x="' +
      (X0 + 16) + '" y="' + (rootY + 19) + '">' + esc(trunc(TITLE, 24)) + "</text></g>";
    AREAS.forEach(function (a, i) {
      var isOpen = a === open;
      s += '<g class="mm-node mm-area' + (isOpen ? " is-open" : "") + (open && !isOpen ? " is-dim" : "") + '" tabindex="0" role="button" aria-expanded="' +
        isOpen + '" aria-label="' + esc(a.name) + ", " + a.files.length + ' files" data-area="' + esc(a.id) + '"><rect class="box" x="' + X1 +
        '" y="' + ys[i] + '" width="' + W1 + '" height="' + H + '" rx="15"/><text class="mm-num" x="' + (X1 + 14) + '" y="' + (ys[i] + 19) + '">' +
        a.num + '</text><text x="' + (X1 + 44) + '" y="' + (ys[i] + 19) + '">' + esc(trunc(a.name, 25)) + '</text><text class="mm-count" x="' +
        (X1 + W1 - 14) + '" y="' + (ys[i] + 19) + '" text-anchor="end">' + a.files.length + "</text></g>";
    });
    fnodes.forEach(function (f, j) {
      var y = fTop + j * ROW;
      if (f.kind === "more") {
        s += '<g class="mm-node mm-more" tabindex="0" role="link" aria-label="' + f.n + ' more files in this area" data-more="' + esc(open.id) +
          '"><rect class="box" x="' + X2 + '" y="' + y + '" width="' + W2 + '" height="' + H + '" rx="4"/><text x="' + (X2 + 14) + '" y="' + (y + 19) +
          '">' + f.n + " more files in this area</text></g>";
        return;
      }
      var card = FILES[f.path];
      var st = explainState(card);
      s += '<g class="mm-node mm-file" tabindex="0" role="link" aria-label="' + esc(f.path) + ", " + esc(st[1]) + '" data-path="' + esc(f.path) +
        '"><rect class="box" x="' + X2 + '" y="' + y + '" width="' + W2 + '" height="' + H + '" rx="4"/><text x="' + (X2 + 14) + '" y="' + (y + 19) + '">' +
        esc(trunc(base(f.path), 32)) + '</text><text class="mm-glyph" x="' + (X2 + W2 - 14) + '" y="' + (y + 19) + '" text-anchor="end">' + st[0] +
        "</text><title>" + esc(f.path) + (card.summary ? ": " + esc(card.summary) : "") + "</title></g>";
    });
    wrap.innerHTML = s + "</svg>";
    if (open) {
      detail.innerHTML = '<p class="label legend">' + open.num + " / " + both("Area", "dir") + "</p><h3>" + esc(open.name) + "</h3>" +
        (open.summary ? "<p>" + fmt(open.summary) + "</p>" : '<p class="pending">This area has no plain-English summary yet.</p>') +
        '<p><a class="u" href="#/area/' + encodeURIComponent(open.id) + '">Read about this area and all ' + open.files.length + " of its files</a></p>";
    } else {
      detail.innerHTML = '<p class="label legend">\u25CF explained \u00A0 \u25D0 partly explained or out of date \u00A0 \u25CB not explained yet</p>';
    }
  }
  main.addEventListener("click", function (event) { mapAction(event.target); });
  main.addEventListener("keydown", function (event) {
    if (event.key !== "Enter" && event.key !== " ") return;
    if (mapAction(event.target)) event.preventDefault();
  });
  function mapAction(target) {
    var node = target && target.closest ? target.closest(".mm-node") : null;
    if (!node) return false;
    if (node.getAttribute("data-area")) {
      var id = node.getAttribute("data-area");
      openArea = openArea === id ? null : id;
      drawMap();
      var again = document.querySelector('.mm-area[data-area="' + String(id).replace(/["\\]/g, "\\$&") + '"]');
      if (again) again.focus();
    } else if (node.getAttribute("data-path")) {
      location.hash = fileHref(node.getAttribute("data-path"));
    } else if (node.getAttribute("data-more")) {
      location.hash = "#/area/" + encodeURIComponent(node.getAttribute("data-more"));
    }
    return true;
  }

  // ---- Views -------------------------------------------------------------
  function fact(label, value) { return value ? '<dt class="label">' + esc(label) + "</dt><dd>" + value + "</dd>" : ""; }
  function linkList(list) {
    if (!list || !list.length) return "";
    return list.map(function (item) {
      return FILES[item] ? '<a href="' + fileHref(item) + '">' + esc(item) + "</a>" : "<code>" + esc(item) + "</code>";
    }).join(", ");
  }

  function viewOverview() {
    var st = stats();
    var r = REPO.readiness || {};
    var html = '<p class="label head-meta"><span>' + both("Code explorer", "./explore") + "</span><span>" + st.files + " files</span><span>" +
      st.lines.toLocaleString("en") + " lines</span><span>" + st.sections + ' sections</span><span class="em">' +
      ((CHECK_STATES[r.overall] || CHECK_STATES.unknown)[1]) + "</span></p>" +
      '<h1 class="display">' + esc(TITLE) + "</h1>" +
      (REPO.summary ? '<p class="punch">' + fmt(REPO.summary) + "</p>" :
        '<p class="punch pending">No plain-English summary yet. In Claude Code, ask it to explain this repository.</p>') +
      '<dl class="pair"><div><dt class="label">Who it is for</dt><dd>' + (fmt(REPO.who_its_for) || '<span class="pending">Not written yet.</span>') +
      '</dd></div><div><dt class="label">How it runs</dt><dd>' + (fmt(REPO.how_it_runs) || '<span class="pending">Not written yet.</span>') + "</dd></div></dl>";
    var n = 0;
    html += sec(++n, "How complete these notes are", "coverage",
      '<ul class="stats"><li><span class="n">' + st.explained + "/" + st.files + '</span><span class="label">files explained</span></li>' +
      '<li><span class="n">' + st.noted + "/" + st.sections + '</span><span class="label">sections with notes</span></li>' +
      '<li><span class="n">' + st.stale + '</span><span class="label">notes older than the code</span></li>' +
      '<li><span class="n"><a class="link-quiet" href="#/readiness">' + checkBadge(r.overall) + '</a></span><span class="label">production-ready?</span></li></ul>');
    var mapExtra = SITE.map ? '<p class="hint" style="margin-top:14px">' + both("Want every function and link? ", "full graph: ") +
      '<a class="u" href="' + esc(SITE.map) + '">' + both("Open the technical map", "./map.html") + "</a></p>" : "";
    html += sec(++n, "How the parts fit together", "tree --areas",
      '<p class="hint">Pick an area to see its files, then pick a file to read its code with a plain-English note beside every section.</p>' +
      '<div class="mm-wrap" id="mm"></div><div class="mm-detail" id="mm-detail" aria-live="polite"></div>' + mapExtra);
    if (START.length) {
      html += sec(++n, "Read these first", "head -n " + START.length, '<ol class="rows-list">' + START.map(function (p, i) {
        return '<li><a class="rowlink" href="' + fileHref(p) + '"><span class="label num">' + pad(i + 1) + '</span><span class="name">' +
          esc(base(p)) + '<span class="dirp">' + esc(dir(p)) + "</span></span>" + fileBadge(FILES[p]) + '<span class="sub">' +
          fmt(FILES[p].summary || "") + "</span></a></li>"; }).join("") + "</ol>");
    }
    var skipped = REPO.skipped || [];
    if (skipped.length) {
      html += '<details class="skipped"><summary class="label">' + skipped.length + " files were left out of these notes</summary><ul>" +
        skipped.slice(0, 200).map(function (s) { return "<li><code>" + esc(s.path) + "</code>: " + esc(s.reason) + "</li>"; }).join("") + "</ul></details>";
    }
    return html;
  }

  function viewArea(id) {
    var a = AREA_BY_ID[id];
    if (!a) return notFound("That area does not exist in these notes.");
    currentArea = id;
    var html = '<p class="label head-meta"><a class="link-quiet" href="#/overview">' + both("Overview", "cd ..") + "</a><span>" + a.num +
      " / " + both("Area", "dir") + "</span><span>" + a.files.length + ' files</span></p><h2 class="display">' + esc(a.name) + "</h2>" +
      (a.summary ? '<p class="punch">' + fmt(a.summary) + "</p>" : "");
    var n = 0;
    if (a.why || a.debug_tips) html += sec(++n, "Why it exists", "why", '<dl class="facts">' + fact("Why this area exists", fmt(a.why)) +
      fact("If something here breaks", fmt(a.debug_tips)) + "</dl>");
    html += sec(++n, "Files in this area", "ls", '<ul class="rows-list">' + sortFiles(a.files).map(function (p, i) {
      var f = FILES[p];
      return '<li><a class="rowlink" href="' + fileHref(p) + '"><span class="label num">' + pad(i + 1) + '</span><span class="name">' + esc(base(p)) +
        '<span class="dirp">' + esc(dir(p)) + "</span></span>" + fileBadge(f) + '<span class="sub">' +
        (f.summary ? fmt(f.summary) : '<span class="pending">Not explained yet.</span>') + "</span></a></li>"; }).join("") + "</ul>");
    return html;
  }

  function viewFile(path, sectionId) {
    var f = FILES[path];
    if (!f) return notFound("There is no file called " + path + " in these notes.");
    currentPath = path; currentArea = f.area;
    var a = AREA_BY_ID[f.area];
    var lines = typeof f.code === "string" ? f.code.split("\n") : null;
    var html = '<p class="label head-meta"><a class="link-quiet" href="#/overview">' + both("Overview", "cd ~") + "</a>" +
      (a ? '<a class="link-quiet" href="#/area/' + encodeURIComponent(a.id) + '">' + a.num + " / " + esc(a.name) + "</a>" : "") +
      "<span>" + esc(f.language || "") + "</span><span>" + (f.lines || 0) + " lines</span>" + fileBadge(f) + "</p>" +
      '<h2 class="display">' + esc(base(path)) + '</h2><p class="path">' + esc(path) + "</p>";
    if (!f.fresh) {
      html += '<p class="banner warn">The code in this file changed after these notes were written. Treat the notes as a guide, and ask Claude to re-explain this file.</p>';
    } else if (f.status !== "explained") {
      html += '<p class="banner">Some parts of this file are not explained yet.</p>';
    }
    var summary = [f.summary, f.purpose].filter(Boolean).join(" ");
    var reasons = (f.readiness && f.readiness.reasons) || [];
    var n = 0;
    html += sec(++n, "In plain English", "man " + base(path), summary || f.why || f.how ? '<dl class="facts">' +
      fact("What it does", fmt(summary)) + fact("Why it exists", fmt(f.why)) + fact("How it works", fmt(f.how)) +
      fact("Takes in", fmt(f.inputs)) + fact("Gives back", fmt(f.outputs)) + fact("Relies on", linkList(f.depends_on)) +
      fact("Used by", linkList(f.used_by)) + fact("What can go wrong", fmt(f.risks)) + fact("If it breaks", fmt(f.debug)) +
      fact("Ready for real use?", fileBadge(f) + (reasons.length ? '<ul class="reasons">' + reasons.map(function (r) {
        return "<li>" + fmt(r) + "</li>"; }).join("") + "</ul>" : "")) + "</dl>" :
      '<p class="pending">This file has no plain-English summary yet.</p>');
    if ((f.terms || []).length) {
      html += sec(++n, "Words used here", "define", '<dl class="terms">' + f.terms.map(function (t) {
        return "<dt>" + esc(t.term) + "</dt><dd>" + fmt(t.meaning) + "</dd>"; }).join("") + "</dl>");
    }
    var rows = (f.sections || []).map(function (s) {
      var code = "";
      if (lines) {
        for (var k = s.start; k <= s.end && k <= lines.length; k++) {
          code += '<span class="ln"><span class="no">' + k + "</span>" + (esc(lines[k - 1]) || " ") + "</span>";
        }
      }
      var kind = KIND_LABELS[s.kind] || s.kind || "";
      return '<div class="row' + (s.id === sectionId ? " sel" : "") + '" id="sec-' + esc(s.id) + '">' +
        (lines ? '<div class="code" role="region" aria-label="Lines ' + s.start + " to " + s.end + '"><pre><code>' + code + "</code></pre></div>" :
          '<div class="code no-code">' + both(SITE.private ? "This repository is private, so its code is not published here. The owner can open these lines on GitHub from the link beside the note." :
            "The code is not published for this repository; the notes describe it.", "// source not published") + "</div>") +
        '<aside class="note"><div class="note-inner"><p class="label"><a href="' + fileHref(path, s.id) + '">Lines ' + s.start + "\u2013" + s.end +
        "</a>" + (kind ? "<span>" + esc(kind) + "</span>" : "") + '<span class="nerd-only">' + esc(s.name || "") + "</span>" + lineLink(path, s) +
        "</p><h4>" + esc(s.title || s.name) + "</h4>" +
        (s.what ? "<p>" + fmt(s.what) + "</p>" : '<p class="pending">Not explained yet.</p>') +
        (s.why ? '<p><span class="k">Why</span>' + fmt(s.why) + "</p>" : "") +
        (s.watch_out ? '<p><span class="k">Watch out</span>' + fmt(s.watch_out) + "</p>" : "") + "</div></aside></div>";
    }).join("");
    html += sec(++n, "Read it section by section", "cat -n " + base(path),
      '<p class="hint">Each row pairs a piece of the code with a note. Every line of the file belongs to exactly one row.</p><div class="rows">' + rows + "</div>");
    return html;
  }

  function viewReadiness() {
    var r = REPO.readiness || {};
    var html = '<p class="label head-meta"><span>' + both("Readiness review", "cat readiness") + "</span>" + (r.checked_at ? "<span>Checked " +
      esc(String(r.checked_at).slice(0, 10)) + "</span>" : "") + '</p><h2 class="display">Is it production-ready?</h2><p class="punch">' +
      checkBadge(r.overall) + " " + (r.summary ? fmt(r.summary) : '<span class="pending">No readiness review yet. In Claude Code, ask for a production check.</span>') + "</p>";
    var n = 0;
    var checks = r.checks || [];
    if (checks.length) {
      html += sec(++n, "Twelve questions", "checks", '<div class="table-wrap"><table class="checks"><thead><tr><th scope="col">Question</th>' +
        '<th scope="col">Answer</th><th scope="col">Evidence</th><th scope="col">Next step</th></tr></thead><tbody>' + checks.map(function (c) {
          return "<tr><td>" + esc(c.question) + "</td><td>" + checkBadge(c.status) + "</td><td>" + (fmt(c.evidence) || "") + "</td><td>" +
            (fmt(c.next_step) || "") + "</td></tr>"; }).join("") + "</tbody></table></div>");
    }
    var groups = { "not-ready": [], "needs-work": [] };
    PATHS.forEach(function (p) { var st = (FILES[p].readiness || {}).status; if (groups[st]) groups[st].push(p); });
    [["not-ready", "Files that are not ready", "grep not-ready"], ["needs-work", "Files that need work", "grep needs-work"]].forEach(function (g) {
      var list = groups[g[0]];
      if (!list.length) return;
      html += sec(++n, g[1] + " (" + list.length + ")", g[2], '<ul class="rows-list">' + list.map(function (p, i) {
        var reasons = (FILES[p].readiness.reasons || []).map(fmt).join(" ");
        return '<li><a class="rowlink" href="' + fileHref(p) + '"><span class="label num">' + pad(i + 1) + '</span><span class="name">' + esc(base(p)) +
          '<span class="dirp">' + esc(dir(p)) + "</span></span>" + fileBadge(FILES[p]) + '<span class="sub">' + reasons + "</span></a></li>"; }).join("") + "</ul>");
    });
    return html;
  }

  function viewDecisions() {
    var list = REPO.decisions || [];
    var html = '<p class="label head-meta"><span>' + both("Decision records", "git log --decisions") + "</span><span>" + list.length +
      ' recorded</span></p><h2 class="display">Why it is built this way</h2><p class="punch">Each decision records what was chosen, why, what else was considered, and when to revisit it.</p>';
    if (!list.length) return html + '<p class="pending" style="margin-top:30px">No decisions recorded yet. The plan-first skill adds one whenever there is a real choice to make.</p>';
    return html + sec(1, "Decisions", "decisions", list.map(function (d) {
      return '<article class="card"><h3>' + esc((d.id ? d.id + ". " : "") + (d.title || "Decision")) + '</h3><dl class="facts">' +
        fact("What was decided", fmt(d.decision)) + fact("Why", fmt(d.why)) + fact("Alternatives considered", fmt(d.alternatives)) +
        fact("Trade-offs", fmt(d.tradeoffs)) + fact("Revisit when", fmt(d.revisit_when)) + fact("Files", linkList(d.files)) + "</dl></article>"; }).join(""));
  }

  function viewDebug() {
    var html = '<p class="label head-meta"><span>' + both("Debugging guide", "man debug") + '</span></p><h2 class="display">When something breaks</h2>' +
      '<p class="punch">A calm method that works for any bug, then the problems this app is most likely to have and where to look.</p>';
    html += sec(1, "The method", "procedure", '<ol class="method">' +
      "<li><strong>Make it happen again on purpose.</strong> Write down the exact steps, what you expected and what happened instead.</li>" +
      "<li><strong>Read the error in plain words.</strong> Copy the full message. Ask Claude what it means before asking it to fix anything.</li>" +
      "<li><strong>Find the area.</strong> Use the map on the overview to pick the area, then the file, then the section.</li>" +
      "<li><strong>Prove it with a small test.</strong> Ask Claude for a test that fails because of the bug. A fix without a failing test first is a guess.</li>" +
      "<li><strong>Fix the cause, not the symptom.</strong> Hiding an error message is not a fix. If two attempts fail, stop and rethink.</li>" +
      "<li><strong>Keep it fixed.</strong> Keep the test, refresh these notes, and record the problem below if it could happen again.</li></ol>");
    var list = REPO.debug_playbook || [];
    html += sec(2, "Known problems", "known issues", list.length ? list.map(function (item) {
      var area = AREA_BY_ID[item.likely_area];
      return '<article class="card"><h3>' + esc(item.symptom || "Problem") + '</h3><dl class="facts">' +
        fact("Likely area", area ? '<a href="#/area/' + encodeURIComponent(area.id) + '">' + area.num + " / " + esc(area.name) + "</a>" : esc(item.likely_area || "")) +
        fact("Where to look", linkList(item.where_to_look)) +
        fact("What to try", (item.steps || []).length ? '<ol class="method">' + item.steps.map(function (s) { return "<li>" + fmt(s) + "</li>"; }).join("") + "</ol>" : "") +
        "</dl></article>"; }).join("") : '<p class="pending">No known problems recorded yet.</p>');
    return html;
  }

  function viewGlossary() {
    var terms = {};
    (REPO.glossary || []).forEach(function (t) { if (t && t.term) terms[t.term.toLowerCase()] = { term: t.term, meaning: t.meaning, files: [] }; });
    PATHS.forEach(function (p) {
      (FILES[p].terms || []).forEach(function (t) {
        if (!t || !t.term) return;
        var key = t.term.toLowerCase();
        if (!terms[key]) terms[key] = { term: t.term, meaning: t.meaning, files: [] };
        if (terms[key].files.length < 5) terms[key].files.push(p);
      });
    });
    var keys = Object.keys(terms).sort();
    var html = '<p class="label head-meta"><span>' + both("Glossary", "grep glossary") + "</span><span>" + keys.length +
      ' terms</span></p><h2 class="display">Glossary</h2><p class="punch">Technical words used in this codebase, in plain English.</p>';
    if (!keys.length) return html + '<p class="pending" style="margin-top:30px">No terms recorded yet.</p>';
    return html + sec(1, "Terms", "terms", '<label><span class="sr-only">Filter the glossary</span><input class="filter" id="gfilter" type="search" placeholder="Filter terms"></label>' +
      '<dl class="glossary" id="glist">' + keys.map(function (k) {
        var t = terms[k];
        return '<dt data-k="' + esc(k) + '">' + esc(t.term) + '</dt><dd data-k="' + esc(k) + '">' + fmt(t.meaning) +
          (t.files.length ? '<div class="used">Used in ' + t.files.map(function (p) { return '<a href="' + fileHref(p) + '">' + esc(base(p)) + "</a>"; }).join(", ") + "</div>" : "") +
          "</dd>"; }).join("") + "</dl>");
  }

  function notFound(message) {
    return '<p class="label head-meta"><span>404</span></p><h2 class="display">Not found</h2><p class="punch">' + esc(message) +
      '</p><p style="margin-top:24px"><a class="u" href="#/overview">Back to the overview</a></p>';
  }

  // ---- Router ------------------------------------------------------------
  function render() {
    var raw = (location.hash || "#/overview").slice(2);
    var parts = raw.split("/");
    var view = parts[0] || "overview";
    var arg = parts[1] ? decodeURIComponent(parts[1]) : "";
    var extra = parts[2] ? decodeURIComponent(parts[2]) : "";
    currentPath = null;
    var html;
    if (view === "file") html = viewFile(arg, extra);
    else if (view === "area") html = viewArea(arg);
    else if (view === "readiness") html = viewReadiness();
    else if (view === "decisions") html = viewDecisions();
    else if (view === "debug") html = viewDebug();
    else if (view === "glossary") html = viewGlossary();
    else { view = "overview"; html = viewOverview(); }
    main.innerHTML = html;
    document.querySelectorAll(".views a").forEach(function (link) {
      if (link.getAttribute("data-view") === view) link.setAttribute("aria-current", "page"); else link.removeAttribute("aria-current");
    });
    renderTree();
    if (view === "overview") drawMap();
    if (view === "glossary") {
      var gf = document.getElementById("gfilter");
      if (gf) gf.addEventListener("input", function () {
        var q = gf.value.trim().toLowerCase();
        var text = {};
        document.querySelectorAll("#glist [data-k]").forEach(function (el) { var k = el.getAttribute("data-k"); text[k] = (text[k] || "") + " " + el.textContent.toLowerCase(); });
        document.querySelectorAll("#glist [data-k]").forEach(function (el) { var k = el.getAttribute("data-k"); el.style.display = !q || text[k].indexOf(q) >= 0 ? "" : "none"; });
      });
    }
    var target = extra ? document.getElementById("sec-" + extra) : null;
    if (target && target.scrollIntoView) target.scrollIntoView({ block: "start" });
    else if (window.scrollTo) { try { window.scrollTo(0, 0); } catch (error) { /* not available */ } }
    main.focus({ preventScroll: true });
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
