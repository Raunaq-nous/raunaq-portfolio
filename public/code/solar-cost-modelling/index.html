e tracker and fixed cost ranges stay in the input, so switching the dropdown does not erase the other option's numbers."},{"start":460,"end":463,"kind":"function","name":"EBOSInputsForm","id":"s26","hash":"e6e59715aacaba32","title":"Electrical BOS section form","what":"Shows the electrical BOS fields in the shared grid.","why":"Same thin-wrapper pattern as the other sections.","watch_out":""},{"start":464,"end":467,"kind":"function","name":"LaborInputsForm","id":"s27","hash":"3a27d233f6a7af00","title":"Labor section form","what":"Shows the labor fields in the shared grid.","why":"Same thin-wrapper pattern as the other sections.","watch_out":""},{"start":468,"end":471,"kind":"function","name":"OtherInputsForm","id":"s28","hash":"6541fc17f6ec1cc0","title":"Other costs section form","what":"Shows the other cost fields in the shared grid.","why":"Same thin-wrapper pattern as the other sections.","watch_out":""},{"start":472,"end":475,"kind":"function","name":"OMInputsForm","id":"s29","hash":"bd82c6f5d17e6fa2","title":"O\u0026M section form","what":"Shows the operations and maintenance fields in the shared grid.","why":"Same thin-wrapper pattern as the other sections.","watch_out":""},{"start":476,"end":480,"kind":"type","name":"SectionFormProps","id":"s30","hash":"f948831b2184b4c7","title":"Section form settings shape","what":"Describes what each section form needs: its values and the change action.","why":"One shared shape lets the same rules work for all nine groups.","watch_out":"The values are loosely typed, so the editor will not catch a value of the wrong type."},{"start":481,"end":491,"kind":"type","name":"InputFieldProps","id":"s31","hash":"13f6cf7877bcb40a","title":"Number box settings shape","what":"Describes one number box: its label, input type, value, change action, and optional limits and step size.","why":"Keeps the number box's inputs in one clear description.","watch_out":"The minimum, maximum and step values only guide the browser's arrows and checks; they do not stop a typed value from being saved."},{"start":492,"end":523,"kind":"function","name":"InputField","id":"s32","hash":"7b117be73f6b74b0","title":"Number box drawing","what":"Draws one labelled number box. A complete number is passed on as a number. Partial entries such as an empty box, a lone minus sign, or a lone decimal point are passed on as text so the user can keep typing.","why":"Likely reason: letting the user type a minus sign or decimal point without the box clearing.","watch_out":"Those partial text values can reach the store and the backend, so the run must handle or block them."},{"start":524,"end":530,"kind":"type","name":"SelectFieldProps","id":"s33","hash":"9da3531f7aa02e14","title":"Dropdown settings shape","what":"Describes one dropdown: its label, current choice, change action, and list of choices.","why":"Keeps dropdowns built the same way.","watch_out":""},{"start":531,"end":544,"kind":"function","name":"SelectField","id":"s34","hash":"0c54e0d0461d52bc","title":"Dropdown drawing","what":"Draws a labelled dropdown that passes the chosen value on as text.","why":"Likely reason: a single dropdown style keeps every choice looking alike.","watch_out":"Dropdown values arrive as text, so any conversion to yes or no flags happens in the calling section, not here."}],"explained_at":"2026-11-11T23:23:05+00:00","explained_by":"haiku","summary":"The input form: nine collapsible sections where the user enters the solar system's sizes, costs, rates and financial assumptions, plus buttons to reset, export and run the analysis.","purpose":"Lets the user change every assumption the cost model uses, then start a run.","why":"Likely reason: grouping inputs into sections keeps a long list manageable, and the field lists keep each label and limit in one place.","how":"Shows nine collapsible sections. Each section is built from a list of field descriptions (label, field name, minimum, maximum, step size). Every change is sent to the store's updateInput with the group name and field name. Run Analysis asks for lecture and research content, then reports success or failure with a pop-up. Reset reloads the defaults. Export stays greyed out until outputs exist.","inputs":"What the user types or selects in the form. Store values: inputs, outputs, calculating, and exporting. Field names that follow the backend's input schema.","outputs":"Updated inputs in the store, a run request, a downloaded Excel file, and pop-up messages.","risks":"Partial numbers such as an empty box, a lone minus sign, or a lone decimal point are passed on as text. Reset replaces all inputs without asking for confirmation.","debug":"If a run fails with the check your inputs message, look for blank or partial number boxes. If a value does not save, check that its field name matches the backend schema file named in the code comment. If Export stays greyed out, no run has produced outputs yet.","summary_hash":"sha256:8bc1673667650fb7718ef03d2935edc0a41d4dcd34e7d93623766701d77fb9f1","fresh":true},"frontend/src/components/panels/LecturePanel.tsx":{"schema_version":1,"path":"frontend/src/components/panels/LecturePanel.tsx","language":"TypeScript (React)","lines":194,"hash":"sha256:c82a26ed9eec2a509fa9d29220bef813d33f0427c4f518e3d58d1814b7c8cd4d","area":"frontend-src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["There is no guard for a step number outside the list, which can crash the page.","Whether the store resets the step number for a new lecture is not visible here.","No tests are visible."]},"terms":[{"term":"Lecture sequence","meaning":"The ordered list of lesson steps that the backend creates for a run."},{"term":"Step","meaning":"One lesson page, with a title, explanation, and optional extras."},{"term":"Progress bar","meaning":"A strip that fills as the user moves through the lesson."}],"depends_on":["react","framer-motion","lucide-react","frontend/src/store/useModelStore","frontend/src/components/ui/Button"],"used_by":["frontend/src/components/layout/Dashboard.tsx"],"sections":[{"start":1,"end":6,"kind":"setup","name":"File setup","id":"s1","hash":"c1ef170436e9cee6","title":"Imports for the lecture screen","what":"Brings in the animation library, the store, the Button component, and the arrow and book icons.","why":"Lists everything the lecture screen needs.","watch_out":""},{"start":7,"end":53,"kind":"function","name":"LecturePanel (part 1)","id":"s2","hash":"d5ae6517e1488528","title":"Current step and navigation limits","what":"Reads the lecture and the current step from the store, shows nothing if there is no lecture, works out the total number of steps, and defines the Next and Previous actions, which stop at the first and last step.","why":"Likely reason: the limits stop the user moving past the start or end of the lesson.","watch_out":"The current step is looked up directly in the list, so a number past the end gives no step and breaks the card below."},{"start":54,"end":97,"kind":"function","name":"LecturePanel (part 2)","id":"s3","hash":"7e11726eca11fef8","title":"Header, progress, and formula toggle","what":"Draws the heading, the Step X of Y label, a progress bar that fills as the user advances, the step card with its number badge and title, the explanation, and the formula show or hide button.","why":"Likely reason: showing position and progress tells the user how far through the lesson they are.","watch_out":"The formula toggle is one setting shared by every step, so once hidden it stays hidden as the user moves on."},{"start":98,"end":154,"kind":"function","name":"LecturePanel (part 3)","id":"s4","hash":"56b88afbea1f5115","title":"Formula, example, breakdown, and context","what":"Shows the formula box when open, with a fade, then the worked example, the cost breakdown list with name, description and percentage, and the real-world context note. Each part appears only if the step includes it.","why":"Likely reason: steps differ in content, so each extra part is optional.","watch_out":"Breakdown rows are identified by their name, so two rows with the same name would confuse the list."},{"start":155,"end":194,"kind":"function","name":"LecturePanel (part 4)","id":"s5","hash":"be98a1095ec3e67e","title":"Previous, Next, and step dots","what":"Draws the Previous and Next buttons, greyed out at the ends, and one dot per step. The current step's dot is a wider green bar, and clicking a dot jumps straight to that step.","why":"Likely reason: the dots give a quick way to see the lesson's length and jump around.","watch_out":"Clicking a dot skips the lesson's intended order, so a user may miss earlier steps."}],"explained_at":"2026-11-11T23:23:05+00:00","explained_by":"haiku","summary":"The educational lecture viewer: shows one step at a time of a solar cost lesson, with an explanation, an optional formula, a worked example, a cost breakdown, and real-world context.","purpose":"Lets the user learn how the cost numbers were built, one step at a time.","why":"Likely reason: a step-by-step lesson helps a non-expert follow the logic from inputs to totals.","how":"Reads the lecture steps and the current step number from the store. Shows a progress bar and a card for the current step. The card shows the explanation, then a formula box that can be hidden, a worked example, a cost breakdown table, and context, each only when the step includes it. Previous, Next, and the step dots move between steps.","inputs":"Store values: lectureSequence and currentLectureStep. The user's clicks on navigation and the formula toggle.","outputs":"The displayed lecture step, and changes to the current step number in the store.","risks":"The formula toggle is local to this screen, so it may reset when the panel is shown again. A step number past the end of the list breaks the card.","debug":"If the panel crashes, check that the current step number is within the number of steps. A stale number from a previous lecture would point past the end. If a formula or example looks wrong, check the stored step text itself.","summary_hash":"sha256:c82a26ed9eec2a509fa9d29220bef813d33f0427c4f518e3d58d1814b7c8cd4d","fresh":true},"frontend/src/components/panels/ResultsPanel.tsx":{"schema_version":1,"path":"frontend/src/components/panels/ResultsPanel.tsx","language":"TypeScript (React)","lines":274,"hash":"sha256:46a585e898356b6a0287f25c78e198a8504608381a97fa2550e61c79123ab6c1","area":"frontend-src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Totals are worked out in two different ways on the same screen.","A missing median is shown as zero in totals but as a midpoint in rows.","No tests are visible."]},"terms":[{"term":"MSP and MMP","meaning":"Two cost measures shown here in dollars per kWdc. The code does not spell out what each stands for, so check the model documentation."},{"term":"Median","meaning":"The middle value of a range, used here as the single headline figure."},{"term":"Range","meaning":"A minimum and a maximum for one cost."},{"term":"kWdc and kWac","meaning":"Kilowatts of panel (DC) capacity and kilowatts of grid-side (AC) capacity."},{"term":"Chart library (recharts)","meaning":"A library that draws bar and pie charts from data."}],"depends_on":["framer-motion","recharts","lucide-react","frontend/src/store/useModelStore","frontend/src/types"],"used_by":["frontend/src/components/layout/Dashboard.tsx"],"sections":[{"start":1,"end":18,"kind":"setup","name":"File setup","id":"s1","hash":"53705da45aebb6ad","title":"Imports for results screen","what":"Brings in the animation library, the chart pieces, icons, the store, and the data types for cost ranges.","why":"Charts need several separate pieces, so each one is named here.","watch_out":""},{"start":19,"end":21,"kind":"function","name":"fmt","id":"s2","hash":"c1f15d28c891ced1","title":"Dollar formatting helper","what":"Turns a number into a dollar amount with two decimal places and thousands separators.","why":"Likely reason: keeps every money figure on the screen in one consistent style.","watch_out":"The dollar sign is fixed, while the thousands separators follow the browser's language setting."},{"start":22,"end":81,"kind":"function","name":"ResultsPanel (part 1)","id":"s3","hash":"6bd320b865e17d02","title":"Cost rows and summary figures","what":"Builds the list of cost rows and the chart data, using the median of each range. Works out the MMP total by adding component medians, computes AC size as system size divided by the DC to AC ratio, and draws the four summary cards.","why":"Likely reason: building the rows once lets the charts, tables and totals reuse the same numbers.","watch_out":"The MMP total card is worked out here from the rows, not taken from the backend total, so it may not match the table's total row."},{"start":82,"end":133,"kind":"function","name":"ResultsPanel (part 2)","id":"s4","hash":"14766faee7984735","title":"Bar and pie charts","what":"Draws a bar chart comparing MSP and MMP for each component, and a pie chart of the MSP share for each component. Pie slices get a label only when they are above 3 percent.","why":"Likely reason: hiding labels on tiny slices keeps the pie readable.","watch_out":"Slices under 3 percent have no label, so the reader must use the tooltip or the table to find small items."},{"start":134,"end":174,"kind":"function","name":"ResultsPanel (part 3)","id":"s5","hash":"82e3a90a665027ef","title":"Detailed tables and run details","what":"Draws the detailed PV only cost table, adds a separate PV plus storage table when storage is on, and shows a run details block with the calculation time, session ID, and whether storage was included.","why":"Gives the detail behind the summary and shows which run is on screen.","watch_out":"The time and session ID come straight from the backend, and a missing timestamp shows as an invalid date."},{"start":175,"end":223,"kind":"function","name":"CostTable","id":"s6","hash":"1101bc6ea1e57238","title":"Cost table drawing","what":"Draws a table with one row per component showing the MSP minimum, maximum, and median and the MMP minimum, maximum, and median. A total row shows the backend total and the formula text.","why":"Likely reason: the total row uses the backend's own figure, so the user sees the calculation's stated total.","watch_out":"A missing median in the total row shows as $0.00 rather than an error."},{"start":224,"end":231,"kind":"type","name":"MetricCardProps","id":"s7","hash":"86236c03e7cf3d3b","title":"Summary card settings shape","what":"Describes one summary card: its title, value text, subtitle, icon, and trend setting.","why":"Keeps the four summary cards built the same way.","watch_out":""},{"start":232,"end":254,"kind":"function","name":"MetricCard","id":"s8","hash":"d3a66f29d7cca4a9","title":"Summary card drawing","what":"Draws one summary card with a title, large value, small note, and icon, and slightly enlarges it on hover.","why":"Likely reason: one card style makes the headline figures easy to scan.","watch_out":"The trend setting only changes the icon colour; it does not show a rise or a fall, despite its name."},{"start":255,"end":260,"kind":"type","name":"CostRowProps","id":"s9","hash":"4d77918a903cc382","title":"Cost row settings shape","what":"Describes one table row: the component name and its MSP and MMP ranges.","why":"Keeps every table row built from the same information.","watch_out":""},{"start":261,"end":274,"kind":"function","name":"CostRow","id":"s10","hash":"94be4ecaf4d4856f","title":"Cost row drawing","what":"Draws one component row with the MSP and MMP minimum, maximum, and median, with the medians highlighted in red.","why":"Likely reason: the medians are the headline figures, so they are emphasised.","watch_out":"If the backend sends no median, this row calculates a midpoint, which can hide that the value was missing."}],"explained_at":"2026-11-11T23:23:05+00:00","explained_by":"haiku","summary":"The results screen: four summary cards, a bar chart and a pie chart, a detailed cost table for the PV only case, an optional table for storage, and run details.","purpose":"Shows what the model calculated in a form the user can compare and drill into.","why":"Likely reason: summary cards give the headline figures first, while tables and charts let the user check the detail.","how":"Reads outputs and inputs from the store and builds a list of cost rows: modules, inverters, structural BOS, electrical BOS, field labor, office labor, other, and O\u0026M. Storage is added when it is on. For each row it takes the median of each range, or the midpoint of the minimum and maximum if no median exists. It then draws the summary cards, the bar chart, the pie chart, the cost tables, and the run details.","inputs":"outputs and inputs from the store, which come from the most recent calculation.","outputs":"Cards, charts, and tables on screen. No data is sent anywhere from this file.","risks":"The MMP total card adds the component medians itself, so it can differ from the total in the backend table. Missing medians become zero in the table totals.","debug":"If totals look wrong, compare the table's total row with the MMP card. If they differ, the card's own sum of medians is the likely source. If charts are empty, check that outputs has the expected component entries. If the storage table is missing, check that both storage outputs are present.","summary_hash":"sha256:46a585e898356b6a0287f25c78e198a8504608381a97fa2550e61c79123ab6c1","fresh":true},"frontend/src/components/panels/SchematicView.tsx":{"schema_version":1,"path":"frontend/src/components/panels/SchematicView.tsx","language":"TypeScript (React)","lines":300,"hash":"sha256:9027071f73bc2cde18b315e649928df7ab8d6a10a96e23162cde7995faf9a8a8","area":"frontend-src","status":"explained","summary_stale":false,"readiness":{"status":"unknown","reasons":["Only four of seven sections were available to review.","The array area appears to assume watts while the input is labelled kWdc, which needs verifying.","Some drawing hooks run after an early return; this is safe only because the parent screen checks the data first."]},"terms":[{"term":"Node","meaning":"A box in the diagram."},{"term":"Edge","meaning":"An arrow connecting two boxes."},{"term":"DC and AC","meaning":"Direct current from the panels and alternating current sent to the grid."},{"term":"BOS","meaning":"Balance of system, the non-panel parts of an installation."},{"term":"Median","meaning":"The middle value of a cost range, used as the box's headline cost."}],"depends_on":["react","framer-motion","react-flow-renderer (diagram library)","lucide-react","frontend/src/store/useModelStore"],"used_by":["frontend/src/components/layout/Dashboard.tsx"],"sections":[{"start":1,"end":18,"kind":"setup","name":"File setup","id":"s1","hash":"88ceb95ef7e71e15","title":"Imports for the diagram","what":"Brings in the diagram library and its style sheet, the animation library, icons, and the store.","why":"Likely reason: the diagram library supplies the boxes, arrows and controls that are used here.","watch_out":"Without the diagram library's style sheet, the boxes and arrows will not be drawn with their correct look."},{"start":19,"end":78,"kind":"function","name":"SchematicView (part 1)","id":"s2","hash":"850a3e86fe7aacc2","title":"Module, inverter, and grid boxes","what":"Works out each box's cost and basic dimensions, then defines the modules, inverters, and electrical BOS and grid boxes, each with an icon and detail values. The module box also shows an estimated array area.","why":"Likely reason: each box shows the figure the user would compare with the results tab.","watch_out":"The array area divides by 1000, which suggests the code expects watts, yet the system size is labelled kWdc, so the area may be off by a factor of 1000."},{"start":79,"end":115,"kind":"function","name":"SchematicView (part 2)","id":"s3","hash":"c633c1cc2eef67a8","title":"Storage and total cost boxes","what":"Adds the energy storage box when storage is on, showing hours, capacity in kWh, and efficiency. Then adds a total cost box, placed lower when storage is included.","why":"Storage is optional, so its box appears only when the run includes it.","watch_out":"The total box's detail is named msp but holds a formatted median total, so the label may mislead."},{"start":116,"end":172,"kind":"function","name":"SchematicView (part 3)","id":"s4","hash":"de316e8fb472389a","title":"Arrows and selection state","what":"Defines the arrows: modules to inverters (DC power), inverters to grid (AC power), and an extra arrow to storage when storage is on. Then sets up the box and arrow state and a click handler that records the selected box.","why":"Likely reason: the arrows show the direction the power flows.","watch_out":"The early return above these hooks is safe only because the Dashboard shows this screen only when outputs exist; changing that check could crash the page."},{"start":173,"end":224,"kind":"function","name":"SchematicView (part 4)","id":"s5","hash":"a8a9806e79f2e8ac","title":"Flow diagram and component details","what":"Draws the flow diagram of cost parts on the left and a 'Component Details' card on the right. Clicking a part fills the card with its name, icon, and cost per kWdc, except that the total part shows no per-unit cost line in the header. A zoom control panel and a small overview map sit in the diagram corner.","why":"Likely reason: the picture and the numbers sit side by side in one grid so both are visible on wide screens. Reason not stated in the code for the fixed 600 pixel diagram height.","watch_out":"The card header assumes every non-total part has a numeric cost, so a part without one would break the page."},{"start":225,"end":264,"kind":"function","name":"SchematicView (part 5)","id":"s6","hash":"9dc76670bec735aa","title":"Listing the selected part's details","what":"Lists every detail of the selected part as a label and value pair. Camel-case field names are turned into spaced words, and numbers are shown with up to three decimal places. For the total, it adds a bold line with the median cost per kWdc.","why":"Likely reason: the rows are built from whatever fields the data contains, so new fields appear without changing this code.","watch_out":"The labels come straight from the data's field names, so renaming a field changes what the user reads."},{"start":265,"end":300,"kind":"function","name":"CustomNode, nodeTypes","id":"s7","hash":"06f61ca80f64772b","title":"Box look and diagram box type","what":"Defines how each box in the diagram looks: a green-bordered card with an icon, name, and cost per kWdc, with a solid green fill for the total. Each box has connection points on its left and right for arrows, and it grows slightly on hover. The mapping that tells the diagram to use this look is set once at module level.","why":"The code comment says the mapping is defined at module level so the diagram does not redraw every box on each refresh.","watch_out":"Moving the mapping inside the component, or giving a non-total box no numeric cost, would slow or break the diagram."}],"explained_at":"2026-11-11T23:32:03+00:00","explained_by":"haiku","summary":"An interactive diagram of the solar system showing the modules, inverters, electrical BOS and grid, and optionally storage and a total cost box, each showing its cost.","purpose":"Shows how the parts connect and what each one costs, so the user can see the whole system at once.","why":"Likely reason: a diagram makes the flow of power from panels to grid easier to follow than tables.","how":"Reads outputs and inputs from the store and works out a cost for each box. It builds boxes for modules, inverters, electrical BOS and grid, adds storage and total boxes when relevant, and draws arrows between them. Clicking a box records it as selected so its details can be shown.","inputs":"outputs and inputs from the store, plus clicks on the boxes.","outputs":"A diagram on screen and the details of the selected box.","risks":"Only four of seven sections were available to review. Box positions and costs are captured when the diagram first draws, so changes made while it is open may not appear.","debug":"If box costs look wrong, compare them with the results tab. If arrows are missing, check whether storage is on. If the array area looks far off, check the unit assumption in the module details.","summary_hash":"sha256:9027071f73bc2cde18b315e649928df7ab8d6a10a96e23162cde7995faf9a8a8","fresh":true},"frontend/src/components/panels/WebResearchPanel.tsx":{"schema_version":1,"path":"frontend/src/components/panels/WebResearchPanel.tsx","language":"TypeScript (React)","lines":218,"hash":"sha256:41acadd7067be91c53db001c939ae54fbc144aca5c8d1e84a5c063f9898aba2c","area":"frontend-src","status":"explained","summary_stale":false,"readiness":{"status":"unknown","reasons":["Only four of eight sections were available to review.","The row builder does not guard against empty entries.","No tests are visible."]},"terms":[{"term":"Validation","meaning":"A check that a value is reasonable compared with a reference."},{"term":"Confidence","meaning":"A number showing how sure the research agent is about a finding. It is optional."},{"term":"Market benchmark","meaning":"A typical range taken from market data."},{"term":"Web research agent","meaning":"The part of the backend that searches for current market information."}],"depends_on":["react","framer-motion","lucide-react","frontend/src/store/useModelStore","frontend/src/types"],"used_by":["frontend/src/components/layout/Dashboard.tsx"],"sections":[{"start":1,"end":6,"kind":"setup","name":"File setup","id":"s1","hash":"0710e313d00ba63c","title":"Imports for research screen","what":"Brings in the animation library, the store, icons for warnings, links and trends, and the research data types.","why":"Lists what the research screen needs.","watch_out":""},{"start":7,"end":17,"kind":"value","name":"COMPONENT_LABELS","id":"s2","hash":"f42e30b244e5016a","title":"Friendly component names","what":"Maps internal component codes such as modules and ess to readable names such as Modules and Energy Storage.","why":"Likely reason: the research data uses short codes, and users should see plain names.","watch_out":"A component code missing from this list has no friendly name here."},{"start":18,"end":25,"kind":"type","name":"CheckRow","id":"s3","hash":"1116359162140049","title":"Validation row shape","what":"Describes one validation line: the field it checks, its status, an optional confidence number, and a detail sentence.","why":"Gives every check the same shape so they can be shown in one table.","watch_out":"Confidence is optional, so anything that displays it must handle it being missing."},{"start":26,"end":39,"kind":"function","name":"toRows","id":"s4","hash":"819819d5640ff51a","title":"Turning validation data into rows","what":"Turns the validation data into a list of rows. For each field it takes the user's value, or the calculated value if there is none, compares it with the market range or benchmark, and writes a sentence. If either side is missing, the sentence is left blank.","why":"Likely reason: a plain sentence lets non-experts read the comparison without interpreting the numbers.","watch_out":"An empty entry in the validation data would fail when read, because the builder reads its fields without checking first."},{"start":40,"end":80,"kind":"function","name":"WebResearchPanel (part 1)","id":"s5","hash":"11e4972927a22c91","title":"Choosing which research to show","what":"Shows the web research panel with a header and a row of buttons, one per component that has research. The first component is chosen by default, and clicking a button switches to that component. If there is no research at all, the panel shows nothing.","why":"Likely reason: the panel hides itself when there is nothing to show, so an empty page section does not appear.","watch_out":"Because the panel returns nothing when the research list is empty, a failed research step makes the whole section disappear without a message."},{"start":81,"end":123,"kind":"function","name":"WebResearchPanel (part 2)","id":"s6","hash":"041b90940fc86deb","title":"Summary headline for a component","what":"Shows the headline for the selected component: a green check if every range check passes, or an orange warning if any fail. A sentence gives the count of checks outside market range, along with a confidence percentage and the number of sources.","why":"Likely reason: the summary lets the user judge a component at a glance before reading the details.","watch_out":"Anything whose status is not exactly 'valid' counts as a problem, so a new status value would be flagged as a failure."},{"start":124,"end":179,"kind":"function","name":"WebResearchPanel (part 3)","id":"s7","hash":"76f7d1fcf66ecc74","title":"Range checks, suggestions, and sources list","what":"Lists each range check with its field name, detail text, and a status tag that is green for valid and red for anything else. Below that it shows the evidence source cards with a count, and a list of suggestions, each with its type and impact.","why":"Likely reason: the full list lets the user see each check and where the evidence comes from, not just a pass or fail.","watch_out":"Source cards use the link address as their unique key, so two sources with the same link would confuse the list."},{"start":180,"end":218,"kind":"function","name":"EvidenceCard","id":"s8","hash":"74b745ee61bb2e47","title":"Expandable evidence source card","what":"Shows one expandable card per source, with a numbered badge, the source title, and a relevance percentage. The first source opens by default. Opening a card shows the excerpt and a 'View source' link that opens the original page in a new tab.","why":"Likely reason: sources can be long, so they start collapsed to keep the page short, and the first one is open to show what a source looks like.","watch_out":"The panel trusts each link exactly as given, so a bad address only shows up when the user clicks it."}],"explained_at":"2026-11-11T23:32:03+00:00","explained_by":"haiku","summary":"The market research view: shows what the web research agent found about current prices and checks each input and output against market ranges.","purpose":"Lets the user see whether their assumptions match market evidence, with sources.","why":"Likely reason: users need to judge model assumptions against outside data before trusting the results.","how":"Turns the validation results into simple rows. Each row has a status and, where both a value and a market range exist, a sentence comparing them. Component codes are shown with friendly names. The evidence cards and sources are drawn by parts of the file not reviewed here.","inputs":"Research results from the store, including validation data for inputs and outputs.","outputs":"Research tables, evidence cards, and source links on screen.","risks":"Only four of eight sections were available to review. The row builder reads each validation entry without checking it exists first, so an empty entry would crash the screen.","debug":"If a comparison sentence is blank, check that both a user or calculated value and a market range exist for that field. If the screen crashes, check the validation data for empty entries.","summary_hash":"sha256:41acadd7067be91c53db001c939ae54fbc144aca5c8d1e84a5c063f9898aba2c","fresh":true},"frontend/src/components/ui/Button.tsx":{"schema_version":1,"path":"frontend/src/components/ui/Button.tsx","language":"TypeScript (React)","lines":64,"hash":"sha256:3f521f31c7662cf5cd0dcfca091e7abf071259594915f7e228e2c9b0cda2c150","area":"frontend-src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No test is visible for this component.","The loading spinner has no accessible label."]},"terms":[{"term":"Props","meaning":"The options a parent component passes into a component, like settings on a form."},{"term":"Spinner","meaning":"A small rotating circle that shows something is in progress."},{"term":"Accessibility","meaning":"Making the app usable for people who use screen readers or keyboards."}],"depends_on":["react","classnames","frontend/src/index.css (shared button classes)"],"used_by":[],"sections":[{"start":1,"end":3,"kind":"setup","name":"File setup","id":"s1","hash":"57128bcc417417a2","title":"Imports for the button","what":"Brings in the standard button settings, a type for content, and a helper that joins style names together.","why":"Likely reason: lets the button accept all normal button options and add its own on top.","watch_out":""},{"start":4,"end":11,"kind":"type","name":"ButtonProps","id":"s2","hash":"7b49079a498f576e","title":"Options the button accepts","what":"Lists the options a button accepts: a style (primary, secondary, or ghost), a size (small, medium, or large), a loading flag, an optional icon, and the content inside. Any normal button option also works.","why":"Likely reason: keeps the allowed choices in one place so every button uses the same ones.","watch_out":"The content is required, so a button with no text or content will fail the type check."},{"start":12,"end":64,"kind":"function","name":"Button","id":"s3","hash":"73fedb56633901af","title":"Button appearance and loading state","what":"The button itself. Its default style is secondary and its default size is medium. While loading it shows a spinner, hides the icon, and cannot be clicked. When disabled or loading it looks faded.","why":"Likely reason: disabling the button while work is running stops repeated clicks during a slow action.","watch_out":"The spinner has no text for screen readers, so people using them may not know the button is busy."}],"explained_at":"2026-11-11T23:32:03+00:00","explained_by":"haiku","summary":"A shared button that comes in three styles and three sizes and can show a spinner while work is in progress.","purpose":"Gives every button in the app the same look and the same loading behavior.","why":"Likely reason: one reusable button keeps the look consistent and avoids repeating the same styling in many places.","how":"It takes the style, size, loading state, icon, and content as options, combines the matching style names, and shows a spinner in place of the icon while loading. It disables the button while loading or when disabled, and passes any other standard button options through.","inputs":"Options from the caller: style, size, loading flag, optional icon, the content inside the button, and any standard button options such as click handlers.","outputs":"A clickable HTML button that looks styled and, while loading, shows a spinning indicator and cannot be clicked.","risks":"The spinner has no text for screen readers, so a loading button may be silent to people who use them. Because the content is required, every button must have text or other content.","debug":"If a button looks wrong, check the style and size options passed by the caller and the shared button classes in index.css. If a button will not click, check whether loading or disabled is set.","summary_hash":"sha256:3f521f31c7662cf5cd0dcfca091e7abf071259594915f7e228e2c9b0cda2c150","fresh":true},"frontend/src/index.css":{"schema_version":1,"path":"frontend/src/index.css","language":"CSS","lines":149,"hash":"sha256:356335c4a23cbf1c2f39d2d2120169745c011d679aed3fa8fff1484794d51cf8","area":"frontend-src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Two color palettes are mixed, which makes the intended look unclear.","No visual test is visible.","Body colors may be overridden by classes in index.html, which is not reflected here."]},"terms":[{"term":"CSS","meaning":"The language that tells the browser how a page should look."},{"term":"Tailwind","meaning":"A styling tool that provides small named style classes."},{"term":"Keyframes","meaning":"A set of steps that describe how an animation changes over time."},{"term":"Focus outline","meaning":"The highlight shown around the element a keyboard user is on."}],"depends_on":["tailwindcss","frontend/tailwind.config.js"],"used_by":["frontend/src/main.tsx","frontend/index.html","frontend/src/components (class names)"],"sections":[{"start":1,"end":55,"kind":"setup","name":"File setup (part 1)","id":"s1","hash":"1c9e381711d6abe0","title":"Base setup and page colors","what":"Sets up the style system, a set of named colors, the default page background and text color, and a slim scrollbar.","why":"Likely reason: gives every page one starting look before individual screens add their own styles.","watch_out":"Two color sets exist, one here and one in the Tailwind configuration, so a change in one may not show up where the other is used."},{"start":56,"end":113,"kind":"setup","name":"File setup (part 2)","id":"s2","hash":"487a18acde435152","title":"Shared button, input, card, and status styles","what":"Defines the shared look for primary and secondary buttons, input boxes, cards, and text colors for valid, warning, and error states.","why":"Likely reason: reusable named styles keep screens consistent and short.","watch_out":"The input style removes the default focus outline and replaces it with a red ring, so keyboard users depend on that ring being visible."},{"start":114,"end":133,"kind":"setup","name":"File setup (part 3)","id":"s3","hash":"4160f8d733fe49b2","title":"Slide-up and glow keyframes","what":"Defines two motion steps: a slide-up that fades in while moving up, and a pulsing green glow.","why":"Likely reason: these are the motion effects used by the animation classes below.","watch_out":"The glow repeats forever, so using it on many items at once can be distracting."},{"start":134,"end":137,"kind":"rule","name":".animate-fade-in ","id":"s4","hash":"08ca5adb0748b87d","title":"Fade-in animation class","what":"Makes any element that uses this class fade in over about a third of a second.","why":"Reason not stated in the code. It is a common, gentle entrance effect.","watch_out":""},{"start":138,"end":141,"kind":"rule","name":".animate-slide-up ","id":"s5","hash":"31086f2ce607fe04","title":"Slide-up animation class","what":"Makes an element slide up a short distance while fading in over about four-tenths of a second.","why":"Reason not stated in the code. It is a common entrance effect.","watch_out":""},{"start":142,"end":145,"kind":"rule","name":".animate-glow ","id":"s6","hash":"bce2ce837c609310","title":"Pulsing glow animation class","what":"Makes an element pulse with a green glow, repeating without end.","why":"Reason not stated in the code. It likely draws attention to something active.","watch_out":"It repeats without end, so use it sparingly."},{"start":146,"end":149,"kind":"rule","name":".tabular-nums ","id":"s7","hash":"8ff0f5ea1ad0e7e4","title":"Aligned number columns class","what":"Makes digits take equal width so numbers in a column line up when scanned.","why":"Likely reason: so columns of costs are easy to compare.","watch_out":""}],"explained_at":"2026-11-11T23:32:03+00:00","explained_by":"haiku","summary":"The main stylesheet that sets the app's base colors and defines the shared button, input, card, status, and animation styles.","purpose":"Gives the whole app a consistent look beyond the individual class names used in components.","why":"Likely reason: reusable named styles avoid repeating long lists of classes on every screen. The top comment says the look is inspired by the Nothing and Teenage Engineering style, but the body rule uses the Bain palette. The reason for mixing them is not stated in the code.","how":"First it loads the Tailwind style system. Then it sets named colors, the default page background and text color, and a slim scrollbar. Next it defines shared styles for buttons, inputs, cards, and status text. Last it defines a few animations: fade-in, slide-up, and a pulsing glow.","inputs":"The Tailwind style system and the color names from the Tailwind configuration.","outputs":"Global styles that apply to every page, plus named classes that components can use.","risks":"Two color sets exist, one here and one in the Tailwind configuration, so a change in one may not appear where the other is used. The input style removes the default focus outline, so keyboard users rely on the red ring being visible.","debug":"If a style does not appear, check that the class is defined here and that the color name exists in the Tailwind configuration. If page colors look wrong, check the body rule here and the body classes in index.html.","summary_hash":"sha256:356335c4a23cbf1c2f39d2d2120169745c011d679aed3fa8fff1484794d51cf8","fresh":true},"frontend/src/main.tsx":{"schema_version":1,"path":"frontend/src/main.tsx","language":"TypeScript (React)","lines":10,"hash":"sha256:2ed12a1457cd60b31c0f44f3ea59b8bbc2ddd4a49add3165228d093878fb7c24","area":"frontend-src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The root element is assumed to exist, with no check.","No test is visible."]},"terms":[{"term":"React","meaning":"A library for building screens out of reusable pieces called components."},{"term":"Strict mode","meaning":"A development-only wrapper that checks components for common mistakes."},{"term":"Root element","meaning":"The empty container in the page where the whole app is placed."}],"depends_on":["react","react-dom/client","frontend/src/App","frontend/src/index.css"],"used_by":["frontend/index.html"],"sections":[{"start":1,"end":10,"kind":"setup","name":"File setup","id":"s1","hash":"5a820fc5c45c8ad1","title":"Starting the app","what":"Starts the app: finds the empty root element on the page, places the whole application inside it, and loads the global styles.","why":"Likely reason: this is the standard way a React app is started, and the strict wrapper helps catch mistakes early.","watch_out":"The app crashes at startup if the root element is missing from the HTML page."}],"explained_at":"2026-11-11T23:32:03+00:00","explained_by":"haiku","summary":"The entry point that starts the React app by placing it into the page's empty root element and loading the global styles.","purpose":"Runs the app when the page opens.","why":"Standard way a React app starts. The strict mode wrapper flags common mistakes during development.","how":"It finds the page element named root, then renders the main App component inside a strict mode wrapper. It also loads the global stylesheet.","inputs":"The page element named root from index.html, the App component, and the stylesheet.","outputs":"The rendered app on the page.","risks":"If the root element is missing, the app crashes at startup because the code assumes it exists.","debug":"If the page is blank, check that index.html has an element named root and that the script path is correct. Check the browser console for the first error.","summary_hash":"sha256:2ed12a1457cd60b31c0f44f3ea59b8bbc2ddd4a49add3165228d093878fb7c24","fresh":true},"frontend/src/store/useModelStore.ts":{"schema_version":1,"path":"frontend/src/store/useModelStore.ts","language":"TypeScript","lines":277,"hash":"sha256:d8e7971b88d8b02f55ac0c15d37cae884d7613daa15435523b327cd5470dbfef","area":"frontend-src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No test is visible for this store.","A failed calculation leaves old results on screen.","Loading defaults discards user edits without asking.","Several places use the loose any type, so some mistakes are not caught."]},"terms":[{"term":"Zustand","meaning":"A small library that keeps shared app data in one place that any screen can read."},{"term":"Session","meaning":"One saved calculation run, stored on the backend under an id."},{"term":"Persist","meaning":"The part of the store library that saves some data in the browser so it survives a refresh."},{"term":"API client","meaning":"The helper that sends requests from the app to the backend and returns the replies."},{"term":"Action","meaning":"A named function that changes the stored data, such as calculate or reset."}],"depends_on":["zustand","zustand/middleware","frontend/src/types/index.ts","frontend/src/api/client"],"used_by":["frontend/src/components/panels/WebResearchPanel.tsx"],"sections":[{"start":1,"end":18,"kind":"setup","name":"File setup","id":"s1","hash":"e12fe7a538b4fd7d","title":"Imports for the store","what":"Explains what the file is for and brings in the store library, the browser-saving helper, the shared data types, and the API client that talks to the backend.","why":"Likely reason: the store is the single place where screens read and change model data.","watch_out":""},{"start":19,"end":59,"kind":"type","name":"ModelState","id":"s2","hash":"ba1a7dcd34774770","title":"List of stored data and actions","what":"Lists every piece of shared data the store holds, such as the session, inputs, outputs, research, lecture steps, errors, and loading flags. It also lists the actions screens can call.","why":"Likely reason: writing the shape in one place helps the screens and the store agree on the same names.","watch_out":"A field added here must also get a starting value below, or the type check will complain."},{"start":60,"end":75,"kind":"function","name":"normalizeInputs","id":"s3","hash":"fe2e918dcf128af0","title":"Cleaning up partly typed numbers","what":"Before inputs go to the backend, replaces any number field the user left blank or half-typed (an empty box, a lone minus sign, or a lone dot) with its default value. The backend therefore receives only real numbers.","why":"The code comment says the backend should only ever receive numbers.","watch_out":"If defaults have not loaded yet, a blank field is sent with no value, which the backend may reject."},{"start":76,"end":131,"kind":"value","name":"useModelStore (part 1)","id":"s4","hash":"98b04362be258235","title":"Starting values, creating and loading sessions","what":"Sets the empty starting values and wraps the store in the browser-saving helper. Creating a session sends the current inputs to the backend. Loading a session copies its saved inputs, outputs, research, lecture steps, checks, and warnings into the store.","why":"Likely reason: sessions let the backend keep a record of each run so it can be reopened or exported later.","watch_out":"When a call fails, the store records the message and then throws the error again, so every caller must catch it."},{"start":132,"end":186,"kind":"value","name":"useModelStore (part 2)","id":"s5","hash":"f7ff7f489cef493f","title":"Setting inputs and running the calculation","what":"Stores new inputs and changes one input at a time. Running the calculation sends the cleaned inputs with a session id, then saves the returned outputs, research, lecture steps, checks, and warnings. If the backend reports failure, it keeps the error and the check list.","why":"Likely reason: a session id is made in the browser if none exists, because the code comment says the backend only keeps a session when given an id.","watch_out":"When a calculation fails, the old outputs stay on screen next to the new error, so the user may read stale numbers."},{"start":187,"end":235,"kind":"value","name":"useModelStore (part 3)","id":"s6","hash":"15d99c0b87b843c5","title":"Excel export and small view switches","what":"Downloads the current session as an Excel file named with the first eight characters of the session id. It also holds small switches: which lecture step is showing, which schematic part is active, and whether the lecture and research panels are visible.","why":"Likely reason: a downloaded file is triggered through a temporary link, which the code creates and removes.","watch_out":"Export needs a session id, so pressing it before the first calculation will show an error."},{"start":236,"end":277,"kind":"value","name":"useModelStore (part 4)","id":"s7","hash":"b37c74792be45747","title":"Reset, loading defaults, and what gets saved","what":"Clears the working data back to empty (reset). Loads the default inputs from the backend and sets them as the current inputs. Also defines what is saved in the browser: the session id, the inputs, and the two panel switches.","why":"Likely reason: saving only a few fields keeps browser storage small and lets the backend resend larger results when needed.","watch_out":"Loading defaults overwrites every input the user has typed, with no confirmation."}],"explained_at":"2026-11-11T23:32:03+00:00","explained_by":"haiku","summary":"The shared memory of the frontend: it holds the model's inputs, results, and session, and provides the actions screens use to change them and talk to the backend.","purpose":"Keeps one copy of the data the app shows so the screens stay in agreement.","why":"Likely reason: one shared store avoids passing the same data through many layers of components.","how":"1. Start with empty values and settings. 2. When the app loads, fetch default inputs or open a saved session. 3. When the user edits, update the inputs locally. 4. When a calculation runs, clean the inputs, send them with a session id, and store the results or the error. 5. Export downloads the Excel file. 6. Some values are saved in the browser so they survive a page refresh.","inputs":"Actions called by screens: create or load a session, update inputs, calculate with optional lecture and research flags, export, load defaults, reset, and small toggles. It also reads replies from the backend client.","outputs":"Stored values the screens read: outputs, research, lecture steps, validation results, warnings, errors, and loading flags. It also triggers an Excel file download.","risks":"Loading defaults overwrites the user's edits with no warning. A failed calculation keeps the old outputs on screen. Reset does not clear the export flag or the default inputs. Callers must catch the errors the actions rethrow. Saved inputs come back after a refresh, so an old input can reappear.","debug":"If numbers look stale, check whether a calculation failed and left old outputs in place. If inputs change unexpectedly, look for a call to load defaults. If export fails, check that a session id exists. If a value is sent as missing, check whether defaults were loaded. Saved browser data sits under the key solar-model-storage and can be cleared in browser developer tools.","summary_hash":"sha256:d8e7971b88d8b02f55ac0c15d37cae884d7613daa15435523b327cd5470dbfef","fresh":true},"frontend/src/types/index.ts":{"schema_version":1,"path":"frontend/src/types/index.ts","language":"TypeScript","lines":267,"hash":"sha256:399ec60c9e518e47c9db29126607345076abaa0f6dd4992f452e8bfd3ff8c158","area":"frontend-src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The shapes are maintained by hand with no check against the backend.","Several fields are optional or loosely typed."]},"terms":[{"term":"TypeScript","meaning":"A version of JavaScript that checks the shape of data before the app runs."},{"term":"Interface","meaning":"A named description of what fields a piece of data has."},{"term":"Optional field","meaning":"A field that may be missing. The code marks these so the checker asks the code to handle a missing value."},{"term":"Compile time","meaning":"The step where code is checked and converted before the app runs."}],"depends_on":[],"used_by":["frontend/src/store/useModelStore.ts"],"sections":[{"start":1,"end":5,"kind":"setup","name":"File setup","id":"s1","hash":"25aadfafd30794e9","title":"File purpose note","what":"Opens the file with a note that these are the data shapes the frontend expects from the backend.","why":"Likely reason: keeps the frontend in step with the backend's data format.","watch_out":""},{"start":6,"end":11,"kind":"type","name":"CostRange","id":"s2","hash":"202b4e117d5080b8","title":"Cost range shape","what":"Describes a low and a high cost estimate, plus an optional middle value called the median.","why":"Likely reason: cost figures are given as ranges to show uncertainty.","watch_out":"The median is optional, so code that uses it must handle it being missing."},{"start":12,"end":19,"kind":"type","name":"ComponentCost","id":"s3","hash":"28cf6f54f5de364b","title":"Component cost shape","what":"Describes one cost part: its ranges for two price measures (MSP and MMP), a formula description, an optional breakdown by sub-part with percentages, and its unit.","why":"Likely reason: every cost part is reported the same way so the screens can show them alike.","watch_out":"The breakdown is optional, so the screen must check it exists before showing it. The full names of MSP and MMP are not given in this file."},{"start":20,"end":25,"kind":"type","name":"SystemInputs","id":"s4","hash":"435ac0399be8d95d","title":"System size inputs shape","what":"The overall project settings: size in kilowatts, the DC to AC ratio, and an optional storage length in hours.","why":"Reason not stated in the code. These are the top-level project choices.","watch_out":"Storage length is optional, so a missing value must be handled wherever it is read."},{"start":26,"end":39,"kind":"type","name":"ModuleInputs","id":"s5","hash":"6a9b10e278f76bc4","title":"Module inputs shape","what":"Solar panel settings: efficiency, physical size and weight, yearly output capacity, labor hours, electricity use, depreciation, an upkeep rate, and low and high cost.","why":"Reason not stated in the code. The fields are grouped so the input form can fill them together.","watch_out":"Renaming a field here without matching the backend leaves that input blank in the app."},{"start":40,"end":49,"kind":"type","name":"InverterInputs","id":"s6","hash":"ff919df2f0fa002f","title":"Inverter inputs shape","what":"Inverter settings: the type (central, string, or micro), yearly output capacity, low and high cost per kilowatt AC, labor hours, depreciation, and efficiency.","why":"Reason not stated in the code.","watch_out":"The type accepts only three exact names, so any other spelling will fail the type check."},{"start":50,"end":60,"kind":"type","name":"ESSInputs","id":"s7","hash":"074820827f63f9df","title":"Storage inputs shape","what":"Battery storage settings: whether storage is on, then optional cost, project, incentive, efficiency, and cycle values.","why":"Likely reason: most storage fields only apply when storage is turned on, so they are optional.","watch_out":"Storage can be turned on while a value is missing, which can lead to blank results."},{"start":61,"end":69,"kind":"type","name":"SBOSInputs","id":"s8","hash":"f66149023126603e","title":"Mounting inputs shape","what":"Racking and mounting settings: area per kilowatt, whether trackers are used, and optional tracker and fixed-mount costs.","why":"Reason not stated in the code.","watch_out":"Tracker cost fields are optional, so they can be empty even when a tracker is used."},{"start":70,"end":82,"kind":"type","name":"EBOSInputs","id":"s9","hash":"ade1c0d8cc0597e3","title":"Electrical balance inputs shape","what":"Electrical settings: low and high costs for transformers, breakers, combiners, and wiring, plus shipping and tariff rates.","why":"Reason not stated in the code.","watch_out":""},{"start":83,"end":90,"kind":"type","name":"LaborInputs","id":"s10","hash":"d327bb3a18d19921","title":"Labor inputs shape","what":"Field and office labor settings: an hourly rate and hours per kilowatt for each, plus a labor burden rate.","why":"Reason not stated in the code.","watch_out":""},{"start":91,"end":97,"kind":"type","name":"OtherCostsInputs","id":"s11","hash":"7c647650f522c38b","title":"Other costs inputs shape","what":"Rates for sales tax, contingency, management, and profit.","why":"Reason not stated in the code.","watch_out":"The code does not say whether these are fractions or whole percentages, so check which one the backend expects."},{"start":98,"end":113,"kind":"type","name":"OMInputs","id":"s12","hash":"f0540abf765bebe6","title":"Operations and maintenance inputs shape","what":"Yearly low and high costs for cleaning, inspection, replacement, insurance, property tax, and lease, plus a discount rate.","why":"Reason not stated in the code. The lecture step on operations covers a 20-year period.","watch_out":"The discount rate has the same fraction-or-percentage question as the other rates."},{"start":114,"end":125,"kind":"type","name":"CostModelInputs","id":"s13","hash":"27ce900f0cfe2a33","title":"Combined inputs shape","what":"Groups all input sections into one object that describes the whole model.","why":"Likely reason: one object is sent to the backend with every choice in it.","watch_out":""},{"start":126,"end":131,"kind":"type","name":"SystemTotal","id":"s14","hash":"0b4e002628cf539b","title":"Overall total shape","what":"The overall project total: a cost range, a formula description, and a unit.","why":"Reason not stated in the code.","watch_out":""},{"start":132,"end":147,"kind":"type","name":"CostModelOutputs","id":"s15","hash":"b8a0f23dc6596011","title":"Calculation results shape","what":"The results: one cost part for each area, two totals (with and without storage), a time stamp, and the session id.","why":"Likely reason: all results come back in one package so the screens read them from one place.","watch_out":"The storage result and its total are optional, so screens must handle them being absent."},{"start":148,"end":155,"kind":"type","name":"ValidationResult","id":"s16","hash":"eeff646b6bdd0543","title":"Input check result shape","what":"One check result for an input field: the field name, a status (valid, warning, or error), a message, a severity, and optional suggestions.","why":"Likely reason: lets the form show clear feedback next to the field it concerns.","watch_out":"Status and severity are separate fields, so a screen that reads only one may misreport a problem."},{"start":156,"end":163,"kind":"type","name":"WebResearchSource","id":"s17","hash":"c3ff28765035114e","title":"Web source shape","what":"One web source used in research: title, link, short excerpt, a relevance score, and when it was found.","why":"Likely reason: keeps the citation details that the research panel shows.","watch_out":"The code does not state the range of the relevance score. The panel treats it as a value from 0 to 1 when showing a percentage."},{"start":164,"end":174,"kind":"type","name":"WebResearchResult","id":"s18","hash":"d76bfb56ba8c08dd","title":"Web research result shape","what":"The research for one cost part: input and output checks, suggestions, quotes, sources, and a confidence value.","why":"Likely reason: one package per component lets the research panel show each one.","watch_out":"The input and output checks are loosely typed, so the editor does not check their contents."},{"start":175,"end":190,"kind":"type","name":"CalculationStep","id":"s19","hash":"588954aaea81de0a","title":"Lecture step shape","what":"One lesson step: number, title, component, visual details, explanation, formula, example, sub-parts, context, and optional research.","why":"Likely reason: matches the lecture steps the backend builds.","watch_out":"Research is optional on a step, so a step may have none attached."},{"start":191,"end":197,"kind":"type","name":"LectureSequence","id":"s20","hash":"679dc9da97c4492e","title":"Lecture sequence shape","what":"The whole lecture: total steps, the list of steps, the current step number, and percent complete.","why":"Likely reason: lets the app show progress through the lecture.","watch_out":"Progress values come from the backend, so the screen should not assume they match the list length."},{"start":198,"end":206,"kind":"type","name":"ErrorDetail","id":"s21","hash":"7c29d40da0d8c7b0","title":"Error detail shape","what":"One error message: a code, a type, text, an optional field name, an optional suggested fix, and a severity of critical, error, or warning.","why":"Likely reason: gives the user specific problems to fix.","watch_out":""},{"start":207,"end":217,"kind":"type","name":"ModelResponse","id":"s22","hash":"4ebfcb98041b228e","title":"Calculation reply shape","what":"The reply to a calculation request: a success flag, the results if any, check results, research, lecture steps, errors, warnings, and extra data.","why":"Likely reason: one reply shape lets the store handle every outcome the same way.","watch_out":"Results are missing when a calculation fails, so code must check the success flag before reading them."},{"start":218,"end":229,"kind":"type","name":"Session","id":"s23","hash":"aaf445bd88a31d55","title":"Saved session shape","what":"A saved session: id, creation time, last update time, and optional saved inputs, outputs, research, lecture, checks, and warnings.","why":"Likely reason: lets a past run be reopened later.","watch_out":"Most saved fields are optional, so a session may open with some sections empty."},{"start":230,"end":244,"kind":"type","name":"SchematicComponent","id":"s24","hash":"cbad3953edaec213","title":"Diagram box shape","what":"Describes one box in a diagram: id, type, icon, position, layers with cost text and color, connections, and whether it is conditional.","why":"Likely reason: a diagram needs position and connection data for each box.","watch_out":"The cost here is text, not a number, so it is not added up automatically."},{"start":245,"end":251,"kind":"type","name":"SchematicVisualization","id":"s25","hash":"a01195319850fe28","title":"Whole diagram shape","what":"Describes a whole diagram: its boxes, the active box, highlighted layers, and whether cost labels show.","why":"Reason not stated in the code.","watch_out":"Not used in the files shown here, so check where it is used before changing it."},{"start":252,"end":261,"kind":"type","name":"ChartDataPoint","id":"s26","hash":"1db46b2ac00ef6ce","title":"Chart point shape","what":"One point or bar for a chart: a name, optional low and high cost values, and a single value.","why":"Likely reason: charts need one shared shape for the ranges they draw.","watch_out":"Every value field is optional, so a chart point may be empty."},{"start":262,"end":267,"kind":"type","name":"WaterfallDataPoint","id":"s27","hash":"86b973de2d07c1ff","title":"Waterfall chart point shape","what":"One step in a waterfall chart: a name, a value, a running total, and whether it is an added amount or a total.","why":"Likely reason: a waterfall chart shows how costs build up to a total.","watch_out":"The running total must match the values, and this file does not enforce that."}],"explained_at":"2026-11-11T23:32:03+00:00","explained_by":"haiku","summary":"Defines the shapes of the data the frontend expects from the backend and uses internally, so the editor can catch misspelled or missing fields.","purpose":"A single list of data shapes that the rest of the frontend shares.","why":"Likely reason: the header says these mirror the backend schemas, so the two stay in step. Kept by hand.","how":"It lists small building blocks first (cost ranges and component costs), then groups the input values by area: system, modules, inverters, storage, mounting, electrical balance, labor, other costs, and operations and maintenance. After that it lists outputs, research, lecture steps, sessions, errors, the reply shape, and the chart and diagram shapes.","inputs":"Nothing is read at run time. The file is used only when the code is checked.","outputs":"No output at run time. It supplies shapes to other files.","risks":"The shapes are written by hand. If the backend renames a field, the frontend still compiles and may show blank values. Several research fields are loosely typed, so their contents are not checked.","debug":"If a value is undefined in the app, compare its name here with the backend field name. These shapes are removed when the app runs, so they cannot show errors in the browser.","summary_hash":"sha256:399ec60c9e518e47c9db29126607345076abaa0f6dd4992f452e8bfd3ff8c158","fresh":true},"frontend/src/vite-env.d.ts":{"schema_version":1,"path":"frontend/src/vite-env.d.ts","language":"TypeScript","lines":16,"hash":"sha256:a61a9c3ad599063f508513f8289268d91670499f5c148816de080dd90b0d80f2","area":"frontend-src","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The diagram declaration may point at a different package version than the one the code uses; not verified here."]},"terms":[{"term":"Module declaration","meaning":"A note that tells the type checker a package or file exists and what it provides."},{"term":"Vite","meaning":"The build tool that runs and packages the frontend."},{"term":"React Flow","meaning":"The library that draws the box-and-arrow diagram."}],"depends_on":["vite (client types)","react-flow-renderer"],"used_by":[],"sections":[{"start":1,"end":16,"kind":"setup","name":"File setup","id":"s1","hash":"bb8f165f6c8f30f0","title":"Type notes for the app's imports","what":"Declares how the editor should understand the style imports and the diagram library imports, including the one diagram stylesheet import.","why":"Likely reason: the editor does not know about these imports by default.","watch_out":"The diagram library's declared version may not match the one installed or used."}],"explained_at":"2026-11-11T23:32:03+00:00","explained_by":"haiku","summary":"Tells the editor how to handle imports of style files and the React Flow diagram library so the code type-checks.","purpose":"Declares the types for imports the editor does not know on its own.","why":"Likely reason: without these notes, the editor would report errors on imports that work fine when the app runs.","how":"It loads Vite's standard type notes, declares that CSS imports are text records, declares the diagram package as coming from the older react-flow-renderer package, and declares the diagram stylesheet import.","inputs":"Nothing at run time.","outputs":"Type information used only by the editor and the type checker.","risks":"The diagram declaration points to the older react-flow-renderer package, while package.json also lists newer @reactflow packages. The packet does not show which one the diagram code imports, so the types may not match the code that actually runs.","debug":"If the editor says a module cannot be found, check this file. If diagram types look wrong, compare package.json with the diagram file's imports.","summary_hash":"sha256:a61a9c3ad599063f508513f8289268d91670499f5c148816de080dd90b0d80f2","fresh":true},"frontend/tailwind.config.js":{"schema_version":1,"path":"frontend/tailwind.config.js","language":"Configuration","lines":64,"hash":"sha256:4e1efc91b41672e12e54399a51e0a808cafcdd8da3b57778be1585147fe3caf8","area":"frontend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Two palettes are in use, with duplicate colors under different names.","Animations are defined in two places."]},"terms":[{"term":"Design token","meaning":"A named value such as a color or font that the whole app shares."},{"term":"Content paths","meaning":"The list of files Tailwind scans for class names."},{"term":"Keyframes","meaning":"A set of steps describing how an animation changes over time."}],"depends_on":["tailwindcss"],"used_by":["frontend/src/index.css","frontend/postcss.config.js"],"sections":[{"start":1,"end":60,"kind":"setup","name":"File setup (part 1)","id":"s1","hash":"1fe69172e07e342e","title":"Scanned files and design colors, fonts, and motion","what":"Lists the files Tailwind scans and defines the named colors, the two fonts, the animation names, and the motion steps behind them.","why":"Likely reason: keeps the design values in one place so the look can be changed without editing every component.","watch_out":"Two color sets exist, so a change to one palette does not change the other."},{"start":61,"end":64,"kind":"setup","name":"File setup (part 2)","id":"s2","hash":"12957fe352c675fa","title":"Closing the theme settings","what":"Closes the theme settings and the config object, and sets the plugin list to empty.","why":"Reason not stated in the code. These are the closing lines of the configuration.","watch_out":""}],"explained_at":"2026-11-11T23:32:03+00:00","explained_by":"haiku","summary":"Sets which files Tailwind scans for class names and defines the app's named colors, fonts, animations, and blur.","purpose":"Controls the design choices: palettes, fonts, and motion names.","why":"Likely reason: named colors let the look be changed in one place. Comments point to docs for the Bain and Nothing palettes.","how":"It lists the source files to scan. Inside the extended theme, it sets two named palettes (a Bain red and grey set and a Nothing green, black, and grey set), a monospace and a sans font, four animation names with matching motion steps, and a small blur size.","inputs":"The source files, which Tailwind scans at build time.","outputs":"Generated class names for colors, fonts, and animations that components can use.","risks":"Two palettes overlap: green and orange are each defined under two names. The color named border replaces the default border color for the whole app, and the stylesheet depends on that. Animations are defined both here and in index.css.","debug":"If a new class has no effect, check that its file is in the content list. If a color looks wrong, check the palette names here and whether the stylesheet overrides it.","summary_hash":"sha256:4e1efc91b41672e12e54399a51e0a808cafcdd8da3b57778be1585147fe3caf8","fresh":true},"frontend/tsconfig.json":{"schema_version":1,"path":"frontend/tsconfig.json","language":"Configuration","lines":32,"hash":"sha256:1e45e646beb957b51c6db06a422fc821fb00d7298569f1d9b0531d7d189fa2c7","area":"frontend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Strict checks are turned off, so many mistakes are less likely to be caught."]},"terms":[{"term":"Strict mode","meaning":"A setting that makes the type checker more careful about empty values and unknown types."},{"term":"JSX","meaning":"The syntax that mixes HTML-like markup into JavaScript for React."},{"term":"No emit","meaning":"A setting that makes the checker read the code and report errors without writing new files."}],"depends_on":["typescript","frontend/src"],"used_by":["frontend/package.json (build check script)"],"sections":[{"start":1,"end":32,"kind":"setup","name":"File setup","id":"s1","hash":"76baa447d0a87caa","title":"Type checker rules","what":"Sets the type checker's rules: language version, module style, React markup support, which checks are on or off, and which folder to check.","why":"The file notes that the checks were relaxed for initial development.","watch_out":"With strict checks off, real mistakes can reach the app without warnings."}],"explained_at":"2026-11-11T23:32:03+00:00","explained_by":"haiku","summary":"Sets the rules the TypeScript checker follows for the frontend, with many strictness checks turned off.","purpose":"Tells the type checker which language version, module style, and files to check.","why":"The file says it is relaxed for initial development, so loose checks were chosen to move quickly.","how":"It targets modern JavaScript, uses bundler-style module lookup, does not write output files, enables React's markup syntax, turns off strict mode and most implicit-type and unused-code checks, and checks only the src folder.","inputs":"The source files under src.","outputs":"Type errors reported during checks. No files are produced.","risks":"Loose settings let many type mistakes through, including values that have no type and empty values that are not checked.","debug":"If the editor shows odd type errors, check this file. Run the build check command to see the same errors in the terminal.","summary_hash":"sha256:1e45e646beb957b51c6db06a422fc821fb00d7298569f1d9b0531d7d189fa2c7","fresh":true},"frontend/vercel.json":{"schema_version":1,"path":"frontend/vercel.json","language":"Configuration","lines":19,"hash":"sha256:a5e720f36dd969c0b73435bd1f197955082a54e8bbb34fbf21303ddbccd999f4","area":"frontend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The backend address is hardcoded.","The allow-any-site header covers all routes."]},"terms":[{"term":"Rewrite","meaning":"A rule that forwards a web address to another place without the browser noticing."},{"term":"CORS","meaning":"A browser rule that controls which other websites may read a response."},{"term":"Dist folder","meaning":"The folder where the build puts the finished website files."}],"depends_on":["frontend/package.json (build script)","the hosted backend service"],"used_by":["the hosting service at deploy time"],"sections":[{"start":1,"end":19,"kind":"setup","name":"File setup","id":"s1","hash":"da18125318a99c86","title":"Hosting and forwarding settings","what":"Sets the build command, the output folder, and the forwarding of /api calls to the hosted backend, plus a header that allows any site to read responses.","why":"Likely reason: lets the live site call the backend through its own address.","watch_out":"The backend address is fixed in this file, so a backend move breaks the live site until this file is updated."}],"explained_at":"2026-11-11T23:32:03+00:00","explained_by":"haiku","summary":"Tells the hosting service how to build the frontend and forwards requests that start with /api to the hosted backend.","purpose":"Sets up the live website on the hosting service.","why":"Likely reason: the browser calls /api on the same site, so the host forwards those calls to the backend and avoids cross-site requests.","how":"It sets the build command, the output folder, and the framework. It forwards any path under /api to the hosted backend, removing the /api prefix. It also adds a header to every route that allows any website to read the responses.","inputs":"The repository, the build command, and the backend address written in the file.","outputs":"The built website in the dist folder and forwarded API responses.","risks":"The backend address is written into this file, so moving the backend means editing this file. The allow-any-site header applies to every route and is broader than needed.","debug":"If API calls fail only on the live site, check the backend address here and whether that backend is running. If the deploy fails, check the build logs for errors from the build command.","summary_hash":"sha256:a5e720f36dd969c0b73435bd1f197955082a54e8bbb34fbf21303ddbccd999f4","fresh":true},"frontend/vite.config.ts":{"schema_version":1,"path":"frontend/vite.config.ts","language":"Configuration","lines":23,"hash":"sha256:dcdbc14caf40cd15d83a6617e14eb315ffc7ea284ab7c22ab930fef8d3a15ea9","area":"frontend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Two separate places define the same forwarding rule.","The @ shortcut may not be used anywhere."]},"terms":[{"term":"Dev server","meaning":"A local program that runs the app during development and refreshes it as code changes."},{"term":"Environment variable","meaning":"A setting passed in from outside the code, which the code reads when it runs."},{"term":"Proxy","meaning":"A middleman that forwards requests to another server."},{"term":"Alias","meaning":"A short name that stands for a folder path."}],"depends_on":["vite","@vitejs/plugin-react","path (Node module)"],"used_by":["frontend/package.json (dev and build scripts)"],"sections":[{"start":1,"end":23,"kind":"setup","name":"File setup","id":"s1","hash":"6e917555f9a801c3","title":"Development server and forwarding setup","what":"Sets up the local development server: the React plugin, the src shortcut, the port, and the forwarding of /api calls to the backend.","why":"Likely reason: lets the local app call the backend without cross-site problems.","watch_out":"The forwarding must match the rule in vercel.json, or local and live behavior will differ."}],"explained_at":"2026-11-11T23:32:03+00:00","explained_by":"haiku","summary":"Configures the Vite development server and build: the React plugin, a short name for the src folder, the dev port, and forwarding of /api requests to the backend during development.","purpose":"Controls how the app runs on a developer's machine.","why":"Likely reason: the development server has no backend of its own, so /api requests are forwarded to the backend to avoid cross-site problems.","how":"It loads the React plugin, maps the @ shortcut to the src folder, and sets the port from the VITE_PORT setting or uses 5173. It forwards /api to the backend address from VITE_API_URL or to localhost port 8000, removing the /api prefix.","inputs":"The environment settings VITE_PORT and VITE_API_URL, if they are set.","outputs":"A running development server on the chosen port, with API calls forwarded to the backend.","risks":"The forwarding only applies in development. Production uses the separate forwarding in vercel.json, so the two must stay in sync. The @ shortcut is defined, but the code shown uses relative imports, so it may be unused.","debug":"If API calls fail during development, check VITE_API_URL and whether the backend runs on the target port. If the port is in use, set VITE_PORT.","summary_hash":"sha256:dcdbc14caf40cd15d83a6617e14eb315ffc7ea284ab7c22ab930fef8d3a15ea9","fresh":true}}}</script>
<script>
(function () {
  "use strict";

  var main = document.getElementById("main");
  var DATA = null;
  try { DATA = JSON.parse(document.getElementById("clarity-data").textContent); } catch (error) { DATA = null; }

  // ---- Mode (shared with the portfolio through the same storage key) ----
  var modeButton = document.getElementById("mode");
  function currentMode() { return document.documentElement.getAttribute("data-mode") === "nerd" ? "nerd" : "calm"; }
  function syncModeLabel() { modeButton.setAttribute("aria-label", "Switch to " + (currentMode() === "calm" ? "nerd" : "calm") + " mode"); }
  modeButton.addEventListener("click", function () {
    var next = currentMode() === "calm" ? "nerd" : "calm";
    document.documentElement.setAttribute("data-mode", next);
    try { localStorage.setItem("site-mode", next); } catch (error) { /* private browsing: fine */ }
    syncModeLabel();
  });
  syncModeLabel();

  if (!DATA || !DATA.repo) {
    main.innerHTML = '<div class="empty"><p class="label">No notes yet</p><h2 class="display" style="margin-top:14px">This page is empty</h2>' +
      '<p class="punch">Open the repository in Claude Code and run <code>python3 .claude/clarity/clarity.py build</code> to fill it.</p></div>';
    return;
  }

  var REPO = DATA.repo;
  var SITE = DATA.site || {};
  var FILES = DATA.files || {};
  var PATHS = Object.keys(FILES).sort();
  var TITLE = SITE.project_name || REPO.name || "Repository";
  var FILE_STATES = {
    "ready": ["\u2713", "Ready", "ok"], "needs-work": ["!", "Needs work", "warn"],
    "not-ready": ["\u00D7", "Not ready", "bad"], "unknown": ["?", "Not checked", "unk"]
  };
  var CHECK_STATES = {
    "pass": ["\u2713", "Yes", "ok"], "partial": ["!", "Partly", "warn"], "fail": ["\u00D7", "No", "bad"],
    "unknown": ["?", "Not checked", "unk"], "ready": ["\u2713", "Ready", "ok"],
    "needs-work": ["!", "Needs work", "warn"], "not-ready": ["\u00D7", "Not ready", "bad"]
  };
  var KIND_LABELS = { "setup": "setup", "function": "function", "class": "class", "method": "method",
    "type": "data shape", "value": "settings or data", "route": "web address", "export": "export",
    "statement": "database statement", "block": "block", "rule": "style rule", "entry point": "starting point",
    "test group": "tests", "event handler": "reacts to an event" };

  function esc(value) {
    return String(value == null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function fmt(value) {
    if (!value) return "";
