n every part.","Hardcoded multipliers are hidden from the user and cannot be adjusted.","No tests are visible, and the formulas cannot be compared with the design document from the packet.","Checks for zero divisors are not visible in this file."]},"terms":[{"term":"MSP","meaning":"minimum sustainable price, the lowest price that covers all operations plus a minimum margin, as the Excel glossary defines it"},{"term":"MMP","meaning":"market median price, the typical market price, as the Excel glossary defines it"},{"term":"kWdc","meaning":"kilowatts of direct-current panel capacity, the usual size measure for solar panels"},{"term":"ILR","meaning":"inverter loading ratio, the ratio of panel capacity to inverter capacity"},{"term":"NPV","meaning":"net present value, the worth today of money paid in future years"},{"term":"O\u0026M","meaning":"operations and maintenance, the running costs after a system is built"},{"term":"Capex","meaning":"capital expenditure, the up-front cost to build a project"}],"depends_on":["schemas.inputs","schemas.outputs","numpy","datetime (Python standard library)"],"used_by":[],"sections":[{"start":1,"end":17,"kind":"setup","name":"File setup","id":"s1","hash":"dc24504afbd24b1d","title":"Imports and file purpose","what":"Describes the file as the cost engine that follows the project's formula document. It brings in the number library and the shapes for inputs and outputs.","why":"Likely reason: the formulas are kept together in one module. The file comment names DATA_SCHEMA.md as the source, which is not in the packet.","watch_out":"Changing a formula here without updating the document it names will leave the two out of step."},{"start":18,"end":71,"kind":"class","name":"CostCalculator (part 1)","id":"s2","hash":"85c7684634f52d44","title":"Setup and the main calculation order","what":"Stores the user's inputs and a timestamp, using the current time as the session ID if none is given. Then runs each part of the cost model in a set order. Storage is calculated only when it is switched on.","why":"Likely reason: later parts need totals from earlier parts, so the order is fixed.","watch_out":"The order matters, because other costs and O\u0026M depend on totals from earlier steps, so reordering the calls would change results."},{"start":72,"end":128,"kind":"class","name":"CostCalculator (part 2)","id":"s3","hash":"29141a1ae7c35435","title":"Packaging output and module, inverter costs","what":"Packs all part results into one output object, then works out the module and inverter costs. Module cost comes from the cost per watt entered by the user and the module efficiency. Inverter cost is scaled by the inverter loading ratio.","why":"Likely reason: one packaged output keeps the app and the Excel file reading the same numbers.","watch_out":"The high market price here is built from the lower cost, not the upper cost, so the high figure is understated."},{"start":129,"end":181,"kind":"method","name":"CostCalculator: calculate_ess","id":"s4","hash":"ab3e548626711027","title":"Battery storage cost formula","what":"Works out the battery storage cost from storage hours, system size, cost per kilowatt-hour and any fixed per-project cost, minus the storage incentive. It runs only when storage is switched on.","why":"Likely reason: storage is optional, so its math is kept separate. The incentive lowers the net cost.","watch_out":"The high market price here is also built from the lower cost, which repeats the same problem found in the other parts."},{"start":182,"end":222,"kind":"method","name":"CostCalculator: calculate_ebos","id":"s5","hash":"caea5a4d3b4e2f96","title":"Electrical balance of system costs","what":"Adds up transformers, breakers, combiner boxes and wiring for the low and high cases, then applies shipping and tariff percentages. The result is turned into a cost per kilowatt.","why":"Reason not stated in the code.","watch_out":"Transformers and breakers scale with AC capacity while combiners and wiring scale with DC size, so changing the inverter loading ratio moves these groups by different amounts."},{"start":223,"end":262,"kind":"method","name":"CostCalculator: calculate_fieldwork","id":"s6","hash":"c231004e2cc95596","title":"Field and office labor costs","what":"Works out crew cost from hours per kilowatt, the hourly rate and the labor burden, once for field work and once for office work. Each gives a low and high figure using fixed spread multipliers.","why":"Likely reason: field and office work vary in different ways, so each has its own spread.","watch_out":"The low and high spread multipliers are typed into the code, so a user cannot change how wide the range is."},{"start":263,"end":321,"kind":"method","name":"CostCalculator: calculate_other","id":"s7","hash":"6cfca60d29fc7879","title":"Other costs and O\u0026M inputs","what":"Adds overhead, contingency, management and profit rates on top of the subtotal to get other costs. It also begins the O\u0026M figure by adding fixed annual costs and costs that scale with total capital cost.","why":"Likely reason: overhead is a share of everything built so far, and O\u0026M depends on the capital total.","watch_out":"Insurance and property tax are shares of total capital cost, so any error in the capital totals flows straight into O\u0026M."},{"start":322,"end":380,"kind":"class","name":"CostCalculator (part 7)","id":"s8","hash":"bf6f4a2442ac17a6","title":"O\u0026M present value and PV-only total","what":"Discounts 20 years of yearly O\u0026M costs back to today's value and divides by system size to get a per-kilowatt figure. It then adds all parts into the PV-only total.","why":"Likely reason: money paid in later years is worth less today, so the code discounts it before adding it to the build cost.","watch_out":"The discount rate is a user input, so a very low rate makes O\u0026M look much larger."},{"start":381,"end":424,"kind":"class","name":"CostCalculator (part 8)","id":"s9","hash":"713935a282c45409","title":"Storage total and component breakdown","what":"Adds the storage cost to the PV-only total when storage is on. It also includes a helper that splits each part's cost across its listed sub-parts using their percentages.","why":"Likely reason: the app shows totals with and without storage, and breakdowns for detail views.","watch_out":"The breakdown helper requires a name on every sub-part with no fallback, so a sub-part missing that name will crash it."}],"explained_at":"2026-11-11T23:37:59+00:00","explained_by":"haiku","summary":"The cost engine. It turns the user's cost inputs into dollar-per-kilowatt estimates for each part of a solar project, each with a low, a high and a median value, then adds them into totals.","purpose":"Produces the cost numbers the app reports. The cost figures shown elsewhere in the project come from here, so this is the most important file to check.","why":"Likely reason: keeping all cost formulas in one place makes them easier to review. The file comment says the formulas follow a separate document, DATA_SCHEMA.md, which is not in the packet.","how":"The calculate_all method runs the parts in a fixed order: modules, inverters, SBOS, EBOS, field labor and office labor. It adds these into a subtotal, uses the subtotal to calculate other costs, then uses total capital cost to calculate O\u0026M. Battery storage is calculated only if it is switched on. Each part gives a minimum sustainable price (MSP) and a market median price (MMP) range, and a median is derived from the low and high ends.","inputs":"A CostModelInputs object from the schemas package. It holds system size, inverter loading ratio (ILR), storage duration, module and inverter costs, battery costs, balance of system costs, labor hours and rates, overhead rates, O\u0026M figures and a storage on/off switch. An optional session ID.","outputs":"A CostModelOutputs object with one entry per part, the PV-only total, the PV-plus-storage total when storage is on, a timestamp and the session ID.","risks":"Several multipliers, such as labor spread factors and market price markups, are typed into the code and cannot be changed by the user. In every part, the upper market price is calculated from the lower cost rather than the upper cost, so the high market price is too low. The unit of module efficiency is not stated here, and the formula divides by it. Divisions by system size, ILR or storage duration are not guarded in this file.","debug":"Start with calculate_all and find the part whose numbers look wrong. Compare the inputs with that part's method. Check the high market price values first, since they are built from the lower cost. If the code crashes, look for zero values in system size, ILR or storage duration. To check formulas against the design, open DATA_SCHEMA.md, which is not in the packet.","summary_hash":"sha256:e913d8db5e35103b64ab0b556855914d8990857a612aa8f4156b10f1fc7bdd3d","fresh":true},"backend/export/excel_exporter.py":{"schema_version":1,"path":"backend/export/excel_exporter.py","language":"Python","lines":592,"hash":"sha256:8fa3825e65f67ef4473c3731d4db3e0c80b5b4ae8827d1e128a0d3ddb3195e36","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Some charts are incomplete or leave out major costs, so they can mislead.","The docstring claims live formulas that are not created.","The Status and Default columns show values that were not actually checked or defined.","No tests are visible in the files provided."]},"terms":[{"term":"openpyxl","meaning":"a Python library that writes Excel files"},{"term":"Workbook","meaning":"an Excel file made up of several sheets"},{"term":"Sheet","meaning":"one tab inside a workbook"},{"term":"Formula (Excel)","meaning":"a cell that calculates its value from other cells, so it updates when they change"},{"term":"Bytes","meaning":"raw file contents rather than readable text"},{"term":"Placeholder function","meaning":"a function that exists but does nothing yet"}],"depends_on":["openpyxl","schemas.inputs","schemas.outputs","io (Python standard library)","datetime (Python standard library)"],"used_by":[],"sections":[{"start":1,"end":18,"kind":"setup","name":"File setup","id":"s1","hash":"477fdb67aaa8335e","title":"Imports and file purpose","what":"Describes the file as an Excel exporter with formulas, charts and a consulting-style look. It brings in the Excel library and the shapes for inputs, outputs and research results.","why":"Likely reason: the spreadsheet is built with a dedicated library. The formula claim in the description is not borne out in the code below.","watch_out":"The description promises formulas, but the cells hold fixed numbers, so users may assume the workbook recalculates."},{"start":19,"end":70,"kind":"class","name":"ExcelExporter (part 1)","id":"s2","hash":"7ce621499e31ba1d","title":"Exporter setup and the export run","what":"Starts a new exporter, creates the workbook and builds each sheet in turn. It then saves the result into memory and returns it as raw bytes. The validation sheet is added only when research results are supplied.","why":"Likely reason: keeping the workbook in memory means nothing has to be written to disk first.","watch_out":"The exporter keeps the workbook in a shared attribute, so one exporter should be used for one export only."},{"start":71,"end":129,"kind":"method","name":"ExcelExporter: _create_inputs_sheet","id":"s3","hash":"795e8ac9ee4c4ea1","title":"Inputs sheet: all user settings","what":"Creates the Inputs sheet with a title and column headers. It then adds a section for each group of settings. Storage settings appear only when storage is on.","why":"Likely reason: lets a reader see which numbers produced the results.","watch_out":"The list of groups is written by hand, so a new input group must be added here manually or it will not appear."},{"start":130,"end":169,"kind":"class","name":"ExcelExporter (part 3)","id":"s4","hash":"515dadf0651d3512","title":"Input rows and the status column","what":"Finishes the inputs sheet with the O\u0026M group and writes each setting as a row with a readable name, key, value, unit, group, description, default and validation rule. Each row gets a check mark in the Status column.","why":"The code comment says field details are simplified for now, with fuller information planned later.","watch_out":"The check mark, the default and the validation rule are fixed or copied, so the sheet implies every input was validated when none was."},{"start":170,"end":226,"kind":"method","name":"ExcelExporter: _create_summary_sheet","id":"s5","hash":"60a08a1cea61850a","title":"Summary sheet of component costs","what":"Creates the Summary sheet with one row per cost part, showing the low, high and median values for both MSP and MMP, and the unit. Storage appears as a row only when it is on.","why":"Likely reason: this is the one-page view a reader would look at first.","watch_out":"The figures are copied in as plain numbers, so they will not update if an input is changed in Excel."},{"start":227,"end":283,"kind":"class","name":"ExcelExporter (part 5)","id":"s6","hash":"a23564f839bb7de9","title":"Summary totals and breakdown sheet setup","what":"Adds the total rows for PV-only and, when storage is on, PV plus storage. Then starts the Detailed Breakdown sheet with its title and column headers.","why":"Likely reason: totals sit below the component rows, which is the usual layout.","watch_out":"The totals are numbers taken from the calculator, not sums of the rows above, so any mismatch would not be caught here."},{"start":284,"end":337,"kind":"class","name":"ExcelExporter (part 6)","id":"s7","hash":"5ece66fab01f67bd","title":"Subcomponent rows in the breakdown","what":"Writes one row per sub-part of each cost part, with its cost, share and a short description, then leaves a blank row between parts. Parts with no sub-parts are skipped.","why":"Likely reason: gives readers who want detail a view of what makes up each cost.","watch_out":"Each sub-part's cost is the part's median times its share, so the rows only add up correctly if the shares add up to one."},{"start":338,"end":386,"kind":"method","name":"ExcelExporter: _add_component_breakdown_chart","id":"s8","hash":"d00047cf737a1880","title":"Bar chart and an empty comparison stub","what":"Writes a small table of low and high values for six cost parts and draws a bar chart from it. It also contains a comparison chart placeholder that does nothing, which leaves a gap on the Charts sheet.","why":"Reason not stated in the code. The comparison chart is described as similar to this one but is empty.","watch_out":"The bar chart leaves out office labor, storage and O\u0026M, so its totals do not match the summary."},{"start":387,"end":420,"kind":"method","name":"ExcelExporter: _add_cost_proportion_pie_chart","id":"s9","hash":"2779bc73a9c1ca91","title":"Cost share pie chart","what":"Writes five category totals (modules, inverters, balance of system, labor and other) and draws a pie chart of their shares. Storage and O\u0026M are not included.","why":"Reason not stated in the code.","watch_out":"The pie shows shares of only some costs, so its percentages do not describe the full project total."},{"start":421,"end":471,"kind":"method","name":"ExcelExporter: _create_glossary_sheet","id":"s10","hash":"269f4ee72e6a7020","title":"Glossary of terms","what":"Creates a Glossary sheet with a fixed list of fourteen terms, each with its key name and a definition. The list is typed in and is not read from the rest of the app.","why":"Likely reason: a reader who opens the workbook alone can look up terms without other documents.","watch_out":"Some terms, such as LCOE, ITC and PPA, do not appear in the sheets built here, which may confuse readers."},{"start":472,"end":525,"kind":"method","name":"ExcelExporter: _create_validation_sheet","id":"s11","hash":"900084a7879e8e4e","title":"Research validation results sheet","what":"Creates the Validation and Research sheet. Each row shows a component, a field, the user's value, the market range, a colored status word and up to two source titles.","why":"Likely reason: lets a reader see which inputs the research checked and what it found.","watch_out":"The sheet shows only input checks, so output checks and market tips from the research do not appear in the workbook."},{"start":526,"end":578,"kind":"method","name":"ExcelExporter: _apply_borders","id":"s12","hash":"474dbea55b5bebd0","title":"Borders and small label helpers","what":"Draws thin borders around a block of cells. It also holds lookup helpers that supply units, short descriptions, simple validation rules and sub-part descriptions. The lookups cover only a few names, and other names get blank or guessed defaults.","why":"Likely reason: the lookups fill in columns without repeating code. The comments say more entries will be added later.","watch_out":"Unknown field names get a default validation rule of greater than zero, which may not suit that field."},{"start":579,"end":592,"kind":"function","name":"export_to_excel","id":"s13","hash":"69ef1914da4137bd","title":"Shortcut function for the export","what":"A simple function other code can call to get an Excel file in one step. It creates an exporter and returns the bytes from its export.","why":"Likely reason: callers do not need to create the exporter themselves.","watch_out":"Callers must treat the returned bytes as a binary file, not as text."}],"explained_at":"2026-11-11T23:37:59+00:00","explained_by":"haiku","summary":"Builds a multi-sheet Excel workbook from the inputs, the cost results and optional web research, and returns the file as raw bytes.","purpose":"Gives the user a spreadsheet to read and share, with inputs, summary costs, a detailed breakdown, charts, a glossary and optional validation results.","why":"Likely reason: a spreadsheet is what many cost-model users expect. The docstring says the look copies consulting-firm style. Reason for the specific colors is not stated.","how":"The export method creates a new workbook and removes the blank default sheet. It then builds the sheets in order: Inputs, Summary, Detailed Breakdown, Charts, Glossary, and Validation \u0026 Research only if research is supplied. Each sheet is written cell by cell with headers, number formats, borders and colored status words. The workbook is saved into memory and returned as bytes. The export_to_excel function is a shortcut that creates the exporter and calls export.","inputs":"A CostModelInputs object, a CostModelOutputs object, and an optional list of WebResearchResult objects.","outputs":"A binary Excel file returned as bytes. Sheets are Inputs, Summary, Detailed Breakdown, Charts, Glossary and, when research is given, Validation \u0026 Research.","risks":"The docstring says the workbook has formulas, but every cell holds a fixed number, so it will not update if an input changes. The bar chart shows only field labor and leaves out office labor, storage and O\u0026M. The pie chart leaves out storage and O\u0026M. The comparison chart is an empty placeholder. The Default column repeats the current value rather than a real default. The Status column shows a check mark for every input whether or not it was checked.","debug":"If a figure in Excel differs from the app, compare the Summary sheet with the calculator output for the same inputs, since the sheet only copies numbers. For a missing or empty chart, check the _create_charts_sheet method and the placeholder named _add_msp_mmp_comparison_chart. If the validation sheet is missing, check that research results were passed to export. A validation sheet with headers but no rows means the research had no input checks.","summary_hash":"sha256:8fa3825e65f67ef4473c3731d4db3e0c80b5b4ae8827d1e128a0d3ddb3195e36","fresh":true},"backend/main.py":{"schema_version":1,"path":"backend/main.py","language":"Python","lines":432,"hash":"sha256:1e049c6c55dc87a7caf593632961fdc2f95a4f22022a4b198d808d2e4cc8f35b","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Sessions are kept only in memory, a gap the file itself notes.","Allowed browser addresses are fixed to local development addresses.","Only 4 of 19 sections are visible in this packet, so error handling and access control could not be checked.","No tests are visible in the files provided."]},"terms":[{"term":"FastAPI","meaning":"a Python toolkit for building web servers that answer requests"},{"term":"Endpoint","meaning":"a web address the server answers, such as one that creates a session"},{"term":"CORS","meaning":"a browser rule that decides which web pages from other addresses may call this server"},{"term":"Session","meaning":"a saved working copy of one user's inputs"},{"term":"In-memory","meaning":"kept in the server's working memory, so it is lost when the server stops"},{"term":"Request shape","meaning":"a class that checks incoming data has the expected fields and types, as Pydantic BaseModel does"}],"depends_on":["fastapi","pydantic","schemas.inputs","schemas.outputs","agents.orchestrator (MultiAgentOrchestrator)"],"used_by":[],"sections":[{"start":1,"end":42,"kind":"setup","name":"File setup","id":"s1","hash":"913039e282b24ed7","title":"Server setup, access rules and shared objects","what":"Creates the web server and sets which browser addresses may call it. Creates one shared orchestrator for all requests and an empty dictionary for saved sessions. Every request this server handles uses these shared objects.","why":"Likely reason: building these once at startup avoids rebuilding them for every request. A comment says a real database should replace the session dictionary.","watch_out":"The shared orchestrator and session dictionary live in server memory, so restarting the server clears every saved session."},{"start":43,"end":47,"kind":"class","name":"SessionCreate","id":"s2","hash":"c9b2e30b23bd854f","title":"Shape of a new-session request","what":"Describes the data sent when a session is created. Starting inputs are optional, so a session can be opened empty and filled in later.","why":"Likely reason: a user may open a session before entering any numbers. Reason not stated in the code.","watch_out":"Code that reads a session must handle the case where no inputs were given."},{"start":48,"end":52,"kind":"class","name":"SessionUpdate","id":"s3","hash":"4c2d5e3b3d2d0c73","title":"Shape of a session update request","what":"Describes the data sent when a session's inputs are changed: a free-form dictionary of field names and new values. Any key is accepted at this level.","why":"Likely reason: lets the frontend send only the fields that changed.","watch_out":"Because the dictionary accepts any names and values, wrong field names or types can pass this step and must be checked where the update is applied."},{"start":53,"end":60,"kind":"class","name":"CalculationRequest","id":"s4","hash":"5bee683ace68f641","title":"Shape of a calculation request","what":"Describes a request to run the cost model: the full set of inputs, an optional session ID, and two switches. The lecture switch and the web research switch both default to on. The lecture switch is not explained in the visible code.","why":"Likely reason: both extras are included unless the caller turns them off.","watch_out":"Web research is on by default, and the research code in this project uses fixed sample data, so a default calculation may show placeholder citations if it uses that agent."},{"start":61,"end":65,"kind":"class","name":"ExportRequest","id":"s5","hash":"6cd2e1d4c0b91a27","title":"Unused export request shape","what":"Defines a small request shape that holds only a session code. The Excel export endpoint in this file does not use it. That endpoint takes the session code directly.","why":"Reason not stated in the code.","watch_out":"Nothing in this file reads this shape, so changing it has no effect here."},{"start":66,"end":76,"kind":"function","name":"root","id":"s6","hash":"c0a96dbbecca52ab","title":"Welcome endpoint with app name","what":"Answers a request to the base web address with the app name, a version label, an online status, and the current time. Opening the server address in a browser shows this.","why":"Likely reason: a simple way to confirm the server is running and responding.","watch_out":"The version label is typed in by hand and must be changed manually when the app is updated."},{"start":77,"end":91,"kind":"function","name":"health_check","id":"s7","hash":"632f3a79e52aad00","title":"Health report for agent services","what":"Returns a status report that lists the calculator, lecture, and Excel export as ready. It lists web research as ready only when the orchestrator has it switched on, and otherwise as disabled. Monitoring tools or a person can use it to see what is working.","why":"Likely reason: lets a tester or monitor see at a glance which parts of the system are available.","watch_out":"Three of the four services are reported as ready without any real check, so the report can say ready even when a service has failed."},{"start":92,"end":122,"kind":"function","name":"create_session","id":"s8","hash":"b5be04c37e4b7402","title":"Creating a new working session","what":"Makes a new unique session code and stores a record in memory under that code, with optional starting inputs. It returns the code and the creation time. A user's work is kept under this code.","why":"Likely reason: lets separate calculations be kept apart and revisited later.","watch_out":"Sessions are held only in memory, so every stored session is lost when the server restarts."},{"start":123,"end":139,"kind":"function","name":"get_session","id":"s9","hash":"75906f8585952d1e","title":"Fetching a saved session","what":"Returns everything stored for a session code, or a not-found error if the code is unknown.","why":"Likely reason: lets the front end reload saved inputs and results.","watch_out":"Returns the whole record, including saved results, so large sessions send a lot of data."},{"start":140,"end":183,"kind":"function","name":"calculate","id":"s10","hash":"0283eff8e0658132","title":"Full cost calculation with saving","what":"Runs the full cost model on the given inputs and can also add research and a lecture. If a session code is given, the inputs, outputs, research, lecture, and warnings are saved to that session. Unexpected failures return an error that includes the failure message.","why":"Likely reason: one main path that does all the work and keeps results available for later steps.","watch_out":"Results are saved even when the calculation reports that it did not succeed, because this endpoint never checks that flag before saving."},{"start":184,"end":215,"kind":"function","name":"calculate_quick","id":"s11","hash":"d84a6498993dccd9","title":"Quick calculation with no saving","what":"Runs only the cost numbers, without research or a lecture, and returns just the outputs. If the calculator reports errors, it returns a bad request error that lists those error messages. Nothing is saved.","why":"Likely reason: a fast option for callers who only need the numbers.","watch_out":"Only error messages are listed back to the caller, so warnings are hidden from it."},{"start":216,"end":269,"kind":"function","name":"update_inputs","id":"s12","hash":"449377b851443de9","title":"Changing saved inputs and recalculating","what":"Takes an existing session, applies the requested field changes to its saved inputs, and reruns the full calculation with research and lecture included. It then saves the new inputs and results and returns the updated session.","why":"Likely reason: lets someone change one assumption without retyping every input.","watch_out":"Every update runs web research and the lecture, which can be slow or depend on outside services. The result is also saved without checking that the calculation succeeded."},{"start":270,"end":310,"kind":"function","name":"export_excel","id":"s13","hash":"afe7340bcaaf6c3d","title":"Downloading the Excel workbook","what":"Rebuilds the saved inputs, outputs, and research for a session, asks the orchestrator to create a spreadsheet, and sends it as a download. The file name uses the first eight characters of the session code. It returns a bad request error if no calculation has been saved yet.","why":"Likely reason: the spreadsheet is built from stored results, so no new calculation is needed.","watch_out":"The file name uses only part of the session code, so two sessions could in principle end up with the same name."},{"start":311,"end":345,"kind":"function","name":"get_component_breakdown","id":"s14","hash":"46dcef121d60b95c","title":"Detail for one cost component","what":"Looks up the detailed breakdown for one named cost part, such as modules, from the saved outputs. It returns a not-found error if the name is wrong or the part has no breakdown.","why":"Likely reason: lets the front end show a drill-down view when a user asks for more detail.","watch_out":"The component name must match exactly. This file does not check it against a list of valid names."},{"start":346,"end":376,"kind":"function","name":"get_lecture_step","id":"s15","hash":"be85a4fe32ec6993","title":"Fetching one lecture step","what":"Finds the teaching step with a given number in the session's saved lecture and returns it. It returns a not-found error if that number does not exist.","why":"Likely reason: lets the lecture be shown one step at a time.","watch_out":"Lecture steps exist only after a calculation that included the lecture. Without one, the endpoint returns a bad request error."},{"start":377,"end":388,"kind":"function","name":"get_defaults","id":"s16","hash":"5e064703c45caab0","title":"Default input values","what":"Returns the standard starting value for every input, as defined in the input schema file. A new user sees these values before changing anything.","why":"Likely reason: gives the front end a starting point for the input form.","watch_out":"The values come from the schema file, so changing a default there changes what this endpoint returns."},{"start":389,"end":407,"kind":"function","name":"delete_session","id":"s17","hash":"97e865d3d6dbc8ec","title":"Deleting a saved session","what":"Removes a session and its saved inputs and results from memory, then confirms the deletion. It returns a not-found error if the code is unknown.","why":"Likely reason: lets users clear out old work.","watch_out":"Deletion is permanent. This file has no undo and no backup."},{"start":408,"end":429,"kind":"function","name":"list_sessions","id":"s18","hash":"70850bf5a5a10bcb","title":"Listing all saved sessions","what":"Returns each session code with its creation time, its last update time, whether it has results, and the total number of sessions.","why":"Likely reason: lets a user or the front end show which sessions exist.","watch_out":"Anyone who can reach the server can see every session, because this file has no login check."},{"start":430,"end":432,"kind":"entry point","name":"entry point","id":"s19","hash":"73f230975a46a981","title":"Starting the server directly","what":"When this file is run directly, starts the web server on port 8000 on all network addresses and restarts it automatically when files change.","why":"Likely reason: a convenient way to start the server during development.","watch_out":"Listening on all addresses makes the server reachable from other computers on the network. Automatic reload is meant for development, not for a live service."}],"explained_at":"2026-11-11T23:39:45+00:00","explained_by":"haiku","summary":"The web server entry point for the cost tool. It sets up the API, browser access rules, one shared orchestrator and in-memory session storage, then defines the endpoints listed in the outline. Only the setup and request shapes are visible in this packet, so the endpoint code could not be checked.","purpose":"Lets the frontend create sessions, run calculations, update inputs, export Excel and read breakdowns through web requests. The endpoint names suggest these roles, but their code is not in the packet.","why":"Likely reason: it is the single place that hands work to the rest of the backend and exposes it to the frontend. A comment says a real database should replace the in-memory storage later.","how":"On start, it creates the FastAPI app and allows requests from two local development addresses. It creates one MultiAgentOrchestrator with web research turned on, and an empty sessions dictionary. Then it declares the shapes of incoming requests: SessionCreate, SessionUpdate, CalculationRequest and ExportRequest. The endpoint functions listed in the outline use these shapes to read requests and send results back. The entry point at the end starts the server when the file is run directly, though its code is not in the packet.","inputs":"Web requests from the frontend, in the shapes defined by the request classes. Setup uses the allowed addresses written into the file, not values from the settings file.","outputs":"JSON responses from each endpoint, and the Excel export endpoint can return a file as a streamed response.","risks":"Sessions live only in memory, so they are lost on restart and are not shared between server copies. The sessions dictionary has no visible size limit. Allowed addresses are fixed to two local addresses, so a deployed frontend would be blocked. Session updates accept any dictionary, so bad field names or values must be caught elsewhere. No login or access control is visible in the shown code, so anyone who can reach the server may read or change sessions.","debug":"If the browser shows a CORS error, compare the frontend address with the allowed list in setup. If a session disappears, check whether the server restarted, since sessions are only in memory. If a calculation is slow or fails, check how the orchestrator was built, since web research is turned on there. For input errors, look at the request class involved and at the update_inputs endpoint.","summary_hash":"sha256:1e049c6c55dc87a7caf593632961fdc2f95a4f22022a4b198d808d2e4cc8f35b","fresh":true},"backend/requirements.txt":{"schema_version":1,"path":"backend/requirements.txt","language":"Configuration","lines":31,"hash":"sha256:aa308e48a3a4cf7ebe952369ace46230ca8d1415b2c8a9bb832f9db9bff67b4e","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No lock file or test is visible to confirm these versions install and work together.","Development test tools are in the same list as the packages the app needs to run.","The Python version this list was built for is not stated."]},"terms":[{"term":"pip","meaning":"the standard tool that installs Python packages from a list."},{"term":"pinned version","meaning":"a package locked to one exact version number so every install is the same."},{"term":"dependency","meaning":"a package that another package or the app needs in order to work."},{"term":"FastAPI","meaning":"the web framework that lets other programs ask this app for data."},{"term":"Uvicorn","meaning":"the program that actually runs the web server for FastAPI."},{"term":"LangChain and LangGraph","meaning":"libraries for building multi-step workflows that use AI models."},{"term":"pytest","meaning":"a tool for running automated tests on the code."}],"depends_on":["fastapi","uvicorn","pydantic","pydantic-settings","langchain","langchain-community","langchain-openai","langgraph","openpyxl","xlsxwriter","openai","anthropic","beautifulsoup4","requests","httpx","python-dotenv","python-multipart","tenacity","pytest","pytest-asyncio"],"used_by":["Not visible in this file. The backend application code, such as backend/main.py, would rely on these packages."],"sections":[{"start":1,"end":31,"kind":"setup","name":"File setup","id":"s1","hash":"bbe0f070806af259","title":"Package list with exact versions","what":"Lists every Python package the backend needs, grouped by purpose, with an exact version for each. Running the installer on this list sets up the backend environment.","why":"Likely reason: exact versions keep the backend predictable across machines and over time.","watch_out":"Changing one version can break another package that depends on it, so test after any change."}],"explained_at":"2026-11-11T23:39:45+00:00","explained_by":"haiku","summary":"Lists the Python packages the backend needs, each pinned to one exact version.","purpose":"Tells the installer exactly which library versions to install so the backend behaves the same on every machine.","why":"Likely reason: pinned versions stop a library update from breaking the app without warning. The file does not say this directly.","how":"The installer reads each line and installs that package at the exact version shown. Comment lines group the packages into web framework, multi-agent system, Excel export, web research and AI, utilities, and development tools.","inputs":"No input data. The file is read by the Python package installer when the backend environment is set up.","outputs":"A Python environment with the listed packages installed.","risks":"Old pinned versions may contain known security flaws and will not get fixes unless someone updates them. Development test tools are installed along with the app packages if the whole file is installed.","debug":"If installation fails, look for version conflicts among the langchain and langgraph packages. Try a fresh environment with the same Python version. Install packages one at a time to find which one fails.","summary_hash":"sha256:aa308e48a3a4cf7ebe952369ace46230ca8d1415b2c8a9bb832f9db9bff67b4e","fresh":true},"backend/schemas/inputs.py":{"schema_version":1,"path":"backend/schemas/inputs.py","language":"Python","lines":517,"hash":"sha256:c2f77ffed3e9aacc92cc3d2fed1a0235d5adfdeeeefea0376a04b5cac8b4f139","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No test is visible for these rules.","Several rules run only when a switch is on, such as battery storage or the tracker.","Some cost ranges, such as the electrical balance-of-system group, have no check that the maximum is above the minimum.","Unit labels are descriptive only and are not checked."]},"terms":[{"term":"pydantic","meaning":"a library that checks that data has the right shape and values before the app uses it."},{"term":"BaseModel","meaning":"the base class pydantic provides; each input group in this file is built on it."},{"term":"validator","meaning":"a rule that checks a value, or a combination of values, and rejects it if the rule fails."},{"term":"enum","meaning":"a fixed list of allowed choices, here the inverter types."},{"term":"ILR","meaning":"inverter load ratio, the ratio of panel DC capacity to inverter AC capacity."},{"term":"DC and AC","meaning":"direct current from the panels and alternating current sent to the grid."},{"term":"BOS","meaning":"balance of system, everything around the panels such as racking, wiring, and electrical gear."},{"term":"ESS","meaning":"energy storage system, meaning the battery."},{"term":"tracker","meaning":"a motorized mounting frame that turns panels to follow the sun."},{"term":"O\u0026M","meaning":"operations and maintenance, the yearly cost of keeping the plant running."},{"term":"capex","meaning":"capital expenditure, the up-front cost of building the plant."},{"term":"NPV","meaning":"net present value, the value today of future yearly payments after discounting."},{"term":"optional","meaning":"a value that may be left empty, shown here as None."}],"depends_on":["pydantic","typing (standard library)","enum (standard library)"],"used_by":["backend/main.py (uses CostModelInputs)"],"sections":[{"start":1,"end":10,"kind":"setup","name":"File setup","id":"s1","hash":"9b95697758df6179","title":"Setup of imports","what":"Brings in the tools needed to define the data shapes and their checks.","why":"Reason not stated in the code beyond what is needed by the classes below.","watch_out":""},{"start":11,"end":17,"kind":"class","name":"InverterType","id":"s2","hash":"f88a1b9ad665e80b","title":"Allowed inverter types","what":"Lists the three inverter types the app accepts: central, string, and micro. Any other value is refused.","why":"Likely reason: stops the inverter type from being any arbitrary text.","watch_out":"Any code that checks inverter type must use these exact three words."},{"start":18,"end":39,"kind":"class","name":"SystemInputs","id":"s3","hash":"5921aa8fa9d39d4d","title":"Project size and key ratios","what":"Holds the overall project size in DC kilowatts with a default of 100 megawatts, the inverter load ratio, and the battery hours per kilowatt. These set the scale for most other costs.","why":"Likely reason: these are the top-level facts that every other cost depends on.","watch_out":"The battery hours value is optional and the file does not say whether it matters when the battery is switched off."},{"start":40,"end":99,"kind":"class","name":"ModuleInputs (part 1)","id":"s4","hash":"65f06a3eda12039e","title":"Module hardware and production settings","what":"Holds the physical and production facts for solar modules: efficiency, size, weight, factory capacity, labor hours, electricity use, depreciation period, and yearly maintenance rate. It also sets the first part of the module price range.","why":"Likely reason: these describe the module itself and how it is made, which the cost math needs.","watch_out":"Efficiency is a fraction, so 20.6 percent is entered as 0.206. The unit labels do not stop a value entered in the wrong form."},{"start":100,"end":117,"kind":"class","name":"ModuleInputs (part 2)","id":"s5","hash":"edbee4c442f0083e","title":"Module price range and its check","what":"Sets the low and high module price per watt and checks that the high price is above the low price. A reversed range is refused.","why":"Likely reason: the price is a range, so both ends are needed, and the check blocks a reversed range.","watch_out":"This check runs when the object is created. Changing a value after creation may not be checked again."},{"start":118,"end":169,"kind":"class","name":"InverterInputs","id":"s6","hash":"8acd702cfece94c2","title":"Inverter settings and price check","what":"Holds the inverter type, factory capacity, low and high price per AC kilowatt, labor hours, depreciation period, and efficiency. It refuses a price range where the high value is not above the low value.","why":"Likely reason: the inverter is priced as a range, and the check blocks reversed ranges.","watch_out":"The inverter price is per AC kilowatt while the project size is per DC kilowatt, so the two must not be mixed up."},{"start":170,"end":220,"kind":"class","name":"ESSInputs (part 1)","id":"s7","hash":"06cea928c77b1c5b","title":"Battery storage settings","what":"Holds the battery on or off switch, low and high price per kWh, fixed project costs, incentive, efficiency, and cycle life, each with defaults and range checks.","why":"Storage is optional, so it defaults to off with preset values.","watch_out":"Field checks (greater than 0, efficiency up to 1) run whenever values are given, even when storage is off. None is allowed for the optional fields."},{"start":221,"end":230,"kind":"method","name":"ESSInputs: validate_ess_params","id":"s8","hash":"26f7d0859e277c4a","title":"Battery switch rule","what":"When the battery is switched on, requires both battery price limits to be filled in and checks that the high price is above the low price.","why":"Likely reason: the battery cost math needs both limits, and only when storage is used.","watch_out":"Because the check only runs when the switch is on, turning the switch on later may expose invalid battery values."},{"start":231,"end":281,"kind":"class","name":"SBOSInputs","id":"s9","hash":"7aabf19c447bc7f5","title":"Racking and tracker settings","what":"Holds the racking area needed per kilowatt, a switch for whether a tracker is used, and separate low and high price ranges for trackers and for fixed racking. The check uses the tracker range when the tracker is on and the fixed range when it is off.","why":"Likely reason: a tracker and a fixed mount have different costs, so the switch picks the right price range.","watch_out":"Only the range selected by the switch is checked, so an invalid range for the other mount type is ignored."},{"start":282,"end":341,"kind":"class","name":"EBOSInputs (part 1)","id":"s10","hash":"a3c419e47a63d252","title":"Electrical balance of system price ranges","what":"Holds low and high prices for transformers, breakers, combiner boxes, and wiring, plus rates for shipping and import tariffs. Each item has its own unit, per AC kilowatt or per DC kilowatt.","why":"Likely reason: these electrical parts are priced separately, each with its own unit.","watch_out":"This group has no check that the high price is above the low price, so a reversed range is accepted. The units differ between items, so mixing them up changes the totals."},{"start":342,"end":347,"kind":"class","name":"EBOSInputs (part 2)","id":"s11","hash":"f40c8c7b2fab0b0b","title":"Electrical balance of system tariff limit","what":"Finishes the import tariff setting, which must be between zero and one, meaning zero to one hundred percent.","why":"Likely reason: a tariff is a percentage, so the range is limited to sensible fractions.","watch_out":"The limit is a fraction, so a value entered as 15 instead of 0.15 would be refused."},{"start":348,"end":382,"kind":"class","name":"LaborInputs","id":"s12","hash":"fd597067dcd9e688","title":"Labor rates and hours","what":"Holds the hourly rates and hours per kilowatt for field workers and office workers, plus the labor burden rate for benefits and taxes.","why":"Likely reason: field and office work are costed separately, and both add benefits and taxes on top of wages.","watch_out":"Rates are dollars per hour and hours are per kilowatt, so the units are easy to confuse. The burden rate is a fraction."},{"start":383,"end":414,"kind":"class","name":"OtherCostsInputs","id":"s13","hash":"a99a68c17c76c5fe","title":"Sales tax, contingency, management, and profit","what":"Holds four percentage rates for sales tax on equipment, a contingency buffer, management overhead, and developer profit. Each must be between zero and one hundred percent.","why":"Likely reason: these are added on top of the subtotal as standard percentage allowances.","watch_out":"These percentages change the final total directly, so a small change in any one moves the answer noticeably."},{"start":415,"end":474,"kind":"class","name":"OMInputs (part 1)","id":"s14","hash":"bbd01b284ed36a53","title":"Yearly operations and maintenance ranges","what":"Holds low and high yearly costs for cleaning, inspection, replacement, insurance, and property tax. Cleaning, inspection, and replacement are per kilowatt, while insurance and property tax are percentages of up-front cost.","why":"Likely reason: running a plant has several yearly costs, each with its own range and unit.","watch_out":"Insurance and property tax are percentages of up-front cost, while the other three are dollar amounts per kilowatt. Mixing them up changes the result by a large amount."},{"start":475,"end":497,"kind":"class","name":"OMInputs (part 2)","id":"s15","hash":"b8ec7f6e2b849b88","title":"Land lease and discount rate","what":"Holds the low and high yearly land lease cost per kilowatt, and the discount rate used to turn future yearly costs into a value today. The discount rate must be above zero and below one.","why":"Likely reason: future yearly costs are worth less today, so the discount rate converts them to present value.","watch_out":"The discount rate must be a fraction, so a value of 6 percent must be entered as 0.06. Entering 6 is refused."},{"start":498,"end":517,"kind":"class","name":"CostModelInputs","id":"s16","hash":"aa5c532a1e58463c","title":"Complete input bundle","what":"Gathers all the input groups into one object, each with starting values, so the whole set of assumptions can be passed around as a unit. It also includes an example block that shows a sample input set for documentation.","why":"Likely reason: one bundle keeps the whole set of inputs together for the calculator and the API.","watch_out":"The example block is only a note for readers. Nothing checks that it matches the rules, and it uses an older settings style that still works."}],"explained_at":"2026-11-11T23:39:45+00:00","explained_by":"haiku","summary":"Defines every user-editable input for the solar cost model, with its default value, allowed range, unit label, and checks that reject impossible combinations.","purpose":"Gives the app one authoritative place that says what each input means, what values are allowed, and what the starting values are.","why":"Likely reason: stops bad or impossible numbers, such as a negative system size or a maximum cost below the minimum, from reaching the calculator.","how":"Each group of related inputs is its own class built on pydantic. Every field has a default value, limits such as greater than zero or between zero and one, a plain description, and a unit label. A few classes add extra checks that compare pairs of values or only run when a switch is on. The top-level class CostModelInputs gathers all the groups together.","inputs":"Values supplied by the user or the API, shaped like nested groups of named numbers, switches and choices.","outputs":"Checked input objects with defaults filled in. If a value breaks a rule, pydantic raises an error that names the field and the rule.","risks":"Several checks run only when a switch is on, such as battery storage or the tracker. When the switch is off, bad values in those groups pass without complaint. Unit labels are descriptive only, so the code does not convert or verify units. Some cost ranges are not checked to make sure the maximum is above the minimum.","debug":"Read the error message first, since it names the field. Find that field's group in this file and check its limits. If a value is refused only when a switch is on, look at the switch in that group. To see the starting values, create the input object with no arguments and inspect it.","summary_hash":"sha256:c2f77ffed3e9aacc92cc3d2fed1a0235d5adfdeeeefea0376a04b5cac8b4f139","fresh":true},"backend/schemas/outputs.py":{"schema_version":1,"path":"backend/schemas/outputs.py","language":"Python","lines":268,"hash":"sha256:d8816ef8b60dbec5e0d3427218c17d0ae57778d94d6a31266007668fc64b4413","area":"backend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The formula text is descriptive and is not checked against the calculator here.","The part percentages are not checked to add up to one hundred percent.","No test is visible for these shapes.","The optional median and the success flag are not enforced by this file."]},"terms":[{"term":"schema","meaning":"a defined shape that says which fields a piece of data must or may have."},{"term":"optional","meaning":"a field that may be left empty."},{"term":"default_factory","meaning":"a way to give each new object its own fresh copy of a default list, so objects do not share one list."},{"term":"subclass","meaning":"a class built on another class that inherits its fields and adds its own."},{"term":"MSP","meaning":"minimum sustainable price, the lowest price a seller can accept and stay in business."},{"term":"MMP","meaning":"market median price, the typical price in the market."},{"term":"per kWdc","meaning":"a cost measured per kilowatt of direct current capacity of the panels."},{"term":"NPV","meaning":"net present value, the value today of future yearly payments after discounting."},{"term":"median","meaning":"the middle value between a low and a high value."},{"term":"lecture","meaning":"the step-by-step teaching explanation of how each cost was reached."}],"depends_on":["pydantic","typing (standard library)"],"used_by":["backend/main.py (uses CostModelOutputs, WebResearchResult, and ModelResponse)"],"sections":[{"start":1,"end":9,"kind":"setup","name":"File setup","id":"s1","hash":"d0001decbc2b6b0d","title":"Setup of imports","what":"Brings in the tools needed to define the shapes, including lists, optional values, and pydantic base types.","why":"Reason not stated in the code beyond what the classes below need.","watch_out":""},{"start":10,"end":21,"kind":"class","name":"CostRange","id":"s2","hash":"88786a9be6de2ba4","title":"Low, high, and middle value","what":"Holds a low value, a high value, and an optional middle value. A method can fill the middle value with the average of the low and high values.","why":"Likely reason: many costs are ranges, so the low and high ends are stored together.","watch_out":"The middle value stays empty until the calculate_median method is called."},{"start":22,"end":33,"kind":"class","name":"ComponentCost","id":"s3","hash":"9c9b4d3dd42fd1ec","title":"Shared base for cost items","what":"Defines the common shape for every cost item: a minimum sustainable price range, a market median price range, a formula text, an optional list of parts, and a unit label that defaults to dollars per kilowatt DC.","why":"Likely reason: every cost item shares these fields, so they are defined once here.","watch_out":"Both price ranges are required, so a cost item missing either one will fail validation."},{"start":34,"end":45,"kind":"class","name":"ModulesOutput","id":"s4","hash":"52981a1512a405fc","title":"Module cost output","what":"Describes the module cost with its own formula text and a default split into material, labor, and logistics at 65, 25, and 10 percent.","why":"Likely reason: the module cost has its own formula and parts, so it gets its own shape.","watch_out":"The split is a fixed default in this file, and nothing checks it against the real cost breakdown."},{"start":46,"end":56,"kind":"class","name":"InvertersOutput","id":"s5","hash":"25eb41671acc3d37","title":"Inverter cost output","what":"Describes the inverter cost with its formula text and a default split of equipment at 75 percent and installation at 25 percent.","why":"Likely reason: the inverter has its own formula and parts, so it gets its own shape.","watch_out":"The formula text names only the minimum inverter price, while the output has both a minimum and a maximum. Check the calculator to see which is really used."},{"start":57,"end":69,"kind":"class","name":"ESSOutput","id":"s6","hash":"129b68a265b0c31f","title":"Battery storage cost output","what":"Describes the battery cost with its formula text and a default split across cells, management electronics, enclosure, and installation.","why":"Likely reason: the battery is optional, so its shape is kept separate and marked optional elsewhere.","watch_out":"The battery formula text divides by system size right after multiplying by it, so the intent is unclear. The calculator is the place to confirm the real math."},{"start":70,"end":81,"kind":"class","name":"SBOSOutput","id":"s7","hash":"88bd70f55638da1f","title":"Racking and tracker cost output","what":"Describes the structural balance of system cost. Its formula text chooses between the tracker price and the fixed racking price, and its default split covers racking, tracker motors, and foundations.","why":"Likely reason: the racking cost depends on whether a tracker is used, so the formula picks the right price.","watch_out":"The formula text uses only a single minimum price for each option, which may not match the range shown in the output."},{"start":82,"end":96,"kind":"class","name":"EBOSOutput","id":"s8","hash":"1c36e8daeba64141","title":"Electrical balance of system cost output","what":"Describes the electrical balance of system cost with its formula text and six default parts covering transformers, breakers, combiners, wiring, shipping, and tariffs.","why":"Likely reason: electrical costs are many small items, so they are split into parts.","watch_out":"As written in the formula text, the shipping and tariff multipliers seem to apply only to the wiring term, not to the whole sum. Check the calculator for the real order."},{"start":97,"end":108,"kind":"class","name":"FieldworkOutput","id":"s9","hash":"515b34d7cc791bf6","title":"Field labor cost output","what":"Describes the on-site labor cost with its formula text and a default split across installation, electrical work, and commissioning.","why":"Likely reason: field labor is its own category with its own hours and rates.","watch_out":"The formula depends on the labor burden rate, so a change to that rate changes this cost too."},{"start":109,"end":121,"kind":"class","name":"OfficeworkOutput","id":"s10","hash":"346b9ca2b72f99e4","title":"Office labor cost output","what":"Describes the office and soft-cost labor with its formula text and a default split across engineering, permitting, project management, and legal.","why":"Likely reason: office work is costed separately from field work, so it gets its own shape.","watch_out":"The formula relies on input names matching the input file exactly. A renamed input would break this formula."},{"start":122,"end":134,"kind":"class","name":"OtherOutput","id":"s11","hash":"dc6844ba771ad10f","title":"Other costs output","what":"Describes the taxes, contingency, overhead, and profit added on top of the earlier costs, with its formula text and a default split across those four items.","why":"Likely reason: these allowances are added on top of the subtotal, so they come after the other cost items.","watch_out":"The formula sums a range of items by their position, so the order in which items appear in the export affects the total. The calculator should be checked to confirm this."},{"start":135,"end":149,"kind":"class","name":"OMOutput","id":"s12","hash":"42e40fe56782f998","title":"Yearly operations and maintenance output","what":"Describes the operations and maintenance cost, expressed as a present value over twenty years, with its formula text and a default split across six items.","why":"Likely reason: running costs continue for years, so they are discounted to a value today.","watch_out":"The twenty-year period is written into the formula text, so changing the plant life elsewhere would not update this text."},{"start":150,"end":156,"kind":"class","name":"SystemTotal","id":"s13","hash":"10c3342241d9c5bc","title":"System total shape","what":"Describes a system-level total, with a low and high range, its formula text, and a default unit of dollars per kilowatt DC.","why":"Likely reason: the grand total needs the same range and unit fields as the parts.","watch_out":"The total's low and high values are not linked to the parts in this file, so they must be kept consistent by the calculator."},{"start":157,"end":196,"kind":"class","name":"CostModelOutputs","id":"s14","hash":"415b614252d59e55","title":"Complete output for one run","what":"Gathers every cost item, the totals with and without battery storage, the time of calculation, and the session code into one result. Battery items are optional, so they may be missing when storage is off.","why":"Likely reason: one structure holds the whole answer for a single run.","watch_out":"The battery total can be empty when storage is off, so code that reads it must allow for that."},{"start":197,"end":205,"kind":"class","name":"ValidationResult","id":"s15","hash":"0288dbddde2a7f31","title":"Validation message shape","what":"Describes a single message about an input or output, with a field name, a status, a message, a severity, and optional suggested fixes.","why":"Likely reason: messages need the same structure so the front end can show them consistently.","watch_out":"The status and severity are free text, so nothing limits them to the words named in the descriptions."},{"start":206,"end":214,"kind":"class","name":"WebResearchSource","id":"s16","hash":"2484e526c816de7f","title":"Web research source shape","what":"Describes one cited source, with a title, web address, quoted excerpt, relevance score from zero to one, and timestamp.","why":"Likely reason: each finding should show where it came from so a user can check it.","watch_out":"The web address is stored as plain text and is not checked to be a working address."},{"start":215,"end":226,"kind":"class","name":"WebResearchResult","id":"s17","hash":"6c1ebd23342b1fa7","title":"Web research result shape","what":"Describes the research findings for one component, including checks on inputs and outputs, suggestions, quoted notes, sources, and a confidence value that defaults to 0.8.","why":"Likely reason: research results need a common shape so they can be shown and saved the same way.","watch_out":"The default confidence of 0.8 is a fixed number, not something measured, so it should not be read as proof of accuracy."},{"start":227,"end":240,"kind":"class","name":"CalculationStep","id":"s18","hash":"3437d1b95e114404","title":"One teaching step shape","what":"Describes one step in the lecture, with a step number, title, component, visual state, plain explanation, formula text, worked example, parts, context, and optional research.","why":"Likely reason: each lecture step must carry everything the front end needs to show it.","watch_out":"The visual state and explanation are free-form, so the front end must be ready for any content."},{"start":241,"end":248,"kind":"class","name":"LectureSequence","id":"s19","hash":"7a3c3d125e53ea1c","title":"Full lecture sequence shape","what":"Describes the ordered list of teaching steps with a total count, the current step, and a completion percentage from zero to one hundred.","why":"Likely reason: the front end needs the step list and its progress together.","watch_out":"The total step count is stored separately from the list, and nothing checks that the two agree."},{"start":249,"end":258,"kind":"class","name":"ErrorDetail","id":"s20","hash":"a56d038a3ae7ce0c","title":"Structured error shape","what":"Describes an error with a code, a type, a message, an optional field name, an optional suggested fix, and a severity.","why":"Likely reason: a fixed shape makes errors easier for the front end to show.","watch_out":"The visible code in the backend main file does not use this shape. Its errors are plain messages instead, so this shape may be unused."},{"start":259,"end":268,"kind":"class","name":"ModelResponse","id":"s21","hash":"4cbbe5902f1ace01","title":"Overall API response shape","what":"Wraps everything a calculation returns: a success flag, the outputs, validation messages, research, lecture, errors, warnings, and extra metadata. The calculate endpoint returns this shape.","why":"Likely reason: one wrapper gives callers a single, consistent response format.","watch_out":"The success flag and the data field are not forced to agree, so a response can say success while data is missing, or the reverse."}],"explained_at":"2026-11-11T23:39:45+00:00","explained_by":"haiku","summary":"Defines the shape of every result the calculator returns, including cost ranges, cost parts, totals, research notes, teaching steps, and the overall response.","purpose":"Gives every result a fixed structure so the API, the Excel export, and the front end all know what to expect.","why":"Likely reason: a shared structure makes results predictable. Some formula text is stored here to document how each number is built. The file does not state the reasons more fully.","how":"CostRange holds a low value, a high value, and an optional middle value. ComponentCost is the shared base for each cost item and holds its price ranges, its formula text, its unit, and an optional list of parts. Each cost type builds on that base and sets its own formula text and default split across parts. Totals and the overall response are assembled from these pieces.","inputs":"Values created by the calculator code. The formula text is descriptive and is stored as plain text, not run as calculation here.","outputs":"Validated output objects that are returned by the API or written into the Excel export.","risks":"The formula text is documentation only and could drift away from the real math in the calculator. The middle value stays empty unless the calculate_median method is called. The part percentages are not checked to add to one hundred percent, although every default set currently does. The success flag and the data field are not forced to agree.","debug":"If a result fails validation, compare the field names used by the calculator with the names in this file. If a median is missing, check that calculate_median was called. If a formula looks wrong, compare it with the calculator code, since this file does not run it. If a split looks off, add the percentages for that item.","summary_hash":"sha256:d8816ef8b60dbec5e0d3427218c17d0ae57778d94d6a31266007668fc64b4413","fresh":true},"frontend/index.html":{"schema_version":1,"path":"frontend/index.html","language":"HTML","lines":14,"hash":"sha256:dfc2a97e3ceb79fb6ad3e3222573cd6f05fdeb9b95e6cd0f2f11e868fb9bd532","area":"frontend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["The body colors may conflict with the stylesheet; not checked visually here."]},"terms":[{"term":"Root element","meaning":"The empty container in the page where the app is placed."},{"term":"Viewport","meaning":"The setting that tells phones how wide to draw the page."},{"term":"Favicon","meaning":"The small icon shown in the browser tab."}],"depends_on":["/solar-icon.svg","frontend/src/main.tsx"],"used_by":["the Vite dev server and build"],"sections":[{"start":1,"end":14,"kind":"setup","name":"File setup","id":"s1","hash":"c55d61791dba2807","title":"The whole web page","what":"The single page that holds the app's title, description, icon, empty root container, and the main script that starts the app.","why":"Likely reason: this is the standard entry page for a single-page app.","watch_out":"The body classes here may override the body rule in index.css, so colors changed in the stylesheet may not show."}],"explained_at":"2026-11-11T23:32:03+00:00","explained_by":"haiku","summary":"The single web page that loads the app: it sets the title, description, icon, the empty root element, and loads the main script.","purpose":"The first page the browser opens.","why":"Standard setup for a Vite app. The title and description show in browser tabs and search previews.","how":"It sets the text encoding and the mobile screen width, links the icon, sets the title and description, adds an empty root element for React, sets the body classes, and loads the main script.","inputs":"The icon file, the main script, and the root element.","outputs":"The page the browser shows, which React fills with the app.","risks":"The body classes set a very dark background and light text. These classes likely take priority over the body rule in index.css, so the page may look dark even though the stylesheet asks for light grey.","debug":"If the page is blank, check the root element's name and the script path. If the page colors are wrong, compare the body classes here with the body rule in index.css.","summary_hash":"sha256:dfc2a97e3ceb79fb6ad3e3222573cd6f05fdeb9b95e6cd0f2f11e868fb9bd532","fresh":true},"frontend/package.json":{"schema_version":1,"path":"frontend/package.json","language":"Configuration","lines":50,"hash":"sha256:22f555cbe53ab1be17bd4796ca28538a0df4f4177283f2786aa20a3bdfe86123","area":"frontend","status":"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["No test command is listed.","Two diagram packages are listed.","The plain build command skips type checking."]},"terms":[{"term":"Dependency","meaning":"A library the app needs in order to run."},{"term":"Dev dependency","meaning":"A tool used only while building or developing, not shipped to users."},{"term":"Package manager","meaning":"The tool that downloads and tracks the libraries listed in this file."}, :"explained","summary_stale":false,"readiness":{"status":"needs-work","reasons":["Run failures are caught and reported to the user.","Blank or partial numbers are not checked before they reach the store and the backend.","Reset has no confirmation step.","No tests are visible."]},"terms":[{"term":"ESS","meaning":"Energy storage system, a battery added to the solar system."},{"term":"BOS","meaning":"Balance of system, the non-panel parts of a solar installation such as racking, wiring and transformers."},{"term":"O\u0026M","meaning":"Operations and maintenance, the yearly costs of keeping the system running."},{"term":"kWdc and kWac","meaning":"Kilowatts of panel (DC) capacity and kilowatts of grid-side (AC) capacity."},{"term":"ILR (DC/AC ratio)","meaning":"The panel capacity divided by the inverter capacity."},{"term":"Fraction","meaning":"A decimal between 0 and 1, so 0.05 means 5 percent."},{"term":"Field name","meaning":"The exact name a value is stored under, which must match the backend's name for it."}],"depends_on":["react","framer-motion","lucide-react","react-hot-toast","frontend/src/store/useModelStore","frontend/src/types","frontend/src/components/ui/Button","backend/schemas/inputs.py (field names come from here, per the code comment)"],"used_by":["frontend/src/components/layout/Dashboard.tsx"],"sections":[{"start":1,"end":18,"kind":"setup","name":"File setup","id":"s1","hash":"ceb3d0060504d43e","title":"Imports and input types","what":"Brings in the data shapes for each input group, the store, the notification tool, icons, and the Button component.","why":"Each group has its own shape so the editor can check the right fields are used.","watch_out":"The data shapes must match the groups defined here; renaming on one side breaks the form."},{"start":19,"end":29,"kind":"type","name":"InputSection","id":"s2","hash":"57f4785a1a9f7766","title":"Section names list","what":"Lists the nine input group names the form can open: system, modules, inverters, ess, sbos, ebos, labor, other, and om.","why":"Fixing the names means a typo cannot create a section that does not exist.","watch_out":"A new group must be added here, to the display code, and to the store together."},{"start":30,"end":88,"kind":"function","name":"InputPanel (part 1)","id":"s3","hash":"c96756f86d892b83","title":"Panel state and actions","what":"Sets up the link to the store, the open or closed state of each section (system and modules start open), and the three actions: run, export, and reset, each with its own success and error messages.","why":"Likely reason: starting the two most-used sections open makes the long form less intimidating.","watch_out":"Run Analysis always requests lecture and research content, and this screen offers no way to turn them off."},{"start":89,"end":142,"kind":"function","name":"InputPanel (part 2)","id":"s4","hash":"46dbe5e93661928a","title":"Top action bar and layout start","what":"Shows nothing until inputs exist. Then draws the title, the Reset, Export and Run Analysis buttons, and starts the section list with the system section.","why":"Likely reason: the top bar keeps the main actions in one place at the top of the form.","watch_out":"Export's greyed-out state is read directly from the store while drawing, which is a different pattern from the rest of the file, so it may be harder to follow."},{"start":143,"end":197,"kind":"function","name":"InputPanel (part 3)","id":"s5","hash":"7d2eb7a658920d68","title":"Modules through BOS sections","what":"Shows the solar modules, inverters, energy storage, structural BOS, and electrical BOS sections, each wired so a change goes into its own input group.","why":"Each section passes its own group name, so changes land in the right place.","watch_out":"A copy-and-paste mistake in a group name would put values into the wrong group with no error."},{"start":198,"end":234,"kind":"function","name":"InputPanel (part 4)","id":"s6","hash":"c80010086851b7e7","title":"Labor through O\u0026M sections","what":"Shows the labor, other costs, and operations and maintenance sections, wired the same way as the earlier sections.","why":"Likely reason: the same wiring pattern keeps the sections consistent.","watch_out":""},{"start":235,"end":242,"kind":"type","name":"InputSectionProps","id":"s7","hash":"8bcc74b02dba6b2a","title":"Section box settings shape","what":"Describes what one collapsible section needs: its title, open flag, toggle action, and content.","why":"Keeps the section box reusable.","watch_out":""},{"start":243,"end":275,"kind":"function","name":"InputSection","id":"s8","hash":"70bc86fcb0e80d5d","title":"Collapsible section box","what":"Draws one collapsible box with a clickable header. The content slides open or closed over about 0.15 seconds.","why":"Likely reason: collapsing sections keeps the long form readable.","watch_out":"Closed content is hidden rather than removed, so its values stay in memory even when the box is closed."},{"start":276,"end":284,"kind":"type","name":"FieldSpec","id":"s9","hash":"8fa0f9d5e13f8a32","title":"Number field description","what":"Describes one numeric field: its stored name, label, and optional minimum, maximum, and step size.","why":"Keeps each field defined in one simple row so the lists are easy to scan.","watch_out":"The stored name must match the backend's name exactly, or the value will not reach the right place."},{"start":285,"end":290,"kind":"value","name":"SYSTEM_FIELDS","id":"s10","hash":"922c67e78f4d6324","title":"System sizing fields","what":"Lists the three system-level numbers: system size in kWdc, the DC to AC ratio (ILR), and storage duration in hours per kWdc.","why":"These are the basic sizing values that the rest of the model builds on.","watch_out":""},{"start":291,"end":304,"kind":"value","name":"MODULE_FIELDS","id":"s11","hash":"66ba1e89d7bb683c","title":"Solar module fields","what":"Lists the panel values: efficiency, cost range per watt, panel height, width and weight, annual factory capacity, labor hours, electricity use, depreciation years, and yearly maintenance rate.","why":"Likely reason: panel details drive the module cost and the area estimate on the diagram.","watch_out":"Efficiency and maintenance rate are fractions between 0 and 1, but the number box may still accept a value such as 5 for 5 percent."},{"start":305,"end":313,"kind":"value","name":"INVERTER_FIELDS","id":"s12","hash":"0cda7aa611bd0571","title":"Inverter fields","what":"Lists inverter cost ranges per kWac, annual capacity, labor hours per kWac, depreciation years, and efficiency.","why":"Likely reason: inverter cost is priced per kWac, so the values are kept in that unit.","watch_out":"The inverter type dropdown is built separately in another part of the form, not in this list."},{"start":314,"end":323,"kind":"value","name":"ESS_FIELDS","id":"s13","hash":"a8c707fa9366822a","title":"Energy storage fields","what":"Lists battery cost per kWh, fixed project cost, incentive per kWh, round-trip efficiency, and lifetime cycles.","why":"Likely reason: battery cost is split into a per-energy rate and a fixed project amount.","watch_out":"Round-trip efficiency is a fraction, so enter 0.85 rather than 85."},{"start":324,"end":331,"kind":"value","name":"SBOS_FIELDS","id":"s14","hash":"664dd27e816a8b01","title":"Structural BOS fields","what":"Lists racking area per kWdc and the tracker and fixed racking cost ranges per square metre.","why":"Racking cost is calculated from area, so area and cost are entered together.","watch_out":"Costs are per square metre while area is per kWdc, so a unit mix-up here changes the totals."},{"start":332,"end":344,"kind":"value","name":"EBOS_FIELDS","id":"s15","hash":"c4941689c56c3762","title":"Electrical BOS fields","what":"Lists cost ranges for the transformer, breakers, combiner box and wiring, plus shipping and tariff rates as fractions.","why":"Likely reason: electrical equipment is priced in parts so each can be adjusted separately.","watch_out":"Transformer and breaker costs are per kWac, while combiner and wiring costs are per kWdc, and mixing these up skews the total."},{"start":345,"end":352,"kind":"value","name":"LABOR_FIELDS","id":"s16","hash":"d37a4f55e95735ac","title":"Labor fields","what":"Lists field and office hourly rates, hours per kWdc for each, and a labor burden fraction.","why":"Labor is split between field and office work so each can have its own rate.","watch_out":"Labor burden is a fraction, not a percentage."},{"start":353,"end":359,"kind":"value","name":"OTHER_FIELDS","id":"s17","hash":"47c541aee142cc12","title":"Other cost fields","what":"Lists sales tax, contingency, management overhead, and developer profit, each as a fraction.","why":"Likely reason: these are percentage add-ons applied to the cost total.","watch_out":"Each value is a fraction between 0 and 1, so 0.07 means 7 percent."},{"start":360,"end":375,"kind":"value","name":"OM_FIELDS","id":"s18","hash":"1f6b4462ef56f8cf","title":"Operations and maintenance fields","what":"Lists yearly cost ranges for cleaning, inspection, replacement, insurance, property tax, and land lease, plus the discount rate.","why":"The results label O\u0026M as NPV, so the discount rate turns future yearly costs into today's money.","watch_out":"Insurance and property tax are fractions of capital cost, while cleaning and the others are per kWdc per year, so check units before editing."},{"start":376,"end":382,"kind":"type","name":"FieldGridProps","id":"s19","hash":"19f0f8ea2ff79271","title":"Grid layout settings shape","what":"Describes what the shared grid needs: the list of fields, the current values, the change action, and optional extra boxes shown first.","why":"Lets one grid layout serve every section.","watch_out":""},{"start":383,"end":402,"kind":"function","name":"FieldGrid","id":"s20","hash":"3d44903450bf9bb6","title":"Shared number grid","what":"Lays out the number boxes in a grid of one column on phones and up to four on wide screens. Any extra dropdown appears first, then one box per field, showing the current value or blank.","why":"Likely reason: a single shared layout keeps every section looking the same.","watch_out":"A missing value shows as a blank box, which is easy to miss and may send an empty value."},{"start":403,"end":406,"kind":"function","name":"SystemInputsForm","id":"s21","hash":"200a9580e9080e30","title":"System section form","what":"Shows the three system fields in the shared grid.","why":"Each section form is a thin wrapper so the shared grid does the work.","watch_out":""},{"start":407,"end":410,"kind":"function","name":"ModuleInputsForm","id":"s22","hash":"07607fbbd40d0d31","title":"Module section form","what":"Shows the module fields in the shared grid.","why":"Same thin-wrapper pattern as the other sections.","watch_out":""},{"start":411,"end":427,"kind":"function","name":"InverterInputsForm","id":"s23","hash":"b455cdd116501843","title":"Inverter section form","what":"Shows the inverter fields plus a dropdown for inverter type: central, string, or micro.","why":"Likely reason: the inverter type is limited to a fixed list rather than free text.","watch_out":"If a saved type is not one of these three, the dropdown will show the first choice while the stored value stays different."},{"start":428,"end":443,"kind":"function","name":"ESSInputsForm","id":"s24","hash":"6047c9762e71caa5","title":"Storage section form","what":"Shows the storage fields plus a dropdown that switches between PV only and PV plus storage.","why":"This dropdown turns storage on or off for the run.","watch_out":"Switching to PV only changes the flag but keeps the storage numbers filled in and stored."},{"start":444,"end":459,"kind":"function","name":"SBOSInputsForm","id":"s25","hash":"35f0534e911207de","title":"Racking section form","what":"Shows the racking fields plus a dropdown for single-axis tracker or fixed tilt.","why":"Likely reason: the choice decides which racking cost range is used.","watch_out":"Both th
